<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>@@TITLE@@ · 작가용</title>
<style>
:root{--ink:#25352e;--muted:#6b7770;--paper:#f4f3ef;--line:#dce1d9;--green:#294d3b;--gold:#c19b53;--soft:#e9efe7}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.65 "Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-wrap:anywhere}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.48}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}h1,h2,h3,h4,p{margin-top:0}h1{font-size:clamp(25px,4vw,36px);letter-spacing:-.045em;margin-bottom:8px}h2{font-size:22px;letter-spacing:-.03em}h3{font-size:17px;margin:24px 0 8px}h4{font-size:14px;margin:18px 0 6px}a{color:var(--green)}small,.muted{color:var(--muted)}small{font-size:12px}[hidden]{display:none!important}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#21392e;color:#e8ede6;padding:30px 18px;display:flex;flex-direction:column;gap:22px}.brand{font:700 28px/1.1 Georgia,serif;letter-spacing:.12em;padding:0 12px}.brand small{font:11px/2 sans-serif;display:block;color:#b4c5b4;letter-spacing:.12em}.sidebar nav{display:grid;gap:5px}.nav-button{border:0;background:transparent;color:inherit;text-align:left;padding:11px 12px;border-radius:7px;display:flex;gap:12px}.nav-button[aria-current=page]{background:#3b5745;color:#fff}.nav-button:hover:enabled{background:#304d3c}.nav-number{color:#b2beaa;font-size:11px;min-width:18px;align-self:center}.sidebar footer{font-size:11px;line-height:1.7;color:#b4c5b4;margin-top:auto;padding:0 12px}.main{min-width:0;padding:30px clamp(16px,4vw,52px) 60px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;color:var(--muted)}.topline span:last-child{letter-spacing:0;color:#805a1d;background:#eee5d4;padding:4px 10px;border-radius:20px}.page-heading{margin:25px 0}.page-heading p{color:var(--muted);max-width:740px}.notice{background:#ede9df;border-left:3px solid var(--gold);padding:14px 18px;font-size:13px;line-height:1.8}.gate{max-width:640px;margin:60px auto;background:#fff;border:1px solid var(--line);padding:36px;border-radius:12px}.eyebrow{font-size:11px;color:#8c713e;letter-spacing:.16em;font-weight:700}.button{border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:9px 13px}.button.primary{background:var(--green);color:white;border-color:var(--green)}.button.small{font-size:12px;padding:5px 9px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}.toolbar label{font-size:12px;color:var(--muted)}select,input[type=search]{min-width:0;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:9px 11px;max-width:100%}.toolbar select{flex:1;max-width:620px}.toolbar input{flex:1;min-width:150px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:22px}.stat strong{display:block;font-size:30px;line-height:1.25;font-weight:500}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card h3{margin:0 0 8px}.card p{font-size:14px}.card button{margin-top:8px}.badge{display:inline-block;font-size:11px;background:var(--soft);border-radius:5px;padding:2px 7px}.badge.added{background:#f8ead7;color:#88601e}.stage-list{padding-left:20px}.stage-list li{margin:9px 0}.split{display:grid;grid-template-columns:minmax(230px,.7fr) minmax(0,1.65fr);gap:20px}.chapter-tree{max-height:65vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:white;padding:10px}.chapter-tree button{border:0;background:transparent;text-align:left;display:block;width:100%;padding:10px;border-radius:6px;color:var(--ink)}.chapter-tree button[aria-current=true]{background:var(--soft);font-weight:700}.unit{border:1px solid var(--line);background:#fff;border-radius:8px;margin:12px 0}.unit summary{padding:14px 17px;cursor:pointer;font-weight:600}.unit-body{padding:0 17px 17px}.unit-body h4:first-child{margin-top:8px}.source-note{font-size:11px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;color:var(--muted);margin:14px 0 0}.diagram{overflow-x:auto;max-width:100%;padding:14px;background:white;border:1px solid var(--line);border-radius:8px}.diagram svg{display:block;font-family:inherit}.reader-frame{display:block;width:100%;height:max(65vh,540px);border:1px solid var(--line);border-radius:8px;background:#fff}.edition-head{background:white;border:1px solid var(--line);padding:18px;border-radius:8px;margin:12px 0}.scroll-table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:600}td .button{white-space:nowrap}.setting-list{display:grid;gap:12px}.setting{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:0}.setting>summary{padding:15px 18px;cursor:pointer;font-weight:600}.setting>summary small{font-weight:400;margin-left:8px}.setting-content{padding:0 18px 20px}.setting-content .entry{border:0;margin:0}.setting-content .entry>summary{display:none}.setting-content .entry-body{padding:0}.claim small{display:block;margin-top:5px}.meta-note{font-size:11px;color:var(--muted);margin:4px 0}.values,.relation{margin:5px 0}.values>div,.relation>div{display:flex;flex-wrap:wrap;gap:10px;padding:5px 0}.values dt,.relation dt{font-size:12px;color:var(--muted)}.values dd,.relation dd{margin:0;flex:1;min-width:150px}.setting table th{width:22%}.empty{padding:25px;background:white;border:1px dashed var(--line);border-radius:8px}.json-pane{padding:20px;background:#203329;color:#e7eee4;border-radius:8px;max-height:65vh;overflow:auto;font:12px/1.65 ui-monospace,monospace;white-space:pre}.rules{white-space:pre-wrap;font:13px/1.8 inherit;background:#fff;border:1px solid var(--line);padding:20px;border-radius:8px}.unit-list{list-style:none;padding:0;margin:14px 0}.unit-list li{padding:9px 0;border-bottom:1px solid var(--line)}.unit-link{border:0;background:transparent;padding:0;text-align:left;color:var(--green);text-decoration:underline;text-underline-offset:3px}.source-result{font-size:12px;color:var(--muted)}
@media(max-width:920px){.shell{grid-template-columns:180px minmax(0,1fr)}.sidebar{padding:24px 10px}.main{padding:24px 20px}.split{grid-template-columns:1fr}.chapter-tree{max-height:220px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.shell{display:block}.sidebar{position:sticky;top:0;z-index:10;height:auto;padding:12px 16px;gap:10px}.brand{font-size:22px;padding:0}.brand small{display:inline;margin-left:8px;font-size:9px}.sidebar nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px}.nav-button{flex-shrink:0;padding:8px 10px;font-size:12px}.nav-number,.sidebar footer{display:none}.main{padding:18px 16px 40px}.topline{font-size:9px}.page-heading{margin:20px 0}.stats{gap:9px}.stat,.card{padding:17px}.grid{grid-template-columns:1fr}.gate{margin:22px 0;padding:24px}.reader-frame{height:70vh;min-height:480px}.toolbar{gap:8px}.toolbar label{width:100%}.toolbar select{flex:1 1 100%}.setting-content{padding:0 12px 16px}td,th{padding:9px}td:first-child{white-space:nowrap}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">LORE<small>WRITING ROOM</small></div>
    <nav id="navigation" aria-label="제작실 메뉴"></nav>
    <footer>작가용 · 전편 스포일러<br>JSON 기반 읽기 전용 스냅샷<br>게임 실행 · 외부 통신 없음</footer>
  </aside>
  <main class="main">
    <div class="topline"><span>LORE / 소설 제작실</span><span>작가용 · 미승인 초안</span></div>
    <section class="gate" id="author-gate">
      <p class="eyebrow">ONE WORKSPACE / AUTHOR ONLY</p>
      <h1>@@TITLE@@</h1>
      <p>원고를 읽고, 큰 구성과 장별 그래프를 살피고, 인물과 설정을 찾는 공간입니다. 여러 파일을 오가지 않고 이 화면에서 전환할 수 있습니다.</p>
      <p class="notice">전편의 정체·관계·후반 사건이 포함됩니다. 아래 확인 버튼은 스포일러 경고이지 비밀번호나 접근 제어가 아닙니다. 이 파일을 공유하면 전체 자료도 공유됩니다.</p>
      <button class="button primary" id="open-studio" type="button">작가용 제작실 열기</button>
    </section>
    <div id="workspace" hidden>
      <header class="page-heading"><h1 id="view-title" tabindex="-1"></h1><p id="view-description"></p></header>
      <div id="view-content"></div>
    </div>
    <noscript><p class="notice">화면 전환에는 JavaScript가 필요합니다. 기존 원고 HTML과 Markdown 트리는 별도로 읽을 수 있습니다.</p></noscript>
  </main>
</div>
<script id="studio-data" type="application/json">@@PAYLOAD@@</script>
<script>@@SCRIPT@@</script>
</body>
</html>
