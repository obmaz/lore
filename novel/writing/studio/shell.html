<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>@@TITLE@@ · 작가용</title>
<style>
:root{--ink:#25352e;--muted:#4e6055;--paper:#f4f3ef;--line:#ccd5ce;--green:#294d3b;--gold:#c19b53;--soft:#e9efe7}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font:14px/1.7 "Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-wrap:anywhere}
button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.48}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3,h4,p{margin-top:0}h1{font-size:24px;line-height:1.4;letter-spacing:-.04em;margin-bottom:6px}h2{font-size:18px;letter-spacing:-.03em}h3{font-size:16px;margin:20px 0 8px}h4{font-size:14px;margin:16px 0 6px}
a{color:var(--green)}small,.muted{color:var(--muted)}small{font-size:12px}[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:#21392e;color:#e8ede6;padding:24px 14px;display:flex;flex-direction:column;gap:18px}
.brand{font:700 23px/1.1 Georgia,serif;letter-spacing:.12em;padding:0 10px}.brand small{font:10px/2 sans-serif;display:block;color:#b4c5b4;letter-spacing:.12em}
.sidebar nav{display:grid;gap:4px}.nav-button{border:0;background:transparent;color:inherit;text-align:left;font-size:13px;min-height:36px;padding:8px 10px;border-radius:6px;display:flex;gap:10px}
.nav-button[aria-current=page]{background:#3b5745;color:#fff}.nav-button:hover:enabled{background:#304d3c}.nav-number{color:#b2beaa;font-size:10px;min-width:16px;align-self:center}
.sidebar footer{font-size:11px;line-height:1.7;color:#b4c5b4;margin-top:auto;padding:0 10px}
.main{min-width:0;max-width:1600px;padding:16px clamp(14px,2vw,28px) 32px}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.topline span:last-child{letter-spacing:0;color:#805a1d;background:#eee5d4;padding:3px 8px;border-radius:20px}
.page-heading{margin:12px 0}.page-heading p{font-size:13px;color:var(--muted);max-width:740px;margin-bottom:0}
.workspace-actions{display:flex;gap:8px;align-items:center;margin-bottom:8px}.workspace-actions small{font-size:12px}
.settings-detail-open .page-heading{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:8px 0}
.settings-detail-open #view-title{order:-1;font-size:18px;margin:0}.settings-detail-open #view-description,.settings-detail-open .workspace-actions small{display:none}
.settings-detail-open .workspace-actions{margin:0}
.notice{background:#ede9df;border-left:3px solid var(--gold);padding:10px 14px;font-size:13px;line-height:1.75}
.view-hint{font-size:12px;color:var(--muted);margin:10px 0}
.gate{max-width:640px;margin:44px auto;background:#fff;border:1px solid var(--line);padding:28px;border-radius:10px}
.eyebrow{font-size:10px;color:#8c713e;letter-spacing:.14em;font-weight:700}
.button{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:13px;min-height:34px;padding:6px 10px;line-height:1.5}
.button.primary{background:var(--green);color:white;border-color:var(--green)}.button.small{font-size:12px;min-height:30px;padding:4px 8px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.toolbar label{font-size:12px;color:var(--muted)}
select,input[type=search]{min-width:0;min-height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:13px;padding:6px 9px;max-width:100%}
.toolbar select{flex:1;max-width:620px}.toolbar input{flex:1;min-width:150px}#graph-zoom{flex:0 0 90px}
.view-tabs,.detail-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.view-tabs [aria-pressed=true],.detail-tabs [aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat,.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.stat strong{display:block;font-size:24px;line-height:1.25;font-weight:500}.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card h3{margin:0 0 6px}.card p{font-size:14px}.card button{margin-top:4px}
.badge{display:inline-block;font-size:11px;background:var(--soft);border-radius:4px;padding:2px 6px}.badge.added{background:#f8ead7;color:#88601e}
.stage-list{padding-left:20px}.stage-list li{margin:7px 0}
.split{display:grid;grid-template-columns:minmax(200px,.7fr) minmax(0,1.65fr);gap:16px}
.chapter-tree{max-height:65vh;overflow:auto;border:1px solid var(--line);border-radius:7px;background:white;padding:8px}
.chapter-tree button{border:0;background:transparent;text-align:left;display:block;width:100%;padding:8px;border-radius:5px;color:var(--ink);font-size:13px}
.chapter-tree button[aria-current=true]{background:var(--soft);font-weight:700}
.unit{border:1px solid var(--line);background:#fff;border-radius:7px;margin:10px 0}.unit summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px}
.unit-body{padding:0 14px 14px;font-size:14px;line-height:1.75}.unit-body h4:first-child{margin-top:8px}
.source-note{font-size:11px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;color:var(--muted);padding-top:10px;margin:18px 0 0;border-top:1px solid var(--line)}.source-note>span{overflow-wrap:anywhere}
.diagram{max-height:70vh;overflow:auto;max-width:100%;padding:10px;background:white;border:1px solid var(--line);border-radius:7px}
.graph-workspace{display:grid;grid-template-columns:minmax(0,1fr);gap:0;align-items:start}.graph-workspace:has(.graph-selection:not([hidden])){grid-template-columns:minmax(0,var(--graph-width,72%)) 12px minmax(0,1fr)}.graph-workspace .graph-selection{margin:0;max-height:70vh;overflow:auto;min-width:0;overflow-wrap:anywhere}.graph-workspace .graph-selection-body{max-height:none}.graph-workspace .diagram{min-width:0}.graph-divider{display:none;width:12px;height:70vh;padding:0;border:0;background:transparent;cursor:col-resize;touch-action:none;position:relative}.graph-workspace:has(.graph-selection:not([hidden])) .graph-divider{display:block}.graph-divider::after{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}.graph-divider:hover::after,.graph-divider:focus-visible::after,.graph-divider.is-dragging::after{background:#365f99;width:3px}.graph-divider:focus-visible{outline:2px solid #365f99;outline-offset:-2px}body.is-resizing{user-select:none}#chapter-diagram{overflow-anchor:none}.diagram .flow-edge[data-edge-kind="influence"]{display:none}.diagram .flow-edge[data-edge-kind="influence"].is-related{display:block}
@media(max-width:900px){.graph-workspace:has(.graph-selection:not([hidden])){grid-template-columns:minmax(0,1fr)}.graph-workspace:has(.graph-selection:not([hidden])) .diagram{height:var(--graph-height,320px);max-height:65vh;min-height:160px}.graph-workspace .graph-selection{max-height:45vh}.graph-divider{width:100%;height:14px;cursor:row-resize}.graph-divider::after{left:0;right:0;top:6px;bottom:auto;width:auto;height:2px}.graph-divider:hover::after,.graph-divider:focus-visible::after,.graph-divider.is-dragging::after{width:auto;height:3px}}
.diagram svg{display:block;font-family:inherit}.diagram svg text{font-size:13px}
.diagram .flow-edge text{font-size:9px}.flow-edge path{vector-effect:non-scaling-stroke}
.flow-node[role="button"]{cursor:pointer}.flow-node[role="button"]:focus{outline:none}.flow-node[role="button"]:focus>rect{stroke:#365f99;stroke-width:3}
.flow-node[data-external="true"]>rect{stroke:#85629b}
.has-graph-selection .flow-edge[data-edge-kind="influence"]{opacity:.2}
.has-graph-selection .flow-edge.is-related{opacity:1}.flow-edge.is-related>path{stroke:#763595;stroke-width:3}
.flow-node.is-related>rect{stroke:#763595;stroke-width:2}.flow-node.is-selected>rect{stroke:#365f99;stroke-width:3}
.graph-selection{padding:8px 10px;margin:6px 0;border:1px solid var(--line);border-radius:6px;background:white}
.graph-selection-head{display:flex;gap:8px;align-items:center;justify-content:space-between}.graph-selection p{margin:6px 0}.graph-selection pre{max-height:180px;overflow:auto;font-size:12px}
.graph-selection-body{max-height:240px;overflow:auto;padding:4px 0}.graph-selection summary{cursor:pointer}
.graph-related{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}.graph-related button{white-space:normal;text-align:left}
.branch-rule>summary small,.branch-reaction>summary small{display:block;font-weight:400;margin-top:2px}
.branch-option{border-top:1px solid var(--line);padding:4px 0 12px}.merge-note{background:var(--soft);border-radius:5px;padding:9px 12px}
.rule-json{margin:8px 0}.rule-json>summary{font-size:12px;font-weight:400;padding:6px 0;color:var(--muted)}
.rule-json pre{font:12px/1.65 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);padding:12px;border-radius:6px;max-height:50vh;overflow:auto}
.reader-frame{display:block;width:100%;height:76vh;min-height:520px;border:1px solid var(--line);border-radius:7px;background:#fff}
.edition-head{background:white;border:1px solid var(--line);padding:14px;border-radius:7px;margin:10px 0}
.scroll-table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:7px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:600}td .button{white-space:nowrap}
.settings-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:12px;align-items:start}
.setting-list{max-height:72vh;overflow:auto;display:grid;gap:6px;position:sticky;top:16px}
.setting-list-item{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);text-align:left}
.setting-list-item strong{font-size:14px;flex:1;min-width:80px}.setting-list-item span{font-size:12px;color:var(--muted);max-width:100%;margin:0}
.setting-list-item[aria-current=true]{background:var(--soft);border-color:var(--green);box-shadow:inset 3px 0 var(--green)}
.setting-detail{background:#fff;border:1px solid var(--line);padding:12px;border-radius:8px;min-width:0}
.setting-detail-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:0 0 8px}.setting-identity{flex:1;min-width:0}
.setting-detail-head h2{font-size:22px;margin:0}.setting-detail-head p{font-size:12px;color:var(--muted);margin:0}.setting-detail .detail-tabs{margin:8px 0}
.entry-id{display:inline-block;font:11px/1.6 ui-monospace,monospace;background:var(--paper);border-radius:4px;padding:2px 5px;margin-left:5px}
.setting-content{container-type:inline-size;container-name:facts;padding:0;font-size:14px;line-height:1.75}.setting-content h3{font-size:16px;padding-bottom:4px;border-bottom:1px solid var(--line);margin:12px 0 6px}
.setting-content p{margin:4px 0}.setting-content .values{margin:0}.setting-content .values>div{padding:2px 0}.setting-content .values ul:empty{display:none}
.setting-content .entry{border:0;margin:0}.setting-content .entry>summary{display:none}.setting-content .entry-body{padding:0}
.fact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;align-items:start}
@container facts (max-width:700px){.fact-grid{grid-template-columns:1fr}}
.fact-card{display:grid;grid-template-columns:84px minmax(0,1fr) auto 40px;align-items:center;gap:4px 6px;border:0;border-bottom:1px solid var(--line);padding:4px 0;min-width:0}
.fact-card h4{grid-column:1;grid-row:1;margin:0;font-size:12px;line-height:1.6;color:var(--muted)}
.fact-value{grid-column:2;grid-row:1;min-width:0;font-size:14px;line-height:1.75}.fact-value .values{display:block;margin:0}.fact-value ul{padding-left:20px;margin:0}.fact-value p{margin:0}
.fact-status{grid-column:3;grid-row:1;display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin:0}.claim-status{white-space:nowrap}
.fact-evidence{font-size:12px;color:var(--muted)}.fact-evidence summary{cursor:pointer}.fact-evidence p{margin:4px 0}
.fact-card>.fact-evidence{grid-column:4;grid-row:1;margin:0;min-width:0}
.fact-card>.fact-evidence>summary{display:flex;align-items:center;justify-content:center;min-height:32px;width:40px;padding:2px;border-radius:4px;background:var(--paper);font-weight:400;list-style:none}
.fact-card>.fact-evidence>summary::-webkit-details-marker{display:none}.fact-card>.fact-evidence[open]{grid-column:1/-1;grid-row:auto;border-top:1px dashed var(--line);padding-top:4px}
.fact-card>.fact-evidence[open]>summary{margin-left:auto;background:var(--soft)}.fact-evidence-body{padding:4px 8px;background:var(--paper);border-radius:4px}
.fact-long{grid-column:1/-1}.fact-long>.fact-value{grid-column:1/-1;grid-row:2}.fact-long>.fact-status{grid-column:2/4;justify-self:end}
.detail-empty{padding:18px 6px;min-height:160px;color:var(--muted)}.detail-empty h2{font-size:18px}
.values,.relation{margin:5px 0}.values>div,.relation>div{display:flex;flex-wrap:wrap;gap:8px;padding:5px 0}.values dt,.relation dt{font-size:12px;color:var(--muted)}.values dd,.relation dd{margin:0;flex:1;min-width:150px}
.setting-content .relation{background:var(--paper);padding:8px 10px;border-radius:6px;margin:6px 0}.setting-content .meta-note{font-size:12px;line-height:1.75}.claim small{display:block;margin-top:5px}
.setting-toolbar{margin:8px 0}.setting-toolbar select{flex:0 1 180px}.setting-toolbar input{min-width:180px}.setting-toolbar .source-result{margin:0;white-space:nowrap}
.empty{padding:20px;background:white;border:1px dashed var(--line);border-radius:7px}
.setting-content .empty{border:0;padding:0;background:transparent;font-size:13px;color:var(--muted)}
.json-pane{padding:16px;background:#203329;color:#e7eee4;border-radius:7px;max-height:65vh;overflow:auto;font:12px/1.7 ui-monospace,monospace;white-space:pre}
.rules{white-space:pre-wrap;font:13px/1.75 inherit;background:#fff;border:1px solid var(--line);padding:16px;border-radius:7px}.source-result{font-size:12px;color:var(--muted)}
@media(max-width:1100px){.settings-layout{grid-template-columns:180px minmax(0,1fr)}}
@media(max-width:920px){.shell{grid-template-columns:170px minmax(0,1fr)}.sidebar{padding:20px 10px}.main{padding:20px 18px}.split{grid-template-columns:1fr}.chapter-tree{max-height:220px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
  .settings-layout{display:block}.setting-list{position:static;max-height:none}.settings-layout.has-selection .setting-list{display:none}.settings-layout:not(.has-selection) .setting-detail{display:none}
  .setting-detail{padding:10px}.setting-detail-head h2{font-size:21px}.setting-detail-head{gap:6px}.setting-toolbar input{flex-basis:100%;min-width:0}.setting-toolbar select{flex-basis:100%;max-width:none}
  .settings-detail-open .setting-toolbar,.settings-detail-open #setting-count,.settings-detail-open #view-description{display:none}
  .settings-detail-open .page-heading{margin:8px 0}.diagram{max-height:65vh}.reader-frame{height:75vh;min-height:460px}
  .fact-card{grid-template-columns:68px minmax(0,1fr) auto 40px}.fact-card>.fact-evidence>summary{min-height:40px}
}
@media(max-width:620px){
  .shell{display:block}.sidebar{position:sticky;top:0;z-index:10;height:auto;padding:10px 14px;gap:8px}.brand{font-size:20px;padding:0}.brand small{display:inline;margin-left:8px;font-size:9px}
  .sidebar nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}.nav-button{flex-shrink:0;min-height:44px;padding:6px 9px;font-size:12px}.nav-number,.sidebar footer{display:none}
  .main{padding:16px 14px 32px}.topline{font-size:10px}.page-heading{margin:16px 0}h1{font-size:22px}.stats{gap:8px}.stat,.card{padding:14px}.stat strong{font-size:22px}
  .grid{grid-template-columns:1fr}.gate{margin:20px 0;padding:20px}.toolbar{gap:6px}.toolbar label{width:100%}.toolbar select{flex:1 1 100%}
  .button,.button.small,select,input[type=search]{min-height:40px}.button{padding:5px 9px}.workspace-actions{gap:8px}.workspace-actions small{font-size:11px}
  /* Keep iOS form focus from zooming the page; other UI text stays compact. */
  select,input[type=search]{font-size:16px}
  .graph-tools label{width:auto}#graph-zoom{flex:0 0 90px}.unit summary{min-height:44px}td,th{padding:8px}td:first-child{white-space:nowrap}
}
</style>
</head>
<!-- On mobile the selected card is the reading surface; search stays on the list. -->
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">LORE<small>WRITING ROOM</small></div>
    <nav id="navigation" aria-label="제작실 메뉴"></nav>
    <footer>작가용 · 전편 스포일러<br>JSON 기반 읽기 전용 스냅샷<br>게임 실행 · 외부 통신 없음</footer>
  </aside>
  <main class="main">
    <div class="topline"><span>LORE / 소설 제작실</span><span>작가용 · 미승인 초안</span></div>
    <div id="workspace">
      <header class="page-heading"><div class="workspace-actions"><button type="button" class="button small" id="studio-back" disabled>← 이전 화면</button><small>읽기 전용 · 작가용 제작실</small></div><h1 id="view-title" tabindex="-1"></h1><p id="view-description"></p></header>
      <div id="view-content"></div>
    </div>
    <noscript><p class="notice">화면 전환에는 JavaScript가 필요합니다. 기존 원고 HTML과 Markdown 트리는 별도로 읽을 수 있습니다.</p></noscript>
  </main>
</div>
<script id="studio-data" type="application/json">@@PAYLOAD@@</script>
<script>@@SCRIPT@@</script>
</body>
</html>
