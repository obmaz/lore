<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전편 곁가지 모험 · 15장 선택 시범</title>
<style>body{max-width:850px;margin:auto;padding:28px 20px;background:#f6f3eb;color:#25372e;font:17px/1.95 "Noto Sans CJK KR","Malgun Gothic",sans-serif;overflow-wrap:anywhere}h1{font-size:34px}h2{margin-top:48px;border-bottom:1px solid #b9c8bd}h3{font-size:18px}small,.note{font-size:13px;color:#627367}.notice{background:#e5ecdf;padding:15px}.quote{border-left:3px solid #66886e;padding:8px 18px;background:white}.metadata{font-size:12px;color:#617265}a{color:#27634c}button{font:inherit;padding:6px 12px}li{margin:5px 0}section{break-inside:auto}@page{size:A4;margin:18mm}@media print{body{padding:0;background:white;font-size:11px}button{display:none}h1{font-size:24px}h2,h3{break-after:avoid}p{orphans:3;widows:3}}body{font-size:16px}button{font:inherit;padding:8px 12px;cursor:pointer}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.side-story{border-left:3px solid #aa8640;padding-left:16px}.side-memory{border-left:3px solid #657d68;padding-left:16px}.side-badge{font-size:12px;color:#806029}#side-choices{display:grid;gap:10px;margin:16px 0}#side-next{margin-top:14px}[hidden]{display:none!important}</style>
<h1>전편 곁가지 모험 · 15장 선택 시범</h1><p class="notice">작가용 · 전편 스포일러 · 각 장 2개 곁가지, 총 30개와 5개 중첩 선택은 창작 초고. 본줄기는 기존 종이책 예시 경로의 주요 내용이며 완성된 장편 본문·원문 대사 전체가 아닙니다. 기존 첫 장 독자 판본과 저장은 별도입니다.</p><div class="toolbar"><button type="button" id="side-prev">이전 장</button><span id="side-progress"></span><button type="button" id="side-restart">처음부터</button></div><div id="side-content" aria-live="polite"></div><div id="side-choices"></div><button type="button" id="side-next" hidden>다음 장</button><script type="application/json" id="side-data">{"chapters":[{"id":"chapter01","number":1,"title":"부탁을 받은 사람들","units":[{"id":"chapter01/p01","blocks":[{"kind":"main","unit_id":"chapter01/p01","title":"낯선 세계에서 받은 안내","text":"서진은 동료들과 다른 세계에 들어와 로어의 성에 도착한다. 성 안의 안내를 따라 이곳을 다스리는 사람에게 가며, 앞으로 맡을 일은 아직 모르는 상태다. 이 도착이 다음 접견의 출발점이 된다."},{"kind":"outcome","unit_id":"chapter01/p01","text":"성주를 만나 사정을 들을 자리에 도착한다."}]},{"id":"chapter01/p02","blocks":[{"kind":"main","unit_id":"chapter01/p02","title":"세계의 위기를 듣다","text":"로드 안은 대륙의 침몰과 용암 지대의 발생, 돌아오지 않은 특공대, 네크로맨서의 세력 확장을 설명한다. 일행은 서로 떨어진 재난이 지금 맡게 될 큰 임무의 배경임을 듣는다. 아직 원인을 직접 확인한 것은 아니지만 막아야 할 상대와 피해의 범위를 알게 된다."},{"kind":"outcome","unit_id":"chapter01/p02","text":"세계의 위기와 궁극적인 상대에 관한 설명을 듣는다."}]},{"id":"chapter01/p03","blocks":[{"kind":"main","unit_id":"chapter01/p03","title":"돌아와 증명해야 할 첫 임무","text":"성주는 곧바로 최종 상대에게 보내는 대신 메너스의 중심을 탐사하고 돌아오라고 부탁한다. 일행은 발견과 귀환 보고가 이번 임무의 완료 기준임을 이해한다. 출발 준비와 동굴 탐색은 이 약속을 수행하기 위한 행동으로 이어진다."},{"kind":"outcome","unit_id":"chapter01/p03","text":"첫 탐사의 목적지와 완료 기준을 알고 수행하기로 한다."}]},{"id":"chapter01/p04","blocks":[{"kind":"main","unit_id":"chapter01/p04","title":"떠난 사람의 이름과 남은 목소리","text":"출발 전 성 안에서 일행은 특공대를 기다리는 사람들의 사정을 접한다. 유골 앞에서는 주니어 안타레스의 목소리를 만나 아버지 레드 안타레스를 찾아 배움을 얻으라는 말을 듣는다. 현재 임무는 동굴 탐사이지만, 여행 중 다시 찾아야 할 이름이 생긴다."},{"kind":"outcome","unit_id":"chapter01/p04","text":"앞으로 찾아볼 인물의 이름과 실종자를 기다리는 사정을 기억한다."}]},{"id":"chapter01/p05","blocks":[{"kind":"main","unit_id":"chapter01/p05","title":"출발할 일행을 정비하다","text":"일행은 맡은 탐사를 위해 출발 준비를 시작한다. 무기고의 도움을 받을지 지금 장비로 떠날지 정한 뒤, 성문에서 들려오는 동행 제안을 만날 것이다. 준비와 동행은 달라질 수 있지만 중심부 탐사와 귀환 보고라는 약속은 유지된다."},{"kind":"choice","unit_id":"chapter01/p05","decision_id":"prepare","id":"prepare/armory","text":"일행은 무기고에서 떠날 준비를 한다. 네 동료의 직업 무기는 그대로 두고, 서진은 미지정이던 자신의 무장으로 단도를 받는다. 장비를 마련한 뒤 일행은 동료 제안이 기다리는 성문으로 향한다."},{"kind":"choice","unit_id":"chapter01/p05","decision_id":"company","id":"company/talk_join","text":"일행은 먼저 제안자가 왜 함께 가려는지 묻고 이야기를 나눈다. 스켈레톤은 자신을 소개하고 여행에 보탬이 되겠다는 뜻을 전한다. 일행은 그 대화를 기억한 채 그를 받아들여 함께 출발한다."},{"kind":"outcome","unit_id":"chapter01/p05","text":"현재 동행과 실제 장비 상태를 가지고 탐사 길에 오른다."}]},{"id":"chapter01/p06","blocks":[{"kind":"main","unit_id":"chapter01/p06","title":"남서쪽 동굴에 도달하다","text":"성에서 들은 방향을 따라 이동한 일행은 남서쪽 동굴 입구에 도착한다. 목적지는 내부의 중심이므로 문턱에 도착한 것만으로 돌아갈 수는 없다. 일행은 동굴 안의 위험을 지나 중심부에 이르는 탐색을 시작한다."},{"kind":"reaction","unit_id":"chapter01/p06","id":"armory_weapon","text":"성문을 나선 서진은 무기고에서 받은 단도를 확인한다. 출발 직전의 준비가 이제 동굴을 향하는 실제 짐과 무장으로 남아 있다."},{"kind":"reaction","unit_id":"chapter01/p06","id":"skeleton_memory","text":"스켈레톤은 성문에서 나눈 이야기를 이어 가며 일행과 걷는다. 함께 가겠다는 짧은 제안보다 더 긴 만남을 나눈 기억이 이번 길에 남는다."},{"kind":"outcome","unit_id":"chapter01/p06","text":"임무의 동굴 안으로 들어가 중심부를 찾아간다."}]},{"id":"chapter01/p07","blocks":[{"kind":"main","unit_id":"chapter01/p07","title":"탐사의 중심을 확인하다","text":"일행은 동굴 안을 통과하여 의뢰에서 지목한 중심부에 도달한다. 성주가 확인을 부탁한 지점까지 왔으므로 탐사의 목표를 수행한 것이다. 그러나 약속은 돌아가 보고하는 일까지였으므로, 일행은 확인한 결과를 전할 성으로 돌아가기로 한다."},{"kind":"outcome","unit_id":"chapter01/p07","text":"중심부 탐사를 마쳤으며 귀환 보고가 남는다."}]},{"id":"chapter01/p08","blocks":[{"kind":"main","unit_id":"chapter01/p08","title":"첫 보고가 다음 부탁이 되다","text":"일행은 성으로 돌아와 탐사 결과를 보고하고, 성주는 그 성공으로 능력을 인정한다. 이 신뢰를 바탕으로 동쪽 라스트디치의 근심을 해결해 달라는 새 부탁을 받는다. 첫 탐사는 끝났지만 세계의 위기는 남아 있으므로 다음 성을 향할 이유가 생긴다."},{"kind":"outcome","unit_id":"chapter01/p08","text":"첫 임무를 보고해 완료하고 다음 성의 의뢰를 받는다."}]}]},{"id":"chapter02","number":2,"title":"모래 아래의 오래된 적","units":[{"id":"chapter02/p01","blocks":[{"kind":"main","unit_id":"chapter02/p01","title":"도착을 기다리던 성","text":"라스트디치에 도착한 일행은 성주가 이미 자신들의 방문 소식을 전해 들었음을 알게 된다. 북쪽 피라미드의 메이저 머미가 성을 위협하고 있다. 이번 임무는 탐사만으로 끝나지 않고 그 상대를 격퇴해야 완료된다."},{"kind":"outcome","unit_id":"chapter02/p01","text":"현재 성의 위협과 격퇴해야 할 상대를 알게 된다."}]},{"id":"chapter02/p02","blocks":[{"kind":"main","unit_id":"chapter02/p02","title":"실종자에게 가족이 있었다","text":"성 안에서 일행은 특공대 지휘관의 배우자를 만나 로어 헌터라는 이름을 듣는다. 주민들의 문과 쌍둥이 성 이야기는 이후 이동의 실마리도 남긴다. 일행은 기다리는 사람의 사정을 기억하되, 먼저 이 성의 당면한 위협을 해결한다."},{"kind":"outcome","unit_id":"chapter02/p02","text":"특공대 지휘관의 이름과 다음 땅에 관한 이야기를 듣는다."}]},{"id":"chapter02/p03","blocks":[{"kind":"main","unit_id":"chapter02/p03","title":"북쪽으로 향하는 이유","text":"일행은 성을 압박하는 적을 찾아 북쪽 동굴로 향한다. 처음 임무와 달리 중심에 닿았다는 사실만으로는 성을 구할 수 없으므로, 안쪽의 상대까지 찾아야 한다. 주민에게 들은 통로 이야기는 이번 일을 보고한 뒤 이어질 여행으로 남겨 둔다."},{"kind":"outcome","unit_id":"chapter02/p03","text":"북쪽 동굴 안에서 의뢰의 상대에게 접근한다."}]},{"id":"chapter02/p04","blocks":[{"kind":"main","unit_id":"chapter02/p04","title":"성을 위협하던 상대와의 대결","text":"일행은 메이저 머미와 주변의 스핑크스를 상대한다. 싸움을 끝내야 성에 가해지는 위협을 줄였다는 결과를 가져갈 수 있다. 주 진행에서는 적들을 격퇴하고 돌아갈 준비를 한다."},{"kind":"outcome","unit_id":"chapter02/p04","text":"성의 위협을 격퇴했고 결과를 보고할 수 있다."}]},{"id":"chapter02/p05","blocks":[{"kind":"main","unit_id":"chapter02/p05","title":"구제의 결과를 보고하다","text":"귀환한 일행의 보고를 받고 성주는 성이 구제되었다고 말한다. 첫 성에서 얻은 신뢰가 아니라 이곳에서 직접 수행한 격퇴가 이번 인정과 보상의 근거다. 보고를 마치면서 당면한 의뢰가 끝나고 다음 이동의 안내를 받을 수 있다."},{"kind":"outcome","unit_id":"chapter02/p05","text":"격퇴 결과를 보고하고 현재 성의 의뢰를 마친다."}]},{"id":"chapter02/p06","blocks":[{"kind":"main","unit_id":"chapter02/p06","title":"쌍둥이 성으로 이어지는 문","text":"성주는 그라운드 게이트가 밸리언트 피플스로 이어진다고 알려 준다. 그 쌍둥이 성은 침략자의 영향을 심하게 받고 있으므로 일행에게는 다음 땅의 피해를 확인할 목적이 생긴다. 문을 건너는 여정은 한 성의 구제를 다른 지역의 문제로 연결한다."},{"kind":"outcome","unit_id":"chapter02/p06","text":"다음 문의 목적지와 그곳으로 갈 이유를 알고 출발한다."}]}]},{"id":"chapter03","number":3,"title":"황금이 잠든 자리","units":[{"id":"chapter03/p01","blocks":[{"kind":"main","unit_id":"chapter03/p01","title":"쌍둥이 성의 실제 모습","text":"문을 건넌 일행은 밸리언트 피플스의 폐허를 마주한다. 닮은 성이라는 앞선 설명과 달리 이곳은 저항의 대가로 파괴되어 있다. 일행은 이 지역을 거쳐 가이아 테라에서 지하에 남은 위험의 사정을 듣는다."},{"kind":"outcome","unit_id":"chapter03/p01","text":"폐허를 확인하고 이 대륙의 새로운 위험을 들을 장소에 도착한다."}]},{"id":"chapter03/p02","blocks":[{"kind":"main","unit_id":"chapter03/p02","title":"풀어서는 안 되는 봉인","text":"성주는 적이 만든 이블 실에 황금의 봉인이 숨겨져 있다고 설명한다. 그것을 풀면 대륙을 황폐하게 할 괴물들이 나온다는 말이므로, 맡은 일은 해제가 아니라 위치를 찾는 것이다. 주민에게서는 리겔이 이미 동굴로 들어갔다는 소식도 듣는다."},{"kind":"outcome","unit_id":"chapter03/p02","text":"봉인을 발견하되 풀지 않는 임무와 동굴에 들어간 인물의 사정을 안다."}]},{"id":"chapter03/p03","blocks":[{"kind":"main","unit_id":"chapter03/p03","title":"지각이 끊어 놓은 길","text":"지하로 내려간 일행은 절벽과 문을 통과하며 봉인이 있는 곳을 찾는다. 안쪽에서 심하게 다친 리겔을 만나고, 전투 중 지각이 바뀌어 혼자 탈출하지 못했다는 설명을 듣는다. 탐색은 위험의 위치를 확인하는 일인 동시에 그곳에 남은 사람과의 만남으로 이어진다."},{"kind":"outcome","unit_id":"chapter03/p03","text":"부상당한 용사를 만나 그의 탈출이 막힌 사정을 듣는다."}]},{"id":"chapter03/p04","blocks":[{"kind":"main","unit_id":"chapter03/p04","title":"치료와 식량 뒤의 작별","text":"일행은 혼자 탈출할 수 없다는 용사의 설명을 듣고 상처를 돌보며 떠날 준비를 돕기로 한다. 치료와 함께 탈출할 식량과 발 디딜 길을 마련해야 한다. 누구에게 어느 준비를 맡길지 정한 뒤, 용사를 떠나보내고 남은 탐색을 이어 갈 것이다."},{"kind":"choice","unit_id":"chapter03/p04","decision_id":"aid","id":"aid/cook","text":"일행이 부상자를 돌보는 동안 요리사는 주방 칼을 사용해 식량 짐을 나누고 가져가기 편하게 정리한다. 상처를 돌보는 일과 탈출 준비가 이어지고, 용사는 축복을 남긴 뒤 자기 길로 떠난다."},{"kind":"outcome","unit_id":"chapter03/p04","text":"용사를 도와 떠나보내고 봉인 탐색을 이어 간다."}]},{"id":"chapter03/p05","blocks":[{"kind":"main","unit_id":"chapter03/p05","title":"황금의 봉인을 찾아 지키다","text":"일행은 남은 지하를 탐색해 황금의 봉인을 발견한다. 성주에게 들었던 위험 때문에 이것을 열어 보려는 행동으로 임무를 바꾸지 않는다. 위치를 확인한 결과를 가지고 성으로 돌아가는 것이 이번 의뢰의 다음 단계다."},{"kind":"outcome","unit_id":"chapter03/p05","text":"황금의 봉인을 발견했고 해제하지 않은 채 귀환한다."}]},{"id":"chapter03/p06","blocks":[{"kind":"main","unit_id":"chapter03/p06","title":"발견 뒤에도 남은 위험","text":"일행은 성주에게 봉인을 찾았다고 보고한다. 그러나 성주는 이 대륙의 위험이 그것만이 아니라며 북동쪽 퀘이크의 적들을 다음 대상으로 알려 준다. 발견 임무의 완료가 남은 위협을 격퇴하는 다음 의뢰로 이어진다."},{"kind":"reaction","unit_id":"chapter03/p06","id":"aid_cook_memory","text":"귀환하는 길에 요리사는 용사에게 나누어 준 식량을 떠올린다. 봉인을 찾았다는 보고에는 지하에 남은 사람을 도운 경험도 함께 이어진다."},{"kind":"outcome","unit_id":"chapter03/p06","text":"발견 결과를 보고한 뒤 다른 동굴의 격퇴 의뢰를 받는다."}]}]},{"id":"chapter04","number":4,"title":"흔들리는 땅의 열쇠","units":[{"id":"chapter04/p01","blocks":[{"kind":"main","unit_id":"chapter04/p01","title":"발견에서 격퇴로 바뀐 임무","text":"일행은 성주가 지목한 퀘이크의 위협을 해결하려 한다. 이번 상대는 아키가고일과 그곳의 적들이며, 봉인의 위치를 알아낸 것만으로는 해결되지 않는 문제다. 일행은 대륙에 남은 적의 힘을 줄이기 위해 출발한다."},{"kind":"outcome","unit_id":"chapter04/p01","text":"다음 동굴의 격퇴 목표를 알고 출발한다."}]},{"id":"chapter04/p02","blocks":[{"kind":"main","unit_id":"chapter04/p02","title":"비밀문이 많은 동굴","text":"주민에게 비밀문과 숨겨진 장비의 이야기를 들은 일행은 복잡한 동굴 안으로 들어간다. 안쪽 길을 찾아야 의뢰의 상대에게 닿을 수 있다. 탐색 중 별도의 발견을 하더라도 주 목표는 적의 거처를 찾는 일로 유지된다."},{"kind":"outcome","unit_id":"chapter04/p02","text":"동굴의 구조를 살피며 보스가 있는 곳에 접근한다."}]},{"id":"chapter04/p03","blocks":[{"kind":"main","unit_id":"chapter04/p03","title":"대륙에 남은 적을 넘다","text":"일행은 아키가고일과 두 적에게 도달해 대결한다. 여기서 승리한 결과가 있어야 이전에 발견한 위험에 더해 이 동굴의 위협도 줄였다고 보고할 수 있다. 주 진행에서는 상대를 격퇴하고 성으로 돌아간다."},{"kind":"outcome","unit_id":"chapter04/p03","text":"격퇴 결과를 가지고 귀환할 수 있다."}]},{"id":"chapter04/p04","blocks":[{"kind":"main","unit_id":"chapter04/p04","title":"보고가 열쇠를 얻는 근거","text":"성으로 돌아온 일행은 이번에 격퇴한 결과를 보고한다. 성주는 그 공적을 인정하고 보상과 함께 워터 키를 준다. 다음 땅의 통로를 들어 알고 있던 것과 실제 문을 열 수 있는 조건을 얻는 일이 이 보고로 구분된다."},{"kind":"outcome","unit_id":"chapter04/p04","text":"보고 보상으로 물의 대륙에 통하는 열쇠를 실제로 얻는다."}]},{"id":"chapter04/p05","blocks":[{"kind":"main","unit_id":"chapter04/p05","title":"열쇠가 가리키는 목적지","text":"성주는 받은 열쇠를 위번의 동굴 안 문에서 써야 한다고 안내한다. 일행은 워터 필드로 가려면 먼저 그 통로에 닿아야 함을 안다. 다음 이동 계획은 막연한 다른 지역 탐방이 아니라 받은 보상을 실제 길로 바꾸는 일이 된다."},{"kind":"outcome","unit_id":"chapter04/p05","text":"열쇠를 쓸 동굴과 문의 목적지를 알고 있다."}]},{"id":"chapter04/p06","blocks":[{"kind":"main","unit_id":"chapter04/p06","title":"남은 준비를 마치고 떠나다","text":"일행은 이 대륙에서 맡은 일을 마쳤다는 결과와 다음 문의 위치를 가지고 이동을 준비한다. 열쇠는 손에 들어왔지만 통로의 적은 아직 남아 있으므로 다음 위험을 염두에 두고 떠난다. 이번 출발은 성주가 알려 준 문까지 보상을 가져가 다음 여행으로 바꾸는 행동이다."},{"kind":"outcome","unit_id":"chapter04/p06","text":"현재 동행·물자·열쇠를 가지고 다음 통로로 향한다."}]}]},{"id":"chapter05","number":5,"title":"건너가는 대가","units":[{"id":"chapter05/p01","blocks":[{"kind":"main","unit_id":"chapter05/p01","title":"문까지 가져가야 할 열쇠","text":"일행은 워터 키를 가지고 위번의 동굴을 찾는다. 열쇠는 목적지에 닿았을 때만 이동을 가능하게 하므로, 얻었다는 사실만으로 대륙을 건넌 것은 아니다. 앞서 들은 길의 위치를 실제 이동으로 확인한다."},{"kind":"outcome","unit_id":"chapter05/p01","text":"물의 문이 있는 동굴에 도착한다."}]},{"id":"chapter05/p02","blocks":[{"kind":"main","unit_id":"chapter05/p02","title":"통로를 지키는 상대들","text":"일행은 문으로 이어지는 동굴 길을 따라간다. 이 통로를 와이번들이 지킨다는 경고가 실제 장애물로 이어진다. 문을 찾는 일과 길의 적을 넘는 일은 모두 다음 대륙에 들어가기 위해 필요한 과정이다."},{"kind":"outcome","unit_id":"chapter05/p02","text":"길을 막는 상대들과 맞서야 하는 지점에 도달한다."}]},{"id":"chapter05/p03","blocks":[{"kind":"main","unit_id":"chapter05/p03","title":"세 수문장을 통과하다","text":"일행은 길을 지키는 와이번들과 대결한다. 이 싸움의 목적은 새 의뢰를 따로 완료하는 것이 아니라 문 앞까지 가는 통로를 확보하는 데 있다. 주 진행에서 상대들을 넘고 나서 일행은 안쪽 문에 접근한다."},{"kind":"outcome","unit_id":"chapter05/p03","text":"통로의 적을 넘어 열쇠를 사용할 문에 닿는다."}]},{"id":"chapter05/p04","blocks":[{"kind":"main","unit_id":"chapter05/p04","title":"이동 조건을 실제로 쓰다","text":"문 앞에 도착한 일행은 가져온 워터 키를 사용한다. 앞 대륙에서 얻은 보상이 이 순간 실제 이동의 조건이 된다. 문을 통과한 뒤에야 일행은 워터 필드에 도착하며, 지나온 지역의 임무와 다음 지역의 만남이 연결된다."},{"kind":"outcome","unit_id":"chapter05/p04","text":"문을 통과해 물의 대륙에 들어간다."}]},{"id":"chapter05/p05","blocks":[{"kind":"main","unit_id":"chapter05/p05","title":"물에 잠긴 땅에 도착하다","text":"일행은 물로 덮인 대륙과 남아 있는 땅을 마주한다. 여기서 바로 새로운 보스를 정해 싸우는 대신 살아남은 사람들이 있는 성으로 향한다. 지금 보이는 피해가 무엇 때문이며 어떤 위험이 남았는지는 그곳의 사정을 들어야 알 수 있다."},{"kind":"outcome","unit_id":"chapter05/p05","text":"새 대륙의 성으로 가서 사정을 듣기로 한다."}]}]},{"id":"chapter06","number":6,"title":"물 아래 남은 사람들","units":[{"id":"chapter06/p01","blocks":[{"kind":"main","unit_id":"chapter06/p01","title":"마지막 아군 성의 사정","text":"워터 필드의 성주는 대륙 대부분이 가라앉고 살아남은 사람들이 이 성을 세웠다고 말한다. 적의 두 동굴이 성을 위협하며, 이곳이 무너지면 지나온 통로로 다른 땅의 침공도 이어질 수 있다. 일행은 다음 대륙으로 떠나기 전에 이 위험을 줄여야 한다."},{"kind":"outcome","unit_id":"chapter06/p01","text":"침몰한 대륙의 사정과 현재 성이 버티는 이유를 듣는다."}]},{"id":"chapter06/p02","blocks":[{"kind":"main","unit_id":"chapter06/p02","title":"이름으로만 알던 생존자","text":"일행은 특공대 대장 로어 헌터를 직접 만난다. 그는 혼자서는 적을 막을 수 없어 영웅들을 기다렸다고 말한다. 앞 성에서 들었던 지휘관의 이름과 기다리는 배우자의 사정이 이제 살아 있는 당사자의 목소리로 이어진다."},{"kind":"outcome","unit_id":"chapter06/p02","text":"지휘관의 생존과 그가 밝힌 현재 처지를 알게 된다."}]},{"id":"chapter06/p03","blocks":[{"kind":"main","unit_id":"chapter06/p03","title":"첫 섬의 위협을 맡다","text":"성주는 남서쪽 섬의 노티스에 있는 히드라를 물리쳐 달라고 부탁한다. 두 동굴 가운데 먼저 맡을 위험이 정해지자 일행은 그 위치로 향한다. 성의 피해를 들은 만남이 실제 격퇴 행동으로 옮겨 간다."},{"kind":"outcome","unit_id":"chapter06/p03","text":"첫 동굴의 상대와 위치를 알고 탐색을 시작한다."}]},{"id":"chapter06/p04","blocks":[{"kind":"main","unit_id":"chapter06/p04","title":"처음 들었던 이름과 다시 만나다","text":"동굴 안에서 레드 안타레스의 영을 만난다. 그는 적의 능력과 간접 공격 기법을 이야기하며 그 배움을 전한다. 앞 성에서 주니어 안타레스에게 들었던 이름이 여기서 실제 배움으로 이어지고, 초자연력도 필요하다는 다음 과제가 남는다."},{"kind":"outcome","unit_id":"chapter06/p04","text":"간접 공격을 배우고 최종 상대에게는 다른 배움도 필요하다는 조언을 듣는다."}]},{"id":"chapter06/p05","blocks":[{"kind":"main","unit_id":"chapter06/p05","title":"첫 동굴의 대결을 마치다","text":"일행은 남은 길을 지나 히드라와 맞선다. 배움을 들었다는 사실과 의뢰를 완료한 결과는 별개이므로, 상대를 격퇴해야 성으로 돌아가 이번 일을 보고할 수 있다. 주 진행에서는 대결을 끝내고 귀환한다."},{"kind":"outcome","unit_id":"chapter06/p05","text":"첫 동굴의 적을 격퇴하고 보고할 결과를 갖춘다."}]},{"id":"chapter06/p06","blocks":[{"kind":"main","unit_id":"chapter06/p06","title":"인정받았지만 하나가 남다","text":"보고를 받은 성주는 일행의 능력을 믿을 수 있다고 말한다. 그러나 성을 위협하던 동굴은 둘이었으므로 첫 승리만으로 이 대륙의 임무가 끝나지 않는다. 일행은 나머지 의뢰와 아직 필요한 배움을 다음 목표로 이어받는다."},{"kind":"outcome","unit_id":"chapter06/p06","text":"성주의 신뢰를 얻고 두 번째 동굴의 위험을 해결하러 간다."}]}]},{"id":"chapter07","number":7,"title":"잠긴 길, 열린 문","units":[{"id":"chapter07/p01","blocks":[{"kind":"main","unit_id":"chapter07/p01","title":"나머지 동굴의 부탁","text":"성주는 동쪽 로크업의 휴즈 드래곤도 격퇴해 달라고 부탁한다. 앞서 하나를 해결했어도 다른 동굴이 남아 있으므로 일행은 이 부탁을 맡는다. 주민에게 들은 미로와 용의 위협은 새 탐색을 준비할 이유가 된다."},{"kind":"outcome","unit_id":"chapter07/p01","text":"남은 위협과 그 위치를 알고 두 번째 동굴로 향한다."}]},{"id":"chapter07/p02","blocks":[{"kind":"main","unit_id":"chapter07/p02","title":"미로에서 만난 수도자","text":"동굴 안을 찾던 일행은 스피카를 만난다. 그녀는 오랜 수도 끝에 초자연력을 알아냈다고 말한다. 앞 동굴에서 더 필요하다고만 들었던 배움이 여기서 구체적인 설명을 들을 수 있는 만남으로 이어진다."},{"kind":"outcome","unit_id":"chapter07/p02","text":"초자연력에 대해 설명할 인물을 만난다."}]},{"id":"chapter07/p03","blocks":[{"kind":"main","unit_id":"chapter07/p03","title":"배움과 동행은 다른 일","text":"스피카는 다섯 능력의 사용법을 설명하고 적들도 그 능력을 안다고 경고한다. 일행은 새로운 힘이 자기편만의 이점이 아니라 상대를 이해하는 데도 필요한 배움임을 듣는다. 동행에 관한 교류가 이어질 여지는 있지만 현재 맡은 동굴의 상대를 격퇴하는 일은 여전히 남아 있다."},{"kind":"automatic","unit_id":"chapter07/p03","decision_id":"spica_company","id":"spica_company/continue","text":"일행은 가르침을 들은 뒤 현재 함께 온 동료들과 탐색을 이어 간다. 스피카는 이 경로의 동굴 대결을 함께한 동료가 되지는 않는다. 일행은 들은 경고를 기억하고 남은 의뢰를 수행하러 간다."},{"kind":"outcome","unit_id":"chapter07/p03","text":"초자연력의 사용법과 경고를 듣고 남은 탐색으로 이어 간다."}]},{"id":"chapter07/p04","blocks":[{"kind":"main","unit_id":"chapter07/p04","title":"미로 끝의 용을 상대하다","text":"일행은 미로를 통과해 휴즈 드래곤에게 도달한다. 이 상대를 격퇴해야 성을 위협하는 두 번째 동굴의 결과도 완료된다. 주 진행에서 대결을 마친 일행은 두 임무를 끝낸 보고를 위해 성으로 돌아간다."},{"kind":"outcome","unit_id":"chapter07/p04","text":"남은 동굴의 상대를 격퇴하고 귀환한다."}]},{"id":"chapter07/p05","blocks":[{"kind":"main","unit_id":"chapter07/p05","title":"다른 땅의 문을 여는 보상","text":"성주는 격퇴 결과를 인정하고 스왐프 키를 준다. 이 열쇠가 여는 문은 지금 대륙이 아니라 앞서 방문한 가이아 테라에 있다. 두 위협을 해결한 결과가 이전에 지나쳤던 문을 다음 목적지로 바꾼다."},{"kind":"outcome","unit_id":"chapter07/p05","text":"늪의 문을 열 실제 열쇠와 사용 장소의 안내를 얻는다."}]},{"id":"chapter07/p06","blocks":[{"kind":"main","unit_id":"chapter07/p06","title":"직진 대신 돌아가는 여행","text":"일행은 현재 물자와 동행 상태를 확인하고 지나온 통로로 돌아간다. 늪의 열쇠를 갖고 있다는 점이 앞선 방문과 달라졌으므로 같은 땅으로 돌아가도 목적은 새롭다. 귀환의 끝에는 아군 성이 아닌 적들의 대륙으로 향할 문이 기다린다."},{"kind":"outcome","unit_id":"chapter07/p06","text":"이전 대륙의 늪 문으로 돌아간다."}]}]},{"id":"chapter08","number":8,"title":"늪이 내민 두 갈래 길","units":[{"id":"chapter08/p01","blocks":[{"kind":"main","unit_id":"chapter08/p01","title":"이전에 열지 못했던 문","text":"일행은 스왐프 키를 가지고 가이아 테라의 늪 문으로 돌아온다. 물의 대륙에서 수행한 두 임무가 이곳을 통과할 조건을 마련했다. 이제부터 아군의 성을 찾아가던 여행과 다른 지역에 들어갈 준비를 한다."},{"kind":"outcome","unit_id":"chapter08/p01","text":"늪의 문을 열 조건을 갖추고 문 앞에 도달한다."}]},{"id":"chapter08/p02","blocks":[{"kind":"main","unit_id":"chapter08/p02","title":"다음 문에는 두 조건이 있다","text":"문 앞에서 로드 안의 조언을 듣는다. 적들의 땅에서는 식량을 구하기 어렵고, 두 동굴의 봉인을 모두 풀어야 스왐프 킵의 라바 게이트를 작동시킬 수 있다고 한다. 일행은 적을 넘고 늪에 들어가 두 목표를 찾아야 할 이유를 얻는다."},{"kind":"outcome","unit_id":"chapter08/p02","text":"늪에 들어가며 식량 경고와 두 봉인이라는 다음 조건을 안다."}]},{"id":"chapter08/p03","blocks":[{"kind":"main","unit_id":"chapter08/p03","title":"기록이 설명하는 일행의 자리","text":"일행은 늪의 기묘한 피라미드에서 예언서를 읽는다. 기록은 로드 안과 에인션트 이블의 관계, 침략자의 악과 다른 개념, 일행이 만들어진 이유를 기술한다. 최종 적에게 맞서려면 반신반인이 되어야 한다는 조건도 아직 이루지 못한 과제로 남긴다."},{"kind":"outcome","unit_id":"chapter08/p03","text":"자신들의 존재와 결전 조건에 대한 기록을 읽는다."}]},{"id":"chapter08/p04","blocks":[{"kind":"main","unit_id":"chapter08/p04","title":"배척하던 이름의 도움","text":"일행은 외진 섬의 에인션트 이블을 찾아간다. 그는 자기 육신이 없다는 설명과 함께 두 동굴의 적과 봉인 탐색의 정보를 알려 준다. 처음 들었던 평가와 달리 현재 임무에 도움이 되는 말을 듣지만, 그 만남만으로 모든 설명이 참이라고 결론내리지는 않는다."},{"kind":"outcome","unit_id":"chapter08/p04","text":"두 봉인이 있는 동굴과 위험에 관한 구체적인 안내를 듣는다."}]},{"id":"chapter08/p05","blocks":[{"kind":"main","unit_id":"chapter08/p05","title":"다른 차원에서 온 설명","text":"안내를 따라 만난 드라코니안은 적의 출처와 다른 공간의 여섯 용사, 차원을 통한 이동에 관한 이론을 말한다. 일행은 기록과 두 만남에서 서로 이어지는 설명을 듣는다. 이 증언은 현재 두 봉인의 임무를 바꾸지 않지만 최종 적의 운명에 대한 질문을 남긴다."},{"kind":"outcome","unit_id":"chapter08/p05","text":"다른 공간과 반복되는 이동에 관한 증언을 듣는다."}]},{"id":"chapter08/p06","blocks":[{"kind":"main","unit_id":"chapter08/p06","title":"설명은 얻었고 수행은 남다","text":"일행은 기록과 안내를 가지고 두 동굴의 봉인 탐색에 나선다. 다음 문을 여는 데 필요한 것은 한 설명을 믿는 결정이 아니라 두 목표를 실제로 수행한 결과다. 들은 결전 조건은 기억하되 아직 얻지 못한 계급을 이미 가진 것으로 처리하지 않는다."},{"kind":"outcome","unit_id":"chapter08/p06","text":"두 봉인을 모두 풀 목표로 탐색을 시작한다."}]}]},{"id":"chapter09","number":9,"title":"두 봉인이 풀릴 때","units":[{"id":"chapter09/p01","blocks":[{"kind":"main","unit_id":"chapter09/p01","title":"해제해야 하는 두 봉인","text":"일행은 안내받은 두 동굴을 찾아간다. 앞 대륙의 황금 봉인과 달리 여기서는 두 봉인을 풀어야 다음 문이 열린다. 어느 쪽을 먼저 탐색하든 한쪽 결과만으로는 다음 대륙으로 갈 수 없다는 목표가 남는다."},{"kind":"choice","unit_id":"chapter09/p01","decision_id":"seal_order","id":"seal_order/evil_first","text":"일행은 먼저 이블 갓의 레버와 봉인을 찾기로 한다. 이 탐색을 마쳐도 다른 동굴의 결과를 얻은 것은 아니다. 그다음 머디의 시험과 봉인도 찾아야 한다. 먼저 고른 동굴로 향하며 두 탐색이 모두 남아 있음을 기억한다."},{"kind":"outcome","unit_id":"chapter09/p01","text":"두 독립 목표의 탐색을 시작한다."}]},{"id":"chapter09/p02","blocks":[{"kind":"main","unit_id":"chapter09/p02","title":"물속 레버에 닿는 조건","text":"이블 갓에서는 양쪽 늪 안의 레버를 당기라는 표지를 찾는다. 늪 위를 걷는 마법은 물속 장치에 접근하는 일을 막으므로 그 상태를 풀어야 한다. 일행은 독의 위험을 감수하고 레버를 작동시켜 봉인의 방으로 갈 길을 연다."},{"kind":"outcome","unit_id":"chapter09/p02","text":"늪 속 장치를 작동시켜 안쪽 탐색의 길을 연다."}]},{"id":"chapter09/p03","blocks":[{"kind":"main","unit_id":"chapter09/p03","title":"일곱 갈래 뒤의 봉인","text":"열린 길을 지나 일행은 여러 방 가운데 봉인의 방을 찾는다. 크랩 갓 왕은 봉인을 넘기지 않겠다며 대결한다. 상대를 넘어선 뒤에야 일행은 이 동굴의 봉인을 풀고 한 목표를 실제 완료한다."},{"kind":"outcome","unit_id":"chapter09/p03","text":"해당 동굴의 수문장을 격퇴하고 봉인을 해제한다."}]},{"id":"chapter09/p04","blocks":[{"kind":"main","unit_id":"chapter09/p04","title":"문답으로 여는 다른 길","text":"머디에 들어간 일행은 문답으로 길을 여는 시험을 만난다. 천문학과 컴퓨터, 세계의 인물과 선악에 관한 문제들이 섞여 있다. 눈앞에 실제 주어진 시험을 통과하는 일은 모든 문제를 한 번에 듣거나 정답을 아는 설정과 구별된다."},{"kind":"outcome","unit_id":"chapter09/p04","text":"현재 주어진 문답을 통과해 안쪽 길로 들어간다."}]},{"id":"chapter09/p05","blocks":[{"kind":"main","unit_id":"chapter09/p05","title":"미로 뒤에서 들은 출처","text":"일행은 미로와 적들을 지나 아스트랄 머드를 만난다. 그는 최종 상대와 함께 다른 차원에서 왔다고 말한다. 앞서 기록과 은둔자의 말로 들었던 차원 이야기가 이번에는 직접 상대하는 적의 증언으로 이어진다."},{"kind":"outcome","unit_id":"chapter09/p05","text":"봉인의 상대에게 도달하고 그가 밝힌 출처를 듣는다."}]},{"id":"chapter09/p06","blocks":[{"kind":"main","unit_id":"chapter09/p06","title":"시험 끝의 봉인을 해제하다","text":"일행은 아스트랄 머드와의 대결을 통과한 뒤 이 동굴의 봉인을 푼다. 상대의 증언을 들은 것만으로는 완료되지 않던 목표를 실제 해제로 마친 것이다. 다른 동굴의 탐색이 앞이었든 뒤에 남아 있든, 이곳의 결과는 별도로 갖추어진다."},{"kind":"outcome","unit_id":"chapter09/p06","text":"해당 동굴의 상대를 격퇴하고 봉인을 해제한다."}]},{"id":"chapter09/p07","blocks":[{"kind":"main","unit_id":"chapter09/p07","title":"두 결과가 하나의 다음 길이 되다","text":"두 동굴의 봉인이 모두 풀리면 일행은 스왐프 킵 중앙으로 돌아간다. 두 탐색의 순서는 달라도 다음 문에 필요한 결과는 같다. 일행은 모든 늪의 비밀을 알아서가 아니라 두 조건을 수행했기 때문에 라바 게이트로 향한다."},{"kind":"outcome","unit_id":"chapter09/p07","text":"두 봉인의 결과를 가지고 다음 게이트로 향한다."}]}]},{"id":"chapter10","number":10,"title":"불의 문턱","units":[{"id":"chapter10/p01","blocks":[{"kind":"main","unit_id":"chapter10/p01","title":"두 봉인의 완료를 문 앞에서 확인하다","text":"라바 게이트 앞에 돌아온 일행은 두 봉인의 결과를 갖추었다. 한쪽만 해제된 상태에서는 다음 이동이 이루어지지 않으므로 이 확인은 선택 방문이 아니다. 그러나 조건을 갖춘 것과 길의 수문장들을 격퇴한 것은 아직 다른 일이다."},{"kind":"outcome","unit_id":"chapter10/p01","text":"게이트의 두 봉인 조건을 갖춘 상태로 문 앞에 선다."}]},{"id":"chapter10/p02","blocks":[{"kind":"main","unit_id":"chapter10/p02","title":"문을 지키는 적들을 넘다","text":"일행은 게이트 주변의 수문장들과 맞선다. 두 봉인이 이동을 허용해도 이 적들까지 사라지지는 않는다. 주 진행에서는 각 상대를 넘어 문을 통과할 실제 길을 확보한다."},{"kind":"outcome","unit_id":"chapter10/p02","text":"필요한 수문장들을 격퇴하고 마지막 대륙으로 이동할 수 있다."}]},{"id":"chapter10/p03","blocks":[{"kind":"main","unit_id":"chapter10/p03","title":"용암의 대륙에서 받는 안내","text":"게이트를 지난 일행은 마지막 대륙에서 로드 안의 조언을 듣는다. 그는 두 요새의 위치와 첫 요새 지하에 살아남은 사람들이 있다는 소식을 전한다. 마지막 상대에게 가는 길은 도움을 받을 사람들에게 먼저 이르는 여정으로 구체화된다."},{"kind":"outcome","unit_id":"chapter10/p03","text":"마지막 대륙에 들어와 두 요새와 지하 피난처의 위치를 안다."}]},{"id":"chapter10/p04","blocks":[{"kind":"main","unit_id":"chapter10/p04","title":"보호의 소식과 마지막 도움의 약속","text":"성주는 지하 사람들이 에인션트 이블의 힘으로 보호받는다고 설명한다. 그는 그곳에서 물자와 도움을 얻으라고 하고, 결전을 앞둘 때 두 존재가 함께 다시 나타나겠다고 약속한다. 일행은 지금 받을 도움과 앞으로 기다릴 도움을 서로 다른 시점으로 이해한다."},{"kind":"outcome","unit_id":"chapter10/p04","text":"피난처를 방문할 이유와 결전 앞 도움의 약속을 듣는다."}]},{"id":"chapter10/p05","blocks":[{"kind":"main","unit_id":"chapter10/p05","title":"먼저 갈 요새가 정해지다","text":"일행은 바로 최종 세력의 요새로 가지 않고 임페리움 마이너를 첫 목적지로 정한다. 그 아래의 사람들이 도움을 줄 수 있다는 조언이 이번 이동의 근거다. 아직 피난처를 만나지 않았으므로 그곳의 물자와 증언은 도착한 뒤의 경험으로 남는다."},{"kind":"outcome","unit_id":"chapter10/p05","text":"첫 요새를 지나 지하 사람들을 만나러 간다."}]}]},{"id":"chapter11","number":11,"title":"요새의 그늘","units":[{"id":"chapter11/p01","blocks":[{"kind":"main","unit_id":"chapter11/p01","title":"적의 요새 아래로 가는 목적","text":"일행은 임페리움 마이너에 들어간다. 지상은 적의 요새지만 지하에는 도움을 받을 사람들이 있다고 들었다. 피난처에 도달하려면 이 공간을 통과해야 하므로 일행은 지상의 적과 지하의 목적지를 구분하며 안쪽으로 간다."},{"kind":"outcome","unit_id":"chapter11/p01","text":"피난처로 내려가기 위해 요새 안을 통과한다."}]},{"id":"chapter11/p02","blocks":[{"kind":"main","unit_id":"chapter11/p02","title":"길을 조종하는 적의 도전","text":"요새에서 길을 막는 적들과 데스 나이트의 도전을 받는다. 상대는 이곳의 무리를 조종한다고 밝힌다. 지하가 보호받는다는 설명은 지상을 안전하게 통과할 수 있다는 뜻이 아니므로, 일행은 이 적들과 실제로 맞서야 한다."},{"kind":"outcome","unit_id":"chapter11/p02","text":"요새의 적들을 격퇴하고 안쪽으로 나아간다."}]},{"id":"chapter11/p03","blocks":[{"kind":"main","unit_id":"chapter11/p03","title":"지하로 이어지는 출입구","text":"일행은 길의 적들을 넘어 피난처로 통하는 출입구에 접근한다. 성주에게서 들은 도시가 실제로 이어지는 장소를 찾은 것이다. 이 문을 지나 아래로 내려가야 지상의 적들과 다른 사람들을 만날 수 있다."},{"kind":"outcome","unit_id":"chapter11/p03","text":"지하로 통하는 출입구를 찾아 내려간다."}]},{"id":"chapter11/p04","blocks":[{"kind":"main","unit_id":"chapter11/p04","title":"도착과 도움 사이의 거리","text":"아래는 라스트 셸터다. 일행은 장소에 도착했지만 주민들의 말이나 도움은 아직 접하지 않았다. 다음 장에서 이들이 어떻게 버티며 무엇을 기다리고 있었는지 듣는 만남이 요새를 통과한 목적을 완성한다."},{"kind":"outcome","unit_id":"chapter11/p04","text":"피난처에 도착해 주민들을 만날 수 있는 상태가 된다."}]}]},{"id":"chapter12","number":12,"title":"아직 살아 있는 사람들","units":[{"id":"chapter12/p01","blocks":[{"kind":"main","unit_id":"chapter12/p01","title":"기다리던 사람들을 만나다","text":"라스트 셸터 주민들은 일행이 오기를 기다렸다고 말한다. 이들은 에인션트 이블을 자신들의 구세주로 부르며 바깥으로 나갈 수 있게 되기를 바란다. 일행은 성주에게 들은 보호의 소식을 실제 주민들의 목소리로 접한다."},{"kind":"outcome","unit_id":"chapter12/p01","text":"주민의 생활과 기대를 듣고 남은 싸움의 이유를 더한다."}]},{"id":"chapter12/p02","blocks":[{"kind":"main","unit_id":"chapter12/p02","title":"같은 이름에 다른 평가가 쌓이다","text":"일행은 처음 성에서 들었던 평가와 기록, 섬의 안내, 여기 주민들의 보호 경험을 서로 대조한다. 같은 이름에 관한 설명은 여행을 거치며 달라졌다. 이들의 목소리는 이해를 넓히지만 주민의 평가만으로 모든 과거와 숨은 동기를 확정하지 않는다."},{"kind":"outcome","unit_id":"chapter12/p02","text":"이전 기록·증언과 지금 들은 말을 대조한다."}]},{"id":"chapter12/p03","blocks":[{"kind":"main","unit_id":"chapter12/p03","title":"세계 밖을 말하는 주민","text":"이곳에는 자신이 게임 제작자라고 밝히며 버그와 난이도를 살폈다는 인물이 있다. 다른 주민도 불행한 세계와 프로그래머에 대해 말한다. 일행은 세계의 재앙에 관한 설명과 세계를 만든다는 말을 같은 장소에서 듣고, 마지막에 다시 나타나겠다는 약속도 접한다."},{"kind":"outcome","unit_id":"chapter12/p03","text":"원작의 제작자 메타 발언과 마지막 등장 예고를 듣는다."}]},{"id":"chapter12/p04","blocks":[{"kind":"main","unit_id":"chapter12/p04","title":"마지막 여정을 위한 실제 준비","text":"일행은 피난처에서 마지막 여정을 위한 물자와 도움을 구한다. 주민들의 기대를 들었지만 이들을 밖으로 나가게 해 줄 위협의 제거는 아직 끝나지 않았다. 이곳에서 받은 도움은 머물러 여행을 끝내기 위한 것이 아니라, 남은 요새로 나가 싸움을 이어 가기 위한 준비가 된다."},{"kind":"choice","unit_id":"chapter12/p04","decision_id":"shelter_prepare","id":"shelter_prepare/food","text":"요리사는 주방 칼을 사용해 식량 짐을 나누고 이동 중 꺼낼 것을 정리한다. 일행은 주민의 도움을 다음 길의 준비로 바꾼다. 새 보상 수량을 임의로 더하지 않고 마련한 짐을 가지고 지상으로 돌아간다."},{"kind":"outcome","unit_id":"chapter12/p04","text":"실제로 마련한 준비와 현재 동행을 가지고 떠날 수 있다."}]},{"id":"chapter12/p05","blocks":[{"kind":"main","unit_id":"chapter12/p05","title":"지상으로 돌아가는 이유","text":"일행은 준비를 마치고 피난처에서 요새로 돌아간다. 주민들이 기대한 바깥의 길은 아직 남은 최종 세력에 도전한 뒤의 일이다. 일행은 받은 도움과 들은 말을 가지고 이블 컨센트레이션으로 향한다."},{"kind":"outcome","unit_id":"chapter12/p05","text":"지상으로 돌아와 다른 요새로 향한다."}]}]},{"id":"chapter13","number":13,"title":"이름을 가리는 벽","units":[{"id":"chapter13/p01","blocks":[{"kind":"main","unit_id":"chapter13/p01","title":"최종 세력의 입구를 넘다","text":"이블 컨센트레이션 입구에서는 프로스트 드래곤이 자신이 성을 지킨다고 말하며 일행을 막는다. 피난처의 도움을 받았어도 이 요새는 여전히 적들이 통제하고 있다. 일행은 수문장과 대결해 안쪽으로 들어간다."},{"kind":"reaction","unit_id":"chapter13/p01","id":"food_preparation","text":"요리사는 피난처에서 나누어 둔 식량 짐이 흐트러지지 않았는지 확인한다. 주민에게 받은 도움은 이제 다음 요새 앞에서 다시 챙기는 준비로 이어진다."},{"kind":"outcome","unit_id":"chapter13/p01","text":"입구의 상대를 격퇴하고 요새 내부로 들어간다."}]},{"id":"chapter13/p02","blocks":[{"kind":"main","unit_id":"chapter13/p02","title":"상대가 밝힌 이름을 듣다","text":"안쪽의 상대는 자신이 일행이 찾던 네크로맨서라고 말한다. 일행이 스스로를 지나치게 믿는다고 비난한 그는 그들을 환상에 빠뜨린다. 지금 일행이 아는 것은 상대가 그렇게 자처했다는 말뿐이며, 먼저 눈앞의 환상을 벗어나야 한다."},{"kind":"outcome","unit_id":"chapter13/p02","text":"이름을 자처한 상대를 만나 환상에 갇힌다."}]},{"id":"chapter13/p03","blocks":[{"kind":"main","unit_id":"chapter13/p03","title":"환상에서 실제 대결로 돌아오다","text":"일행은 자신들을 가둔 환상에서 빠져나올 길을 찾는다. 환상을 벗어나자 이름을 자처하던 상대가 실제 공격을 가한다. 일행은 그가 내세운 이름의 진위를 따지기 전에 먼저 이 대결을 넘어야 하며, 이름을 들었다는 사실만으로 여기서 여정이 끝난다고 판단할 수 없다."},{"kind":"outcome","unit_id":"chapter13/p03","text":"환상을 벗어나 눈앞의 상대와 대결할 수 있다."}]},{"id":"chapter13/p04","blocks":[{"kind":"main","unit_id":"chapter13/p04","title":"패배 뒤에야 드러나는 정체","text":"대결에서 패배한 상대는 자신이 실제로는 일행이 찾던 존재가 아니었다고 고백한다. 그가 숨을 거두자 주변의 기둥도 사라진다. 이 승리가 최종 상대의 패배가 아님을 안 일행은 여기서 여정을 끝낼 수 없고 다음 길을 찾아야 한다."},{"kind":"outcome","unit_id":"chapter13/p04","text":"상대의 고백으로 정체를 알고 아직 실제 최종 적이 남았음을 안다."}]},{"id":"chapter13/p05","blocks":[{"kind":"main","unit_id":"chapter13/p05","title":"숨겨진 성을 드러내는 장치","text":"남은 표지는 레버를 움직이면 감추어진 성이 나타난다고 알려 준다. 일행은 지시된 곳에서 장치를 작동시켜 지하의 성을 드러낸다. 말로만 다음 길이 있다고 안 것이 아니라 실제 장소가 나타나면서 여정을 계속할 통로가 생긴다."},{"kind":"outcome","unit_id":"chapter13/p05","text":"레버를 작동시켜 감추어진 성을 드러낸다."}]},{"id":"chapter13/p06","blocks":[{"kind":"main","unit_id":"chapter13/p06","title":"이름이 아닌 실제 상대를 향하다","text":"일행은 나타난 성을 거쳐 던전 오브 이블의 입구로 향한다. 긴 여행의 목표는 이름을 자처한 부하를 넘는 데서 끝나지 않았다. 이번에 열린 통로가 실제 최종 상대에게 접근하는 다음 단계가 된다."},{"kind":"outcome","unit_id":"chapter13/p06","text":"최종 동굴의 입구로 이동한다."}]}]},{"id":"chapter14","number":14,"title":"가장 깊은 문","units":[{"id":"chapter14/p01","blocks":[{"kind":"main","unit_id":"chapter14/p01","title":"종족을 내세운 수문장","text":"던전 오브 이블 입구의 아키드라코니안은 자기 종족을 내세우며 일행을 위협한다. 숨겨진 길을 열었어도 내부로 바로 들어갈 수는 없다. 일행은 입구의 대결을 통과해야 하며, 특정 동료가 있을 때의 사건은 실제 동행 조건에 따라 달라진다."},{"kind":"outcome","unit_id":"chapter14/p01","text":"입구의 수문장을 넘고 동굴 내부에 들어간다."}]},{"id":"chapter14/p02","blocks":[{"kind":"main","unit_id":"chapter14/p02","title":"최종 상대 대신 나선 기계 적","text":"동굴 안에서 금속의 팬저 바이퍼가 일행을 막는다. 그는 최종 상대가 직접 수고하지 않도록 일행을 처단하는 것이 임무라고 말한다. 이 적을 넘어야 다음 도움과 더 안쪽의 길에 접근할 수 있다."},{"kind":"outcome","unit_id":"chapter14/p02","text":"기계 적과의 대결을 마치고 남은 길로 나아간다."}]},{"id":"chapter14/p03","blocks":[{"kind":"main","unit_id":"chapter14/p03","title":"약속했던 두 존재의 마지막 도움","text":"대결 뒤 편안한 기운이 일행을 감싸고 로드 안과 에인션트 이블의 모습이 제시된다. 일행은 양쪽 벽의 숨은 문과 두 레버에 관한 도움을 듣는다. 마지막 대륙에서 들었던 도움의 약속이 이 만남으로 이어진다."},{"kind":"outcome","unit_id":"chapter14/p03","text":"마지막 도움을 받고 숨은 문과 두 장치의 위치를 안다."}]},{"id":"chapter14/p04","blocks":[{"kind":"main","unit_id":"chapter14/p04","title":"기록의 조건이 실제 변화가 되다","text":"이 도움 뒤 현재 일행은 반신반인이 된다. 늪의 예언서에서 필요하다고 읽었던 계급이 여기서 실제 상태의 변화로 이어진다. 마지막 상대에게 맞설 조건을 얻었지만 두 장치를 작동시켜 방의 길을 여는 일은 아직 남아 있다."},{"kind":"outcome","unit_id":"chapter14/p04","text":"현재 일행의 계급이 바뀌고 결전 조건을 갖춘다."}]},{"id":"chapter14/p05","blocks":[{"kind":"main","unit_id":"chapter14/p05","title":"두 숨은 문이 하나의 길을 열다","text":"일행은 안내받은 양쪽 벽의 숨은 문을 찾고 각각의 레버를 작동시킨다. 한 장치만으로는 마지막 방이 열리지 않으므로 두 수행을 모두 마쳐야 한다. 양쪽 조건이 갖추어지면 용암 중앙에서 마지막 방의 입구가 나타나고, 단서를 들은 것과 실제 길을 연 것이 구분된다."},{"kind":"outcome","unit_id":"chapter14/p05","text":"양쪽 레버를 실제로 작동시켜 마지막 방의 입구를 드러낸다."}]},{"id":"chapter14/p06","blocks":[{"kind":"main","unit_id":"chapter14/p06","title":"마지막 문 앞의 상대","text":"드러난 입구 앞에는 블랙 나이트가 남아 있다. 계급과 장치 조건을 갖추었어도 이 수문장을 넘어야 실제 방에 들어갈 수 있다. 일행은 마지막 입구의 대결을 마치고 최종 상대가 있는 방으로 간다."},{"kind":"outcome","unit_id":"chapter14/p06","text":"최후의 수문장을 격퇴하고 마지막 방에 들어갈 수 있다."}]},{"id":"chapter14/p07","blocks":[{"kind":"main","unit_id":"chapter14/p07","title":"탐색을 끝내고 결전으로 들어가다","text":"일행은 마지막 방으로 들어간다. 기록의 조건과 도움의 약속, 두 장치, 마지막 수문장을 통과한 결과가 모두 이 도착을 만들었다. 이제 필요한 것은 또 다른 열쇠나 장소를 찾는 여행이 아니라 실제 최종 상대와 대결하는 일이다."},{"kind":"outcome","unit_id":"chapter14/p07","text":"최종 상대를 만날 방에 도착한다."}]}]},{"id":"chapter15","number":15,"title":"남겨진 마지막 말","units":[{"id":"chapter15/p01","blocks":[{"kind":"main","unit_id":"chapter15/p01","title":"실제 최종 상대와 그 무리","text":"마지막 방의 네크로맨서는 아키몽크와 아키메이지를 소개하고 자기편을 늘리겠다고 말한다. 일행은 처음 성에서 맡았던 궁극적인 임무의 상대를 마주한다. 앞 요새에서 이름을 자처하던 부하와 다른 이번 만남이 실제 결전의 시작이다."},{"kind":"outcome","unit_id":"chapter15/p01","text":"최종 상대와 함께 싸울 적들을 만나 대결에 들어간다."}]},{"id":"chapter15/p02","blocks":[{"kind":"main","unit_id":"chapter15/p02","title":"도주가 허용되지 않는 대결","text":"최종 상대는 도전을 받은 이상 도주를 허용하지 않겠다고 말한다. 일행은 여행에서 쌓은 경험과 마지막 도움을 가지고 적의 무리와 맞선다. 각 지역에서의 수행과 이동 조건을 통과해 얻은 이 만남에서 일행은 대결을 끝내고, 패배한 상대가 남기는 말을 듣는다."},{"kind":"outcome","unit_id":"chapter15/p02","text":"성공 주 진행에서 대결을 마치고 상대의 후속 말을 듣는다."}]},{"id":"chapter15/p03","blocks":[{"kind":"main","unit_id":"chapter15/p03","title":"죽음 대신 다른 공간으로","text":"패배한 네크로맨서는 탈출 수단이 있다고 말하고 블랙홀을 만든다. 다른 공간에서 다시 힘을 기르겠다는 그의 말은 적이 죽는 결말과 다르다. 일행은 지금 세계에서의 싸움과 다른 공간에서 계속될 수 있는 그의 운명을 구분하게 된다."},{"kind":"outcome","unit_id":"chapter15/p03","text":"상대가 다른 공간으로 떠나려는 모습과 계획을 듣는다."}]},{"id":"chapter15/p04","blocks":[{"kind":"main","unit_id":"chapter15/p04","title":"반복되는 운명의 말을 남기다","text":"상대는 여러 공간에서 쫓기며 살아갈 운명을 말하고, 다시 여기 돌아올 가능성이 거의 없다고 한다. 일행이 늪에서 들었던 차원과 다른 용사들의 설명이 마지막 증언에 이어진다. 그는 작별하고 떠나며 이 세계에서 맡은 임무의 대결은 끝난다."},{"kind":"outcome","unit_id":"chapter15/p04","text":"상대의 마지막 진술과 이별을 접하고 이 세계의 대결을 끝낸다."}]},{"id":"chapter15/p05","blocks":[{"kind":"main","unit_id":"chapter15/p05","title":"여정의 끝과 남은 원문","text":"처음 성에서 받은 부탁으로 시작한 일행의 여정은 침략자를 막은 대결과 이별로 끝에 도달한다. 여러 공간을 떠돌 상대의 운명은 남아 있지만, 지금 이 세계에서 맡았던 싸움은 끝난다. 뒤이어 비바람과 운명에 관한 마지막 말이 남으며 여행을 마무리한다."},{"kind":"outcome","unit_id":"chapter15/p05","text":"성공 결말의 마지막 원문과 후속 소개로 이야기를 마친다."}]}]}],"stories":[{"id":"well_bucket","chapter_id":"chapter01","anchor_unit":"chapter01/p04","reaction_unit":"chapter01/p06","title":"성벽 아래의 두레박","prompt":"성벽 안쪽의 작은 우물 곁에서 물 긷던 여인이 일행을 붙잡는다. 끊어진 줄 끝에서 두레박이 돌 틈에 걸렸다. 성문으로 나갈 시간은 정해 두었지만, 우물의 일을 잠깐 도울 수는 있다.","participate_label":"두레박을 건져 여인이 물을 길을 수 있게 돕는다","participate":"우물에서 돌아오는 소리는 생각보다 깊었다. 여인은 남은 줄을 손목에 감고 당겼다가, 돌 틈에서 나무가 깨지는 소리를 듣고 손을 놓았다. 두레박을 부수면 오늘 물을 나를 도구가 없어진다고 했다. 서진은 우물 테두리부터 살폈다. 아래로 들어가는 것은 위험했고, 여인이 혼자 계속 당기게 두는 것도 위험했다.\n\n사냥꾼이 줄이 기울어지는 방향을 짚었다. 나무꾼은 우물 곁에 쌓인 짧은 널판을 빌려 줄이 돌 모서리에 쓸리지 않게 받쳤다. 줄을 팽팽하게 붙잡는 사람과 옆으로 조금씩 끌어 주는 사람이 나뉘었다. 돌에 걸린 물건을 곧장 힘으로 뽑으려던 처음의 생각과 달리, 어느 순간 두레박이 아래에서 가볍게 돌아가는 감촉이 손에 전해졌다.\n\n물 묻은 나무가 우물 위로 올라오자 여인은 금이 간 테두리를 손바닥으로 감쌌다. 새 도구는 아니었지만 아직 쓸 수 있었다. 그녀는 물을 한 번 더 길어 줄을 새로 묶었다. 일행에게 대단한 보답을 약속하지도, 떠나는 길을 바꾸라고 하지도 않았다. 다만 손에 남은 물기를 털며 “다음 사람도 이것을 써야 하니까요”라고 말했다. 서진은 빌린 널판을 제자리에 돌려놓고 성문 쪽으로 몸을 돌렸다. 떠나기 전에 끝낼 수 있는 일은 끝냈다.","skip_label":"우물 곁을 지나 출발 준비를 계속한다","skip":"일행은 우물 아래로 내려갈 길을 찾는 대신 성문 쪽으로 걸음을 옮긴다. 여인은 줄을 돌 테두리에 묶고 다른 도움을 구하러 안쪽 길로 들어간다. 두레박을 건졌는지는 일행이 보지 못한다. 물방울 떨어지는 소리만 잠시 뒤따르다가 성 안의 다른 소리에 섞인다.","on_participate":"동굴 입구에서 줄을 묶을 자리를 살피던 일행은 우물의 돌 모서리를 떠올린다. 곧장 당기지 않고 어느 쪽에 걸렸는지부터 확인하던 손의 감각이 남아 있다. 그 기억은 탐사의 목표를 대신해 주지는 않는다. 일행은 여전히 동굴의 중심까지 들어가야 한다.","on_skip":"동굴 입구의 축축한 바위를 만지자 우물의 여인이 생각난다. 일행은 그녀의 일이 어떻게 끝났는지 모른다. 남겨 둔 일에 대한 생각을 잠시 접고, 지금 맡은 중심부 탐사에 집중한다."},{"id":"flour_sack","chapter_id":"chapter02","anchor_unit":"chapter02/p02","reaction_unit":"chapter02/p05","title":"무너진 제빵소의 마지막 자루","prompt":"성 밖으로 향하는 짧은 길에서 무너진 작업장 앞의 노인이 부탁한다. 젖기 전에 마지막 곡식 자루를 꺼내고 싶지만 기울어진 선반 아래로 혼자 들어갈 수 없다. 북쪽의 위협을 해결하는 임무와는 별개인 작은 구조 작업이다.","participate_label":"기울어진 선반을 받치고 곡식 자루를 꺼낸다","participate":"닫힌 문 아래로 희끗한 가루가 새어 나왔다. 노인은 작업장이 무너지기 전에 쓰던 곡식이 아직 안에 있다며, 담장 밖으로 도망친 이웃에게 조금이라도 나누고 싶다고 했다. 요리사는 자루부터 잡아끌지 않았다. 선반 밑을 보더니 먼저 위에 얹힌 빈 그릇과 돌 조각을 내려야 한다고 말했다.\n\n작업장 안은 한 사람이 겨우 몸을 돌릴 만큼 좁았다. 나무꾼이 바깥에서 선반을 받치는 동안 서진은 문턱을 넘었다. 바닥의 작은 돌을 치울 때마다 먼지가 일어나 어깨를 감쌌다. 구석의 빈 그릇이 굴러 선반 다리를 건드리자 모두 움직임을 멈췄다. 버티는 팔이 떨렸지만, 서둘러 자루를 낚아채면 사람부터 깔릴 수 있었다.\n\n요리사가 문 밖에서 자루의 어느 쪽을 접어야 틈을 지날 수 있는지 일러 주었다. 함께 조금씩 밀고 당긴 끝에 해진 천이 문턱을 넘어왔다. 속의 곡식은 일부가 눅눅했지만 바닥에 직접 닿지 않은 몫은 따로 담을 수 있었다. 노인은 감사의 말보다 먼저 자루를 작은 그릇들에 나누었다. 일행은 그 곡식을 가져가지 않았다. 작업장 앞에 빌린 받침을 남겨 사람이 다시 위험한 틈으로 들어가지 않게 해 둔 뒤, 북쪽으로 향할 준비를 계속했다.","skip_label":"작업장에 들어가지 않고 북쪽으로 향한다","skip":"일행은 안쪽 선반이 얼마나 버틸지 알 수 없어 작업장 안으로 들어가지 않는다. 노인은 문을 닫고 자루가 있는 쪽의 지붕을 더 단단히 받쳐 보려 한다. 일행이 떠난 뒤 그가 곡식을 꺼냈는지는 확인하지 못한다. 곡식 냄새는 골목을 벗어나자 차츰 옅어진다.","on_participate":"격퇴 결과를 보고하러 돌아오는 길, 작업장 앞에는 작은 그릇 몇 개가 놓여 있다. 곡식을 나누던 노인의 손을 기억하는 일행에게 그 자리는 이름 없는 한 사람의 생활이 이어진 흔적으로 보인다. 성의 위협이 줄었다는 인정은 여전히 북쪽에서의 실제 격퇴에 대한 것이다.","on_skip":"보고하러 돌아온 일행은 닫힌 작업장 문을 지나간다. 자루를 꺼냈는지 물어볼 사람은 지금 보이지 않는다. 일행이 확인할 수 있는 것은 북쪽의 상대를 격퇴했다는 자기 임무의 결과이지, 들르지 않은 작업장의 사정이 아니다."},{"id":"ruin_cart","chapter_id":"chapter03","anchor_unit":"chapter03/p02","reaction_unit":"chapter03/p06","title":"폐허에서 온 손수레","prompt":"성주에게 봉인의 위험을 들은 뒤, 성 밖의 길에서 돌무더기에 바퀴가 걸린 손수레를 만난다. 폐허에서 살림을 옮겨 온 사람들이 물 항아리를 넘어뜨리지 않고 수레를 빼내려고 한다. 봉인을 찾는 의뢰와는 다른 국소적인 부탁이다.","participate_label":"수레를 빼내고 피난민의 항아리를 옮겨 준다","participate":"수레에는 무기나 보물 대신 이가 빠진 그릇과 물 항아리가 실려 있었다. 수레를 미는 사람은 항아리를 내리면 다시 올릴 힘이 없다며, 깨뜨리지 않고 틈을 넘길 수 없겠느냐고 물었다. 서진은 바퀴가 박힌 곳에 쪼그려 앉았다. 돌을 전부 치워야 할 듯 보였지만, 움직이지 않는 것은 축 하나였다.\n\n나무꾼이 길가의 버려진 받침목을 주워 수레를 조금 띄웠다. 사냥꾼은 항아리가 기울어지는 반대쪽을 붙잡았다. 수레가 들리는 순간 묻힌 작은 돌이 빠져나왔고, 바퀴가 갑자기 굴러 모두의 발을 밀어냈다. 일행은 수레를 붙들어 세운 뒤 한 사람씩 자리를 바꾸었다. 더 높이 드는 것보다 어느 순간 손을 놓을지 맞추는 일이 어려웠다.\n\n마침내 수레를 평평한 길에 올려놓았을 때 항아리 하나의 마개가 풀려 있었다. 요리사가 남은 천으로 입구를 덮고 수레 주인에게 매듭을 맡겼다. 그들은 일행이 찾는 봉인의 위치도, 지하의 사정도 몰랐다. 짐을 잃지 않고 오늘 길을 건널 수 있게 된 것뿐이었다. 도움을 준 일행은 수레를 끝까지 따라가지 않고 의뢰를 수행할 길로 돌아왔다. 뒤쪽에서 바퀴가 작은 돌을 넘는 소리가 전보다 일정하게 이어졌다.","skip_label":"수레의 일은 남겨 두고 의뢰의 길로 간다","skip":"일행은 손수레 곁에서 잠깐 멈췄지만 지하의 위험을 먼저 확인하기로 한다. 수레 주인들은 항아리를 하나씩 내려 바퀴를 가볍게 만들기 시작한다. 일행이 모퉁이를 돌아선 뒤의 일은 보지 못한다. 손을 빌려주지 않았다는 경험은 남지만, 그것이 그 사람들의 최후를 알게 해 주지는 않는다.","on_participate":"봉인의 위치를 보고하러 돌아오며 일행은 수레를 함께 붙들던 손을 떠올린다. 열지 말아야 할 것을 그대로 둔 임무와, 깨지지 않게 옮긴 평범한 항아리는 서로 다른 일이었다. 그래도 무엇을 건드리고 무엇을 지켜야 하는지 먼저 살핀다는 태도는 여행에 남는다.","on_skip":"봉인을 열지 않고 돌아온 일행에게는 성 밖에서 내려놓던 항아리의 모습도 떠오른다. 그 뒤 수레가 움직였는지는 모른다. 이번에는 실제로 확인한 봉인의 위치와 지켰던 지시만 성주에게 보고한다."},{"id":"blind_chamber","chapter_id":"chapter04","anchor_unit":"chapter04/p02","reaction_unit":"chapter04/p04","title":"막다른 굴의 작은 빛","prompt":"복잡한 동굴의 본길을 찾던 일행은 옆으로 짧게 꺾인 굴에서 등불이 굴러오는 것을 본다. 안쪽에는 적에게 쫓기다 막다른 곳에 몰린 무명 탐색자가 있다. 그를 데리고 나오는 일은 의뢰의 상대에게 가는 길을 대신하지 않는다.","participate_label":"짧은 옆굴로 들어가 탐색자를 데리고 나온다","participate":"등불은 기름을 엎지르지 않은 채 발치까지 굴러왔다. 안쪽에서 “이쪽은 길이 아닙니다”라는 말이 들렸고, 그 말 끝에 돌을 긁는 소리가 이어졌다. 사냥꾼은 굴이 넓어지는 곳을 먼저 짚었다. 일행은 새 지름길을 기대하지 않고, 돌아올 수 있는 짧은 길 안에서 사람을 찾기로 했다.\n\n옆굴의 끝에는 떨어진 돌 사이로 몸을 숨긴 탐색자가 있었다. 그 앞의 잡졸은 사람의 움직임을 따라 낮게 자세를 바꾸었다. 서진은 좁은 틈에서 몸을 크게 움직일 수 없다는 것을 보고 한 걸음 물러섰다. 등불이 비추는 쪽으로 상대를 유인하자 동료가 지나갈 빈틈이 생겼다. 잡졸이 등불을 걷어차려 하자 나무꾼은 벌목 도끼를 바닥 가까이 세워 그 발을 막았다. 뒤의 사냥꾼은 사냥 활을 겨눈 채 동료에게 사람이 빠져나올 만큼만 자리를 내라고 말했다. 상대를 굴 끝까지 쫓기보다 출구를 지키는 쪽을 택했다. 탐색자를 끌어내는 동안 일행은 서로의 등을 벽처럼 붙였다. 싸움은 적의 거처를 알아내는 대결이 아니라, 한 사람이 막다른 굴을 나올 시간을 벌기 위한 짧은 충돌이었다.\n\n본길로 돌아온 탐색자는 떨어뜨린 등불을 받아 들었다. 그는 어디에 의뢰의 상대가 있는지 확실히 아는 사람이 아니었다. 아까 들어간 굴이 막혀 있다는 것만 여러 번 말했다. 일행은 그를 입구 쪽으로 향하게 하고 빌린 등불을 돌려주었다. 도움을 마친 뒤에도 안쪽 상대를 찾아야 하는 임무는 남았다. 그들이 얻은 것은 비밀 장비나 적을 무너뜨릴 답이 아니라, 좁은 곳에서 서로의 자리를 바꾸어 가며 버틴 경험이었다.","skip_label":"옆굴에 들어가지 않고 본길 탐색을 이어 간다","skip":"일행은 굴 안의 소리만으로 위험의 크기를 알 수 없어 안으로 들어가지 않는다. 입구 방향을 크게 알려 준 뒤 본길을 찾는 탐색을 계속한다. 등불의 주인이 그 말을 듣고 돌아왔는지는 보지 못한다. 새 장비나 옆굴의 사정을 얻었다고 기록하지 않는다.","on_participate":"성으로 돌아와 격퇴 결과를 보고하려는 순간, 일행은 옆굴에서 사람을 빼내던 일을 잠시 떠올린다. 본줄기의 공적은 의뢰의 상대를 실제로 격퇴한 결과이고, 그와 별도로 좁은 곳에서 서로의 자리를 지켜 주었던 작은 싸움도 경험으로 남아 있다.","on_skip":"보고를 앞둔 일행에게 옆굴의 등불이 잠깐 생각난다. 그 안쪽의 결말은 알지 못한다. 성주에게 전할 것은 자신들이 실제로 찾아 격퇴한 상대와 그 결과뿐이다."},{"id":"ledge_rope","chapter_id":"chapter05","anchor_unit":"chapter05/p03","reaction_unit":"chapter05/p05","title":"날개 그늘 아래의 밧줄","prompt":"통로의 수문장들을 넘어선 뒤, 문으로 가는 길 옆에서 끊어진 운반대와 아래턱에 매달린 짐꾼을 발견한다. 그는 남은 밧줄을 붙들고 있으나 혼자 올라오지 못한다. 아직 문은 통과하지 않았고, 이 일은 열쇠의 사용 조건과 별개다.","participate_label":"끊어진 운반대를 고정해 짐꾼을 끌어올린다","participate":"구멍 아래에서 먼저 올라온 것은 사람의 얼굴이 아니라 손가락이었다. 바위 끝을 붙들었다가 미끄러지는 손 사이로 낮은 신음이 들렸다. 짐꾼은 자기 짐을 놓치고 아래턱에 떨어졌다고 했다. 위에 남은 밧줄은 운반대의 못 하나에 간신히 걸려 있었고, 그 못은 사람의 무게를 버틸 자리가 아니었다.\n\n나무꾼은 운반대의 기울어진 틀을 바닥의 돌 틈에 밀어 넣었다. 서진은 밧줄이 닿는 곳까지 몸을 낮추되 아래로 뛰어내리지는 않았다. 사냥꾼이 손을 옮길 순서를 알려 주었다. 짐꾼이 한 손을 놓는 순간 밧줄이 바위에 문질러져 섬유가 터졌고, 모두가 당기던 힘을 잠깐 늦춰야 했다. 바위 틈에서는 짐꾼의 떨어진 짐을 뒤지던 작은 검은 짐승이 모습을 드러냈다. 내려오던 손을 향해 몸을 낮추는 것을 보고 사냥꾼은 사냥 활을 그쪽으로 겨누었다. 좁은 턱에 동료를 더 내려보내지는 않았다. 손을 붙잡은 사람은 버티고, 짐승의 움직임을 보는 사람은 물러설 틈을 알려 주었다. 짐승이 다시 바위 뒤로 숨은 순간, 한 번에 올리려던 힘을 나누자 남은 줄이 사람을 조금씩 끌어올렸다.\n\n짐꾼은 위에 올라와도 한동안 바닥에 손을 댄 채 있었다. 잃어버린 짐을 찾으러 다시 내려갈 수는 없었다. 일행은 운반대에 남은 헐거운 틀을 옆으로 치워 다음 사람이 같은 곳에 발을 올리지 않게 했다. 밧줄은 그 자리에 묶어 두었고 자기 장비로 챙기지 않았다. 짐꾼은 왔던 쪽으로 기어가듯 몸을 돌렸다. 일행은 그를 따라 다른 목적지로 가지 않고, 여전히 자신들의 열쇠를 사용해야 할 안쪽 문으로 향했다.","skip_label":"아래턱을 살피는 일을 중단하고 안쪽 문으로 간다","skip":"일행은 흔들리는 운반대를 더는 믿을 수 없어 몸을 낮추지 않는다. 짐꾼에게 아래턱에서 벗어나지 말라고 외치고, 남은 길을 서둘러 지나간다. 그 뒤 다른 도움이 왔는지는 모른다. 문을 통과하는 데 필요한 자기 열쇠와 원래의 이동 절차는 그대로 남는다.","on_participate":"물이 덮인 땅에 도착한 뒤, 일행은 건너오기 직전 바위에 매달렸던 손을 기억한다. 누군가를 끌어올린 줄은 두고 왔지만 손바닥의 따가움은 남았다. 이곳에 온 것은 그 도움의 보상이 아니라, 가져온 열쇠를 실제 문에서 사용한 결과다.","on_skip":"물에 잠긴 땅을 바라보는 일행에게는 통로 아래턱의 목소리도 떠오른다. 자신들은 그 사람을 끌어올리지 않았고 그 뒤를 보지 못했다. 새로운 땅에 도착했다는 사실로 그 낯선 이의 사정까지 해결되었다고 생각하지 않는다."},{"id":"caught_sail","chapter_id":"chapter06","anchor_unit":"chapter06/p02","reaction_unit":"chapter06/p06","title":"물살에 걸린 작은 돛","prompt":"생존자와의 만남 뒤, 성 가까운 물가에서 떠밀린 작은 배를 본다. 배 안의 두 사람이 찢어진 돛을 낮추려 하지만 돛줄이 바위에 걸려 배가 계속 돌아간다. 섬의 적을 격퇴하기 전에 잠깐 손을 빌려줄지 정한다.","participate_label":"돛줄을 풀어 배가 안전한 얕은 곳에 닿도록 돕는다","participate":"배는 한쪽으로 기울었다가 돌아오기를 반복했다. 물에 닿은 돛이 바람보다 물살을 먼저 받는 탓이었다. 배 안의 사람은 줄을 잡아당기며 육지에 닿을 수 있다고 외쳤지만, 잡아당길수록 배의 앞머리가 옆으로 돌아갔다. 사냥꾼이 바위에 감긴 줄의 자리를 찾고 일행에게 물속으로 성급히 들어가지 말라고 손짓했다.\n\n서진은 물가에 굴러온 긴 널판을 빌려 줄의 매듭을 밀었다. 널판 끝은 한 번 미끄러져 물살에 끌렸고, 그 힘이 팔을 당겼다. 나무꾼이 뒤에서 널판을 받쳐 주자 이번에는 매듭이 조금씩 바위 끝으로 올라왔다. 물가와 배 안에서 동시에 힘을 늦춰야 줄이 풀렸다. 일행은 물 위를 걷거나 바람을 바꾸는 능력을 새로 얻은 것이 아니라, 배의 사람이 손을 놓을 순간을 함께 맞춘 것이다.\n\n줄이 빠진 배는 한참 돌아가다가 얕은 모래에 멎었다. 배 안의 사람들은 먼저 서로를 붙잡고 내린 뒤 찢어진 돛을 접었다. 일행은 배를 자기 것으로 삼지 않았고 섬으로 가는 새로운 이동 수단을 얻지도 않았다. 다만 물가에 놓인 짐을 위쪽으로 옮겨 사람이 다시 배에 뛰어들지 않게 도왔다. 낯선 두 사람의 짧은 인사가 물소리에 묻혔다. 일행은 맡게 될 격퇴 의뢰를 계속하기 위해 성 쪽의 원래 길로 돌아갔다.","skip_label":"물가의 일에 개입하지 않고 성의 의뢰를 우선한다","skip":"일행은 물가의 바위가 얼마나 미끄러운지 알 수 없어 더 다가가지 않는다. 배 안의 사람들에게 돛을 낮추라고 외친 뒤 성의 의뢰를 수행할 준비로 돌아간다. 배가 어느 곳에 닿았는지는 보지 못한다. 자기 배나 추가 물자를 얻었다고 여기지 않는다.","on_participate":"첫 동굴의 결과를 보고하고 나온 일행은 접힌 작은 돛을 떠올린다. 큰 땅의 피해를 자기 힘으로 모두 되돌릴 수는 없었지만, 배가 돌아가던 순간에는 손을 빌려줄 자리를 찾았다. 성을 위협하는 나머지 동굴의 임무는 그 경험과 별개로 남아 있다.","on_skip":"첫 동굴의 임무를 마쳤어도 떠밀린 배의 행방까지 알게 된 것은 아니다. 일행은 물소리를 들으며 보지 못한 일을 떠올렸다가, 성을 위협하는 두 동굴 중 아직 하나가 남았다는 사실로 생각을 돌린다."},{"id":"small_bell","chapter_id":"chapter07","anchor_unit":"chapter07/p02","reaction_unit":"chapter07/p06","title":"미로에 놓인 작은 종","prompt":"수도자를 만난 자리에서 다음 배움을 듣기 전, 가까운 옆길에서 바닥을 두드리는 소리가 들린다. 길을 잃은 무명 여행자가 떨어뜨린 작은 종으로 자기 위치를 알리려 한다. 그를 본길에 돌려보내는 일과 새 능력을 배우는 일은 별개다.","participate_label":"옆길의 소리를 따라 여행자를 본길로 데려온다","participate":"같은 소리가 벽을 두 번 돌아왔다. 어느 쪽이 사람의 소리인지 소리만으로는 알 수 없었다. 서진은 방금 지나온 갈림을 잊지 않도록 바닥의 작은 돌을 옆으로 모았다. 사냥꾼은 소리가 나는 동안 움직이지 말고, 잠잠해진 뒤 한 걸음씩 가까이 가자고 했다. 이번 탐색은 먼 곳의 미로를 새로 풀어내는 일이 아니라 눈앞의 짧은 옆길에서 돌아올 자리를 지키는 일이었다.\n\n벽 끝에서 만난 여행자는 종의 꼭지를 떨어뜨려 빈 몸통만 돌에 두드리고 있었다. 그는 일행을 보자 먼저 등 뒤로 물러났다. 좁은 곳에 너무 많은 사람이 들어와 출구가 사라진 듯 보인 것이다. 요리사가 한 걸음 비켜 본길 쪽의 빛을 보여 주자 그제야 여행자가 종을 내려놓았다. 일행은 그가 지나갈 자리를 먼저 만들고, 자신들이 남긴 돌의 방향을 따라 되돌아갔다.\n\n여행자는 잃어버린 종의 꼭지를 찾으러 다시 들어가려 했으나 일행은 여기서 따라갈 수 없다고 말했다. 그는 빈 종을 품에 넣고 입구 쪽으로 걸었다. 새로운 능력의 비법이나 동굴 상대의 약점은 그에게서 얻지 않았다. 일행은 원래의 만남으로 돌아와 아직 들어야 할 배움과 격퇴 임무를 이어 갔다. 작은 소리를 들었다는 것과 그 소리의 주인을 실제로 만났다는 것은 이제 서로 다른 기억이 되었다.","skip_label":"옆길을 더 찾지 않고 원래의 만남을 이어 간다","skip":"일행은 소리가 어느 벽에서 돌아오는지 확신하지 못해 옆길 탐색을 하지 않는다. 본길의 방향을 큰 소리로 알려 주고 원래의 만남을 이어 간다. 종의 주인을 만났다고 할 수는 없다. 이후의 배움과 동굴의 격퇴 의뢰는 참여 여부와 상관없이 계속된다.","on_participate":"두 의뢰를 끝내고 돌아가는 길에 일행은 빈 종을 품에 넣던 여행자를 기억한다. 같은 장소를 다시 지나는 지금은 어느 갈림에서 사람이 나타났는지 서로에게 말해 줄 수 있다. 그것은 별도의 배움을 대신하는 능력이 아니라 자기들이 직접 걸었던 짧은 길의 기억이다.","on_skip":"다시 지나가는 길에서 소리가 들리지 않아도 그 여행자가 구조되었다는 뜻으로 받아들이지 않는다. 일행은 종의 주인을 보지 못했다. 이번 귀환을 바꾼 것은 맡은 두 위협을 해결하고 실제로 받은 보상이라는 점을 분명히 한다."},{"id":"dying_fire","chapter_id":"chapter08","anchor_unit":"chapter08/p02","reaction_unit":"chapter08/p06","title":"늪 가장자리의 꺼지는 불","prompt":"늪의 위험과 두 봉인의 임무를 들은 뒤, 본길 가까운 마른 턱에서 꺼지는 작은 불을 본다. 떠돌이 한 사람이 젖은 짐을 옮기다 발목이 진흙에 묶였다. 불 곁으로 그를 돌려놓을지, 현재 탐색 준비를 계속할지 정한다.","participate_label":"진흙에 묶인 사람을 마른 턱으로 옮겨 준다","participate":"작은 불은 빛보다 연기를 더 많이 내고 있었다. 그 곁의 사람은 짐을 내려놓지 못한 채 같은 자리에서 발을 빼려 했다. 발을 세게 당길수록 다른 발이 깊이 들어갔다. 서진은 손을 내밀기 전에 턱 아래의 땅을 막대로 눌러 보았다. 겉의 마른 껍질과 달리 그 아래는 버틸 곳이 아니었다.\n\n일행은 사람이 있는 곳까지 줄곧 뛰어들지 않았다. 나무꾼이 주변에 버려진 짧은 판자를 모아 무게를 나누어 받을 자리를 만들었다. 사냥꾼은 몸을 곧장 뒤로 당기지 말고 한쪽 신발을 느슨하게 풀라고 외쳤다. 젖은 짐을 먼저 마른 곳으로 밀어 놓은 뒤에야 사람의 손을 붙잡을 수 있었다. 그때 갈대 밑에서 낮게 기어오던 짐승이 움직이는 발을 따라 가까워졌다. 나무꾼은 벌목 도끼를 널판의 바깥쪽으로 낮게 휘둘러 상대가 곧장 달려들 자리를 막았다. 사냥꾼이 물러날 쪽을 알리는 동안 사람을 잡은 동료들은 손을 바꾸지 않았다. 짐승을 늪 깊이 쫓아가 쓰러뜨리려 하지 않고, 함께 마른 턱에 올라서는 데만 힘을 맞췄다. 신발 하나가 진흙에 남았지만 사람은 불 곁으로 돌아왔다. 일행은 늪 위를 걷는 상태나 독에 대한 새로운 저항을 얻지 않았다.\n\n불 옆에서 물을 짜던 사람은 늪의 깊은 곳에 관해 아는 척하지 않았다. 자신은 길을 벗어나 짐을 줍다가 묶였다고만 했다. 일행은 뒤에서 찾아야 할 기록이나 만남의 설명을 이 사람에게 대신 듣지 않았다. 불이 다시 조금 밝아졌을 때 그들은 빌린 판자를 턱 가장자리에 내려놓고 원래의 탐색으로 향했다. 뒤에 남은 불은 갈 길을 알려 주는 계시가 아니라, 한 사람이 잠시 몸을 말릴 수 있는 작은 자리였다.","skip_label":"마른 턱의 일을 더 맡지 않고 탐색 준비를 이어 간다","skip":"일행은 가까운 턱에도 자기 무게를 버틸 자리가 부족하다고 보고 안으로 들어가지 않는다. 짐을 먼저 내려놓으라고 알린 뒤 본길로 돌아선다. 그 사람이 발을 뺐는지, 불이 계속 타는지는 보지 못한다. 아직 만나지 않은 존재들의 설명을 이 조우에서 들었다고 기록하지 않는다.","on_participate":"두 봉인을 찾아 나설 때 일행은 짐을 먼저 밀어내고 사람의 손을 잡았던 순서를 떠올린다. 늪의 어느 부분이 위험했는지는 직접 보았지만 모든 늪을 안다고 생각하지 않는다. 기록과 안내에서 얻은 지식, 아직 실제로 수행해야 할 봉인의 임무는 각각의 자리에 남는다.","on_skip":"봉인 탐색을 시작하는 일행에게 꺼지던 불이 잠깐 떠오른다. 그 자리에 있던 사람의 이후 사정은 알 수 없다. 본길에 남았다는 선택을 늪의 위험을 모두 피할 방법을 알아낸 경험으로 바꾸지 않는다."},{"id":"return_knots","chapter_id":"chapter09","anchor_unit":"chapter09/p07","reaction_unit":"chapter10/p01","title":"돌아오는 길의 젖은 매듭","prompt":"두 동굴의 봉인을 모두 푼 뒤 돌아오는 길에서 낡은 짐걸이와 끊어질 듯한 줄을 본다. 얕은 물가에서 짐을 건너려는 무명 행인이 매듭을 붙들고 있다. 이미 완료한 봉인과는 상관없는 작은 통행의 문제다.","participate_label":"짐걸이를 고쳐 행인의 짐이 물에 쓸리지 않게 한다","participate":"두 매듭 가운데 하나는 겉만 남아 있었다. 행인은 줄 끝을 단단히 잡고 있다고 했지만, 잡은 곳보다 앞쪽의 섬유가 물에 불어 풀리고 있었다. 짐걸이 아래로는 깊은 구멍이 아니라 좁고 거센 물살이 지나갔다. 일행이 손을 빌려준다면 사람을 위한 큰 문이 아니라, 이 짐 하나가 젖지 않고 건널 자리를 만드는 셈이었다.\n\n서진은 행인에게 줄을 더 당기지 말라고 했다. 나무꾼이 낮은 받침을 옮겨 줄의 처진 부분을 받쳤고, 요리사는 짐의 무게를 둘로 나누어 담을 방법을 찾았다. 새 줄이 없어 낡은 줄 전체를 믿을 수는 없었다. 일행은 짐을 한 번에 보내지 않고 마른 돌 사이로 하나씩 옮겼다. 물에 닿은 바닥이 미끄러지는 순간에는 손을 놓지 않고 함께 몸을 낮추었다.\n\n끝에 남은 매듭을 짧게 고쳐 묶자 행인은 빈 짐걸이를 흔들어 보았다. 더 많은 짐을 걸 수 있다고 장담할 만큼 튼튼해진 것은 아니었다. 일행은 손을 빌려 주고도 그 한계를 그대로 말했다. 자기들의 두 봉인은 이미 실제로 풀었으며 이 줄이 그 결과를 바꾸지는 않았다. 원래 가야 할 문 쪽으로 돌아서는 동안 행인이 물에 닿지 않은 짐을 하나씩 확인하는 모습이 뒤에 남았다.","skip_label":"짐걸이의 일은 맡지 않고 문을 향해 돌아간다","skip":"일행은 낡은 줄을 믿지 않고 행인에게 짐을 나누어 옮기라고 말한다. 짐걸이를 고치지는 않은 채 원래의 문으로 돌아가는 길을 이어 간다. 행인이 어떤 방법으로 건넜는지는 직접 보지 못한다. 두 동굴에서 실제 완료한 결과는 이 선택으로 줄거나 늘지 않는다.","on_participate":"문 앞에 도착해 두 봉인의 완료를 확인할 때, 일행은 물가에서 나누어 옮긴 짐도 떠올린다. 짐의 무게를 덜어 낸 일과 두 봉인을 모두 해제한 일은 서로 다른 결과였다. 수문장을 넘어야 하는 현재의 과제까지 그 작은 도움이 대신해 주지는 않는다.","on_skip":"문 앞에서 일행이 확인하는 것은 실제로 해제한 두 봉인이다. 물가의 행인을 도왔다는 기억은 없고, 그 뒤의 통행도 모른다. 짐걸이를 지나쳤다는 이유로 다음 대륙의 조건이 바뀌지는 않는다."},{"id":"ash_barrel","chapter_id":"chapter10","anchor_unit":"chapter10/p05","reaction_unit":"chapter11/p01","title":"재 아래 남은 물통","prompt":"마지막 대륙의 안내를 들은 뒤, 첫 요새로 가는 길 옆의 버려진 운반소에서 재를 털던 사람이 부탁한다. 쓰러진 물통이 받침에 걸려 혼자 바로 세우지 못한다. 피난처의 위치나 보호의 정체에 관한 새 설명은 없는 짧은 조우다.","participate_label":"물통을 세워 그 사람이 남은 물을 지킬 수 있게 한다","participate":"재는 손으로 쓸어도 곧 다시 내려앉았다. 운반소에 남은 사람은 물통의 뚜껑을 누른 채 바닥의 틈을 가리켰다. 기울어진 통이 완전히 넘어지면 남은 물이 그 틈으로 빠질 것이라고 했다. 그는 일행이 들었던 지하 사람들의 사정을 아는 화자가 아니었다. 지금 필요한 것은 그 말의 진상을 밝혀 주는 사람이 아니라 통을 함께 붙잡을 팔이었다.\n\n서진은 통부터 들어 올리지 않고 걸린 받침을 살폈다. 나무꾼이 빈 틀을 밀어 통의 아래를 받쳤고, 다른 동료들은 통이 돌지 않게 양쪽을 눌렀다. 요리사는 뚜껑을 그대로 잠그면 통이 더 무겁다며 작은 그릇으로 먼저 물을 덜어 냈다. 물을 지키려면 오히려 조금을 밖으로 옮겨야 했다. 받침이 빠졌을 때 통은 한 번 크게 기울었지만 이번에는 붙잡을 손이 더 있었다.\n\n통이 평평한 곳에 앉자 사람은 덜어 둔 물을 천천히 되부었다. 일행에게 남은 물을 가져가라고 하지도 않았고, 아직 만나지 않은 주민들의 증언을 대신 전하지도 않았다. 그들은 빌린 틀을 옆에 놓고 손의 재를 털었다. 오늘 본 작은 통의 사정과 성주에게 들었던 큰 피난처의 소식은 다른 경험이었다. 첫 요새로 향할 이유와 마지막 도움을 기다릴 약속은 원래 들었던 그대로 남았다.","skip_label":"운반소의 일을 맡지 않고 첫 요새로 향한다","skip":"일행은 앞서 받은 안내를 우선하여 운반소에 더 머물지 않는다. 물을 작은 그릇에 먼저 나누어 담으라고 말한 뒤 원래의 목적지를 향한다. 통이 바로 섰는지는 알지 못한다. 피난처를 이미 방문했거나 그곳의 물자를 받았다는 경험은 생기지 않는다.","on_participate":"첫 요새 아래로 내려갈 목적을 확인하며 일행은 재 묻은 물통을 함께 붙들던 일을 떠올린다. 아직 주민들의 말을 듣지 못했다는 사실은 변하지 않는다. 방금 지나온 사람의 사정과 앞으로 만나야 할 사람들의 사정을 섞지 않은 채 안으로 들어간다.","on_skip":"첫 요새에 들어가는 일행은 운반소에 남겨 둔 통을 기억한다. 그 통의 이후 결과는 모른다. 눈앞의 지하 피난처에 도달하고 실제 사람들을 만나는 일이 여전히 앞으로의 목적이다."},{"id":"cell_voice","chapter_id":"chapter11","anchor_unit":"chapter11/p02","reaction_unit":"chapter11/p04","title":"계단 곁에 갇힌 목소리","prompt":"길을 막던 상대를 넘은 뒤, 지하로 가는 본길 곁의 막힌 작은 칸에서 두드리는 소리가 난다. 안에는 무명 포로 한 사람이 끼인 문을 밀고 있다. 그를 꺼내는 일은 피난처로 통하는 원래 출입구를 찾는 일을 대신하지 않는다.","participate_label":"끼인 문을 들어 포로가 작은 칸에서 나오게 한다","participate":"문에는 열쇠를 넣을 자리가 없었다. 문짝 자체가 돌에 눌려 비틀린 채 끼어 있었다. 안쪽 사람은 이미 여러 번 밀어 손에 힘이 남지 않는다고 했다. 서진은 틈으로 손을 넣으려다가 작은 돌이 떨어지는 것을 보고 멈췄다. 문이 갑자기 움직이면 안쪽 사람이 먼저 다칠 수 있었다.\n\n나무꾼이 문 밑의 틈에 버려진 짧은 받침을 밀어 넣었다. 사냥꾼은 포로가 물러설 수 있는 자리를 묻고, 몸을 비키기 전에는 밀지 않겠다고 말했다. 바깥과 안쪽에서 서로 같은 수를 세며 움직였다. 첫 시도에는 문이 조금 올라왔다가 다시 주저앉았고, 일행은 그 사이에 손을 넣지 않고 받침을 하나 더 옮겼다. 두 번째에야 사람이 옆으로 빠져나올 만큼 틈이 생겼다.\n\n포로는 일행이 가려는 아래 도시를 본 사람이 아니었다. 자신이 이 작은 칸에 갇혀 있던 사정도 길게 설명할 힘이 없었다. 일행은 그에게 열린 본길의 방향을 알려 주었지만 동료로 영입하거나 지하의 안내자로 삼지 않았다. 문을 받친 나무는 그대로 두어 다시 사람을 가두지 않게 했다. 일행은 소리의 주인을 실제로 만났다는 기억을 가지고, 아직 통과해야 할 원래 출입구로 돌아갔다.","skip_label":"작은 칸의 일을 더 맡지 않고 지하 출입구를 찾는다","skip":"일행은 문 위의 돌이 언제 내려앉을지 몰라 강제로 움직이지 않는다. 안쪽 사람에게 손을 문틈에서 빼고 기다리라고 말한 뒤 본길 탐색을 계속한다. 그 사람이 나왔는지는 이후에 보지 못한다. 아직 만나지 않은 지하 주민들의 정보나 도움을 얻지는 않는다.","on_participate":"아래에 도착한 일행은 작은 칸에서 풀려난 사람과 앞으로 만날 주민들이 같은 화자가 아니라는 점을 기억한다. 출입구를 통과한 지금도 이곳의 보호와 생활에 관한 설명은 실제 만남 뒤에 들어야 한다. 두드리던 손을 직접 보았다는 작은 경험만 따로 남는다.","on_skip":"피난처에 도착해도 계단 곁 작은 칸의 이후 사정까지 알 수는 없다. 일행은 그 안쪽의 사람을 꺼내지 않았고 뒤를 보지 못했다. 지금의 도착을 그 사람까지 구제한 결과로 말하지 않은 채 새로운 만남을 기다린다."},{"id":"leaking_channel","chapter_id":"chapter12","anchor_unit":"chapter12/p02","reaction_unit":"chapter12/p05","title":"벽 사이로 새는 하루치 물","prompt":"주민들의 서로 다른 평가를 들은 뒤, 생활 구역의 낮은 벽에서 물을 받는 사람이 부탁한다. 갈라진 물길이 안쪽으로 새어 작은 그릇만 계속 채우고 있다. 보호자의 힘이나 바깥의 위협을 바꾸는 일이 아닌 생활의 수선이다.","participate_label":"갈라진 물길을 임시로 막아 주민의 수고를 덜어 준다","participate":"그 사람은 작은 그릇이 찰 때마다 다른 통으로 물을 옮겼다. 그릇을 비우는 동안 또 한 번 바닥이 젖었다. 요리사는 벽 전체를 막으려면 물이 다른 쪽으로 새어 들어갈 것 같다고 했다. 일행은 보이지 않는 보호의 힘을 시험하지 않고 눈앞에 드러난 갈라진 틈만 살피기로 했다.\n\n서진은 그릇을 옮기는 일을 먼저 맡았다. 나무꾼이 주민이 가져온 작은 판을 틈에 대고, 사냥꾼은 물이 빠져나갈 낮은 방향을 짚었다. 판을 세게 누르자 잠깐 물이 그쳤지만 다른 모서리에서 곧 물방울이 떨어졌다. 잘 보이는 틈 하나를 막는 일만으로는 끝나지 않았다. 주민은 오래된 천을 더 가져왔고, 모두가 판의 각도를 조금씩 바꾸어 물이 원래의 받이로 돌아가게 했다.\n\n바닥이 더 젖지 않자 주민은 비로소 허리를 폈다. 완벽한 새 물길을 만든 것은 아니어서 다음에는 판을 다시 살펴야 했다. 그는 자기 그릇을 닦으며 일행에게 받은 도움을 작은 생활의 일로 말했다. 보호자가 어떤 존재인지에 관한 정답도, 주민들을 벌써 밖으로 나갈 수 있게 했다는 선언도 나오지 않았다. 일행은 빌린 그릇을 돌려주었다. 남은 준비와 마지막 여정에 관한 목적은 그대로 두고, 잠깐 맡았던 물 나르는 일을 마쳤다.","skip_label":"수선에는 참여하지 않고 다음 만남을 이어 간다","skip":"일행은 벽 안쪽의 구조를 모르는 상태에서 판을 더 밀어 넣지 않는다. 주민은 작은 그릇으로 물을 계속 받아 옮긴다. 일행이 다른 만남을 마친 뒤 물길이 고쳐졌는지는 확인하지 못한다. 주민들의 평가를 들었다는 사실과 직접 생활의 일을 도왔다는 경험을 섞지 않는다.","on_participate":"지상으로 돌아갈 준비를 마친 일행은 그릇을 비우던 손을 기억한다. 자신들이 덜어 준 것은 한 자리의 수고였고, 사람들이 기대하는 바깥의 위협 제거는 아직 끝나지 않았다. 잠깐 고친 물길을 구원의 완료처럼 여기지 않고 남은 싸움을 향한다.","on_skip":"지상으로 돌아갈 때 일행에게는 작은 그릇을 계속 옮기던 주민의 모습이 남는다. 물길의 수선 결과는 알지 못한다. 들은 기대에 답하려면 아직 최종 세력에 도전해야 한다는 사실을 생각하며 피난처를 나선다."},{"id":"fallen_store","chapter_id":"chapter13","anchor_unit":"chapter13/p04","reaction_unit":"chapter13/p06","title":"벽 뒤에 남겨진 짐","prompt":"대결 뒤의 고백과 기둥의 소멸을 본 다음, 원래 장치를 찾기 전 낮은 저장 칸에서 살아 있는 작은 짐승의 소리를 듣는다. 무너진 선반 아래에 걸린 천 꾸러미를 치우면 빠져나올 수 있을 듯하다. 표지나 진상에 관한 새 단서는 없는 국소적인 탐색이다.","participate_label":"저장 칸의 꾸러미를 치워 갇힌 짐승을 밖으로 보낸다","participate":"소리는 큰 대결이 끝난 뒤에야 들렸다. 일행은 처음에는 다시 이름을 자처하는 말이 나오지 않을까 경계했지만, 낮은 저장 칸 안에서는 천을 긁는 소리만 이어졌다. 사냥꾼이 바닥 가까이 몸을 낮추고 움직이는 작은 그림자를 확인했다. 이미 사라진 기둥과 다른, 낡은 선반 아래의 평범한 물건들이 출구를 막고 있었다.\n\n서진은 꾸러미를 한 번에 당기려다가 위의 그릇이 따라 움직이는 것을 보고 손을 늦췄다. 나무꾼이 선반을 받친 동안 요리사는 깨지기 쉬운 물건을 바닥에 내려놓았다. 안의 작은 짐승은 가까운 손을 피하며 더 깊은 틈으로 들어갔다. 구해 주려는 마음이 있다는 것만으로는 상대가 믿고 나오지 않았다. 일행은 한쪽 통로를 비운 뒤 모두 조금 물러났다.\n\n잠시 뒤 천 끝이 움직이고 낮은 그림자가 열린 틈을 빠져나갔다. 무엇을 알고 있는 존재인지 묻거나 뒤를 따라가지 않았다. 남은 꾸러미는 주인을 모르는 물건이어서 가져가지 않고 옆으로 정리했다. 일행이 이 저장 칸에서 얻은 것은 숨겨진 성을 여는 답도, 방금 들은 고백을 뒤집는 진상도 아니었다. 큰 이름들이 사라진 자리에도 작은 숨이 남아 있다는 경험이었다. 그들은 원래 표지에 적힌 장치를 찾는 길로 돌아왔다.","skip_label":"저장 칸은 더 살피지 않고 원래 장치를 찾는다","skip":"일행은 선반이 얼마나 버틸지 몰라 안으로 손을 더 넣지 않는다. 저장 칸의 물건을 가져가지 않은 채 원래 장치를 찾는 일로 돌아간다. 소리의 주인이 밖으로 나왔는지는 보지 못한다. 방금 들은 고백이나 이후 통로의 조건을 새로운 상상으로 바꾸지 않는다.","on_participate":"드러난 성을 거쳐 다음 입구로 가며 일행은 사람의 손을 피하다가 열린 틈으로 빠져나간 작은 그림자를 떠올린다. 그 일을 자기편을 얻은 일로 여기지는 않는다. 여정의 다음 길은 원래 표지와 실제 장치 수행으로 열렸고, 짐승이 빠져나온 일은 그 사이에 남은 별도의 경험이다.","on_skip":"다음 입구로 가는 일행은 낮은 저장 칸에서 들었던 소리를 기억하지만 그 주인의 뒤를 알지 못한다. 새 물건이나 도움을 얻지 않았으며, 방금의 진상 공개와 장치의 결과만 원래대로 가지고 다음 상대를 향한다."},{"id":"hot_frame","chapter_id":"chapter14","anchor_unit":"chapter14/p02","reaction_unit":"chapter14/p07","title":"용암 곁의 식지 않은 쇠","prompt":"기계 적과의 대결을 마친 뒤, 본길 곁에 기울어진 오래된 운반 틀이 보인다. 아래쪽에는 떨어진 짐 하나를 붙잡으려던 무명 일꾼이 발을 끼웠다. 틀을 옮길지, 더 다가가지 않고 원래 길로 돌아갈지 정한다. 아직 마지막 도움과 계급 변화는 얻지 않았다.","participate_label":"운반 틀을 받쳐 일꾼이 발을 뺄 시간을 만든다","participate":"운반 틀은 본길에 이어지는 문이 아니었다. 본길 옆에 버려진 짐의 받침이었고, 아래로 미끄러지는 무게 때문에 사람이 발을 움직이지 못했다. 그는 틀이 식었다고 생각하고 다가갔다가 젖은 천이 눌어붙을 만큼 뜨겁다는 것을 알았다고 했다. 일행은 막 겪은 대결의 힘을 새로운 무한한 능력처럼 믿을 수 없었다.\n\n나무꾼은 길가의 마른 받침을 밀어 틀을 바닥에서 조금 띄웠다. 서진은 뜨거운 쇠에 손을 곧장 대지 않고 일꾼이 가져온 긴 천으로 움직일 자리를 잡았다. 열 때문에 손을 오래 둘 수 없어 동료들이 차례로 힘을 받았다. 사냥꾼이 틀이 돌아갈 방향을 보고 일꾼에게 발을 옆으로 빼라고 했다. 틀을 높이 들지는 못했지만 한 사람이 빠져나올 만큼의 짧은 틈은 생겼다.\n\n일꾼은 잃어버린 짐을 다시 주우려 하지 않았다. 일행도 남은 쇠를 새로운 무기로 챙기지 않았다. 틀이 본길 쪽으로 굴러오지 않게 받침을 놓은 뒤 그들은 손에 감았던 천을 원래 주인에게 돌려주었다. 어떤 장치가 마지막 방을 여는지는 아직 이후의 도움을 받아야 알 수 있었다. 눈앞의 작은 구조를 마친 일행은 원래의 길로 돌아와 아직 이어져야 할 만남과 탐색을 계속했다.","skip_label":"뜨거운 틀에는 더 다가가지 않고 원래 길을 따른다","skip":"일행은 받침이 버틸지 알 수 없어 운반 틀을 옮기지 않는다. 일꾼에게 본길 쪽으로 틀을 당기지 말라고 알린 뒤 원래 길로 돌아선다. 그의 발이 빠졌는지는 나중에 보지 못한다. 새 무기를 얻거나 마지막 방의 장치를 먼저 알아낸 경험은 생기지 않는다.","on_participate":"마지막 방으로 들어가기 전 일행은 뜨거운 틀 아래에서 만든 짧은 틈을 기억한다. 그때 버티던 팔과 지금 실제로 갖춘 결전 조건은 같은 것이 아니다. 도움의 만남, 계급 변화, 두 장치의 작동과 수문장의 대결을 모두 거친 현재의 도착을 작은 구조의 보상으로 돌리지 않는다.","on_skip":"마지막 방에 들어가기 전 일행은 본길 곁의 운반 틀을 떠올린다. 그 자리의 뒤를 보지 못한 것과 지금 실제로 마지막 문을 통과할 조건을 갖춘 것은 별개의 사실이다. 얻지 않은 구조 경험을 자기들이 했던 일처럼 말하지 않는다."},{"id":"last_step","chapter_id":"chapter15","anchor_unit":"chapter15/p04","reaction_unit":"chapter15/p05","title":"끝난 싸움 뒤의 한 걸음","prompt":"최종 상대의 작별과 이 세계를 떠나는 모습을 본 뒤, 마무리로 이어지기 전 돌아설 길의 깨진 낮은 발판을 발견한다. 급히 지나가면 건널 수는 있지만 뒤에 같은 자리를 밟을 누군가를 위해 잠깐 정리할 수도 있다. 떠난 상대의 운명에는 손대지 않는 마지막 곁가지다.","participate_label":"깨진 발판을 정리하고 서로의 마지막 걸음을 돕는다","participate":"큰 소리가 사라진 뒤 작은 돌이 구르는 소리가 또렷해졌다. 돌아설 자리의 낮은 발판은 가운데가 비어 있었고, 그 위에는 서둘러 지나가던 발이 남긴 부스러기가 쌓여 있었다. 서진은 빈 곳을 뛰어넘을 수 있었다. 하지만 뒤의 동료가 아직 숨을 고르고 있었으므로 이번에는 먼저 넘어가 버리지 않았다.\n\n나무꾼이 흔들리는 돌을 걷어 내고, 사냥꾼은 발을 놓아도 움직이지 않는 자리를 짚었다. 요리사가 짐의 무게를 잠깐 나누어 받자 한 사람이 몸을 낮추어 깨진 조각을 바깥으로 밀어낼 수 있었다. 일행은 새로운 힘으로 온 길을 다시 세우려 하지 않았다. 지금 건널 낮은 자리 하나에서 서로의 걸음을 기다렸다. 아무도 그 일을 추가 승리나 다른 공간까지 추적한 성과라고 부르지 않았다.\n\n마술사는 맨 마지막에 발판을 확인하고 동료들이 다 건넜는지 돌아보았다. 정리해 둔 자리가 앞으로 얼마나 버틸지는 알 수 없었다. 그래도 당장 자기들이 지나갈 때 서로를 서두르게 하지는 않았다. 일행은 남은 돌을 길 한쪽에 모아 놓고 다시 몸을 돌렸다. 최종 상대가 다른 공간으로 떠났다는 결말은 바뀌지 않았다. 여행의 끝에 하나 더 남은 것은 그를 붙잡은 새 모험이 아니라, 큰 싸움 뒤에도 눈앞의 작은 일을 함께 마칠 수 있었다는 경험이었다.","skip_label":"발판을 더 고치지 않고 각자의 조심스러운 걸음으로 지나간다","skip":"일행은 깨진 자리를 살펴 각자 건널 수 있는 곳으로 조심스럽게 발을 옮긴다. 발판을 정리하는 데 더 머물지는 않는다. 뒤에 그 자리를 누가 밟을지, 다른 누군가가 고칠지는 알지 못한다. 떠난 상대를 다시 만났거나 그 운명을 끝냈다는 새로운 결말은 만들지 않는다.","on_participate":"마지막 마무리를 앞둔 일행에게는 깨진 발판에서 서로의 걸음을 기다린 순간도 남는다. 큰 임무가 끝났다는 사실과 눈앞의 작은 일을 마쳤다는 경험을 나란히 두고, 원작의 이별과 마지막 말로 여정을 끝맺는다.","on_skip":"마지막 마무리를 앞둔 일행은 깨진 발판을 각자 조심해서 건너온 일을 기억한다. 그 자리를 수선했다는 경험은 없다. 원작에서 남겨진 이별과 운명에 관한 말을 새로운 해결로 바꾸지 않고, 자기들이 실제로 끝낸 임무의 끝에 선다."},{"id":"gate_lantern","chapter_id":"chapter01","anchor_unit":"chapter01/p05","reaction_unit":"chapter01/p07","title":"성문 밖으로 흘러나온 불빛","prompt":"출발 준비가 끝난 성문 곁에서 문지기가 흔들리는 등롱을 붙들고 있다. 떨어진 고리가 덮개 틈에 끼어 다시 걸 수 없다고 한다.","participate_label":"문지기와 떨어진 고리를 꺼낸다","participate":"문지기는 등롱을 바닥에 내려놓았다. 젖은 돌 사이로 고리가 반쯤 보였다. 손을 무작정 넣으면 틈이 좁아져 다칠 수 있었다. 일행은 덮개를 누르는 돌과 고리가 걸린 방향을 확인했다. 문지기에게 불빛을 맡기고, 어떤 방법으로 고리를 꺼낼지 함께 정했다.","skip_label":"문지기의 일을 맡지 않고 동굴로 향한다","skip":"문지기는 등롱을 든 채 다른 경비를 부른다. 일행은 약속한 탐사 길로 들어선다. 뒤를 돌아봤을 때 불빛은 아직 낮았지만 그 뒤 누가 고리를 꺼냈는지는 보지 못한다.","on_participate":"동굴의 중심에 가까워질 때 문지기와 함께 등롱을 걸던 일이 떠오른다. 탐사의 중심은 이 경험과 별개로 직접 확인해야 한다.","on_skip":"동굴에서 성문의 낮은 불빛이 생각난다. 문지기가 일을 마쳤는지는 모른다. 보지 않은 결과를 대신 상상하지 않고 탐사를 계속한다.","approach":{"prompt":"덮개를 받쳐 틈을 넓힐까, 고리만 걸어 끌어낼까?","options":[{"id":"careful","label":"덮개를 받쳐 문지기가 손을 넣을 틈을 만든다","body":"문지기가 빌려온 받침을 돌 아래에 밀었다. 덮개가 움직이면 모두 손을 뺐다가 다시 자리를 잡았다. 충분한 틈이 생기자 문지기는 고리를 꺼내 직접 등롱을 걸었다. 받침은 원래 주인에게 돌려주고 흔들리는 돌에 사람이 밟지 않도록 표시를 남겼다. 문지기는 다음 교대에도 받침을 빌릴 수 있는지 물어보겠다며 손을 털었다. 일행은 그가 스스로 고친 불빛 아래를 지나 떠났다.","reaction":"동굴 안의 비좁은 발 디딜 곳을 보며 문지기에게 공간을 만들어 주던 일을 기억한다. 빌린 받침은 돌려주었고, 동굴의 위험을 해결할 새 도구를 얻은 것은 아니다."},{"id":"direct","label":"빌린 철사로 고리를 걸어 꺼낸다","body":"문지기는 손잡이에 끼워 둔 짧은 철사를 내밀었다. 틈 속 고리를 잡을 때마다 철사가 미끄러졌다. 당기는 손을 멈추고 불빛의 각도를 바꾸자 고리가 돌에 걸린 지점이 보였다. 그쪽을 피해 천천히 끌어냈다. 문지기는 휘어진 철사를 펴 손잡이에 끼우고 등롱을 달았다. 큰 돌을 옮기지 않아도 되었지만 작은 물건을 오래 지켜봐야 했다.","reaction":"어두운 모서리를 살피며 빛의 각도를 바꾸어 고리를 찾았던 일을 떠올린다. 철사는 이미 돌려주었으므로 지금 손에 있는 장비가 아니다."}]}},{"id":"road_stones","chapter_id":"chapter02","anchor_unit":"chapter02/p03","reaction_unit":"chapter02/p06","title":"북쪽 길의 쓰러진 경계돌","prompt":"북쪽으로 가던 길의 갈림목에서 어린 짐꾼이 빈 수레를 끌고 돌아본다. 표석이 엎어져 어느 쪽이 지나온 마을인지 짚지 못한다.","participate_label":"표석을 세워 짐꾼의 지나온 길을 함께 확인한다","participate":"표석 아래쪽은 비에 씻겨 반들거렸다. 일행은 글자를 지어 쓰지 않고 흙에 묻힌 면부터 닦았다. 짐꾼은 자기가 건넌 작은 개울과 수레바퀴가 남긴 자국을 이야기했다.\n\n돌을 세워도 오래된 글자는 절반밖에 읽히지 않았다. 일행은 짐꾼이 기억하는 개울까지 짧게 동행해 길이 이어지는지 확인했다. 짐꾼은 그제야 돌아갈 쪽을 알아보고 수레를 돌렸다. 일행은 북쪽 탐사를 미루지 않을 거리에서 그와 헤어졌다. 성의 위협을 없애는 일은 아니었지만 같은 길을 오가는 한 사람이 덜 헤맬 수는 있었다.","skip_label":"짐꾼에게 길을 맡기고 북쪽 탐사를 계속한다","skip":"일행도 그 마을을 직접 가 보지 않았으므로 방향을 단정하지 않는다. 짐꾼은 개울을 찾아 되돌아가 보기로 한다. 일행은 북쪽으로 향하며 그의 귀환 여부는 알지 못한다.","on_participate":"다음 문 앞에서 짐꾼이 길을 알아본 순간을 기억한다. 지금의 이동 역시 확인한 출입구를 통해야 하며 표석의 경험만으로 다른 통로가 열리지는 않는다.","on_skip":"다음 문으로 가며 쓰러진 표석이 생각난다. 짐꾼의 귀환 결과는 알지 못한다. 일행이 확인한 다음 길만 따라 이동한다."},{"id":"cold_hearth","chapter_id":"chapter03","anchor_unit":"chapter03/p04","reaction_unit":"chapter03/p06","title":"식어 버린 화덕의 재","prompt":"용사를 떠나보내고 탐색을 잇는 길, 폐허 가장자리에서 주민이 무너진 담에 눌린 공동 화덕을 치운다. 오늘 저녁만이라도 쓸 자리를 만들고 싶다고 한다.","participate_label":"주민과 벽돌을 걷어 작은 화덕 자리를 만든다","participate":"주민은 옛집을 되세울 힘은 없다고 했다. 넓은 화덕을 통째로 고칠 수도 없었다. 일행은 굴러 떨어질 벽돌과 바닥에 닿은 벽돌을 나누고 손으로 들 수 있는 것부터 옮겼다.\n\n젖은 재가 신발에 붙었다. 주민이 재를 퍼내는 동안 일행은 바람을 막을 낮은 벽을 쌓았다. 주민이 모아 둔 마른 가지로 붙인 불은 두 번 꺼졌다. 돌의 간격을 바꾸자 냄비 하나를 올릴 열이 남았다. 일행은 음식도 연료도 가져가지 않았다. 무너진 마을이 돌아온 것은 아니었다. 오늘 한 끼를 마련할 자리를 남기고 봉인을 찾는 길로 돌아갔다.","skip_label":"화덕을 고치지 않고 봉인 탐색을 잇는다","skip":"주민은 혼자 들 수 있는 벽돌부터 치우겠다고 한다. 일행은 흔들리는 담 가까이 가지 않고 탐색 길로 돌아선다. 화덕에 다시 불이 붙었는지는 확인하지 않는다.","on_participate":"봉인을 찾은 뒤에도 남은 위험을 보며 작은 화덕의 불을 떠올린다. 봉인의 발견이 폐허의 생활을 단번에 되돌리지 않는다는 사실이 손의 감각으로 남는다.","on_skip":"봉인을 발견하고도 위험이 남은 폐허에서 화덕 곁 주민의 사정은 알 수 없다. 탐색의 성과를 그 사람의 해결 결과로 바꾸어 말하지 않는다."},{"id":"stone_niche","chapter_id":"chapter04","anchor_unit":"chapter04/p02","reaction_unit":"chapter04/p05","title":"갈라진 벽감의 낡은 흔적","prompt":"복잡한 동굴의 막힌 벽감에 천 꾸러미가 보인다. 물건을 잃었다는 무명 길잡이는 그 안의 낡은 장갑을 되찾고 싶어 한다. 꾸러미는 불안정한 돌 아래에 있다.","participate_label":"꾸러미를 꺼내 길잡이에게 돌려준다","participate":"길잡이는 보물이 아니라 함께 오던 사람과 나눠 쓰던 장갑이라고 말했다. 일행은 얕아 보이는 틈에 손부터 넣지 않았다. 위의 돌은 한쪽이 갈라져 있었고 아래쪽에는 꾸러미만 끌어낼 여유가 있었다. 길잡이가 가지고 온 물건 중 무엇을 빌릴 수 있는지 살폈다.","skip_label":"벽감을 건드리지 않고 안쪽 길을 찾는다","skip":"일행은 길잡이에게 갈라진 돌을 가리키며 가까이 기대지 말라고 한다. 꺼내는 일은 맡지 않고 주 목표의 길을 찾는다. 물건을 되찾았는지는 알 수 없다.","on_participate":"다음 목적지를 준비하며 길잡이에게 돌려준 물건을 기억한다. 작은 틈에서 한 일을 동굴 전체의 조사 성과와 혼동하지 않는다.","on_skip":"열쇠가 가리키는 길로 갈 때 꾸러미가 생각난다. 안의 물건과 회수 결과는 직접 확인한 사실이 아니다.","approach":{"prompt":"갈라진 돌을 받칠까, 틈 아래로 천을 밀어 꾸러미만 꺼낼까?","options":[{"id":"careful","label":"돌을 받친 뒤 꾸러미를 옮긴다","body":"빌린 받침을 돌 아래에 대고 흔들림을 지켰다. 꾸러미를 드는 동안 모래가 어깨에 흘렀다. 누구도 멈추라는 말을 재촉하지 않았다. 꾸러미를 꺼낸 뒤 받침을 빼고 접근하지 말라는 표시를 놓았다. 길잡이는 장갑을 확인하고 다음 사람에게 위험을 알리겠다며 표시 곁에 남았다.","reaction":"다음 목적지로 가며 돌을 지키던 손의 무게를 떠올린다. 물건을 되찾는 동안 위험을 살피던 경험만 남고 새 비밀문 정보는 얻지 않는다."},{"id":"direct","label":"천으로 감싸 꾸러미만 끌어낸다","body":"길잡이의 넓은 천을 바닥 틈에 밀어 넣었다. 돌은 두고 꾸러미가 걸리지 않는 각도를 찾았다. 천을 접었다 폈다 하며 움직인 끝에 꾸러미가 밖으로 미끄러졌다. 길잡이는 장갑의 먼지를 털었다. 벽감은 고치지 못했으므로 위험 표시는 그대로 남겼다.","reaction":"다음 목적지로 가며 꾸러미만 꺼내고 갈라진 돌은 남긴 일을 기억한다. 작은 성공 뒤에도 해결하지 못한 위험이 남을 수 있다."}]}},{"id":"passage_echo","chapter_id":"chapter05","anchor_unit":"chapter05/p02","reaction_unit":"chapter05/p05","title":"통로에 남은 어긋난 발소리","prompt":"문으로 이어지는 길의 짧은 곁굴에서 발소리가 다른 박자로 돌아온다. 뒤따르던 무명 운반인은 빈 상자를 그 안에 빠뜨렸다며 회수를 부탁한다.","participate_label":"운반인과 얕은 곁굴에서 빈 상자를 회수한다","participate":"멈춰 서자 사람의 발소리 같은 울림 대신 바닥에서 끌리는 소리만 남았다. 일행은 소리를 적의 정체나 다음 문의 단서로 단정하지 않았다. 짧은 굴 끝에서 빈 상자가 비스듬한 바위턱을 타고 움직였다.\n\n더 굴러가지 않게 빈 틈을 막았다. 상자를 잡자 뚜껑이 열리며 잠금쇠가 벽에 부딪쳤다. 운반인은 그 소리에 누가 자신을 쫓아오는 줄 알았다며 웃다가 말을 멈췄다. 앞에는 실제 적이 있다는 경고를 들은 터였다. 상자를 돌려주고 확인한 굴 밖으로 나왔다. 작은 소리를 설명했다고 길을 지키는 상대까지 사라지는 것은 아니었다.","skip_label":"곁굴을 살피지 않고 문으로 향한다","skip":"운반인은 입구에 짐을 내려놓고 스스로 소리를 살피겠다고 한다. 일행은 본래 통로로 간다. 울림이 잠잠해져도 회수 결과나 소리의 원인을 안다고 판단하지 않는다.","on_participate":"다음 땅에 닿아 곁굴에서 설명할 수 있었던 울림을 떠올린다. 그 경험과 실제 수문장을 통과한 일은 별개다.","on_skip":"새 땅에서 울림을 떠올려도 보지 않은 굴의 원인을 확정하지 않는다. 직접 넘은 수문장과 문을 통과한 결과만 기억한다."},{"id":"shore_crates","chapter_id":"chapter06","anchor_unit":"chapter06/p03","reaction_unit":"chapter06/p06","title":"섬 가장자리의 떠밀린 짐","prompt":"첫 섬으로 향하는 물가에서 배 주인이 얕은 돌 사이를 오가는 빈 짐통을 가리킨다. 잠기기 전에 모아 달라는 작은 부탁이다.","participate_label":"배 주인과 얕은 물가의 짐통을 끌어 올린다","participate":"배 주인은 빠른 물살 쪽으로 들어가지 말라고 먼저 말했다. 일행은 육지에 발을 둔 채 짐통이 돌에 걸릴 때까지 기다렸다. 성급히 손을 뻗으면 발이 먼저 미끄러졌다. 가까운 통부터 끌어 올리고 물을 비웠다.\n\n마지막 통은 돌 두 개 사이에 끼었다. 당기는 대신 물이 빠질 때 방향을 틀자 손잡이가 돌아왔다. 배 주인은 바닥을 두드려 금 간 것과 다시 쓸 것을 나누었다. 통을 주거나 배를 빌려 주겠다고 약속하지 않았다. 일행도 바다를 마음대로 다니게 된 것은 아니었다. 젖은 손을 닦고 맡은 동굴로 향했다.","skip_label":"짐통 회수를 맡지 않고 첫 동굴로 간다","skip":"배 주인은 긴 막대를 가지러 자기 배로 돌아간다. 일행은 의뢰의 상대가 있는 쪽으로 향한다. 통이 몇 개 돌아왔는지는 확인하지 못한다.","on_participate":"격퇴 결과를 인정받고 물가의 통을 떠올린다. 기다렸다 한 번에 움직인 경험이 남지만 성의 인정이나 다음 임무의 근거는 아니다.","on_skip":"보고 뒤 물가의 부탁을 기억한다. 통의 회수 여부는 모르며 성에 보고한 것은 직접 수행한 격퇴뿐이다."},{"id":"shelter_screen","chapter_id":"chapter07","anchor_unit":"chapter07/p03","reaction_unit":"chapter07/p06","title":"미로의 바람막이","prompt":"배움을 듣고 남은 미로로 가는 길, 쉬던 무명 탐사자가 찢어진 바람막이를 붙든다. 천이 문턱에 걸려 통행을 방해한다.","participate_label":"탐사자와 바람막이를 정리한다","participate":"바람이 동굴의 어느 틈에서 오는지는 확실하지 않았다. 천이 얼굴을 덮으면 탐사자는 손을 놓지 못했다. 일행은 바닥의 끈에 발이 걸리지 않게 치웠다. 바람을 새로운 능력의 효과라고 말하지 않았다. 작은 쉼터와 미로를 지나는 길을 함께 살펴야 했다.","skip_label":"탐사자의 일을 맡지 않고 미로 탐색을 잇는다","skip":"탐사자는 천을 자기 쪽으로 당긴다. 일행은 빈 쪽으로 지나간다. 바람막이가 다시 섰는지 다른 사람이 도왔는지는 보지 못한다.","on_participate":"돌아가는 여정에서 작은 쉼터를 떠올린다. 그 경험은 동행 여부나 능력 습득과 별개다.","on_skip":"우회해 돌아가며 찢어진 천을 기억한다. 쉼터의 정리 결과는 모르며 직접 지나온 길을 따라 돌아간다.","approach":{"prompt":"쉼터를 남겨 고칠까, 천을 내려 통로를 넓힐까?","options":[{"id":"careful","label":"천을 묶어 쉴 자리를 남긴다","body":"탐사자가 자기 짐에서 짧은 끈을 꺼냈다. 찢어진 부분을 겹쳐 묶고 바람이 강한 쪽만 낮췄다. 일행이 끝을 지키는 동안 그는 앉을 틈을 만들었다. 통로 쪽 끈은 돌에 붙여 발에 걸리지 않게 했다. 완전한 수선은 아니었지만 잠깐 쉴 자리는 생겼다. 일행은 남은 미로를 향했다.","reaction":"돌아가는 길에 통로를 비운 채 쉼터를 남긴 일을 기억한다. 보지 않은 이후의 이용자나 탐사자의 생존 결과까지 아는 것은 아니다."},{"id":"direct","label":"천을 접어 통로부터 비운다","body":"천의 끝을 나누어 잡고 고정 끈을 하나씩 풀었다. 천이 내려오자 문턱이 드러났다. 찢어진 천은 접어 탐사자의 짐에 올렸다. 그는 지금 쉬기보다 떠나겠다며 짐을 챙겼다. 일행은 새 동료로 받아들이거나 다른 길의 안전을 보장하지 않았다. 각자의 길이 갈라지는 문턱에서 헤어졌다.","reaction":"돌아가는 길에 천을 내리자 드러난 문턱을 떠올린다. 탐사자가 떠난 자리까지 확인했을 뿐 이후 어디에 도착했는지는 모른다."}]}},{"id":"wet_pages","chapter_id":"chapter08","anchor_unit":"chapter08/p05","reaction_unit":"chapter08/p06","title":"물기 번진 작은 장부","prompt":"설명을 듣고 돌아오는 쉼터에서 짐 정리하던 사람이 젖은 장부를 들고 있다. 봉인의 기록이 아니라 함께 온 사람들에게 돌려줄 물건 목록이다.","participate_label":"장부를 펼쳐 물건의 주인을 확인한다","participate":"낱장이 서로 붙어 있었다. 억지로 떼면 이름과 표시가 찢어질 것 같았다. 일행은 주인이 기억하는 부분부터 천 위에 놓고 읽을 수 없는 글자는 읽었다고 하지 않았다.\n\n주인은 짐의 매듭 색과 종이 표시를 비교했다. 짝이 맞자 엉뚱한 사람에게 돌려줄 걱정이 줄었다. 끝내 구별 못 한 두 물건은 주인이 직접 찾아오게 하기로 했다. 일행은 장부를 가져가지 않고 세계의 비밀에 관한 증거로 삼지도 않았다. 방금 들은 큰 설명과 눈앞에서 확인한 작은 사실의 차이가 손에 남았다.","skip_label":"장부를 맡지 않고 봉인 수행을 준비한다","skip":"주인은 붙은 종이를 두고 짐의 표시부터 살펴보기로 한다. 일행은 쉼터를 떠난다. 누구에게 물건이 돌아갔는지는 확인하지 않았다.","on_participate":"설명을 수행으로 옮길 때 장부의 읽을 수 있는 것과 없는 것을 나누던 일을 기억한다. 들은 증언을 전부 확정 사실로 바꾸지 않고 봉인 임무를 준비한다.","on_skip":"봉인을 준비하며 장부를 정리하던 사람을 떠올린다. 물건 목록은 보지 않았으므로 배운 사실에 보태지 않는다."},{"id":"reed_marker","chapter_id":"chapter09","anchor_unit":"chapter09/p07","reaction_unit":"chapter10/p01","title":"두 길이 만난 곳의 꺾인 갈대","prompt":"두 봉인을 모두 푼 뒤 돌아가는 길, 수레 주인이 둔덕에서 바퀴를 뺀다. 길 가장자리의 갈대 표지가 꺾여 물가에 너무 가까이 갔다고 한다.","participate_label":"수레를 옮기고 꺾인 표지를 다시 묶는다","participate":"봉인으로 갈라진 두 길은 지나온 길이었다. 그렇다고 돌아오는 발밑까지 안전해진 것은 아니었다. 일행은 기울어진 쪽에 몰린 짐을 보고 가까운 것부터 내리게 했다.\n\n주인이 고른 얕은 땅에서 받칠 돌을 구했다. 물속의 지름길을 찾지 않고 바퀴를 둔덕 쪽으로 조금씩 돌렸다. 수레가 나오자 꺾인 갈대를 남은 갈대에 묶었다. 모든 늪의 길을 알려 주는 표지가 아니라 바로 이곳에서 다음 사람이 너무 내려가지 않게 하는 표시였다. 짐과 받침을 정리하고 다음 게이트로 향했다.","skip_label":"수레 일을 맡지 않고 다음 게이트로 간다","skip":"주인은 짐을 내려 바퀴를 가볍게 하기로 한다. 일행은 두 봉인의 결과를 가지고 다음 문으로 간다. 수레가 나왔는지는 모르며 부탁을 지나쳤다고 통과 조건이 달라지지 않는다.","on_participate":"문 앞에서 두 봉인 완료를 확인하며 바퀴를 떠올린다. 두 수행을 마친 일과 그 뒤 구조를 도운 일은 별개의 기억이다.","on_skip":"문 앞에서 수레의 사정을 모른 채 두 봉인의 결과를 확인한다. 남겨 둔 부탁은 본줄기 통과 조건을 대신하거나 취소하지 않는다."},{"id":"ash_cloth","chapter_id":"chapter10","anchor_unit":"chapter10/p04","reaction_unit":"chapter11/p01","title":"먼지를 막는 문턱의 천","prompt":"피난처의 도움에 관한 약속을 듣고 자리를 뜨는 길, 작업장 사람이 문턱 아래로 들어오는 재에 천을 댄다. 도구를 가져올 동안 한쪽을 잡아 달라고 한다.","participate_label":"작업장 사람과 천을 고정한다","participate":"천을 펴면 한쪽으로 재가 들어오고 두껍게 접으면 문이 닫히지 않았다. 일행은 작업장 사람이 가져온 돌을 놓을 자리를 찾고 문이 움직일 범위는 비웠다.\n\n재가 잦아들 때마다 천의 접는 모양을 바꾸었다. 안쪽 사람이 문을 여닫으며 손가락이 끼지 않는지 확인했다. 틈을 줄이자 바닥의 재를 쓸 수 있게 되었다. 작은 천이 대륙의 용암이나 전쟁을 막는 것은 아니었다. 사람이 작업을 이을 만큼 정리하고 손을 뗐다. 지하의 보호와 물자는 실제 그곳에 내려가야 얻을 수 있었다.","skip_label":"천을 고정하지 않고 다음 목적지를 준비한다","skip":"작업장 사람은 돌을 올리고 다른 사람을 부른다. 일행은 천이 고정되었는지 보지 못한 채 요새로 갈 준비를 잇는다. 작업장의 재와 피난처의 보호는 별개다.","on_participate":"요새 아래로 갈 목적을 확인하며 천을 기억한다. 보호의 설명과 먼지를 막아 본 경험은 다르다. 피난처의 도움은 아직 직접 받아야 한다.","on_skip":"요새 아래로 가며 남겨 둔 부탁을 기억한다. 작업장이 정리되었다고 가정하지 않고 피난처의 약속을 받은 도움으로 바꾸지 않는다."},{"id":"loose_stair","chapter_id":"chapter11","anchor_unit":"chapter11/p03","reaction_unit":"chapter11/p04","title":"내려가는 계단의 흔들린 발판","prompt":"지하 출입구 계단 곁에서 무명 운반인이 흔들리는 발판 앞에 멈춘다. 통로 전체는 막히지 않았지만 그의 무거운 짐은 좁은 옆길로 지나가기 어렵다.","participate_label":"운반인이 짐을 아래로 옮기도록 돕는다","participate":"일행은 운반인이 건널 곳과 자신들이 지날 수 있는 곳을 따로 확인했다. 짐을 나누거나 그가 가져온 받침으로 발판을 잠깐 지킬 수 있었다. 지하의 문 자체를 고치는 일은 아니며 아래의 도움을 미리 받은 것도 아니었다.","skip_label":"짐을 맡지 않고 좁은 옆길로 내려간다","skip":"운반인은 짐을 내려놓고 함께 나를 사람을 기다린다. 일행은 자기 몸과 장비로 지날 수 있는 옆길을 쓴다. 짐이 내려왔는지는 모른다.","on_participate":"아래에서 운반인에게 보탠 손을 기억한다. 작은 도움은 피난처 사람들과의 만남이나 물자 수령을 대신하지 않는다.","on_skip":"아래에서 계단의 짐을 떠올린다. 옮겨졌는지는 모르며 도움은 이제 실제로 만나 받아야 한다.","approach":{"prompt":"짐을 나눠 옆길로 옮길까, 발판을 받쳐 운반인이 건너게 할까?","options":[{"id":"careful","label":"작은 묶음으로 나누어 옆길로 옮긴다","body":"운반인이 매듭을 풀었다. 안의 물건을 일행의 장비와 섞지 않고 묶음마다 주인을 확인했다. 여러 번 내려 옮기는 동안 돌아오는 사람은 길목을 지켰다. 묶음이 아래에 모이자 운반인은 다시 매듭을 묶었다. 느렸지만 흔들리는 발판을 쓸 필요는 없었다.","reaction":"여러 번 옮긴 짐을 기억한다. 모두 운반인에게 돌려주었으므로 소지품이 늘었다고 쓰지 않는다."},{"id":"direct","label":"발판을 받쳐 직접 짐을 옮기게 한다","body":"운반인의 널판을 발판 아래에 대었다. 먼저 빈 발판을 눌러 흔들림을 확인했다. 그는 짐을 직접 옮겨 반대편에 내려놓았다. 받침은 임시였으므로 오래 버티는 수리라고 말하지 않았다. 널판을 주인에게 돌려주고 일행은 옆길로 내려갔다.","reaction":"임시 받침을 영구 수리라고 부르지 않은 일을 기억한다. 한 사람의 짐을 옮겼다고 계단의 모든 위험이 사라지지는 않았다."}]}},{"id":"mended_cup","chapter_id":"chapter12","anchor_unit":"chapter12/p03","reaction_unit":"chapter12/p05","title":"금 간 잔을 내려놓는 자리","prompt":"주민들의 말을 듣고 준비를 잇는 길, 물 나누던 사람이 금 간 잔들을 고른다. 버리면 오래 기다려야 하고 그대로 쓰면 손을 벨 수 있어 함께 정리해 달라고 한다.","participate_label":"위험한 잔과 쓸 수 있는 그릇을 나눈다","participate":"물을 따르던 사람은 잔을 천으로 감으면 괜찮을 것 같다고 했다. 일행은 가장자리를 살피고 물이 새는 것과 입을 댈 수 없는 것을 나누었다. 위험한 잔은 마시는 자리에서 치워 작은 물건을 담는 곳에 놓았다.\n\n남은 잔은 적었다. 마신 사람이 씻어 다음 사람에게 건네도록 순서를 정했다. 기다리던 이들도 잔이 손에서 손으로 건너가는 것을 보고 줄을 지켰다. 일행에게 물자나 회복 효과를 주는 일은 아니었다. 지상으로 가기 전 아래 사람들의 하루가 이어질 작은 자리를 정리했을 뿐이다.","skip_label":"그릇 정리를 맡지 않고 마지막 준비를 잇는다","skip":"물을 나누던 사람은 위험한 잔을 옆으로 치운다. 일행은 준비할 곳으로 간다. 잔이 충분했는지 누가 줄을 정리했는지는 모른다.","on_participate":"지상으로 갈 때 건네던 잔을 기억한다. 실제 준비는 본줄기에서 마쳤으며 작은 경험이 숨은 지식의 근거가 되지는 않는다.","on_skip":"지상으로 가며 그릇 고르던 사람을 기억한다. 결과는 모른다. 실제 받은 도움과 거절한 부탁을 구분한다."},{"id":"dust_door","chapter_id":"chapter13","anchor_unit":"chapter13/p05","reaction_unit":"chapter13/p06","title":"드러난 성 곁의 먼지 낀 문","prompt":"장치를 작동시켜 다음 성을 드러낸 뒤 곁의 얕은 저장공간에서 먼지가 쏟아진다. 작은 문이 돌조각에 눌려 닫히지 않고 빈 상자들이 바닥에 흩어져 있다.","participate_label":"빈 상자를 정리해 걸어갈 자리를 비운다","participate":"처음 상자를 밀자 아래 돌조각이 함께 굴렀다. 일행은 안이 빈 것을 확인하고 움직이지 않는 쪽부터 옮겼다. 작은 문을 성을 여는 두 번째 장치로 해석하지 않았다. 본줄기의 장치는 작동했고 다음 장소도 실제 드러났다.\n\n상자를 안쪽에 세우자 발 디딜 폭이 생겼다. 닫히지 않는 문은 억지로 고치지 않고 떨어질 물건만 치웠다. 주인을 알 수 없어 안쪽을 뒤지거나 물건을 챙기지도 않았다. 먼지 묻은 손을 털고 실제 상대를 향한 길로 돌아왔다. 눈앞의 잡동사니와 큰 비밀의 출입구는 다른 것이었다.","skip_label":"저장공간을 건드리지 않고 드러난 성으로 간다","skip":"일행은 돌조각을 피해 열린 통로로 간다. 주인과 안쪽 사정을 모르므로 보상이 남았다고 단정하지 않는다. 드러난 성은 선택과 무관하게 다음 목적지다.","on_participate":"실제 상대를 향하며 빈 상자를 옮긴 일을 기억한다. 새로운 단서가 아니라 직접 확인한 작은 경험만 남는다.","on_skip":"실제 상대를 향하며 보지 않은 저장공간의 사정을 덧붙이지 않는다. 성을 드러낸 것은 필수 장치의 작동이다."},{"id":"cool_recess","chapter_id":"chapter14","anchor_unit":"chapter14/p05","reaction_unit":"chapter14/p07","title":"마지막 길 옆의 식은 돌자리","prompt":"양쪽 레버를 모두 움직여 마지막 입구가 나타난 뒤 옆 벽감에서 작은 돌들이 흘러내린다. 입구는 열려 있고 우회할 폭도 있지만 넘어지기 쉬운 자리다.","participate_label":"불안정한 작은 돌자리를 정리한다","participate":"일행은 마지막 입구가 나타난 것을 먼저 확인했다. 벽감은 세 번째 조건이 아니었다. 열이 덜한 쪽에서 손댈 수 있는 돌만 살피고 깊은 틈이나 뜨거운 바위에는 접근하지 않았다. 지금 할 수 있는 정리는 둘이었다.","skip_label":"돌을 피해 열린 마지막 입구로 간다","skip":"돌이 적은 쪽으로 발을 옮긴다. 벽감의 돌은 남지만 레버는 둘 다 이미 작동했다. 정리하지 않았다고 마지막 입구가 사라지거나 대결이 연기되지는 않는다.","on_participate":"결전으로 갈 때 돌을 정리한 손을 기억한다. 입구를 연 것은 양쪽 레버의 수행이며 곁가지는 그 뒤의 경험이다.","on_skip":"결전 앞에서 옆자리 돌을 떠올린다. 정리 결과는 없지만 양쪽 수행과 필수 순서는 그대로다.","approach":{"prompt":"움직이는 돌을 옮길까, 돌을 두고 발 디딜 곳을 표시할까?","options":[{"id":"careful","label":"옮길 수 있는 작은 돌을 안쪽에 모은다","body":"돌을 들기 전에 옆 조각이 따라오지 않는지 눌렀다. 쉽게 움직이는 것만 낮은 바닥에 모았다. 맞물린 조각은 손대지 않았다. 걷는 폭은 조금 넓어졌지만 깊은 벽을 고친 것은 아니었다. 무기나 힘을 얻지도 않았다. 발을 확인하고 열린 입구로 돌아왔다.","reaction":"작은 돌을 옮기던 박자를 떠올린다. 그 경험이 최종 상대의 약점이나 승리 조건을 알려 주지는 않는다. 대결은 직접 치러야 한다."},{"id":"direct","label":"돌을 두고 먼지 위에 발 디딜 곳을 표시한다","body":"맞물린 돌에는 손대지 않았다. 먼지 위에 설 자리를 짧게 그어 함께 확인했다. 영구 안전 표지가 아니라 지금 우회할 폭을 공유하는 표시였다. 마지막 사람이 지난 것을 본 뒤 입구로 모였다. 돌은 남아 있어도 열린 방은 이미 확인한 사실이었다.","reaction":"남은 위험을 고쳤다고 말하지 않고 발 디딜 곳만 확인한 일을 기억한다. 조심스러움과 별개로 마지막 대결은 이어진다."}]}},{"id":"silent_fragments","chapter_id":"chapter15","anchor_unit":"chapter15/p04","reaction_unit":"chapter15/p05","title":"작별 뒤에 남은 돌조각","prompt":"상대가 마지막 말을 남기고 떠난 뒤 발밑에 갈라진 돌조각이 남아 있다. 추적 단서나 다른 결말의 문은 아니다. 잠깐 자리를 정리하거나 여정의 마무리로 갈 수 있다.","participate_label":"날카로운 조각을 옆으로 모으고 잠깐 쉰다","participate":"말이 멎은 뒤 서로의 숨소리가 크게 들렸다. 조각을 치운다고 상대가 다시 나타나거나 다른 공간의 운명이 풀리지는 않았다. 당장 몸을 일으킬 자리를 비울 수는 있었다.\n\n일행은 큰 바위를 움직이지 않고 손에 닿는 조각만 모았다. 서로 다치지 않았는지 묻되 없던 부상을 만들지는 않았다. 잠깐 앉아 쉬는 동안 누구도 떠난 상대의 행방을 알고 있다고 말하지 않았다. 손을 털고 일어났을 때 결말은 달라지지 않았다. 끝난 대결과 남아 있는 말을 가지고 여정의 마지막 부분으로 나아갔다.","skip_label":"조각을 피해 바로 여정의 마무리로 간다","skip":"날카로운 조각이 없는 쪽으로 몸을 돌린다. 별도 자리를 정리하지 않았지만 작별과 떠남은 이미 끝났다. 보지 않은 뒤 이야기를 만들지 않고 마지막 말을 향한다.","on_participate":"끝에서 잠깐 앉았던 자리를 기억한다. 작은 정리가 다른 결말이나 귀환을 만든 것은 아니다. 마지막 진술은 남고 실제 한 일은 조각을 치우고 일어난 것이다.","on_skip":"마무리에 이르러 멈추지 않고 걸었던 선택을 기억한다. 없던 휴식 경험을 덧붙이지 않으며 마지막 말과 원래 결말은 그대로다."}]}</script><script>'use strict';
(() => {
  const data=JSON.parse(document.getElementById('side-data').textContent);
  const $=id=>document.getElementById(id);
  const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const paragraphs=value=>String(value).split(/\n\n+/).map(p=>'<p>'+escape(p)+'</p>').join('');
  let chapterIndex=0, choices={}, approaches={}, pending=null;
  function draw(){
    const chapter=data.chapters[chapterIndex];let text='<h2>'+escape('제'+chapter.number+'장 · '+chapter.title)+'</h2>';
    pending=null;
    units:for(const unit of chapter.units){
      for(const block of unit.blocks.filter(b=>['main','reaction'].includes(b.kind))){
        if(block.kind==='main')text+='<h3>'+escape(block.title)+'</h3>';
        text+=paragraphs(block.text);
      }
      for(const story of data.stories.filter(s=>s.reaction_unit===unit.id && Object.hasOwn(choices,s.id))){
        const mode=choices[story.id], approach=story.approach?.options.find(o=>o.id===approaches[story.id]);
        const body=mode==='skip'?story.on_skip:approach?approach.reaction:story.on_participate;
        text+='<section class="side-memory" data-side-memory="'+escape(story.id)+'" data-mode="'+mode+'" data-approach="'+escape(approach?.id||'')+'"><p class="side-badge">곁가지의 후속 반응 · 창작 초고</p>'+paragraphs(body)+'</section>';
      }
      for(const block of unit.blocks.filter(b=>['choice','automatic'].includes(b.kind)))text+=paragraphs(block.text);
      for(const story of data.stories.filter(s=>s.anchor_unit===unit.id)){
        text+='<section class="side-story" data-side-story="'+escape(story.id)+'"><p class="side-badge">선택 곁가지 · 창작 초고</p><h3>'+escape(story.title)+'</h3>'+paragraphs(story.prompt);
        if(!Object.hasOwn(choices,story.id)){pending={story,kind:'entry'};text+='</section>';break units;}
        const mode=choices[story.id];
        text+='<p class="side-badge">선택: '+escape(story[mode==='take'?'participate_label':'skip_label'])+'</p>'+paragraphs(story[mode==='take'?'participate':'skip']);
        if(mode==='take'&&story.approach){
          text+='<div class="side-approach" data-side-approach="'+escape(story.id)+'"><p class="side-badge">참여한 경우만 · 해결 방법 선택</p>'+paragraphs(story.approach.prompt);
          const selected=story.approach.options.find(o=>o.id===approaches[story.id]);
          if(!selected){pending={story,kind:'approach'};text+='</div></section>';break units;}
          text+='<p class="side-badge">선택: '+escape(selected.label)+'</p>'+paragraphs(selected.body)+'</div>';
        }
        text+='</section>';
      }
      for(const block of unit.blocks.filter(b=>b.kind==='outcome'))text+='<p class="core-outcome"><small>필수 본줄기 결과 · '+escape(block.text)+'</small></p>';
    }
    $('side-content').innerHTML=text;
    const options=!pending?[]:pending.kind==='entry'?['take','skip'].map(id=>({id,label:pending.story[id==='take'?'participate_label':'skip_label']})):pending.story.approach.options;
    $('side-choices').innerHTML=options.map(o=>'<button type="button" data-side-choice="'+escape(o.id)+'" data-choice-kind="'+pending.kind+'" data-story="'+escape(pending.story.id)+'">'+escape(o.label)+'</button>').join('');
    $('side-next').hidden=!!pending||chapterIndex===data.chapters.length-1;
    $('side-prev').disabled=chapterIndex===0;
    $('side-progress').textContent=chapter.number+' / '+data.chapters.length+'장 · 곁가지 '+Object.keys(choices).length+'개 선택 · 해결 방법 '+Object.keys(approaches).length+'개';
    if(!pending&&chapterIndex===data.chapters.length-1)$('side-content').insertAdjacentHTML('beforeend','<p class="notice" id="side-complete">모든 장의 필수 본줄기와 선택한 곁가지를 표시했습니다. 실제 읽음이나 본문·원문 전체의 출판 승인을 뜻하지 않습니다.</p>');
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button||button.disabled)return;
    if(button.dataset.sideChoice){
      if(!pending||button.dataset.story!==pending.story.id||button.dataset.choiceKind!==pending.kind)return;
      const {story,kind}=pending, selected=button.dataset.sideChoice;
      if(kind==='entry'){
        if(Object.hasOwn(choices,story.id)||!['take','skip'].includes(selected))return;
        choices[story.id]=selected;
      }else{
        if(choices[story.id]!=='take'||Object.hasOwn(approaches,story.id)||!story.approach.options.some(o=>o.id===selected))return;
        approaches[story.id]=selected;
      }
      draw();
      document.querySelector('[data-side-'+(kind==='approach'?'approach':'story')+'="'+story.id+'"]').scrollIntoView({block:'start',behavior:'instant'});
    }else if(button.id==='side-next'&&!pending&&chapterIndex<data.chapters.length-1){chapterIndex++;draw();scrollTo({top:0,behavior:'instant'});}
    else if(button.id==='side-prev'&&chapterIndex>0){chapterIndex--;draw();scrollTo({top:0,behavior:'instant'});}
    else if(button.id==='side-restart'){chapterIndex=0;choices={};approaches={};draw();scrollTo({top:0,behavior:'instant'});}
  });
  draw();
})();
</script></html>
