": "“미안합니다.”"}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/decline_wait", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말을 들은 상대가 멈췄다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 이유를 늘어놓지 않았다. 대답은 이미 끝났는데 설명으로 오래 붙잡는 일은 더 잔인할 수도 있었다. 잠깐 시선을 맞추고 고개를 숙였다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/decline_distance", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "상대가 길을 비켰다.\n\n조금 전의 두 걸음은 그대로 남았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 사이를 건너지 않았다. 문 밖으로 걸었다. 뒤의 발소리는 늘지 않았다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/decline_not_erased", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "부탁을 거절했다고 이야기를 듣지 않은 것은 아니었다.\n\n그는 방금 들은 말을 기억했다. 다만 함께 걷는 사람은 없었다. 눈앞의 길을 결정할 때, 떠난 사람의 대답까지 빌려 쓸 수는 없었다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/departure_result", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "문을 넘자 바람이 옷을 밀었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성 안쪽을 한 번 돌아봤다. 결정은 끝났다. 다음에 나오는 사람이 누구인지 기다리느라 이곳에 서 있을 수는 없었다."}], "when": true}, {"id": "lore_menace/departure_direction", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "남서쪽으로 몸을 돌렸다.\n\n성주가 말한 동굴은 아직 보이지 않았다. 눈앞에는 길과 돌, 걸어야 할 거리만 있었다. 그는 가장 가까운 발 디딜 자리부터 골랐다."}], "when": true}, {"id": "lore_menace/departure_end", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "일행이 뒤따랐다.\n\n문은 등 뒤에 남았다. 다시 돌아올 때에는 같은 문이 다르게 보일 것이다. 그때까지 해야 할 일이 있었다. 지금은 걸으면 됐다."}], "when": true}, {"id": "i/joe_departure", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "mad_joe", "particle": "은/는"}}, {"text": " 성을 등지고도 뒤를 봤다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 속도를 늦췄다. 빨리 따라오라고 부르지 않았다. 서로를 잘 알지 못해도, 지금 같은 길에서 멈출 수는 있었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "mad_joe"}}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/set_out", "label": [{"text": "남서쪽으로 길을 잡는다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/road", "when": true}], "editorial": {"intent": "1-2: 출발 준비와 첫 동행 요청을 길게 펼치고 수락·거절에 다른 현재 동료와 감정의 끝을 준다.", "notes": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "source_refs": ["lore_menace/skeleton_exit"], "status": "draft"}, "entry_when": true, "handoff": null, "id": "lore_menace/departure_path", "kind": "merge", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/skeleton_exit"]}, "title": [{"text": "함께 걷거나 남겨 두거나"}]}, {"blocks": [{"id": "lore_menace/road_first", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성벽에서 멀어지자 바람이 강해졌다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 옷깃을 잡았다. 성 안에서는 방향만 들으면 될 것 같았다. 바깥에서는 방향을 알아도 돌을 피하고 발을 옮겨야 했다. 길은 말처럼 한 번에 넘어가지지 않았다."}], "when": true}, {"id": "lore_menace/road_shoulders", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "어깨가 자꾸 올라갔다.\n\n내리려고 하면 몇 걸음 뒤에 다시 힘이 들어갔다. 그는 손을 폈다. 손에 힘을 빼도 앞을 보는 눈은 쉽게 풀리지 않았다."}], "when": true}, {"id": "lore_menace/road_castle_behind", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성벽이 낮아 보일 때까지 걸었다.\n\n뒤돌아볼 때마다 돌아갈 곳이 멀어졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 두 번째부터 오래 보지 않았다. 앞을 보지 않는 동안에도 일행은 움직이고 있었다."}], "when": true}, {"id": "lore_menace/road_checking_pace", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그는 속도를 늦췄다.\n\n앞장서는 사람에게 맞추면 뒤에서는 힘을 더 쓸 수 있었다. 옆으로 비켜 사람들을 지나게 했다. 누군가는 짐을 고쳤고, 누군가는 짧게 숨을 골랐다.\n\n누가 빠른지 알아볼 때가 아니었다. 어디서 멈춰야 모두 함께 갈 수 있는지 알아봐야 했다."}], "when": true}, {"id": "lore_menace/road_destination_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“우리가 갈 곳을 한 번만 다시 확인하죠.”"}], "when": true}, {"id": "lore_menace/road_intro_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말을 꺼내자 일행이 가까워졌다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 방향을 가리켰다. 성주에게 대답할 때는 쉬웠다. 길 위에서 함께 갈 사람에게 설명하려니 빠진 것이 없는지 더 신경 쓰였다."}], "when": true}, {"id": "lore_menace/road_share", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": "protagonist", "text": [{"text": "“남서쪽 동굴입니다. 중심부까지 확인하고, 돌아가서 본 것을 보고합니다.”"}], "when": true}, {"id": "lore_menace/road_mission_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "자기가 말한 순서를 속으로 다시 세었다.\n\n가는 것. 확인하는 것. 돌아오는 것.\n\n마지막을 빼면 일은 끝나지 않았다. 일행이 다시 움직였다. 그는 가까운 길과 돌아올 방향을 번갈아 봤다."}], "when": true}, {"id": "lore_menace/road_skeleton", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 일행의 끝에서 걷고 있었다.\n\n성문에서와 달리 자기 걸음을 먼저 정하지 않았다. 앞사람이 멈추면 멈췄다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 간격을 조금 좁혔다. 부탁을 들을 때 알지 못했던 얼굴을 이제 길 위에서 보고 있었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/road_join_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "“걸음은 괜찮습니까?”"}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/road_join_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“괜찮소. 너무 빠르지는 않소.”"}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/road_join_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그는 고개를 끄덕였다.\n\n모든 것이 괜찮다는 대답은 아니었다. 지금 속도로 함께 걸을 수 있다는 말이었다. 그 정도면 다음 걸음을 옮길 이유가 됐다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/road_declined_memory", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "한 사람이 서 있던 자리가 떠올랐다.\n\n지금 뒤에는 그가 없었다. 동행을 거절했으니 말소리도 따라오지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 현재 곁에 있는 사람들의 걸음을 확인했다. 이미 정한 답을 길에서 다시 바꿀 수는 없었다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/road_veteran", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "주점의 노인이 떠올랐다.\n\n돌아오지 못한 친구들. 그 얼굴을 생각하니 돌아갈 방향을 더 자주 보게 됐다. 처음 떠나는 사람에게 돌아오라는 말은 너무 쉬울 수도 있었다. 그는 그 말이 쉬운 동안 잊지 않기로 했다."}], "when": {"op": "eq", "state": "knowledge.missing_squad", "value": true}}, {"id": "lore_menace/road_stone", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌이 발 앞에서 굴렀다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 옆으로 피했다. 뒤에 오는 사람에게 손을 들어 자리를 알려 줬다. 그 사람이 같은 돌을 밟지 않는 것을 보고 다시 걸었다.\n\n말로 설명한 목적지보다 먼저 해결할 일이 있었다."}], "when": true}, {"id": "lore_menace/road_distance", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "동굴이 가까워질 거라고 생각했지만 눈에 잡히는 것은 없었다.\n\n몇 걸음 더. 저편까지.\n\n그는 거리를 작게 나눴다. 멀리 가겠다고 했으니 가까운 길부터 걸어야 했다."}], "when": true}, {"id": "lore_menace/road_breath", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "숨이 조금 빨라졌다.\n\n겁 때문인지 걷는 탓인지 구별하기 어려웠다. 속도를 조금 줄이자 발소리도 함께 줄었다. 일행은 그를 재촉하지 않았다."}], "when": true}, {"id": "lore_menace/road_end", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "어두운 입구가 보였다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 멈췄다. 길에서 떠올리던 어둠보다 입구는 작았다. 그 안으로 계속 들어간다는 생각은 더 컸다.\n\n일행이 곁에 섰다. 여기서부터는 다른 빛으로 걸어야 했다."}], "when": true}, {"id": "i/joe_route", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 오늘 받은 부탁부터 설명했다.\n\n이 사람이 접견실에 있었던 것은 아니었다. 함께 걷는다고 모든 말을 아는 것은 아니었다. "}, {"ref": {"catalog": "characters", "id": "mad_joe", "particle": "이/가"}}, {"text": " 중심부까지 보고 돌아온다는 말을 낮게 따라 했다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "mad_joe"}}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/enter_menace", "label": [{"text": "동굴 안으로 들어간다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/cave_entry", "when": true}, {"branch_kind": "navigation", "consequence": [{"text": "선택한 경험만 상태와 다음 장면에 남긴다."}], "effects": [], "id": "i/choose_role", "label": [{"text": "동굴에 들어가기 전에 각자의 할 일을 나눈다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "target": "i/roles", "when": true}], "editorial": {"intent": "1-3: 성을 떠난 일행의 걸음과 대화, 동굴 문턱의 감각을 펼치고 안으로 들어가는 결정에서 멈춘다.", "notes": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "source_refs": ["lore_menace/assignment", "lore_menace/menace_entry"], "status": "draft"}, "entry_when": true, "handoff": null, "id": "lore_menace/road", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/assignment", "lore_menace/menace_entry"]}, "title": [{"text": "말이 길이 될 때"}]}, {"blocks": [{"id": "lore_menace/cave_threshold", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": ["lore_menace/menace_entry"]}, "speaker": null, "text": [{"text": "입구 바로 앞까지 갔다.\n\n밝은 바닥이 갑자기 어두워졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 발을 놓기 전에 안쪽을 봤다. 성주가 말한 동굴의 이름과 실제 입구가 이제야 하나로 겹쳤다."}], "when": true}, {"id": "lore_menace/cave_outside_noise", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "바깥에서는 바람이 들렸다.\n\n안에서는 무슨 소리가 나는지 알 수 없었다. 두 소리를 한꺼번에 들으려다가 그는 가만히 섰다. 먼저 자신의 발소리부터 멎어야 했다."}], "when": true}, {"id": "lore_menace/cave_first_step", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "첫발은 생각보다 얕게 들어갔다.\n\n바닥에 무게를 실었다. 움직이지 않았다. 다음 발을 옮겼다. 뒤에서 오는 사람이 밟을 자리를 남기고 옆으로 비켰다."}], "when": true}, {"id": "lore_menace/cave_eyes", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "눈이 곧바로 따라오지 않았다.\n\n밝은 곳에서 본 바닥의 모양이 안에서는 끊겼다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 몇 번 눈을 깜박였다. 보이지 않는다고 앞이 비어 있는 것은 아니었다."}], "when": true}, {"id": "lore_menace/cave_look_back", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "뒤돌아보니 입구가 환했다.\n\n한 걸음 들어왔을 뿐인데 바깥은 멀리 떨어진 곳 같았다. 그는 일행이 안쪽에 들어왔는지 확인했다. 지금은 이름을 부르면 목소리가 가까이 돌아왔다."}], "when": true}, {"id": "lore_menace/cave_companion_reply", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“다 들어왔습니다. 천천히 가죠.”"}], "when": true}, {"id": "lore_menace/cave_breath", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말을 듣자 얕은 숨이 풀렸다.\n\n그는 앞을 보았다. 멀리 있는 중심부를 한 번에 볼 수는 없었다. 가장 가까운 바닥. 그다음 벽. 확인할 범위를 줄였다."}], "when": true}, {"id": "lore_menace/cave_skeleton_presence", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 뒤쪽에 서 있었다.\n\n안으로 들어오니 성문에서 하던 말은 사라졌다. 발을 놓을 자리부터 보았다. 함께 왔다는 사실은 지금 같은 곳에서 멈춰 있다는 것으로 드러났다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/cave_wall", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "벽에 손끝을 댔다.\n\n돌이 차가웠다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 손을 밀지 않고 표면을 따라 옮겼다. 눈에 보이는 것과 손에 닿는 것을 맞춰 봤다. 거친 곳에서는 손을 떼었다."}], "when": true}, {"id": "lore_menace/cave_not_far", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "아직 멀리 들어온 것은 아니었다.\n\n그런데 벌써 돌아가고 싶은 생각이 났다. 밖에서는 입구만 찾으면 될 줄 알았다. 안에서는 첫걸음 다음에 또 첫걸음을 골라야 했다."}], "when": true}, {"id": "lore_menace/cave_dust_light", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "입구의 빛이 먼지에 걸렸다.\n\n그 안에서는 발을 옮길 때 일어난 가루가 보였다. 빛이 닿지 않는 쪽에서는 가루도 보이지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 경계를 오래 보지 않고 바닥으로 시선을 내렸다."}], "when": true}, {"id": "lore_menace/cave_hold_together", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "앞으로 가기 전에 뒤를 확인했다.\n\n한 사람만 더 멀리 보겠다고 움직이면 간격이 벌어졌다. 그는 손을 낮게 들었다. 일행이 가까워질 때까지 기다렸다. 함께 가야 돌아올 때도 수를 셀 수 있었다."}], "when": true}, {"id": "lore_menace/cave_decision", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "여기서 계속 서 있을 수는 없었다.\n\n보이는 곳까지 옮긴다. 다시 멈춘다. 그다음 자리를 찾는다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 첫 번째로 보이는 돌을 골랐다."}], "when": true}, {"id": "lore_menace/cave_last_light", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "빛이 등 뒤로 넘어갔다.\n\n그는 돌아보고 싶은 마음을 잠깐 눌렀다. 뒤에 있는 사람들의 발소리가 들렸다. 지금 필요한 확인이었다. 다음 걸음을 옮겼다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/walk_deeper", "label": [{"text": "일행의 거리를 맞추며 더 안으로 간다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/cave_walk", "when": true}], "editorial": {"intent": "1-3: 성을 떠난 일행의 걸음과 대화, 동굴 문턱의 감각을 펼치고 안으로 들어가는 결정에서 멈춘다.", "notes": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "source_refs": ["lore_menace/menace_entry", "lore_menace/center"], "status": "draft"}, "entry_when": true, "handoff": null, "id": "lore_menace/cave_entry", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/menace_entry", "lore_menace/center"]}, "title": [{"text": "빛이 짧아지는 곳"}]}, {"blocks": [{"id": "lore_menace/walk_sense", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "안쪽은 걸음마다 달랐다.\n\n가까운 벽이 멀어졌고, 넓던 바닥이 좁아졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 손을 놓고 다시 붙였다. 입구에서 익힌 거리만 믿으면 바로 잘못 짚을 수 있었다."}], "when": true}, {"id": "lore_menace/walk_noise_stopped", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "모두 멈췄는데 소리가 남았다.\n\n그는 고개를 들었다. 다른 사람의 발소리인가. 뒤를 보니 일행도 멈춰 있었다. 조금 전 낸 울림이 돌 사이에서 늦게 돌아오고 있었다."}], "when": true}, {"id": "lore_menace/walk_sound_wait", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "아무도 말을 하지 않았다.\n\n울림이 잦아들자 그제야 가까운 숨소리가 나뉘었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 발밑을 봤다. 소리를 따라 급히 움직이지 않은 것이 다행이었다."}], "when": true}, {"id": "lore_menace/walk_small_word", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“잠깐.”"}], "when": true}, {"id": "lore_menace/walk_follow_sound", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "손을 들자 뒤의 발도 멎었다.\n\n방금 들은 소리가 어디서 왔는지 기다렸다. 대답처럼 같은 소리가 돌아왔지만 새 발소리는 아니었다. 그는 앞으로 기울였던 몸을 세웠다."}], "when": true}, {"id": "lore_menace/walk_wall_hand", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "벽에 댄 손이 거친 곳에 걸렸다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 손가락을 뺐다. 그대로 밀었다면 긁혔을 것이다. 한 걸음 전에 매끈했다고 다음 자리도 같은 것은 아니었다.\n\n그는 눈을 더 가까이 가져갔다. 손을 쓰기 전에 볼 수 있는 만큼 봤다."}], "when": true}, {"id": "lore_menace/walk_stop_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "앞발이 멎었다.\n\n뒤에서 오던 사람이 가까워졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 옆으로 몸을 돌려 부딪칠 자리를 피했다. 멈추라는 말이 늦었다. 상대도 짐을 당겨 세웠다.\n\n어두워서 서로의 발을 보지 못한 탓이었다. 그는 손을 낮췄다. 이번에는 뒤쪽까지 보이도록 했다."}], "when": true}, {"id": "lore_menace/walk_smaller_word", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“앞이 잘 안 보입니다. 제가 멈추면 조금 떨어져서 기다려 주세요.”"}], "when": true}, {"id": "lore_menace/walk_awkward_release", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말을 하자 길이 생긴 것 같았다.\n\n실제로 바닥이 넓어진 것은 아니었다. 뒤의 사람이 반걸음 물러났다. 그만큼 몸을 돌릴 자리가 늘었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 다시 앞을 봤다. 겁을 없애는 주문은 없었다. 대신 서로 어떻게 멈추는지 알릴 수 있었다. 그 편이 지금은 더 도움이 됐다."}], "when": true}, {"id": "lore_menace/walk_companion", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "이/가"}}, {"text": " 간격을 맞춰 멈췄다.\n\n그는 먼저 앞질러 오지 않았다. 성문에서 함께 가겠다고 했던 말이 이 좁은 길에서는 발 하나의 간격으로 이어졌다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/walk_join_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "“괜찮습니까?”"}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/walk_join_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“괜찮소. 당신이 멈추면 나도 멈추겠소.”"}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/walk_join_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 고개를 끄덕였다.\n\n어둠을 볼 수 있게 해 주는 답은 아니었다. 그러나 뒤에서 언제 멈출지 모르는 발소리는 줄었다. 그는 다음 자리를 고를 수 있었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/walk_declined_space", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "뒤를 봤다.\n\n지금 함께 들어온 사람들이 있었다. 성문에서 남겨 둔 사람은 여기 없었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 곁에 있는 이들에게 손짓했다. 현재의 간격을 맞춰야 했다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/walk_focus", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "먼 곳을 오래 보다가 가까운 돌을 놓칠 뻔했다.\n\n발끝이 돌 옆을 스쳤다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 무게를 싣기 전에 멈췄다. 중심부를 찾겠다고 하면서 그쪽만 보고 있었다.\n\n그는 시선을 내렸다. 목적지는 멀어도 다음 발은 자기 앞에 있었다. 그곳을 지나지 않으면 아무 데도 갈 수 없었다."}], "when": true}, {"id": "lore_menace/walk_name_low", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "동굴의 이름을 낮게 불렀다.\n\n부르면 조금 가까워질 줄 알았다. 소리는 벽에 닿아 돌아왔을 뿐이었다. 그는 이름 대신 눈앞의 돌을 기억했다. 돌아올 때 실제로 알아볼 것은 그쪽이었다."}], "when": true}, {"id": "lore_menace/walk_breath_changes", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "숨이 벽에서 돌아오는 것 같았다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 입을 조금 벌렸다. 빠르게 걷지 않았는데도 답답했다. 그는 속도를 줄이고 일행이 멈출 시간을 줬다.\n\n조금 뒤 다시 움직였다. 이 길을 빨리 통과하는 것보다 계속 걸을 수 있는 속도로 가는 편이 나았다. 되돌아갈 힘도 남겨야 했다."}], "when": true}, {"id": "lore_menace/walk_different_echo", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "울림이 달라졌다.\n\n가까이서 끊기던 발소리가 더 멀리 남았다. 그는 벽에 대던 손을 거뒀다. 앞쪽이 조금 넓어지고 있었다. 아직 무엇이 있는지는 보이지 않았다."}], "when": true}, {"id": "lore_menace/walk_arrival", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "한 걸음 더 옮기자 일행이 나란히 설 자리가 생겼다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 멈췄다. 좁은 길에서 나오자 더 들어가고 싶은 마음이 먼저 들었다. 그는 그 마음보다 주위를 먼저 확인했다.\n\n성주가 말한 곳에 닿았는지 알아야 했다."}], "when": true}, {"id": "i/role_echo_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "이/가"}}, {"text": " 걸음을 늦췄다.\n\n조금 전 살핀 자리를 알아본 모양이었다. "}, {"ref": {"catalog": "equipment", "id": "story_axe", "particle": "은/는"}}, {"text": " 같은 손에 남아 있었다. 앞사람도 멈추는 이유를 다시 묻지 않았다. 맡긴 일 하나가 돌아가는 속도에도 남았다."}], "when": {"all": [{"op": "eq", "state": "event.role.party_woodcutter", "value": true}, {"op": "contains", "state": "companions.starting", "value": "party_woodcutter"}, {"op": "eq", "state": "event.weapon.party_woodcutter", "value": "story_axe"}]}}, {"id": "i/role_echo_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_hunter", "particle": "이/가"}}, {"text": " 걸음을 늦췄다.\n\n조금 전 살핀 자리를 알아본 모양이었다. "}, {"ref": {"catalog": "equipment", "id": "story_bow", "particle": "은/는"}}, {"text": " 같은 손에 남아 있었다. 앞사람도 멈추는 이유를 다시 묻지 않았다. 맡긴 일 하나가 돌아가는 속도에도 남았다."}], "when": {"all": [{"op": "eq", "state": "event.role.party_hunter", "value": true}, {"op": "contains", "state": "companions.starting", "value": "party_hunter"}, {"op": "eq", "state": "event.weapon.party_hunter", "value": "story_bow"}]}}, {"id": "i/role_echo_party_cook", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_cook", "particle": "이/가"}}, {"text": " 걸음을 늦췄다.\n\n조금 전 살핀 자리를 알아본 모양이었다. "}, {"ref": {"catalog": "equipment", "id": "story_knife", "particle": "은/는"}}, {"text": " 같은 손에 남아 있었다. 앞사람도 멈추는 이유를 다시 묻지 않았다. 맡긴 일 하나가 돌아가는 속도에도 남았다."}], "when": {"all": [{"op": "eq", "state": "event.role.party_cook", "value": true}, {"op": "contains", "state": "companions.starting", "value": "party_cook"}, {"op": "eq", "state": "event.weapon.party_cook", "value": "story_knife"}]}}, {"id": "i/role_echo_party_magician", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_magician", "particle": "이/가"}}, {"text": " 걸음을 늦췄다.\n\n조금 전 살핀 자리를 알아본 모양이었다. "}, {"ref": {"catalog": "equipment", "id": "story_wand", "particle": "은/는"}}, {"text": " 같은 손에 남아 있었다. 앞사람도 멈추는 이유를 다시 묻지 않았다. 맡긴 일 하나가 돌아가는 속도에도 남았다."}], "when": {"all": [{"op": "eq", "state": "event.role.party_magician", "value": true}, {"op": "contains", "state": "companions.starting", "value": "party_magician"}, {"op": "eq", "state": "event.weapon.party_magician", "value": "story_wand"}]}}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/confirm_center", "label": [{"text": "동굴의 중심부를 확인한다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/center", "when": true}], "editorial": {"intent": "1-4: 동굴 안의 거리와 소리를 더듬는 탐사, 중심부 확인, 함께 돌아서기까지의 긴 장면 초고.", "notes": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "source_refs": ["lore_menace/center"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lore_stage", "value": 3}, "handoff": null, "id": "lore_menace/cave_walk", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/center"]}, "title": [{"text": "확인해야 할 끝"}]}, {"blocks": [{"id": "lore_menace/center_quote", "kind": "source_quote", "literal_ids": ["LORESPEC.PAS:literal:34455", "LORESPEC.PAS:literal:34507", "LORESPEC.PAS:literal:34554"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/center"]}, "speaker": null, "text": [{"source": {"bindings": [{"end": 11, "ref": {"catalog": "terms", "id": "menace"}, "start": 5}, {"end": 45, "ref": {"catalog": "characters", "id": "lord_ahn"}, "start": 37}], "literal_ids": ["LORESPEC.PAS:literal:34455", "LORESPEC.PAS:literal:34507", "LORESPEC.PAS:literal:34554"]}}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "도착했다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 바로 말하지 못했다. 중심부까지 확인하겠다고 했다. 여기서 무엇이 보이는지, 돌아가서 무엇을 말할지 아직 나누지 못했다.\n\n그는 주위를 다시 봤다. 도착했다는 감각보다 실제로 본 것이 먼저였다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_listen", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "발소리가 멎었다.\n\n넓어진 곳에서는 울림이 오래 남았다. 그는 가까운 돌의 면을 봤다. 긁힌 선이 있었다. 바닥은 지나온 길보다 넓었다. 안쪽으로 이어지는 곳도 보였다.\n\n누가 왜 그 선을 냈는지는 몰랐다. 더 안쪽에 무엇이 있는지도 몰랐다.\n\n이곳까지 왔다는 것만으로 동굴을 다 알게 되는 것은 아니었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 돌아가서 그 차이를 말하기로 했다. 보지 않은 것을 없는 것으로 만들어 보고할 수는 없었다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_hands", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "손가락을 폈다.\n\n돌을 짚던 손이 차가웠다. 멈추고 나서야 어깨가 무거웠다. 걸을 때에는 몸이 긴장한 줄도 모르고 앞만 봤다. 그는 팔을 낮추고 짧게 숨을 골랐다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_group_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "일행도 멈췄다.\n\n누군가는 앞을 봤다. 누군가는 뒤를 확인했다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 옆으로 비켰다. 뒤에서 온 사람에게 볼 자리를 줬다. 혼자 본 것을 다 같이 본 것처럼 말하고 싶지 않았다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_say_at_last", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“여기까지 왔습니다.”"}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_small_sentence", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "목소리는 작았다.\n\n그래도 일행이 고개를 돌렸다. 길에서 말하던 목적지가 이제 발밑에 있었다. 더 큰 말은 필요하지 않았다. 다음에 할 일을 정해야 했다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_before_return", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "앞으로 더 가고 싶었다.\n\n길이 보이는데 돌아서면 덜 한 것 같았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 지나온 쪽을 봤다. 중심부에 도착하는 것만 맡은 일이 아니었다. 본 것을 가지고 돌아가야 했다.\n\n더 많이 보겠다고 안쪽으로 들어가다 힘을 다 써 버리면 보고할 사람도 남지 않을 수 있었다.\n\n궁금증은 지워지지 않았다. 지금 해야 할 일을 대신하게 둘 수는 없었다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_companion", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 돌아갈 쪽을 보고 있었다.\n\n성문에서 듣던 부탁이 떠올랐다. 이 사람에게 함께 돌아간다는 말은 어떻게 들릴까. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 묻지 않았다. 상대의 시선이 이미 같은 길에 있었다."}], "when": {"all": [{"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}, {"op": "eq", "state": "event.cave_detour_done", "value": false}]}}, {"id": "lore_menace/center_join_reply", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "“돌아갈 때도 천천히 가면 되겠소.”"}], "when": {"all": [{"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}, {"op": "eq", "state": "event.cave_detour_done", "value": false}]}}, {"id": "lore_menace/center_join_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그는 고개를 끄덕였다.\n\n자신만 돌아가자고 말하는 것은 아니었다. 한 사람이 같은 방향을 보고 있었다. 그 확인 하나가 다음 움직임을 가볍게 했다."}], "when": {"all": [{"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}, {"op": "eq", "state": "event.cave_detour_done", "value": false}]}}, {"id": "lore_menace/center_reply", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“돌아갑시다. 본 것을 그대로 보고하겠습니다.”"}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_turning", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "몸을 돌렸다.\n\n등 뒤의 길이 앞으로 왔다. 그는 발 하나를 옆으로 뺐다. 좁아지는 곳으로 다시 들어가려면 차례가 필요했다. 갈 때보다 익숙하다고 빨리 걸을 수는 없었다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_last_look", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "몇 걸음 뒤에서 한 번 돌아봤다.\n\n멈춰 있던 자리가 조용해졌다. 거기까지 가는 것이 전부라고 생각했던 곳이었다. 이제는 돌아갈 길의 시작이었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 다시 앞을 봤다. 일행의 발소리가 성 쪽으로 움직였다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "i/center_return_from_detour", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "sou nd": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "같은 길인데 다르게 보였다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 벽을 짚으려다가 손을 멈췄다. 들어올 때에는 반대쪽에 두었던 손이었다. 돌아오는 방향이 바뀌니 익숙한 자리가 금방 낯설어졌다.\n\n그는 앞에 있는 표면부터 확인했다. 기억만으로 걷지 않았다."}], "when": true}, {"id": "lore_menace/return_order", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌아서는 동안 일행의 순서가 달라졌다.\n\n앞에 있던 사람이 뒤로 갔다. 좁은 곳에서는 몸을 바꿔 설 틈도 없었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 한 사람씩 움직이게 기다렸다.\n\n같은 사람들과 돌아가도 걸음은 다시 맞춰야 했다."}], "when": true}, {"id": "lore_menace/return_small_mark", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "작은 돌 하나가 눈에 걸렸다.\n\n들어올 때 멈췄던 자리였다. 알아봤다는 이유로 바로 밟으려다가 발을 거뒀다. 돌이 그때와 같은 쪽으로 보이지 않았다.\n\n그는 기억한 것과 눈앞의 것을 맞췄다. 맞지 않는 부분에서는 현재 보이는 쪽을 골랐다. 돌아가는 길을 알고 있다는 자신감이 발목을 꺾어 주지는 않을 것이다."}], "when": true}, {"id": "lore_menace/return_echo_reply", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "발소리가 벽에서 돌아왔다.\n\n처음 들었을 때는 다른 발인지 기다렸다. 이번에도 잠깐 멈췄다. 같은 울림이라고 알아봤어도 확인은 필요했다. 일행이 멎자 뒤늦은 소리만 남았다.\n\n그는 손을 내렸다. 다시 걸어도 됐다."}], "when": true}, {"id": "lore_menace/return_skeleton", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "이/가"}}, {"text": " 간격을 두고 따라왔다.\n\n들어갈 때 맞춘 속도가 돌아오는 길에서도 남아 있었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 뒤를 확인하고 앞으로 고개를 돌렸다. 이름을 불러야만 있는 사람은 아니었다. 발소리로도 위치를 알 수 있었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/return_skeleton_line", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "“이제 밝은 쪽으로 가는 것이오?”"}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/return_skeleton_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“입구까지 돌아가야 합니다. 조금 더 가죠. 서두르지는 맙시다.”"}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/return_absent", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "뒤쪽에는 함께 들어온 사람들만 있었다.\n\n성문에서 헤어진 이의 발소리는 없었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 현재 일행의 간격을 확인했다. 빈자리에 누군가의 말을 만들어 넣지 않았다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/return_light", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "옅은 빛이 보였다.\n\n눈이 먼저 그쪽으로 갔다. 발은 아직 어두운 바닥에 있었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 고개를 내렸다. 마지막 몇 걸음에서 넘어지고 싶지 않았다."}], "when": true}, {"id": "lore_menace/return_outside", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "바람이 얼굴에 닿았다.\n\n그는 입구를 넘고 옆으로 비켰다. 나머지 사람도 나올 자리가 필요했다. 밝아진 얼굴을 차례로 확인하고 나서야 숨을 길게 내쉬었다.\n\n나왔다. 그러나 아직 끝은 아니었다. 성주에게 돌아가야 했다."}], "when": true}, {"id": "lore_menace/return_reset", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“잠깐 쉽시다. 다 나온 뒤에 다시 출발하죠.”"}], "when": true}, {"id": "lore_menace/return_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그는 손을 털었다.\n\n돌의 가루가 바람에 흩어졌다. 다리가 조금 무거웠다. 바깥에 나왔다고 힘까지 돌아오는 것은 아니었다. 일행이 짐을 고치는 동안 성이 있는 방향을 봤다.\n\n걸어온 만큼 다시 걸어야 했다."}], "when": true}, {"id": "lore_menace/return_veteran", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌아오지 못한 사람들의 이야기가 떠올랐다.\n\n지금 자신들은 동굴에서 나왔다. 그 사실만으로 주점의 노인이 기다리던 사람들이 돌아오는 것은 아니었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 자신들이 돌아온 일을 작게도 크게도 꾸미지 않기로 했다. 이제 보고할 수 있는 일이 하나 생긴 것이었다."}], "when": {"op": "eq", "state": "knowledge.missing_squad", "value": true}}, {"id": "lore_menace/return_rehearsal", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "보고할 말을 골랐다.\n\n동굴을 찾았다. 중심부에 닿았다. 거기서 본 것은 무엇이었다.\n\n문장을 늘려 놓으니 그럴듯했다. 하지만 모르는 곳까지 안 것처럼 들릴 수도 있었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 마지막 말을 먼저 정했다."}], "when": true}, {"id": "lore_menace/return_rehearsal_line", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“중심부까지 다녀왔습니다. 더 안쪽은 확인하지 못했습니다.”"}], "when": true}, {"id": "lore_menace/return_rehearsal_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말하고 나니 짧았다.\n\n걸어온 시간에 비하면 너무 짧은 보고 같았다. 그렇다고 긴장했던 순간을 늘어놓는다고 더 정확해지는 것은 아니었다. 그가 본 것을 물으면 그때 답하면 됐다."}], "when": true}, {"id": "lore_menace/return_arrive", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성문이 가까워졌다.\n\n출발할 때 보던 문이었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 발밑의 돌을 피했다. 일행이 뒤에서 같은 쪽으로 들어왔다.\n\n나갈 때 한 대답을 가지고 돌아온 것은 처음이었다. 다음에는 실제로 본 것을 말해야 했다."}], "when": true}, {"id": "i/shield_echo", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "equipment", "id": "shield_5", "particle": "이/가"}}, {"text": " 일행의 걸음에 맞춰 움직였다.\n\n아까까지 돌 틈에 있던 물건이었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 발견한 곳을 떠올렸다. 손에 든 뒤에도 어디서 얻었는지 잊고 싶지 않았다."}], "when": {"op": "ne", "state": "event.shield_owner", "value": ""}}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/report_success", "label": [{"text": "성주에게 탐사 성공을 보고한다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/report", "when": true}], "editorial": {"intent": "같은 길을 돌아온 일행이 과장하지 않은 보고를 통해 첫 부탁을 끝내는 소편", "notes": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "source_refs": ["lore_menace/center", "lore_menace/report"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lore_stage", "value": 4}, "handoff": null, "id": "lore_menace/return_road", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/center", "lore_menace/report"]}, "title": [{"text": "같은 길을 거꾸로"}]}, {"blocks": [{"id": "lore_menace/report_threshold", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "접견실 문 앞에서 걸음을 늦췄다.\n\n들어오기 전에 준비한 말이 목에 걸렸다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 고개를 들었다. 성주가 그들을 보고 있었다. 일행이 돌아왔다는 사실은 이미 눈앞에 있었다.\n\n그 뒤의 일을 말하면 됐다."}], "when": true}, {"id": "lore_menace/report_words", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“중심부까지 다녀왔습니다. 지나온 곳은 확인했습니다. 그보다 더 안쪽은 들어가지 않았습니다.”"}], "when": true}, {"id": "lore_menace/report_wait", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "보고를 끝냈다.\n\n성주는 바로 끼어들지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 말을 더 보탤 뻔했다. 어두웠다는 말, 길이 좁았다는 말, 여러 번 멈췄다는 말.\n\n이미 말한 것을 덮을까 봐 입을 다물었다. 상대가 무엇을 묻는지 기다렸다. 질문에는 실제로 본 범위에서 답할 생각이었다."}], "when": true}, {"id": "lore_menace/report_quote", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:13915"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/report"]}, "speaker": "lord_ahn", "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:13915"]}}], "when": true}, {"id": "lore_menace/reward_counter_quote", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:13956"], "provenance": {"note": "원작 UI 보상 표기. 성주의 발화가 아니다. 수치로 나이/자동 레벨 상승/새 능력을 확정하지 않는다.", "origin": "source_exact", "source_refs": ["lore_menace/report"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:13956"]}}], "when": true}, {"id": "lore_menace/report_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성주의 대답을 들었다.\n\n그제야 발에 들어가 있던 힘이 풀렸다. 중심부를 확인하겠다는 약속은 이제 이 방까지 돌아왔다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 일행을 잠깐 봤다. 혼자 받은 대답은 아니었다."}], "when": true}, {"id": "lore_menace/report_thanks", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“감사합니다.”"}], "when": true}, {"id": "lore_menace/report_double_word", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "출발하기 전에도 비슷한 인사를 했다.\n\n이번에는 같은 말이 다르게 들렸다. 무언가 해 보겠다는 인사가 아니었다. 갔다 돌아온 뒤에 한 인사였다.\n\n짧은 말을 끝내고도 그는 곧바로 돌아서지 않았다. 성주에게 아직 할 말이 남아 있는 것 같았다."}], "when": true}, {"id": "lore_menace/report_skeleton", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 곁에 서 있었다.\n\n성문에서 두 걸음 남겨 두었던 사람이 이 방까지 함께 왔다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 사실을 대신 설명하지 않았다. 누구와 다녀왔는지는 지금 함께 서 있는 모습으로도 보였다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/report_declined", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "현재의 일행이 곁에 섰다.\n\n헤어진 사람은 이 방에 없었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 함께 다녀온 사람들을 봤다. 보고할 경험도 그 길을 실제로 걸은 사람들의 것이었다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/report_settle", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "일이 끝났다고 생각했다.\n\n그 생각이 들자 피곤함도 가까워졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 바닥에 둔 발을 조금 옮겼다. 성주의 시선이 아직 일행에게 있었다.\n\n돌아왔다는 대답 뒤에 다른 일이 기다릴 수도 있었다. 그는 먼저 나가겠다는 말을 하지 않았다."}], "when": true}, {"id": "i/role_report_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "이/가"}}, {"text": " 옆 사람과 눈을 맞췄다.\n\n오늘 맡았던 일을 전부 설명할 필요는 없었다. 일행은 같은 길에서 그 행동을 봤다. 출발할 때 말없이 서 있던 것과, 돌아와 조용히 기다리는 것은 달랐다."}], "when": {"all": [{"op": "eq", "state": "event.role.party_woodcutter", "value": true}, {"op": "contains", "state": "companions.starting", "value": "party_woodcutter"}, {"op": "eq", "state": "event.weapon.party_woodcutter", "value": "story_axe"}]}}, {"id": "i/role_report_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_hunter", "particle": "이/가"}}, {"text": " 옆 사람과 눈을 맞췄다.\n\n오늘 맡았던 일을 전부 설명할 필요는 없었다. 일행은 같은 길에서 그 행동을 봤다. 출발할 때 말없이 서 있던 것과, 돌아와 조용히 기다리는 것은 달랐다."}], "when": {"all": [{"op": "eq", "state": "event.role.party_hunter", "value": true}, {"op": "contains", "state": "companions.starting", "value": "party_hunter"}, {"op": "eq", "state": "event.weapon.party_hunter", "value": "story_bow"}]}}, {"id": "i/role_report_party_cook", "kind": "narration", "literal_ids": [], "pro 작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/next_task", "when": true}], "editorial": {"intent": "같은 길을 돌아온 일행이 과장하지 않은 보고를 통해 첫 부탁을 끝내는 소편", "notes": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "source_refs": ["lore_menace/report"], "status": "draft"}, "entry_when": {"all": [{"op": "eq", "state": "quest.lore_stage", "value": 4}, {"op": "eq", "state": "quest.menace_reward_claimed", "value": false}]}, "handoff": null, "id": "lore_menace/report", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/report"]}, "title": [{"text": "축하의 크기"}]}, {"blocks": [{"id": "lore_menace/next_before", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "다음 말이 나오기 전에 숨을 골랐다.\n\n동굴에서는 다음 자리를 눈으로 찾았다. 여기서는 성주가 어떤 말을 할지 기다려야 했다. 돌아왔다는 안도감이 아직 풀리지 않았는데, 그 안에 다시 긴장이 섞였다."}], "when": true}, {"id": "lore_menace/next_silence", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "짧은 침묵이었다.\n\n이번에는 바닥의 금으로 시선을 피하지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성주를 봤다. 일행에게 다른 부탁을 할 생각이라면 끝까지 들어야 했다. 듣기도 전에 할 수 있다고 말할 수는 없었다."}], "when": true}, {"id": "lore_menace/next_quote", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:14212", "LORETALK.PAS:literal:14261", "LORETALK.PAS:literal:14315", "LORETALK.PAS:literal:14365", "LORETALK.PAS:literal:14385", "LORETALK.PAS:literal:14397", "LORETALK.PAS:literal:14431", "LORETALK.PAS:literal:14444", "LORETALK.PAS:literal:14456", "LORETALK.PAS:literal:14493"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/next_task"]}, "speaker": "lord_ahn", "text": [{"source": {"bindings": [{"end": 52, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 41}, {"end": 102, "ref": {"catalog": "terms", "id": "lastditch"}, "start": 93}, {"end": 125, "ref": {"catalog": "terms", "id": "lastditch"}, "start": 116}], "literal_ids": ["LORETALK.PAS:literal:14212", "LORETALK.PAS:literal:14261", "LORETALK.PAS:literal:14315", "LORETALK.PAS:literal:14365", "LORETALK.PAS:literal:14385", "LORETALK.PAS:literal:14397", "LORETALK.PAS:literal:14431", "LORETALK.PAS:literal:14444", "LORETALK.PAS:literal:14456", "LORETALK.PAS:literal:14493"]}}], "when": true}, {"id": "lore_menace/next_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "terms", "id": "lastditch"}}, {"text": ".\n\n동쪽에 있는 성이라고 했다. 그곳의 모습은 떠오르지 않았다. 이름에 붙은 근심이라는 말이 먼저 남았다. 성주가 말한 "}, {"ref": {"catalog": "characters", "id": "necromancer"}}, {"text": "의 이름도 함께였다.\n\n아직 보지 못한 사람들에게 도움이 필요했다. 중심부를 확인하는 것과는 다른 부탁이었다."}], "when": true}, {"id": "lore_menace/next_scale", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "앞선 일은 목적지가 분명했다.\n\n중심부에 닿으면 돌아올 수 있었다. 이번에는 사람들의 근심부터 들어야 했다. 어디까지 가면 끝나는지 이 방에서는 알 수 없었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 발밑을 보려다가 참았다. 피해야 할 돌 대신 대답해야 할 말이 있었다."}], "when": true}, {"id": "lore_menace/next_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“가서 그곳 사정부터 들으면 됩니까?”"}], "when": true}, {"id": "lore_menace/next_lord_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "lord_ahn", "text": [{"text": "“우선 그들을 만나 주시오.”"}], "when": true}, {"id": "lore_menace/next_question_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그는 고개를 끄덕였다.\n\n가서 사람을 만난다. 먼저 듣는다. 자신이 할 수 있는 일을 찾는다.\n\n한꺼번에 놓인 것 같던 부탁이 세 단계로 나뉘었다. 마지막 답은 아직 없었다. 그 답까지 지금 아는 척할 필요는 없었다."}], "when": true}, {"id": "lore_menace/next_skeleton", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "이/가"}}, {"text": " 일행을 봤다.\n\n새 목적지를 들었다고 먼저 나갈 준비를 하지는 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그와 눈을 맞췄다. 이번 길을 함께 정할 사람 가운데 그도 있었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/next_declined", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "곁에는 현재의 동료들이 있었다.\n\n처음의 부탁을 듣고 함께 나갔다 돌아온 사람들이었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 다음 길에서도 그들의 눈길을 빼놓지 않기로 했다. 성문에서 남겨 둔 사람이 대신 대답해 줄 수는 없었다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/next_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“가서 만나 보겠습니다.”"}], "when": true}, {"id": "lore_menace/next_answer_measure", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "이번 대답에는 끝을 붙이지 않았다.\n\n모든 근심을 없애겠다고 말하지 않았다. 아직 무엇인지도 몰랐다. 먼저 만나겠다는 말은 할 수 있었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 범위에서 대답을 멈췄다."}], "when": true}, {"id": "lore_menace/next_breath_room", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "방 안의 숨소리가 가까워졌다.\n\n일행이 조금씩 움직였다. 출발하는 순서를 생각하는 것처럼 보였다. 그는 마음속에서 동쪽이라는 방향을 붙잡았다. 익숙해진 남서쪽의 길을 그대로 따라가면 안 됐다."}], "when": true}, {"id": "lore_menace/next_hold_name", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "terms", "id": "lastditch"}}, {"text": ".\n\n새 이름을 한 번 더 외웠다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성주를 봤다. 목적지가 생겼다고 그곳의 사정까지 얻은 것은 아니었다.\n\n이제는 들어야 할 이야기가 저편에 있었다."}], "when": true}], "choices": [{"branch_kind": "quest", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [{"op": "set", "provenance": {"note": "원작 조건/변화를 집필 상태로 추상화. 원문 코드 실행이나 고정 인물 설정 추가가 아니다.", "origin": "source_adaptation", "source_refs": ["lore_menace/next_task"]}, "state": "quest.lore_stage", "value": 6}], "id": "lore_menace/hear_next_task", "label": [{"text": "동쪽 성에 관한 부탁을 기억한다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/farewell", "when": true}], "editorial": {"intent": "첫 부탁을 마친 뒤 더 큰 의뢰를 듣되 만능의 자신감 대신 가서 듣겠다는 태도로 다음 이야기의 문턱에 서는 소편", "notes": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "source_refs": ["lore_menace/next_task"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lore_stage", "value": 5}, "handoff": null, "id": "lore_menace/next_task", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/next_task"]}, "title": [{"text": "다음 사람들의 근심"}]}, {"blocks": [{"id": "lore_menace/farewell_quote", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:14611"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/next_task"]}, "speaker": "lord_ahn", "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:14611"]}}], "when": true}, {"id": "lore_menace/farewell_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "스스로 행동하라는 말을 들었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 고개를 숙였다. 언제 나갈지, 어디서부터 할지, 어려우면 누구에게 물을지. 여기서 더 묻고 싶었다.\n\n하지만 동쪽의 성에서 들을 대답까지 이 방에 있지는 않았다.\n\n그는 고개를 들었다. 성주의 마지막 말은 허락이라기보다 다음 걸음을 자신들에게 돌려주는 말이었다."}], "when": true}, {"id": "lore_menace/farewell_reply", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“알겠습니다.”"}], "when": true}, {"id": "lore_menace/farewell_step", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "발을 옮겼다.\n\n방 안으로 들어올 때 크게 들리던 소리가 이번에도 울렸다. 다만 그 소리를 따라 자기 자세를 고치지는 않았다. 그는 문까지 갈 자리를 봤다. 일행이 움직일 길도 남겼다."}], "when": true}, {"id": "lore_menace/farewell_companion", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "이/가"}}, {"text": " 곁에서 몸을 돌렸다.\n\n출구에서 처음 만났을 때와는 달랐다. 어디로 가는지 몰라 부탁하던 사람이 이제는 다음 목적지의 이름을 함께 들었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그가 따라올 간격을 기다렸다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/farewell_skeleton_line", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "“이번에는 어느 쪽으로 가는 것이오?”"}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/farewell_skeleton_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“동쪽입니다. 가서 사람들을 만나죠. 무엇을 할지는 그 이야기를 듣고 정해야 합니다.”"}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/farewell_smile", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그가 짧게 고개를 끄덕였다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 웃을 뻔했다. 조금 전 성주에게 물었던 것을 자신이 설명하고 있었다. 대답을 안다고 해서 모든 것을 아는 것은 아니었다. 그래도 첫 방향은 말해 줄 수 있었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/farewell_declined", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "함께 돌아온 사람들과 문을 향했다.\n\n일행의 발소리는 지금 그들의 수만큼 났다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 문 앞에서 뒤를 확인했다. 새 길에서도 현재 곁에 있는 사람들과 움직여야 했다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/farewell_share", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“동쪽으로 갑니다. 도착하면 먼저 이야기를 듣죠.”"}], "when": true}, {"id": "lore_menace/farewell_loosen", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말하자 일행의 걸음이 정리됐다.\n\n누군가는 앞을 봤고, 누군가는 짐을 당겼다. 준비가 완벽해진 것은 아니었다. 여기서 기다리는 동안 다음 목적지가 가까워지는 것도 아니었다. 그는 문 쪽으로 걸었다."}], "when": true}, {"id": "lore_menace/farewell_window_light", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "복도에는 빛이 남아 있었다.\n\n나갈 때 보던 빛과 비슷했다. 동굴 안에서 등 뒤로 밀려났던 빛이 다시 발밑으로 왔다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 눈을 좁히지 않고 바닥을 봤다. 보이는 동안에는 더 많이 확인할 수 있었다."}], "when": true}, {"id": "lore_menace/farewell_hands", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "손을 폈다.\n\n돌을 짚던 손끝에는 아직 거친 감각이 남아 있었다. 그가 다녀온 일을 말하지 않아도 몸은 기억했다. 그는 손을 내렸다. 새 일을 받은 뒤에도 앞의 경험이 사라지는 것은 아니었다."}], "when": true}, {"id": "lore_menace/farewell_end", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "첫 부탁은 끝났다.\n\n동굴을 찾았다. 중심부를 확인했다. 돌아와 보고했다. 들어가기 전에는 세 말이면 될 것 같았다. 그 사이에는 잘못 디딜 뻔한 돌과 늦게 돌아오는 소리, 서로 멈추는 간격이 있었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 일행과 함께 문을 넘었다.\n\n다음 길은 동쪽이었다. 아직 그곳 사람들의 얼굴을 모르고, 무엇 때문에 괴로운지도 몰랐다.\n\n이번에는 그 답을 들으러 가야 했다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/leave_audience", "label": [{"text": "다음 여정을 준비한다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/next_quest_boundary", "when": true}], "editorial": {"intent": "첫 부탁을 마친 뒤 더 큰 의뢰를 듣되 만능의 자신감 대신 가서 듣겠다는 태도로  []}, "title": [{"text": "두 번째 답변"}]}, {"blocks": [{"id": "i/tavern_story_entry_1", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "문이 바닥을 긁었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 조금 더 밀었다. 틈에서 젖은 나무 냄새가 나왔다. 식기가 부딪치는 소리가 뒤따랐다. 안쪽에서는 여러 사람이 동시에 말하고 있었다."}], "when": true}, {"id": "i/tavern_story_entry_2", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그는 문 앞에서 멈췄다.\n\n웃음이 났다. 자기들을 본 것인지는 알 수 없었다. 가까운 탁자의 사람이 고개를 들었다가 다시 옆을 봤다. 그제야 문을 더 열었다."}], "when": true}, {"id": "i/tavern_story_entry_3", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "문을 닫자 바깥 소리가 끊겼다.\n\n안쪽에서는 의자를 당겼다. 말끝 위로 웃음이 올라갔다. 못 들은 사람이 되물었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 가장 가까운 목소리 하나부터 들으려 했다."}], "when": true}, {"id": "i/tavern_story_entry_4", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "주인이 잔을 빛 쪽으로 들었다.\n\n천이 유리 위를 한 바퀴 돌았다. 문가를 보고도 바로 부르지 않았다. 잔을 내려놓고 천을 접은 뒤에야 일행을 향해 손을 들었다."}], "when": true}, {"id": "i/tavern_story_entry_5", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "빈 의자가 보였다.\n\n그 앞의 사람들에게는 이미 하던 이야기가 있었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 바로 들어가 앉지 않았다. 문가에서는 뒤에 들어올 사람을 막고 있었다.\n\n먼저 주인의 눈을 찾았다."}], "when": true}, {"id": "i/tavern_story_entry_6", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "주인의 인사는 크지 않았다.\n\n그런데 문 앞에서는 또렷하게 들렸다. 누구를 향한 말인지 이번에는 구별할 수 있었다."}], "when": true}, {"id": "i/tavern_welcome", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:2110"], "provenance": {"note": "독립 스냅샷의 해당 조건·대사. 증언은 확정 진상이 아니다.", "origin": "source_exact", "source_refs": ["i/castle_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [{"end": 18, "ref": {"catalog": "terms", "id": "lore"}, "start": 14}], "literal_ids": ["LORETALK.PAS:literal:2110"]}}], "when": true}, {"id": "i/tavern_story_entry_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 고개를 숙였다.\n\n대답이 조금 작았다. 주인은 못 들었다고 묻는 대신 빈자리를 가리켰다. 그는 그 손짓을 보고 문가에서 비켰다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험만 상태와 다음 장면에 남긴다."}], "effects": [], "id": "i/tavern_personal", "label": [{"text": "주인이 가까이 다가와 인사한다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "target": "i/tavern_personal", "when": {"op": "gte", "state": "quest.lore_stage", "value": 3}}, {"branch_kind": "navigation", "consequence": [{"text": "선택한 경험만 상태와 다음 장면에 남긴다."}], "effects": [], "id": "i/tavern_menu", "label": [{"text": "주인이 음료를
