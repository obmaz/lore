작. NPC 증언은 방문한 경로에서만 경험하며 세계 진상·후속 영입을 자동 확정하지 않는다.", "source_refs": [], "status": "draft"}, "entry_when": true, "handoff": null, "id": "i/armory_after", "kind": "scene", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "title": [{"text": "무기고를 나서며"}]}, {"blocks": [{"id": "i/tavern_story_departure", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "의자를 밀어 넣었다.\n\n이번에는 바닥을 긁지 않도록 들었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 주인에게 고개를 숙였다. 천을 쥔 손이 잠깐 들렸다. 앉을 때보다 나갈 때 인사가 쉬웠다."}], "when": true}, {"id": "i/tavern_story_departure_end", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "문을 열자 바깥 소리가 먼저 들어왔다.\n\n그는 문턱을 넘고 다시 닫았다. 안쪽의 웃음이 알아들을 수 없는 소리가 됐다. 못 들은 이야기들도 그 안에 남았다.\n\n지금 떠나는 길에서 모든 목소리를 챙길 수는 없었다. 그는 일행 쪽으로 걸었다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험만 상태와 다음 장면에 남긴다."}], "effects": [], "id": "i/tavern_depart_finish", "label": [{"text": "앞으로 이어지는 길로 나선다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다. 추가: 탐방 뒤 같은 갈림길로 돌아가지 않고 본줄기로 합류한다.", "origin": "authored", "source_refs": []}, "target": "i/threshold", "when": true}], "editorial": {"intent": "대화를 택하지 않은 행동도 떠나는 장면으로 보여 준 뒤 다음 지역/출발 경계에 합류한다.", "notes": "추가 장면은 authored/proposed. 주점 공간·주인의 손놀림·익명 손님 반응·주인공 심리/응답은 창작이며 고정 인물 설정이 아니다. 음료 구매/섭취·금화/장비/동료 변화와 새 세계 진상은 없다. 입장과 인사는 자동 진행, 마지막 행동만 선택. 원작 두 인사의 노출은 기존 방문 횟수로 구별하는 집필용 각색이며 원작의 난수 규칙이 아니다.", "source_refs": [], "status": "draft"}, "entry_when": true, "handoff": null, "id": "i/tavern_departure", "kind": "scene", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "title": [{"text": "문밖의 소리"}]}, {"blocks": [{"id": "lastditch_pyramid/arrival_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성벽이 보이지 않았다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 길이 굽는 곳에서 멈췄다. 조금 전까지 어깨 너머에 남아 있던 성은 낮은 돌과 먼지 뒤로 사라져 있었다. 돌아갈 곳을 보며 걸을 수 있는 구간은 끝났다.\n\n뒤의 발소리가 가까워졌다. 그는 고개를 돌렸다.\n\n“간격을 조금 줄이죠.”\n\n앞장서던 사람이 멈췄다. 뒤쪽에서는 짐을 고쳐 메는 소리가 났다. 기다린 시간은 길지 않았다. 그래도 혼자 먼저 걸었다면 누군가 따라오느라 뛰어야 했을 것이다.\n\n첫 동굴에서 배운 것은 그 정도였다. 모르는 길에서 앞에 섰다고 더 빨리 갈 필요는 없었다.\n\n다시 걸었다. 이번 방향은 동쪽이었다. 중심부까지 확인하라는 부탁은 끝났고, 사람들의 근심을 도우라는 부탁이 남았다.\n\n무엇을 도우라는 걸까.\n\n그는 걸으면서 가능한 일을 몇 가지 떠올렸다. 잃어버린 것을 찾는 일. 막힌 길을 치우는 일. 어느 쪽도 아직 들은 이야기는 아니었다. 목적지는 알았지만 그곳에서 무엇을 만나게 될지는 몰랐다.\n\n발 앞의 돌이 굴렀다. 그는 생각을 멈추고 옆으로 피했다. 뒤에 오는 사람에게 손을 들어 보였다. 그 사람이 같은 곳을 밟지 않고 지나간 뒤 다시 걸었다.\n\n답은 성에 가면 들을 수 있었다. 그 전에 다치고 싶지는 않았다.\n\n문이 보인 것은 그 뒤였다. 높은 벽 사이에서 사람들이 오갔다. 안으로 짐을 들이는 사람과 바깥으로 나오는 사람이 한곳에서 잠깐 멈췄다. 서로 몸을 돌리자 좁던 틈이 다시 열렸다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그쪽으로 달려가지 않았다. 걷는 속도를 유지한 채 문 옆으로 붙었다. 일행이 한꺼번에 들어가면 나오는 길을 막을 것 같았다.\n\n“먼저 지나가세요.”\n\n짐을 든 사람이 고개를 숙였다. 그는 기다렸다가 문 쪽으로 움직였다. 낯선 성에 들어가는 것이 두 번째라고 모든 것이 익숙해지지는 않았다. 그래도 이번에는 어디서 멈춰야 사람들과 부딪치지 않는지 조금 먼저 볼 수 있었다.\n\n입구에 글이 있었다. 그는 읽기 전에 뒤를 확인했다. 마지막 사람이 가까워지고 있었다. 혼자 읽고 돌아서면 같은 말을 다시 설명해야 했다.\n\n잠깐 기다렸다. 일행이 곁에 섰다.\n\n이름부터 함께 읽었다."}], "when": true}, {"id": "lastditch_pyramid/arrival_sign", "kind": "source_quote", "literal_ids": ["LOREENT.PAS:literal:15559", "LOREENT.PAS:literal:15575", "LOREENT.PAS:literal:15587"], "provenance": {"note": "원문 발생 순서·공백·표현은 불변이다. 이름 위치만 참조로 표시하고 동적 이름은 별도 표시 삽입을 사용한다.", "origin": "source_exact", "source_refs": ["lastditch_pyramid/town_entry"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LOREENT.PAS:literal:15559"]}}, {"source": {"bindings": [{"end": 9, "ref": {"catalog": "terms", "id": "lastditch"}, "start": 0}], "literal_ids": ["LOREENT.PAS:literal:15575"]}}, {"source": {"bindings": [], "literal_ids": ["LOREENT.PAS:literal:15587"]}}], "when": true}, {"id": "lastditch_pyramid/arrival_welcome", "kind": "source_quote", "literal_ids": ["LOREENT.PAS:literal:15624"], "provenance": {"note": "원문 발생 순서·공백·표현은 불변이다. 이름 위치만 참조로 표시하고 동적 이름은 별도 표시 삽입을 사용한다.", "origin": "source_exact", "source_refs": ["lastditch_pyramid/town_entry"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LOREENT.PAS:literal:15624"]}}], "when": true}, {"id": "lastditch_pyramid/meet_lord", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:15535"], "provenance": {"note": "원문 발생 순서·공백·표현은 불변이다. 이름 위치만 참조로 표시하고 동적 이름은 별도 표시 삽입을 사용한다.", "origin": "source_exact", "source_refs": ["lastditch_pyramid/lastditch_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:15535"]}}], "when": true}, {"id": "lastditch_pyramid/party_1_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "이/가"}}, {"text": " 문 앞에서 몸을 돌렸다.\n\n뒤의 사람이 다 들어온 것을 확인하고 옆으로 비켰다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그가 내준 자리를 따라 움직였다. 넓은 문에서도 서두르면 서로 걸릴 수 있었다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_woodcutter"}}, {"id": "lastditch_pyramid/party_1_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_hunter", "particle": "이/가"}}, {"text": " 사람들이 오가는 틈을 가리켰다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그쪽을 봤다. 짐을 나르는 사람이 지나간 뒤 빈 공간이 생겼다. 일행이 한쪽으로 붙어 들어갔다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_hunter"}}, {"id": "lastditch_pyramid/party_1_party_cook", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_cook", "particle": "이/가"}}, {"text": " 짐의 끈을 당겼다.\n\n문가의 물건에 걸리지 않도록 늘어진 곳을 안으로 넣었다. "}, {"ref": {"catalog": "characters", "id": "protagonist"}}, {"text": "도 자기 옷자락을 확인하고 길을 비웠다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_cook"}}, {"id": "lastditch_pyramid/party_1_party_magician", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_magician", "particle": "이/가"}}, {"text": " 높은 문보다 안쪽 복도를 봤다.\n\n앞에서 멈춘 사람이 다시 움직이자 같은 쪽으로 몸을 돌렸다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 눈길을 따라 일행이 설 자리를 찾았다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_magician"}}, {"id": "lastditch_pyramid/arrival_audience", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "환영의 말을 듣자 굳어 있던 어깨가 조금 풀렸다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 문 안에서 길을 물었다. 상대는 일행을 훑어보더니 성주를 만나 보라고 했다. 어디서 왔는지 길게 설명할 틈도 없었다.\n\n그가 가리킨 쪽으로 몸을 돌렸다.\n\n“저희를 기다리고 있습니까?”\n\n더 묻고 싶었지만 상대는 이미 다른 사람에게 길을 내주고 있었다. 성주에게 가면 알 수 있을 것이다. 그는 인사를 하고 발을 옮겼다.\n\n뒤에서 작은 목소리가 났다.\n\n“이번에는 길을 덜 잃겠네요.”\n\n웃으려던 순간 앞에서 사람이 나왔다. 그가 옆으로 비켰다. 상대도 같은 쪽으로 피했다. 둘이 다시 멈췄다.\n\n“제가 이쪽으로 가겠습니다.”\n\n말하고 나니 길이 풀렸다. 그는 짧게 웃었다. 목적지를 아는 것과 거기까지 제대로 지나가는 것은 다른 문제였다.\n\n접견실 앞에서는 속도를 낮췄다. 처음 성주를 만났을 때 서 있던 거리를 떠올렸지만 그대로 따라 서지는 않았다. 방의 폭도, 안쪽의 사람도 달랐다.\n\n먼저 인사했다. 일행이 뒤에서 멈추는 동안 입을 열 준비를 했다. 어느 성에서 왔고 어떤 부탁을 받았는지부터 설명할 생각이었다.\n\n성주가 먼저 일행을 봤다.\n\n그는 준비했던 첫마디를 삼켰다. 상대가 기다리는 것은 길을 묻는 여행객의 인사가 아닌 것 같았다. 몸 옆에 놓은 손을 조금 폈다.\n\n성주가 입을 열었다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [], "id": "lastditch_pyramid/continue_arrival", "label": [{"text": "다음 장면으로 이어간다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "target": "lastditch_pyramid/request", "when": true}], "editorial": {"intent": "2장 1의 목적·수행·결과를 실제 장면으로 펼친다.", "notes": "적용 문체 style.revision=1. 인물·장비는 참조 ID로 쓰고 실제 합류·장착·경험만 후속 본문에 반영한다. 미승인 산문이며 원작의 모든 전투 경로를 자동 승리로 주장하지 않는다.", "source_refs": ["lastditch_pyramid/lastditch_dialogue", "lastditch_pyramid/town_entry", "lastditch_pyramid/pyramid_entry", "lastditch_pyramid/pyramid", "lastditch_pyramid/gate"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lastditch_stage", "value": 0}, "handoff": null, "id": "lastditch_pyramid/arrival", "kind": "scene", "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는 또렷했다.\n\n뒤에서 짐이 움직였다. 일행 가운데 한 사람이 끈을 당겨 고쳐 맸다. 출발할 준비를 하는 작은 움직임이었다.\n\n그는 돌아봤다. 이 이야기를 들은 사람은 자신 혼자가 아니었다. 대답하면 모두 북쪽으로 갈 것이다. 지금 자신 있는 얼굴을 하는 것이 그들을 안전하게 만들어 주지는 않았다.\n\n“잠깐만요.”\n\n한마디를 하고 성주를 다시 봤다. 되물어야 할 것을 찾았다. 동굴의 방향은 들었다. 상대의 이름도 들었다. 무엇을 해야 하는지까지 분명했다.\n\n남은 것은 하겠다는 대답이었다.\n\n지난번에는 돌아오겠다고 말했다. 그 약속을 지키고 나자 다음 부탁이 왔다. 한 번 돌아왔다는 사실이 이번 싸움의 답이 되어 주지는 않았다.\n\n그래도 들은 일을 다른 일처럼 줄여 말할 수는 없었다. 가서 살펴보기만 하겠다고 대답하면 성주가 맡긴 것과 다른 일을 하게 된다.\n\n그는 손을 놓았다.\n\n“가 보겠습니다. 돌아오면 그곳에서 한 일을 말씀드리겠습니다.”\n\n말은 크지 않았다. 방 안에서 자기 목소리가 잦아드는 것을 기다렸다. 더 멋진 약속을 보태고 싶었지만 입을 다물었다. 해야 할 일의 크기는 목소리를 높여도 줄지 않았다.\n\n성주는 도움에 대한 대가를 약속했다. 지금 받는 물건은 없었다. 그는 무엇을 받게 되는지 다시 묻지 않았다. 아직 이 방에서 대답 하나를 했을 뿐이었다.\n\n접견을 마치고 돌아섰다. 문 앞에서 일행이 모이려 하자 반걸음 비켰다. 들어올 때는 성주와의 거리를 재고 있었다. 나갈 때는 같이 움직일 사람들의 간격이 먼저 보였다.\n\n복도의 소리가 가까워졌다. 누군가 북쪽으로 바로 길을 잡으려 했다. 그가 짧게 불렀다.\n\n“성 안에서 조금 더 듣고 갑시다.”\n\n상대의 이름과 동굴의 위치는 알았다. 그 때문에 고통받는 사람들의 얼굴은 아직 제대로 보지 못했다. 같은 곳에 가더라도 왜 돌아와야 하는지 들을 수 있을 것 같았다.\n\n서두르지 말자는 뜻으로 손을 내렸다. 일행이 멈췄다.\n\n그는 말을 걸 수 있는 사람을 찾았다."}], "when": true}], "choices": [{"branch_kind": "quest", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [{"op": "set", "provenance": {"note": "원작의 조건/상태를 독립 집필 상태로 표현한다. 게임 코드나 저장 값을 실행하지 않는다.", "origin": "source_adaptation", "source_refs": ["lastditch_pyramid/lastditch_dialogue"]}, "state": "quest.lastditch_stage", "value": 1}], "id": "lastditch_pyramid/continue_request", "label": [{"text": "다음 장면으로 이어간다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "target": "lastditch_pyramid/town", "when": true}], "editorial": {"intent": "2장 1의 목적·수행·결과를 실제 장면으로 펼친다.", "notes": "적용 문체 style.revision=1. 인물·장비는 참조 ID로 쓰고 실제 합류·장착·경험만 후속 본문에 반영한다. 미승인 산문이며 원작의 모든 전투 경로를 자동 승리로 주장하지 않는다.", "source_refs": ["lastditch_pyramid/lastditch_dialogue", "lastditch_pyramid/town_entry", "lastditch_pyramid/pyramid_entry", "lastditch_pyramid/pyramid", "lastditch_pyramid/gate"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lastditch_stage", "value": 0}, "handoff": null, "id": "lastditch_pyramid/request", "kind": "scene", "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "title": [{"text": "도착을 기다리던 성 · 의뢰"}]}, {"blocks": [{"id": "lastditch_pyramid/town_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "거리로 나오자 말소리가 갈라졌다.\n\n접견실에서는 한 사람의 말이 끝나기를 기다리면 됐다. 여기서는 손짓을 보다가 다른 목소리가 끼어들었다. 누군가는 하던 일을 멈추지 않고 대답했다. 누군가는 지나갈 길부터 비켜 달라고 했다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 벽 가까이 물러섰다. 일행도 그 곁으로 붙었다. 길 한가운데 모여 있으면 대답을 듣는 동안 다른 사람들을 붙들게 됐다.\n\n그가 북쪽 동굴로 간다고 말하자 상대의 손이 잠깐 멎었다.\n\n같은 이름을 들어도 반응은 달랐다. 성주는 해야 할 일을 설명했다. 여기서는 그 일이 자기 하루에 얼마나 가까이 있는지부터 말하는 것 같았다.\n\n그는 질문을 짧게 나눴다. 찾아갈 방향을 물었다. 안에 들어간 사람이 있었는지 물었다. 한 사람이 답하지 못하는 말은 곁에 있는 다른 사람에게 들었다.\n\n모든 설명을 한꺼번에 외우려고 하자 정작 손짓한 방향을 놓칠 뻔했다. 그는 다시 앞을 봤다. 사람의 말끝과 손이 가리킨 곳을 함께 기억해야 했다.\n\n일행 가운데 누군가 조금 늦게 가까워졌다. 그가 자리를 비워 줬다. 모두 들은 것처럼 곧바로 걷기 시작하지 않았다. 상대가 이어 하는 말을 함께 들을 수 있도록 잠깐 기다렸다.\n\n들리는 이름 가운데는 다른 성도 있었다. 지금 가야 할 동굴과 먼 곳으로 이어지는 길이 같은 목소리에서 나왔다. 그는 그 둘을 나눠 물었다. 오늘 북쪽으로 가는 목적을 잃고 싶지는 않았다.\n\n손에 든 짐을 고쳐 잡았다. 이곳에서 들은 물건의 소문이 아직 자기 장비가 되는 것은 아니었다. 길을 묻는 동안에도 지금 가진 것은 몸 옆에 있었다.\n\n옆에서 무언가 부딪치는 소리가 났다. 그는 고개를 돌렸다. 일행이 서로의 짐을 피해 서고 있었다. 앞에서 설명을 듣는 동안 뒤의 간격이 줄어든 모양이었다.\n\n“조금만 비켜 주세요. 다 같이 듣겠습니다.”\n\n다시 자리를 맞췄다. 말을 건네던 사람도 일행을 봤다. 그는 대답을 기다렸다. 같은 장소에 들어갈 사람들에게 필요한 말이었다."}], "when": true}, {"id": "lastditch_pyramid/town_386", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:14722"], "provenance": {"note": "원문 발생 순서·공백·표현은 불변이다. 이름 위치만 참조로 표시하고 동적 이름은 별도 표시 삽입을 사용한다.", "origin": "source_exact 선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌아오지 않은 특공대를 물었다.\n\n상대가 바로 대답하지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 소음 때문에 못 들은 줄 알았다. 다시 말하려고 입을 열었을 때 상대가 고개를 들었다.\n\n그 표정을 보고 질문을 반복하지 않았다.\n\n성주의 방에서는 소식이 끊긴 사람들의 이야기였다. 기다리는 사람의 얼굴은 그 설명 안에 보이지 않았다. 지금 눈앞의 사람은 같은 이름을 듣고 하던 일을 멈췄다.\n\n그는 성급하게 다른 질문으로 넘어가지 않았다. 상대의 손이 움직이는 것을 보다가 얼굴로 시선을 올렸다. 듣고 있다는 것을 보여야 했다. 무슨 말을 준비하는지까지 먼저 정할 수는 없었다.\n\n상대가 자신과 지휘관의 관계를 밝혔다."}], "when": true}, {"id": "lastditch_pyramid/family_account", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:15111"], "provenance": {"note": "원문 발생 순서·공백·표현은 불변이다. 이름 위치만 참조로 표시하고 동적 이름은 별도 표시 삽입을 사용한다.", "origin": "source_exact", "source_refs": ["lastditch_pyramid/lastditch_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [{"end": 4, "ref": {"catalog": "terms", "id": "lore"}, "start": 0}, {"end": 35, "ref": {"catalog": "characters", "id": "lore_hunter"}, "start": 24}], "literal_ids": ["LORETALK.PAS:literal:15111"]}}], "when": true}, {"id": "lastditch_pyramid/hunter_reputation", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:15370"], "provenance": {"note": "원문 발생 순서·공백·표현은 불변이다. 이름 위치만 참조로 표시하고 동적 이름은 별도 표시 삽입을 사용한다.", "origin": "source_exact", "source_refs": ["lastditch_pyramid/lastditch_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [{"end": 4, "ref": {"catalog": "terms", "id": "lore"}, "start": 0}], "literal_ids": ["LORETALK.PAS:literal:15370"]}}], "when": true}, {"id": "lastditch_pyramid/family_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "lore_hunter"}}, {"text": ".\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 이름을 천천히 되풀이했다. 상대가 고개를 움직였다. 잘못 부르지 않았다는 확인을 받은 것처럼 느껴졌다.\n\n“그분의 소식을 듣고 오셨습니까?”\n\n대답이 목에 걸렸다.\n\n성주를 만나러 왔다는 말은 할 수 있었다. 북쪽 동굴의 일을 맡았다는 말도 할 수 있었다. 이 사람이 물은 것은 그 어느 쪽도 아니었다.\n\n그는 고개를 저었다.\n\n“소식을 가지고 온 것은 아닙니다.”\n\n말이 끝나자 거리가 더 멀어진 것 같았다. 상대는 그를 계속 보고 있었다. 그는 앞선 성에서 소식이 끊겼다는 설명을 들었다고 덧붙였다. 이곳에서 이름을 제대로 알게 됐다는 말도 했다.\n\n모르는 것을 감추려고 다른 이야기를 길게 하면 더 기대하게 만들 수 있었다. 그는 대답을 멈췄다.\n\n지휘관이 능력 있는 사람이었다는 말이 떠올랐다. 그런 사람이라면 반드시 돌아올 것이라고 말하고 싶었다. 자신도 한 번 동굴에 다녀왔다. 돌아와서 다녀왔다는 말을 하는 일이 사람을 얼마나 안심시키는지 조금 알았다.\n\n하지만 그는 지휘관이 간 길을 모른다.\n\n마지막으로 본 사람도 아니다.\n\n그 이름을 제대로 기억한 것만으로 기다림의 끝을 약속할 수는 없었다. 대신 자기가 할 수 있는 작은 말을 골랐다.\n\n“이름은 잊지 않겠습니다.”\n\n그 말 뒤에 큰 약속을 붙이지 않았다. 상대가 더 물으면 들은 범위에서 답할 생각이었다. 그러나 질문은 이어지지 않았다. 이야기는 지금 성을 위협하는 일로 돌아갔다.\n\n그는 북쪽을 봤다. 자신들에게 맡겨진 상대는 그곳에 있었다. 이 사람의 이야기를 들었다고 목적지가 다른 곳으로 바뀌는 것은 아니었다. 한 가지 일을 끝내도 다른 기다림까지 끝낼 수 없다는 사실이 걸렸다.\n\n곁에서 일행이 움직였다. 그는 돌아설 준비를 했다. 처음에는 길 하나를 물으면 될 줄 알았다. 떠나기 전 인사를 하려니 들은 이름이 다시 생각났다.\n\n상대가 고개를 들었다. 그가 한 번 더 인사했다.\n\n이제 북쪽으로 갈 때 그 성에는 부탁을 맡긴 사람만 남아 있지 않을 것이다. 아직 대답을 받지 못한 사람도 남아 있었다."}], "when": true}, {"id": "lastditch_pyramid/party_2_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "이/가"}}, {"text": " 기다렸다.\n\n상대가 말을 끝내기 전에 다음 길을 가리키지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 덕분에 서두르지 않고 인사할 수 있었다. 자리를 옮길 때에야 일행이 움직였다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_woodcutter"}}, {"id": "lastditch_pyramid/party_2_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_hunter", "particle": "이/가"}}, {"text": " 들은 이름을 다시 확인했다.\n\n같은 일을 한다는 이유만으로 모르는 사람의 행방을 짐작하지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 이름을 고쳐 말할 일이 없는지 상대의 대답을 기다렸다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_hunter"}}, {"id": "lastditch_pyramid/party_2_party_cook", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_cook", "particle": "이/가"}}, {"text": " 가까운 짐을 옮겼다.\n\n대답을 기다리는 사람의 앞을 가리지 않도록 한 발 비켰다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 상대의 얼굴을 다시 볼 수 있었다. 이야기를 듣는 자리도 함께 만들고 있었다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_cook"}}, {"id": "lastditch_pyramid/party_2_party_magician", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_magician", "particle": "이/가"}}, {"text": " 일행 쪽으로 시선을 돌렸다.\n\n누군가 위로를 보태려다가 멈췄다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 지금 들은 말이 끊기지 않도록 기다렸다. 할 수 없는 약속은 아무도 먼저 꺼내지 않았다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_magician"}}], "choices": [{"branch_kind": "knowledge", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [{"op": "set", "provenance": {"note": "원작의 조건/상태를 독립 집필 상태로 표현한다. 게임 코드나 저장 값을 실행하지 않는다.", "origin": "sour 에 섰다.\n\n발소리가 하나 늘었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 북쪽을 가리켰다.\n\n“안쪽의 길은 저희도 모릅니다.”\n\n"}, {"ref": {"catalog": "characters", "id": "polaris", "particle": "은/는"}}, {"text": " 같은 상대를 물리치고 싶다는 뜻을 다시 밝혔다. 길을 다 안다는 대답은 아니었다. 그가 고개를 끄덕였다.\n\n함께할 목적은 같았다. 그 앞의 길은 같이 확인해야 했다.\n\n움직이기 전에 이름을 다시 불렀다. 대답이 왔다. 일행 가운데 누군가는 옆으로 비켰고 누군가는 짐을 당겼다. 새로운 사람이 들어왔다고 걷던 순서가 저절로 맞지는 않았다.\n\n"}, {"ref": {"catalog": "equipment", "id": "weapon_4"}}, {"text": "의 손잡이를 잡은 손이 보였다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 손을 따라 장비가 놓인 쪽을 확인했다. 좁은 곳에서는 그 길이를 피할 자리가 필요할 것이다.\n\n“제가 멈추면 뒤에서도 조금 떨어져서 기다려 주세요.”\n\n먼저 동굴에서 맞췄던 간격을 설명했다. 처음부터 아는 사이인 것처럼 생략하지 않았다. 새 동료가 고개를 끄덕였다.\n\n일행이 다시 걸었다. 처음 몇 발 동안 그는 뒤를 더 자주 봤다. 새로운 발소리가 어디에서 나는지 알아 두기 위해서였다.\n\n누군가가 속도를 낮췄다. 뒤에 선 사람이 가까워졌다. 인사를 나눈 일은 끝났고 실제로 함께 가는 일이 시작됐다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [], "id": "lastditch_pyramid/continue_polaris_joined", "label": [{"text": "다음 장면으로 이어간다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "target": "lastditch_pyramid/road", "when": true}], "editorial": {"intent": "2장 2의 목적·수행·결과를 실제 장면으로 펼친다.", "notes": "적용 문체 style.revision=1. 인물·장비는 참조 ID로 쓰고 실제 합류·장착·경험만 후속 본문에 반영한다. 미승인 산문이며 원작의 모든 전투 경로를 자동 승리로 주장하지 않는다.", "source_refs": ["lastditch_pyramid/lastditch_dialogue", "lastditch_pyramid/town_entry", "lastditch_pyramid/pyramid_entry", "lastditch_pyramid/pyramid", "lastditch_pyramid/gate"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lastditch_stage", "value": 1}, "handoff": null, "id": "lastditch_pyramid/polaris_joined", "kind": "scene", "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "title": [{"text": "합류한 사람의 걸음"}]}, {"blocks": [{"id": "lastditch_pyramid/declined_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "“이번에는 지금의 일행으로 가겠습니다.”\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 말을 끝내고 상대를 봤다. 너무 차갑게 들렸을까 싶었다. 그렇다고 좋은 말을 보태며 대답을 흐릴 수는 없었다.\n\n“같이 싸우고 싶다는 말씀은 들었습니다.”\n\n그가 고개를 숙였다. 동행하겠다는 말은 하지 않았다. 목적이 같아도 지금 함께 있는 사람들의 걸음을 바꾸고 싶지는 않았다.\n\n"}, {"ref": {"catalog": "characters", "id": "polaris", "particle": "은/는"}}, {"text": " 더 가까이 오지 않았다. 길을 내줬다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 옆을 지나며 인사했다.\n\n뒤의 발소리를 확인했다. 방금보다 늘지 않았다. 앞에서 걸음을 멈춘 사람이 그를 기다렸다.\n\n그는 현재 일행에게 가까이 갔다. 거절한 사람이 그 뒤 어디로 가는지까지 지켜보지는 않았다. 그 사람의 길을 대신 정한 것은 아니었다.\n\n북쪽으로 몸을 돌렸다. 지금 같이 걸을 사람들에게 출발하자고 말했다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [], "id": "lastditch_pyramid/continue_polaris_declined", "label": [{"text": "다음 장면으로 이어간다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "target": "lastditch_pyramid/road", "when": true}], "editorial": {"intent": "2장 2의 목적·수행·결과를 실제 장면으로 펼친다.", "notes": "적용 문체 style.revision=1. 인물·장비는 참조 ID로 쓰고 실제 합류·장착·경험만 후속 본문에 반영한다. 미승인 산문이며 원작의 모든 전투 경로를 자동 승리로 주장하지 않는다.", "source_refs": ["lastditch_pyramid/lastditch_dialogue", "lastditch_pyramid/town_entry", "lastditch_pyramid/pyramid_entry", "lastditch_pyramid/pyramid", "lastditch_pyramid/gate"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lastditch_stage", "value": 1}, "handoff": null, "id": "lastditch_pyramid/polaris_declined", "kind": "scene", "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "title": [{"text": "지금 함께 걷는 사람들"}]}, {"blocks": [{"id": "lastditch_pyramid/road_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": ["lastditch_pyramid/pyramid_entry"]}, "speaker": null, "text": [{"text": "문을 넘자 일행의 걸음이 빨라졌다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 뒤를 봤다. 성 안에서 여러 번 멈췄던 탓인지 나오는 순간부터 속도를 내고 있었다. 뒤쪽의 짐이 한 번 부딪쳤다.\n\n“조금 벌려서 갑시다.”\n\n앞사람이 간격을 내줬다. 소리가 줄었다. 그는 그제야 북쪽의 길을 봤다.\n\n입구를 찾으면 되는 것은 아니었다. 이번에는 안쪽에서 싸워야 했다. 주민에게 들은 두 마리라는 수를 떠올렸다. 가운데 상대만 보다가 양쪽을 놓칠 수 있었다.\n\n그는 곁의 사람에게 안으로 들어가면 서로 보는 방향을 나누자고 말했다. 상대가 고개를 끄덕였다. 어디에 설지는 도착한 뒤 확인해야 했다. 길도 모른 채 전부 정할 수는 없었다.\n\n발이 낮은 돌에 걸렸다. 무게를 싣기 전에 멈췄다. 바로 앞의 사람은 이미 그 돌을 넘은 뒤였다. 뒤에서 오는 사람에게 자리를 보여 주고 옆으로 비켰다.\n\n한 사람의 걸음이 안전했다고 뒤의 걸음까지 안전한 것은 아니었다. 앞에서는 돌이 보였고 뒤에서는 앞사람의 몸에 가렸다.\n\n그가 돌을 넘은 뒤 잠깐 기다렸다. 일행이 다시 가까워졌다. 이름을 부르면 같은 높이에서 대답이 돌아왔다.\n\n길 위에서는 성에서 들은 이야기가 번갈아 떠올랐다. 북쪽의 상대. 돌아오지 않은 지휘관. 두 이름을 모두 기억하고 있었지만 이번에 찾아갈 사람은 분명했다.\n\n한쪽을 끝냈다고 다른 사람의 소식까지 알게 되지는 않을 것이다. 그 생각은 걸음을 늦추기보다 말을 조심하게 했다. 곁의 사람에게 동굴의 일을 다시 확인할 때에도 들은 것만 말했다.\n\n바닥의 색이 달라졌다. 흙 위에 놓였던 돌이 안쪽에서는 넓게 이어졌다. 멀리 보던 입구가 어느새 가까웠다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 손을 들었다. 앞의 사람이 멈추고 뒤의 발도 멎었다.\n\n아직 공격은 보이지 않았다. 그럼에도 이 문 안에서부터 적이 있다는 생각으로 발을 놓아야 했다.\n\n그는 먼저 짐이 벽에 닿지 않을 간격을 봤다. 같이 넘어갈 수 있는 폭을 찾은 뒤 안쪽을 가리켰다.\n\n가까운 사람이 어디까지 들어가서 멈출지 물었다. 그는 벽이 좁아지는 자리를 가리켰다. 그 너머는 입구에서 한꺼번에 볼 수 없었다.\n\n“저기에서 다시 보겠습니다.”\n\n대답을 들은 사람이 앞을 봤다. 일행이 움직였다. 먼저 지나간 어깨가 길을 가리자 그는 반걸음 기다렸다. 안쪽에 적이 있다는 생각으로 서두르던 발이 지금 보이는 바닥의 속도에 맞춰졌다."}], "when": true}, {"id": "lastditch_pyramid/party_3_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "이/가"}}, {"text": " 낮은 돌을 먼저 넘고 기다렸다.\n\n뒤의 사람에게 같은 자리를 보여 줬다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 먼저 통과한 사람이 서두르지 않는 것을 보고 속도를 맞췄다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_woodcutter"}}, {"id": "lastditch_pyramid/party_3_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_hunter", "particle": "이/가"}}, {"text": " 바닥의 좁아진 곳을 가리켰다.\n\n멀리 보이는 입구보다 지금 통과할 폭을 먼저 확인했다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 옆으로 비켜 다음 사람이 손을 내밀 자리를 남겼다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_hunter"}}, {"id": "lastditch_pyramid/party_3_party_cook", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_cook", "particle": "이/가"}}, {"text": " 잠깐 멈췄다.\n\n뒤의 짐이 닿는 소리를 듣고 몸을 돌렸다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 간격을 늘린 뒤 다시 걸었다. 가까운 소리 하나가 길의 속도를 고쳐 줬다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_cook"}}, {"id": "lastditch_pyramid/party_3_party_magician", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_magician", "particle": "이/가"}}, {"text": " 안쪽의 소리를 기다렸다.\n\n일행의 발이 멎자 남은 울림이 줄었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 틈에 앞을 봤다. 먼저 내는 소리가 줄어야 아직 보지 못한 곳을 살필 수 있었다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_magician"}}, {"id": "lastditch_pyramid/extra_3", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말을 멈추자 작은 소리가 남았다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 앞을 봤다. 방금 자신들이 낸 발소리가 돌아오는 것인지, 다른 곳에서 새로 움직이는 것인지 기다렸다. 울림이 잦아든 뒤에도 성 안의 소음 같은 것은 없었다.\n\n가까운 사람이 좁은 자리를 가리켰다. 그는 몸을 조금 낮춰 폭을 확인했다. 한 사람이 지나가는 것과 일행이 한꺼번에 움직이는 것은 달랐다.\n\n먼저 넘어간 사람이 자리를 내줬다. 다음 사람이 발을 놓았다. 다시 돌아보며 뒤쪽에 손짓했다.\n\n“여기로요.”\n\n그 말이 긴 설명을 대신했다. 무기를 들지 않은 손으로 방향을 가리키고, 지나온 자리를 다시 비웠다. 입구 앞에서 서로 밀리지 않는 작은 순서가 생겼다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 마지막 사람이 통과한 것을 확인했다. 멈추는 순서를 만들었으니 이제 안쪽에서 다시 움직일 수 있었다."}], "when": true}, {"id": "lastditch_pyramid/polaris_present_3", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "polaris", "particle": "이/가"}}, {"text": " 멈췄다.\n\n새로 온 사람이라고 앞을 대신 알지는 못했다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "이/가"}}, {"text": " 좁은 곳을 가리키자 자기 위치를 알려 주고 곁의 짐을 피했다. 같은 쪽으로 다시 움직였다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "polaris"}}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [], "id": "lastditch_pyramid/continue_road", "label": [{"text": "다음 장면으로 이어간다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "target": "lastditch_pyramid/entrance", "when": true}], "editorial": {"intent": "2장 3의 목적·수행·결과를 실제 장면으로 펼친다.", "notes": "적용 문체 style.revision=1. 인물·장비는 참조 ID로 쓰고 실제 합류·장착·경험만 후속 본문에 반영한다. 미승인 산문이며 원작의 모든 전투 경로를 자동 승리로 주장하지 않는다.", "source_refs": ["lastditch_pyramid/lastditch_dialogue", "lastditch_pyramid/town_entry", "lastditch_pyramid/pyramid_entry", "lastditch_pyramid/pyramid", "lastditch_pyramid/gate"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lastditch_stage", "value": 1}, "handoff": null, "id": "lastditch_pyramid/road", "kind": "scene", "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "title": [{"text": "북쪽으로 향하는 이유 · 길"}]}, {"blocks": [{"id": "lastditch_pyramid/pyramid_sign", "kind": "source_quote", "literal_ids": ["LOREENT.PAS:literal:15713"], "provenance": {"note": "원문 발생 순서·공백·표현은 불변이다. 이름 위치만 참조로 표시하고 동적 이름은 별도 표시 삽입을 사용한다.", "origin": "source_exact", "source_refs": ["lastditch_pyramid/town_entry"]}, "speaker": null, "text": [{"source": {"bindings": [{"end": 18, "ref": {"catalog": "terms", "id": "pyramid"}, "start": 11}], "literal_ids": ["LOREENT.PAS:literal:15713"]}}], "when": true}, {"id": "lastditch_pyramid/entrance_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "입구에 적힌 이름은 들은 것과 같았다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 안쪽으로 첫발을 놓았다. 흙이 얇게 밀리며 단단한 바닥이 드러났다. 발을 빼려다가 움직이지 않는 것을 보고 다음 걸음을 골랐다.\n\n들어온 빛이 뒤의 사람들 사이로 잘렸다. 누군가를 확인할 때마다 밝은 틈이 생겼다가 사라졌다. 마지막 사람이 들어온 뒤에는 빛이 낮은 바닥에만 남았다.\n\n그가 손을 짚을 벽을 찾았다. 멀리 뻗지는 않았다. 가까운 면을 확인하고, 짐이 닿기 전에 몸을 돌렸다.\n\n이번에는 길을 잘못 들지 않았다는 안도감이 오래가지 않았다. 올바른 입구를 찾았으니 이제 그 안의 상대를 만나게 될 것이다.\n\n조금 더 걸었을 때 긴 그림자가 보였다.\n\n처음에는 돌의 한쪽이 어두운 줄 알았다. 가까이 보니 손잡이가 있었다. 끝부분이 돌에서 떨어져 있었다. 그는 그 앞에서 멈췄다.\n\n성에서 들은 창 이야기가 떠올랐다. 지금 본 것이 그 물건인지는 아직 확인하지 못했다.\n\n그는 잡아당기지 않았다. 기대어 있는 곳과 바닥을 먼저 봤다. 들어 올리는 동안 옆사람의 몸에 닿을 길이였다. 일행에게 한쪽으로 비켜 달라고 말했다.\n\n몸을 낮추자 손잡이에 글이 보였다. 손을 대려다가 먼저 읽었다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [], "id": "lastditch_pyramid/continue_entrance", "label": [{"text": "다음 장면으로 이어간다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "target": "lastditch_pyramid/spear", "when": true}], "editorial": {"intent": "2장 3의 목적·수행·결과를 실제 장면으로 펼친다.", "notes": "적용 문체 style.revision=1. 인물·장비는 참조 ID로 쓰고 실제 합류·장착·경험만 후속 본문에 반영한다. 미승인 산문이며 원작의 모든 전투 경로를 자동 승리로 주장하지 않는다.", "source_refs": ["lastditch_pyramid/lastditch_dialogue", "lastditch_pyramid/town_entry", "lastditch_pyramid/pyramid_entry", "lastditch_pyramid/pyramid", "lastditch_pyramid/gate"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lastditch_stage", "value": 1}, "handoff": null, "id": "lastditch_pyramid/entrance", "kind": "scene", "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "title": [{"text": "북쪽으로 향하는 이유 · 입구"}]}, {"blocks": [{"id": "lastditch_pyramid/spear_496", "kind": "source_quote", "literal_ids": ["LORE 원래 기대어 있던 자리에 놓아뒀다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 물건이 길 가운데로 밀려 나오지 않았는지 확인하고 일어섰다.\n\n이름은 읽었다. 가지고 가겠다는 대답은 하지 않았다.\n\n곁의 사람들이 기존 장비를 고쳐 잡았다. 그가 몸을 돌리자 짐이 창의 끝 가까이 지나갔다. 한 걸음 멈춰 걸리지 않을 틈을 만들었다.\n\n그다음에는 안쪽이었다. 손잡이의 글을 한 번 더 읽으려고 되돌아가지는 않았다. 지나온 길에 남은 물건은 더 이상 손에 든 장비가 아니었다."}], "when": {"op": "eq", "state": "event.chapter02.spear_owner", "value": ""}}, {"id": "lastditch_pyramid/spear_owner_protagonist", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "이/가"}}, {"text": " "}, {"ref": {"catalog": "terms", "id": "oedipus_spear", "particle": "을/를"}}, {"text": " 고쳐 들었다.\n\n발견할 때에는 길이가 잘 보이지 않았다. 손에 넣으니 몸을 돌릴 때 끝이 어디까지 가는지 먼저 확인해야 했다. 옆의 사람이 반걸음 비켰다. 무기를 맡은 사람이 그 틈으로 움직였다.\n\n손잡이의 글이 오늘의 움직임까지 대신해 주지는 않았다. 직접 들고 좁은 곳을 지나갈 속도를 맞췄다."}], "when": {"op": "eq", "state": "event.chapter02.spear_owner", "value": "protagonist"}}, {"id": "lastditch_pyramid/spear_owner_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "이/가"}}, {"text": " "}, {"ref": {"catalog": "terms", "id": "oedipus_spear", "particle": "을/를"}}, {"text": " 고쳐 들었다.\n\n발견할 때에는 길이가 잘 보이지 않았다. 손에 넣으니 몸을 돌릴 때 끝이 어디까지 가는지 먼저 확인해야 했다. 옆의 사람이 반걸음 비켰다. 무기를 맡은 사람이 그 틈으로 움직였다.\n\n손잡이의 글이 오늘의 움직임까지 대신해 주지는 않았다. 직접 들고 좁은 곳을 지나갈 속도를 맞췄다."}], "when": {"op": "eq", "state": "event.chapter02.spear_owner", "value": "party_woodcutter"}}, {"id": "lastditch_pyramid/spear_owner_party_hunter", "kind": "narrat ion", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "울림이 길어졌다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 멈췄다. 가까운 벽에서 끊기던 발소리가 앞쪽으로 더 오래 남았다. 좁은 길이 끝나는 곳에서 어둠의 폭이 달라지고 있었다.\n\n그는 몸을 다 내놓기 전에 옆을 봤다. 일행이 손짓을 보고 멈췄다. 앞을 확인하는 동안 뒤에서 밀리지는 않았다.\n\n안쪽에 움직이는 것이 있었다.\n\n하나를 따라 눈을 옮겼다. 반대편에서도 움직임이 생겼다. 그는 처음 보던 쪽으로 급히 시선을 돌렸다. 동시에 두 곳을 볼 수는 없었다.\n\n“왼쪽을 봐 주세요.”\n\n곁의 사람에게 말했다. 그가 오른쪽을 확인했다. 가운데에 "}, {"ref": {"catalog": "characters", "id": "major_mummy", "particle": "이/가"}}, {"text": " 있었다. 주변의 "}, {"ref": {"catalog": "characters", "id": "sphinx"}}, {"text": " 둘은 같은 간격을 유지하지 않았다.\n\n한쪽이 가까워졌다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 앞으로 기울던 몸을 다시 세웠다. 가운데만 보고 발을 옮겼다면 옆의 상대를 놓쳤을 것이다. 이름을 아는 적과 현재 다가오는 공격은 같은 자리에서 보이지 않았다.\n\n뒤에서 들어갈 곳을 물었다. 그는 발 하나가 놓일 자리를 가리켰다. 좁은 입구에 모두 모이면 앞사람이 움직일 때마다 뒤의 사람은 기다려야 했다. 그렇다고 아무 생각 없이 넓은 방으로 뛰어나갈 수도 없었다.\n\n돌바닥에 신발이 닿았다.\n\n그 소리 뒤에 상대의 움직임이 빨라졌다. 들킨 것인지, 원래 그렇게 움직이려던 것인지 구별할 시간은 없었다. 그가 손을 낮추며 짧게 말했다.\n\n“오른쪽입니다.”\n\n일행의 얼굴이 그쪽으로 돌아왔다. 두 상대가 벌어진 사이로 가운데가 보였다. 그 틈이 얼마나 오래 남을지는 몰랐다.\n\n들어온 자리를 지키며 맞설 것인가. 두 공격의 방향을 나눠 가운데에 접근할 것인가.\n\n그는 일행이 서 있는 간격을 봤다. 혼자 뛰어들면 이번 싸움은 여기서부터 흩어질 것이다. 먼저 움직이는 방법을 정해야 했다."}], "when": true}], "choices": [{"branch_kind": "flavor", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [{"op": "set", "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "state": "event.chapter02.approach", "value": "hold"}], "id": "lastditch_pyramid/hold_together", "label": [{"text": "들어온 쪽의 간격을 지키며 상대를 막는다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선 f": {"catalog": "characters", "id": "sphinx"}}, {"text": " 하나가 가까워졌다.\n\n앞에 선 사람이 몸을 뺐다. 그가 같은 자리로 따라 물러나려다가 발을 멈췄다. 뒤에 다른 사람이 있었다. 옆으로 옮겨 길을 비웠다.\n\n공격이 지나갔다. 돌 가까이에서 짧은 소리가 났다.\n\n그는 끝을 따라 보지 않았다. 다른 쪽이 남아 있었다. 두 공격을 한 번의 움직임으로 생각하면 다음을 놓칠 것이다.\n\n“여기입니다.”\n\n뒤에서 목소리가 났다. 고개를 돌릴 자리를 보여 주는 말이었다. 그가 앞을 다시 봤다. 방금 피한 사람이 자신의 위치를 되찾았다. 그제야 옆의 사람이 반걸음 나섰다.\n\n모두 한꺼번에 앞으로 나가지 않았다. 한 사람이 비키고, 다른 사람이 빈틈을 확인했다. 따라 나서고 싶은 마음이 들 때마다 뒤의 발소리를 들었다.\n\n가운데에는 "}, {"ref": {"catalog": "characters", "id": "major_mummy", "particle": "이/가"}}, {"text": " 있었다. 지금의 둘을 건너뛰고 달려가고 싶었다. 그러나 앞으로 갈 자리도 그 둘의 움직임이 만들어 내고 있었다.\n\n한쪽의 공격이 크게 지나갔다. 반대편에서 일행이 자리를 지켰다. 그 사이에 길이 보였다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 짧게 손을 내밀었다. 가까운 사람이 같은 틈을 봤다. 함께 움직였다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [], "id": "lastditch_pyramid/continue_tactics_hold", "label": [{"text": "다음 장면으로 이어간다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "target": "lastditch_pyramid/battle", "when": true}], "editorial": {"intent": "2장 4의 목적·수행·결과를 실제 장면으로 펼친다.", "notes": "적용 문체 style.revision=1. 인물·장비는 참조 ID로 쓰고 실제 합류·장착·경험만 후속 본문에 반영한다. 미승인 산문이며 원작의 모든 전투 경로를 자동 승리로 주장하지 않는다.", "source_refs": ["lastditch_pyramid/lastditch_dialogue", "lastditch_pyramid/town_entry", "lastditch_pyramid/pyramid_entry", "lastditch_pyramid/pyramid", "lastditch_pyramid/gate"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lastditch_stage", "value": 1}, "handoff": null, "id": "lastditch_pyramid/tactics_hold", "kind": "scene", "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "title": [{"text": "성을 위협하던 상대와의 대결 · 간격"}]}, {"blocks": [{"id": "lastditch_pyramid/separate_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "“멀리 흩어지지는 마세요. 보는 방향만 나눕시다.”\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "이/가"}}, {"text": " 양쪽을 가리켰다. 한 공격에 모두 같은 쪽으로 밀리지 않으려는 것이었다. 일행이 서로의 목소리를 들을 수 있는 거리에서 자리를 바꿨다.\n\n한 사람이 먼저 움직였다. "}, {"ref": {"catalog": "characters", "id": "sphinx"}}, {"text": " 하나가 그쪽으로 돌아갔다.\n\n그는 따라 뛰려던 발을 멈췄다. 다른 상대를 봤다. 두 움직임이 겹치면 틈을 만들었다고 생각한 쪽에서 곧바로 막힐 수 있었다.\n\n“아직입니다.”\n\n자기 숨이 크게 들렸다. 손을 든 채 기다리는 순간이 공격을 피하는 것보다 길었다. 옆의 사람이 멈췄다. 반대편에서 소리가 났다.\n\n한쪽의 공격을 피한 사람이 다시 자리를 잡았다. 그사이 다른 상대가 방향을 바꿨다. 두 공격이 같은 곳을 향하지 않는 짧은 순간이었다.\n\n그가 손을 내렸다.\n\n“지금.”\n\n일행이 움직였다. 가운데와의 거리가 줄었다. "}, {"ref": {"catalog": "characters", "id": "major_mummy"}}, {"text": "만 보고 달려가지 않았다. 옆에서 누군가 같은 속도로 따라오고 있었다.\n\n다시 소리가 났다. 그는 한 발을 멈춰 공격이 지나갈 자리를 내줬다. 옆의 사람도 발을 고쳤다. 빠르게 옮길 곳과 기다릴 곳이 가까이 붙어 있었다.\n\n앞이 열렸다. 이번에는 혼자 도착한 자리가 아니었다. 뒤의 발소리가 이어진 것을 확인하고 다시 몸을 돌렸다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [], "id": "lastditch_pyramid/continue_tactics_separate", "label": [{"text": "다음 장면으로 이어간다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "target": "lastditch_pyramid/battle", "when": true}], "editorial": {"intent": "2장 4의 목적·수행·결과를 실제 장면으로 펼친다.", "notes": "적용 문체 style.revision=1. 인물·장비는 참조 ID로 쓰고 실제 합류·장착·경험만 후속 본문에 반영한다. 미승인 산문이며 원작의 모든 전투 경로를 자동 승리로 주장하지 않는다.", "source_refs": ["lastditch_pyramid/lastditch_dialogue", "lastditch_pyramid/town_entry", "lastditch_pyramid/pyramid_entry", "lastditch_pyramid/pyramid", "lastditch_pyramid/gate"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lastditch_stage", " particle": "이/가"}}, {"text": " 가까운 사람의 자리를 확인했다.\n\n함께 같은 쪽으로 밀리지 않도록 반걸음 비켰다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 옆에서 몸을 돌릴 틈을 찾았다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_cook"}}, {"id": "lastditch_pyramid/party_4_party_magician", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_magician", "particle": "이/가"}}, {"text": " 발밑을 가리켰다.\n\n앞으로 나가려던 사람이 멈췄다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 돌을 피할 자리를 봤다. 상대만 보는 동안에도 바닥은 움직임을 막을 수 있었다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_magician"}}, {"id": "lastditch_pyramid/battle_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "빈틈은 오래 남지 않았다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 가까워진 상대를 향해 한 발 더 나가려다가 물러섰다. 옆에서 공격이 들어왔다. 먼저 피한 사람이 있던 자리를 다른 사람이 채웠다.\n\n그도 몸을 돌렸다. 방금까지 앞으로 보이던 길은 옆의 사람에게 가려졌다. 길을 뚫었다고 생각한 순간에 다시 자기 자리를 찾아야 했다.\n\n돌바닥에서 발이 연달아 울렸다. 소리만 듣고 뒤를 볼 수는 없었다. 고개를 돌린 동안 앞의 공격을 놓칠 수 있었다.\n\n“제가 왼쪽을 보겠습니다.”\n\n반대편을 맡겠다는 대답이 왔다. 같은 곳을 두 사람이 보고 다른 곳을 비우던 틈이 줄었다.\n\n"}, {"ref": {"catalog": "characters", "id": "major_mummy", "particle": "이/가"}}, {"text": " 움직였다. 그는 그쪽으로 몸을 기울였다. 닿을 기회라고 생각했다.\n\n어깨 가까이 손이 들어왔다.\n\n그가 멈췄다. 옆의 "}, {"ref": {"catalog": "characters", "id": "sphinx", "particle": "이/가"}}, {"text": " 방금 지나간 자리로 다시 돌아오고 있었다. 한 걸음 더 나갔다면 등 뒤에서 그 움직임을 받아야 했다.\n\n“고맙습니다.”\n\n대답을 들을 틈은 없었다. 다음 공격이 시작됐다. 그는 손이 가리킨 방향으로 몸을 틀었다. 한 사람이 빠져나갈 자리를 만들고 나서 자기 발도 옮겼다.\n\n소리가 크게 났다.\n\n그쪽에서 싸움이 잘 풀리는 것처럼 느껴졌다. 고개를 돌리려다가 참았다. 큰 소리에는 사람들의 움직임도 몰렸다. 자기가 맡은 곳을 비우면 반대편에서 위험이 올 수 있었다.\n\n그는 앞에 있는 공격을 넘겼다. 가까운 사람이 자리를 바꾸기 전에 짧게 불렀다. 그 이름을 들은 뒤에서 대답이 왔다. 말을 길게 할 수 없었지만 누가 움직이는지는 알릴 수 있었다.\n\n한쪽의 공격이 멎었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그곳을 한 번 보고 다른 쪽으로 시선을 돌렸다. 아직 움직이는 상대가 남아 있었다. 조용해졌다는 이유로 손을 내릴 수는 없었다.\n\n설 자리가 조금 늘었다. 앞으로 나섰던 사람이 숨을 골랐다. 옆의 사람이 그 자리를 맡았다. 일행의 간격은 풀리지 않았다.\n\n그제야 가운데가 다시 보였다.\n\n다음 움직임은 짧았다. 서로의 위치를 여러 번 확인해 둔 덕분이었다. 어디에 서 있는지 설명하는 말 대신 손짓이 나왔다. 기다리던 발이 움직였다.\n\n그가 가운데로 몸을 돌렸다. 옆에서 따라온 사람이 반대편을 봤다. 지금 혼자 앞으로 나가는 것이 아니라는 사실을 확인할 수 있었다.\n\n"}, {"ref": {"catalog": "characters", "id": "major_mummy", "particle": "이/가"}}, {"text": " 물러났다.\n\n돌에 발이 걸렸다. 상대의 움직임이 한 번 끊겼다. 그는 그 멈춤에 맞춰 나가려다가 자기 발밑을 봤다. 같은 돌이 자기에게도 걸릴 수 있었다.\n\n발을 옆으로 놓았다. 일행도 자리를 바꿨다. 방금의 틈이 닫히기 전에 가까운 사람이 다시 소리를 냈다.\n\n그는 그 목소리를 따라 움직이지 않았다. 목소리가 알려 준 위치를 확인하고 자기가 갈 자리를 골랐다. 뒤의 사람에게 길을 내주며 앞으로 몸을 돌렸다.\n\n공격이 이어졌다.\n\n마지막으로 가까워졌을 때는 오래 뒤를 볼 필요가 없었다. 곁에서 소리가 났고 같은 쪽으로 옮겨 선 사람이 보였다. 그는 그 간격을 놓치지 않았다.\n\n가운데 상대의 움직임이 끝내 멎었다.\n\n그는 바로 손을 내리지 않았다. 반대편을 봤다. 들어온 길을 봤다. 자기들과 같이 움직이던 사람들의 얼굴을 차례로 확인했다.\n\n공격을 피하던 발소리가 사라졌다.\n\n이제 들리는 것은 일행의 숨이었다. 누군가 짧게 말을 꺼내려다가 입을 다물었다. 그도 먼저 숨을 내쉬었다. 아직 소리가 큰 것 같았지만 돌아오는 울림뿐이었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 가까운 벽에 손을 댔다. 차가웠다. 싸우는 동안에는 그 벽이 어느 쪽에 있는지만 알아야 했다. 이제는 거기에 손을 놓은 채 곁의 사람을 볼 수 있었다.\n\n그가 다시 방을 확인했다. 움직임은 돌아오지 않았다."}], "when": true}, {"id": "lastditch_pyramid/polaris_present_4", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "polaris", "particle": "이/가"}}, {"text": " 가까운 사람에게 짧게 불렀다.\n\n움직이기 전에 자신의 위치를 알려 주는 말이었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그쪽이 비지 않았다는 것을 확인했다. 처음 함께한 싸움에서도 멈추는 신호는 들을 수 있었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "polaris"}}, {"id": "lastditch_pyramid/skeleton_present_4", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "이/가"}}, {"text": " 멈추는 간격을 맞췄다.\n\n첫 동굴에서처럼 앞사람이 멈추면 뒤에서도 멈췄다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그가 자리를 바꾸기 전에 낸 소리를 들었다. 서로의 위치를 놓치지 않았다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lastditch_pyramid/battle_weapon_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "이/가"}}, {"text": " "}, {"ref": {"catalog": "equipment", "id": "story_axe", "particle": "을/를"}}, {"text": " 고쳐 잡았다.\n\n넓게 움직이면 곁의 사람에게 닿을 거리였다. 날을 앞으로 내놓기 전에 공간을 확인하고 짧게 몸을 돌렸다."}], "when": {"all": [{"op": "contains", "state": "companions.starting", "value": "party_woodcutter"}, {"op": "eq", "state": "event.weapon.party_woodcutter", "value": "story_axe"}]}}, {"id": "lastditch_pyramid/battle_weapon_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {" .\n\n들어온 방향을 가리켰다. 일행이 그쪽으로 몸을 돌렸다. 더 가까이 가서 멎은 상대를 볼 필요는 없었다.\n\n지금 남은 일은 돌아가는 것이었다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [], "id": "lastditch_pyramid/continue_won", "label": [{"text": "다음 장면으로 이어간다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "target": "lastditch_pyramid/return_road", "when": true}], "editorial": {"intent": "2장 4의 목적·수행·결과를 실제 장면으로 펼친다.", "notes": "적용 문체 style.revision=1. 인물·장비는 참조 ID로 쓰고 실제 합류·장착·경험만 후속 본문에 반영한다. 미승인 산문이며 원작의 모든 전투 경로를 자동 승리로 주장하지 않는다.", "source_refs": ["lastditch_pyramid/lastditch_dialogue", "lastditch_pyramid/town_entry", "lastditch_pyramid/pyramid_entry", "lastditch_pyramid/pyramid", "lastditch_pyramid/gate"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lastditch_stage", "value": 2}, "handoff": null, "id": "lastditch_pyramid/won", "kind": "scene", "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "title": [{"text": "성을 위협하던 상대와의 대결 · 결과"}]}, {"blocks": [{"id": "lastditch_pyramid/party_5_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "이/가"}}, {"text": " 밝은 곳에서 멈췄다.\n\n뒤의 사람이 나올 자리를 내줬다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 틈으로 일행의 얼굴을 확인했다. 먼저 나온 뒤에도 돌아볼 일이 남아 있었다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_woodcutter"}}, {"id": "lastditch_pyramid/party_5_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_hunter", "particle": "이/가"}}, {"text": " 길 위의 돌을 가리켰다.\n\n싸움에 관한 이야기가 잠깐 멎었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 돌을 넘은 뒤 다시 들었다. 지나온 일을 말하는 동안 현재의 발도 지켜야 했다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_hunter"}}, {"id": "lastditch_pyramid/party_5_party_cook", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_cook", "particle": "이/가"}}, {"text": " 짐을 고쳐 당겼다.\n\n몸을 돌리는 사람에게 걸리지 않도록 옆을 비웠다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 일행이 함께 길을 나선 것을 보고 성이 있는 방향을 확인했다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_cook"}}, {"id": "lastditch_pyramid/return_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌아가는 길에서는 더 자주 멈췄다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 앞의 사람이 짐을 고칠 때 기다렸다. 길을 잊어버린 것은 아니었다. 좁은 곳에서 같이 들어갈 간격을 다시 맞추고 있었다.\n\n싸움이 끝났다고 바닥까지 평평해지지는 않았다. 들어올 때 넘었던 돌은 같은 자리에 있었다. 반대쪽에서 보니 높이가 달라 보였다.\n\n그가 발을 고쳐 놓았다. 뒤의 사람이 그 움직임을 보고 손을 들었다. 이번에는 긴 설명 없이도 멈추는 순서가 맞았다.\n\n옅은 빛이 나타났다.\n\n앞의 걸음이 빨라졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 사람을 불렀다. 입구가 가까워졌다고 나머지 사람들까지 밝은 곳에 온 것은 아니었다.\n\n“조금만 기다려 주세요.”\n\n뒤쪽의 발소리가 가까워졌다. 다 같이 문 쪽으로 움직였다. 그는 빛을 오래 보지 않고 발밑으로 시선을 내렸다. 마지막 몇 발에서 돌을 놓치고 싶지 않았다.\n\n바람이 얼굴을 스쳤다.\n\n입구를 넘자 안에서 그렇게 크게 들리던 숨소리가 작아졌다. 그는 옆으로 비켜 다음 사람이 나올 자리를 내줬다. 눈이 밝아진 바닥에 익을 때까지 고개를 조금 숙였다.\n\n다 나왔다.\n\n그 사실을 확인하고서야 어깨에 들어간 힘을 뺐다. 북쪽으로 올 때는 동굴의 입구를 찾았다. 돌아갈 때는 성이 있는 방향을 찾아야 했다. 길은 같아도 먼저 보게 되는 것이 달라졌다.\n\n걷기 시작한 뒤 누군가 방 안의 한 순간을 말했다. 그가 듣다가 고개를 돌렸다. 자기 자리에서는 보지 못한 움직임이었다.\n\n한 걸음 물러났을 때 뒤에서 난 소리. 옆의 사람이 지나갔을 때 생긴 짧은 틈. 그 이유를 이제 맞출 수 있었다.\n\n그도 어깨 가까이 손을 보고 멈춘 일을 말했다.\n\n“못 봤으면 그대로 나갔을 겁니다.”\n\n옆의 사람이 짧게 답했다. 그 순간에 무엇을 보고 있었는지 설명했다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 자기 기억에 그 말을 붙였다. 함께 싸웠다고 서로의 모든 위치를 본 것은 아니었다.\n\n앞에서 손짓이 나왔다. 낮은 돌이었다. 이야기가 멎었다가 돌을 넘은 뒤 다시 이어졌다. 지나온 싸움을 말하는 동안에도 지금 걷는 길은 확인해야 했다.\n\n성벽이 보였다.\n\n그는 도착했다고 말하려다가 손을 내렸다. 아직 문까지 걸어야 했다. 처음 읽었던 글이 가까워지고 사람들이 드나드는 자리가 보였다.\n\n문 앞에서는 나오는 사람에게 길을 내줬다. 그 사람이 자신들을 알아보는지 살피려다가 그만뒀다. 성 안의 모든 사람이 북쪽에서 무슨 일이 있었는지 알고 있지는 않을 것이다.\n\n자신들은 결과를 가지고 왔다. 이제 전해야 했다.\n\n문 안의 소리가 가까워졌다. 누군가는 짐을 옮겼다. 누군가는 다른 사람을 불렀다. 성주가 있는 쪽을 가리키고 일행을 기다렸다.\n\n그동안 기다리는 가족의 얼굴이 떠올랐다. "}, {"ref": {"catalog": "characters", "id": "lore_hunter"}}, {"text": "의 이름을 알려 준 사람이었다. 북쪽의 공격을 끝냈다는 말은 할 수 있었다. 그 사람이 기다리는 소식까지 가지고 온 것은 아니었다.\n\n그 두 대답을 하나로 합칠 수는 없었다.\n\n우선 성주에게 가야 했다. 그가 일행과 함께 다시 걸었다."}], "when": true}, {"id": "lastditch_pyramid/extra_5", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "접견실 가까이에서 보고할 말을 맞췄다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 마지막 순간부터 떠올렸다. 상대의 움직임이 멎었다. 일행은 서로를 확인했다. 들어온 길을 따라 함께 나왔다.\n\n그 사이의 일은 사람마다 다르게 보았을 것이다. 그는 곁의 사람에게 어느 쪽을 보고 있었는지 물었다. 앞에 섰다는 이유로 자신의 설명만 먼저 길게 만들고 싶지 않았다.\n\n대답을 듣자 한 소리의 방향이 분명해졌다. 자기가 물러난 뒤 누군가 그 자리를 맡았다고 했다. 그가 본 것은 달라진 빈틈이었다. 같은 순간을 다른 쪽에서 설명하니 순서가 맞았다.\n\n“그 부분도 말씀해 주세요.”\n\n말을 다 외울 필요는 없었다. 어느 방에 들어갔는지, 어떤 상대를 만났는지, 그 싸움을 어떻게 끝냈는지부터 전달하면 됐다. 더 자세히 물으면 그때 함께 답할 수 있었다.\n\n문 앞에서 손을 폈다. 싸울 때처럼 힘을 주고 기다릴 필요는 없었다.\n\n이제는 말을 해야 했다."}], "when": true}, {"id": "lastditch_pyramid/polaris_present_5", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "polaris", "particle": "은/는"}}, {"text": " 좁아진 길에서 속도를 낮췄다.\n\n곁의 사람도 멈췄다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "이/가"}}, {"text": " 나갈 방향을 가리키자 둘이 몸을 바꿔 설 틈을 냈다. 올 때보다 발소리의 위치가 익숙했다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "polaris"}}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [], "id": "lastditch_pyramid/continue_return_road", "label": [{"text": "다음 장면으로 이어간다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "target": "lastditch_pyramid/report", "when": true}], "editorial": {"intent": "2장 5의 목적·수행·결과를 실제 장면으로 펼친다.", "notes": "적용 문체 style.revision=1. 인물·장비는 참조 ID로 쓰고 실제 합류·장착·경험만 후속 본문에 반영한다. 미승인 산문이며 원작의 모든 전투 경로를 자동 승리로 주장하지 않는다.", "source_refs": ["lastditch_pyramid/lastditch_dialogue", "lastditch_pyramid/town_entry", "lastditch_pyramid/pyramid_entry", "lastditch_pyramid/pyramid", "lastditch_pyramid/gate"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lastditch_stage", "value": 2}, "handoff": null, "id": "lastditch_pyramid/return_road", "kind": "scene", "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "title": [{"text": "구제의 결과를 보고하다 · 귀환"}]}, {"blocks": [{"id": "lastditch_pyramid/report_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "인사는 짧았다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성주의 눈을 보고 목적부터 말했다. 북쪽 동굴에 다녀왔다. 의뢰의 상대를 찾았다. 그곳에서 대결을 끝냈다.\n\n“주변에는 둘이 더 있었습니다.”\n\n이름을 빼놓지 않았다. 가운데의 상대만 보고 앞으로 나가려던 일을 떠올렸다. 이번 싸움을 설명할 때 옆의 두 공격을 없는 것처럼 말할 수는 없었다.\n\n그는 처음 방에 들어갔던 위치를 손으로 짚었다. 일행 가운데 누군가가 설명을 보탰다. 자기가 맡았던 쪽에서 무엇이 움직였는지 말했다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 말을 막지 않았다. 모든 공격을 혼자 봤다고 보고하는 것보다 정확했다. 상대의 말을 들은 뒤 자기 자리에서 확인한 마지막 움직임을 덧붙였다.\n\n성주가 듣고 있었다.\n\n어느 부분에서 고개를 끄덕였는지 보자 같은 말을 되풀이할 필요가 줄었다. 그는 방 안의 대결을 마친 뒤 어떻게 돌아나왔는지까지 설명하고 멈췄다.\n\n성공을 인정하는 말이 뒤따랐다.\n\n그는 뒤의 사람들을 한 번 봤다. 같이 들어온 사람들이 제자리에 서 있었다. 자신의 이름이 먼저 불렸다고 혼자 다녀온 것처럼 답할 수는 없었다.\n\n“함께 다녀왔습니다.”\n\n그 말은 출발하기 전에 한 약속보다 짧았다. 하지만 이제는 그 짧은 말을 끝까지 할 수 있었다. 같이 나가고 같이 돌아온 사람들이 눈앞에 있었다.\n\n성주는 도움에 대한 대가를 이야기했다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 처음 들었던 약속을 떠올렸다. 그때는 동굴을 찾아갈 길부터 몰랐다. 지금은 약속의 끝에 서 있었다.\n\n인정을 받았다고 바로 몸을 돌릴 수는 없었다. 성주의 시선이 아직 일행에게 남았다. 그는 문 쪽을 보려던 눈길을 되돌렸다.\n\n처음 도착했을 때는 무엇을 해야 할지 들었다. 이번에는 다음 길을 들을 차례였다.\n\n그가 발을 고쳐 디뎠다. 뒤에서 짐이 조금 움직였다. 들어올 때보다 서로의 간격은 익숙했다. 성주가 이어 하는 말을 함께 기다렸다.\n\n그는 일행에게 눈길을 줬다. 보고할 말을 맞추던 때처럼 누군가 설명을 보태려는지 확인했다. 방의 어느 쪽에서 무엇을 봤는지는 사람마다 달랐다.\n\n이제 더 할 말이 없다는 짧은 대답이 왔다. 그가 고개를 끄덕였다. 혼자 마지막 문장을 정하고 나서 모두의 보고까지 끝났다고 할 필요는 없었다.\n\n처음에는 성주가 어떤 일을 맡길지만 보고 있었다. 돌아온 뒤에는 같이 말하는 사람들의 자리도 보였다. 그 사이에서 대답 하나를 듣고 기다리는 일이 전보다 쉬워졌다."}], "when": true}, {"id": "lastditch_pyramid/party_5_party_magician", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · e": {"bindings": [{"end": 14, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 3}], "literal_ids": ["LORETALK.PAS:literal:18225"]}}], "when": true}, {"id": "lastditch_pyramid/guidance_474", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:18271"], "provenance": {"note": "원문 발생 순서·공백·표현은 불변이다. 이름 위치만 참조로 표시하고 동적 이름은 별도 표시 삽입을 사용한다.", "origin": "source_exact", "source_refs": ["lastditch_pyramid/lastditch_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:18271"]}}], "when": true}, {"id": "lastditch_pyramid/guidance_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "북동쪽이라는 방향을 다시 확인했다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성주가 가리킨 곳을 봤다. 거리에서는 문이 서쪽에 나타난다는 말을 들었다. 방금 받은 안내는 같지 않았다.\n\n그 둘을 한 방향처럼 외울 수는 없었다. 그는 오늘 들은 말의 주인을 구별했다. 지금은 성주가 설명한 길부터 확인할 것이다.\n\n문에 들어가면 다른 성으로 이어진다고 했다. "}, {"ref": {"catalog": "terms", "id": "valiant_peoples"}}, {"text": ".\n\n이름을 듣자 서로 닮은 성이라는 말이 떠올랐다. 처음 성 안에서 들을 때는 먼 곳에 관한 이야기였다. 이제는 앞으로 걸어가 볼 장소가 됐다.\n\n그 성에는 "}, {"ref": {"catalog": "characters", "id": "necromancer"}}, {"text": "의 영향이 심하다고 했다.\n\n북쪽의 일을 끝내고 돌아왔을 뿐이었다. 이 방의 사람들에게는 성이 구제된 결과가 있었다. 다른 땅의 사람들도 같은 대답을 받은 것은 아니었다.\n\n그는 성주에게 위치를 한 번 더 물었다. 대답을 들은 뒤 일행을 봤다. 누군가는 이미 방향을 기억하고 있었다. 누군가는 다음 성의 이름을 작게 따라 했다.\n\n같은 이름으로 부를 수 있어야 길 위에서 서로 다른 곳을 찾지 않을 것이다.\n\n“문까지 가 보겠습니다.”\n\n다음 땅에서 무엇을 해야 할지는 아직 몰랐다. 먼저 입구를 찾고 통과해야 했다. 이 성에서 해결한 일이 저편의 사정을 설명해 주지는 않았다.\n\n접견을 마치고 몇 걸음 옮겼다. 혼자 문 쪽으로 나가지 않았다. 함께 설명을 듣던 이들이 가까워졌다.\n\n그는 지금 들은 방향을 짧게 정리했다. 북동쪽. 다른 대륙으로 이어지는 문. 닮았다는 성.\n\n상대의 큰 이름은 다시 설명하지 않았다. 모두 방 안에서 같은 말을 들었다. 이제는 어느 쪽으로 몸을 돌려야 하는지부터 맞췄다."}], "when": true}], "choices": [{"branch_kind": "knowledge", "consequence": [{"text": "이 경로의 경험만 기록하고 다음 본줄기로 합류한다."}], "effects": [{"op": "set", "provenance": {"note": "원작의 조건/상태를 독립 집필 상태로 표현한다. 게임 코드나 저장 값을 실행하지 않는다.", "origin": "source_adaptation", "source_refs": ["lastditch_pyramid/lastditch_dialogue"]}, "state": "knowledge.chapter02_gate", "value": true}], "id": "lastditch_pyramid/continue_guidance", "label": [{"text": "다음 장면으로 이어간다"}], "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "target": "lastditch_pyramid/gate", "when": true}], "editorial": {"intent": "2장 6의 목적·수행·결과를 실제 장면으로 펼친다.", "notes": "적용 문체 style.revision=1. 인물·장비는 참조 ID로 쓰고 실제 합류·장착·경험만 후속 본문에 반영한다. 미승인 산문이며 원작의 모든 전투 경로를 자동 승리로 주장하지 않는다.", "source_refs": ["lastditch_pyramid/lastditch_dialogue", "lastditch_pyramid/town_entry", "lastditch_pyramid/pyramid_entry", "lastditch_pyramid/pyramid", "lastditch_pyramid/gate"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lastditch_stage", "value": 3}, "handoff": null, "id": "lastditch_pyramid/guidance", "kind": "scene", "provenance": {"note": "추가: 장면의 행동·공간·대화·심리는 원작에 없는 창작 초고. style.revision=1을 적용했으며 새 고정 인물 설정·보상·능력·사망을 선언하지 않는다.", "origin": "authored", "source_refs": []}, "title": [{"text": "문 너머의 다음 땅 · 안내"}]}, {"blocks": [{"id": "lastditch_pyramid/gate_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": ["lastditch_pyramid/gate"]}, "speaker": null, "text": [{"text": "길을 묻던 자리에서 속도를 늦췄다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 처음 여기 서서 듣던 말을 떠올렸다. 다른 대륙으로 통하는 문이 있다는 것. 두 성이 닮았다는 것. 그때는 북쪽 동굴에 가는 일과 떨어져 있었다.\n\n이제 일부는 다음 목적지의 설명이 됐다.\n\n그는 같은 이야기를 다시 듣기 위해 사람들을 붙들지 않았다. 이미 들은 말과 성주의 새 안내를 구별해 기억했다. 일행은 사람들이 비켜 둔 길을 따라 문 쪽으로 움직였다.\n\n떠나기 전에 기다리는 가족을 찾았다.\n\n상대가 일행을 봤다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 먼저 돌아왔다고 말했다. 북쪽의 부탁을 끝냈고 다른 땅으로 향하게 됐다고 설명했다.\n\n그 사람의 눈길이 잠깐 달라졌다. 이어 나온 질문은 남편에 관한 것이었다.\n\n그는 숨을 한 번 고르고 대답했다.\n\n“이번 동굴에서는 그분의 소식을 얻지 못했습니다.”\n\n이름은 기억한다고 덧붙였다. 승리한 이야기를 더 크게 해서 그 대답을 덮지는 않았다. 성을 위협하는 공격 하나를 끝냈어도 이 사람의 기다림은 그대로였다.\n\n인사를 하고 돌아섰다. 오래 서 있는 것으로 해 주지 못한 답을 대신할 수는 없었다. 일행이 가까운 곳에서 기다리고 있었다.\n\n그가 거기로 갔다. 장비와 짐은 함께 움직였다. 들은 이름도 남았다. 다음 땅으로 가져가는 것이 손에 든 물건만은 아니었다.\n\n길이 좁아질 때마다 앞뒤의 간격을 줄였다. 앞사람이 낮은 돌을 가리켰다. 뒤에서는 짐의 끈을 잡아당겼다. 북쪽 동굴로 갈 때 맞췄던 순서가 다른 길에서도 남아 있었다.\n\n문이 가까워졌다.\n\n입구를 알리는 글이 보였다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 앞에서 멈췄다. "}, {"ref": {"catalog": "terms", "id": "ground_gate"}}, {"text": "라는 이름과 성주가 말한 목적지를 맞춰 봤다.\n\n들어가면 어느 풍경이 먼저 보일까.\n\n글만으로는 알 수 없었다. 그는 입구 가까이에 섰다가 옆으로 비켰다. 혼자 먼저 확인하러 들어가면 뒤의 사람은 같은 장소에서 그를 기다려야 했다.\n\n발소리가 가까워졌다. 그가 돌아봤다. 같이 걸어온 사람들이 있었다. 방금까지 짐을 고치던 손도 멎었다.\n\n이번에도 모두 같은 이야기를 듣고 같은 문 앞에 섰다.\n\n그는 앞으로 몸을 돌렸다. 이쪽에서 끝낸 일은 뒤에 남았다. 아직 보지 못한 사람들이 있는 곳은 저편이었다.\n\n“넘어가면 바로 앞으로 뛰지 맙시다.”\n\n말하고 나서 그는 문 앞의 폭을 가리켰다. 이쪽에서 아무리 넓게 서 있어도 반대편이 같은 폭인지 알 수 없었다. 첫 사람이 지나가서 설 자리를 본 뒤 나머지가 따라가면 됐다.\n\n가까운 사람이 먼저 바닥을 내려다봤다. 다른 사람은 뒤에서 들어오는 길을 봤다. 그는 그 사이에 섰다. 혼자 앞과 뒤를 계속 번갈아 보는 대신 누가 어디를 확인하는지 짧게 말할 수 있었다.\n\n성에서 처음 들었던 방향은 아직 머릿속에 남아 있었다. 문이 어디에 나타난다는 주민의 말과 성주가 가리킨 북동쪽의 길은 다른 설명이었다. 그는 오늘 어떤 안내를 따라 여기까지 왔는지 일행에게 다시 짚었다.\n\n그쪽에서 묻는 사람이 있으면 이 길을 설명해 줄 수 있을 것이다. 지금은 저편의 사정까지 덧붙이지 않았다.\n\n바람이 짐의 끈을 흔들었다. 그는 끈 끝을 몸 가까이 붙였다. 가까운 사람도 손을 바꿔 잡았다. 싸움을 끝낸 뒤 느슨해진 손이 새로운 길을 준비하는 손으로 움직였다.\n\n돌아올 곳이 눈앞에 보이지 않게 되면 지난 길을 기억해야 했다. 그는 문 옆의 모양과 자신들이 선 방향을 한 번 더 봤다. 앞선 동굴에서 돌아올 때 작은 돌을 알아보던 순간이 떠올랐다.\n\n지나가는 길은 처음부터 전부 알 필요가 없었다. 알아본 자리를 하나씩 늘려 가면 됐다. 다만 앞을 먼저 확인한 사람이 뒤의 사람까지 같은 것을 봤다고 여기지 않아야 했다.\n\n그가 손을 들었다. 일행이 그 손을 봤다. 같은 순간에 몰리지 않고 차례로 문 쪽에 다가갈 준비가 됐다."}], "when": true}, {"id": "lastditch_pyramid/gate_sign", "kind": "source_quote", "literal_ids": ["LOREENT.PAS:literal:15784"], "provenance": {"note": "원문 발생 순서·공백·표현은 불변이다. 이름 위치만 참조로 표시하고 동적 이름은 별도 표시 삽입을 사용한다.", "origin": "source_exact", "source_refs": ["lastditch_pyramid/town_entry"]}, "speaker": null, "text": [{"source": {"bindings": [{"end": 20, "ref": {"catalog": "terms", "id": "ground_gate"}, "start": 9}], "literal_ids": ["LOREENT.PAS:literal:15784"]}}], "when": true}, {"id": "lastditch_pyramid/party_6_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "이/가"}}, {"text": " 문 옆으로 비켰다.\n\n뒤의 사람들이 가까워질 자리를 만들었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 빈 공간에 서서 마지막 발소리를 기다렸다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_woodcutter"}}, {"id": "lastditch_pyramid/party_6_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_hunter", "particle": "이/가"}}, {"text": " 안내받은 방향을 확인했다.\n\n거리에서 들은 말과 지금 갈 길을 하나로 줄이지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성주의 설명을 다시 짚고 문 쪽으로 고개를 돌렸다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_hunter"}}, {"id": "lastditch_pyramid/party_6_party_cook", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_cook", "particle": "이/가"}}, {"text": " 늘어진 끈을 안으로 넣었다.\n\n새 길에서도 곁의 짐에 걸릴 수 있는 것이었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 서두르지 않고 그 손이 멎는 것을 기다렸다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_cook"}}, {"id": "lastditch_pyramid/party_6_party_magician", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_magician", "particle": "이/가"}}, {"text": " 문 저편을 봤다.\n\n보이지 않는 풍경을 먼저 설명하지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 일행이 같은 곳에 선 것을 확인한 뒤 몸을 앞으로 돌렸다."}], "when": {"op": "contains", "state": "companions.starting", "value": "party_magician"}}, {"id": "lastditch_pyramid/extra_6", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존 장면의 행동·대화 호흡을 재집필하며 원작 대사·선택 결과·현재 동료·장비·능력·인물 지식은 바꾸지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "다음 성의 이름을 다시 물었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 대답했다. 상대가 자기 입으로 따라 했다. 그는 성주가 그곳을 설명할 때 덧붙인 말도 짧게 전했다.\n\n도착해서 어떤 부탁을 받을지는 몰랐다. 문 앞에서 지금 정할 것은 아니었다. 적어도 어디로 가는지는 서로 다르게 기억하지 않아야 했다.\n\n한 사람이 입구 가까이 왔다. 뒤의 사람이 짐을 당겼다. 그가 손을 들었다. 먼저 넘으라는 뜻이 아니라 잠깐 기다리라는 뜻이었다.\n\n마지막 사람이 가까워질 때까지 기다렸다.\n\n문 뒤의 공간은 아직 보이지 않았다. 여기서는 서로의 위치를 쉽게 확인할 수 있었다. 들어간 뒤에는 굽은 길이나 어둠 때문에 다시 이름을 불러야 할지도 몰랐다.\n\n그는 앞을 보는 사람과 곁을 보는 사람의 자리를 내줬다. 모두 같은 쪽으로 기울지 않았다.\n\n함께 섰다. 그제야 가리키던 손을 내렸다.\n\n설명을 듣는 시간은 끝났다. 지금까지 들은 이름과 방향을 가지고 발을 옮길 차례였다."}], "when": true}, {"id": "lastditch_pyramid/polaris_present_6", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: writing/styles.json#/profiles/B · revision 1을 적용한 별도 산문 초고. 기존     const companions = [...packet.state['companions.starting'],...packet.state['companions.optional_recruits']];
    info.append(element('p','동행: ' + companions.map(id => data.labels.characters[id] || id).join(', ')));
    info.append(element('p','성 안에서 들른 곳: ' + packet.state['event.city_visits'] + ' · 금화: ' + packet.state['event.gold']));
    for (const id of packet.state['companions.starting']) info.append(element('p',data.labels.characters[id] + ': ' + (data.labels.equipment[packet.state['event.weapon.' + id]] || '미정')));
    if (companions.includes('mad_joe')) info.append(element('p',data.labels.characters.mad_joe + ': ' + (data.labels.equipment[packet.state['event.weapon.mad_joe']] || '미정')));
    if (packet.state['event.shield_owner']) info.append(element('p','발견 방패 장착자: ' + data.labels.characters[packet.state['event.shield_owner']]));
    for(const id of ['protagonist','skeleton','polaris']){
      if(id!=='protagonist'&&!companions.includes(id))continue;
      const weapon=packet.state['event.weapon.'+id];
      if(weapon)info.append(element('p',data.labels.characters[id]+': '+(data.labels.equipment[weapon]||'미정')));
    }
    if(packet.state['event.chapter02.spear_owner'])info.append(element('p',data.labels.terms.oedipus_spear+': '+data.labels.characters[packet.state['event.chapter02.spear_owner']]));
    if (!current.choices.length) box.append(element('p',`제${data.chapters.length}장 끝. 선택한 동료·장비·경험은 다음 장으로 인계됩니다. ${data.chapters.length+1}장 이후는 이 판본에서 아직 집필 전이며, 전편 개요와 분기 미리보기는 제작 자료입니다.`));
    document.getElementById('back').disabled = !packet.sections.some(s=>s.selected&&!automatic(s.node.id,s.state));
  }
  document.getElementById('restart').addEventListener('click',() => { route = []; redraw(); message('처음부터 시작합니다.'); readFromSection(0); });
  document.getElementById('back').addEventListener('click',() => {
    const next = [...route]; next.pop();
    while (next.length && automatic(replay(next).node.id,replay(next).state)) next.pop();
    route = next; redraw(); message('직전 선택으로 돌아왔습니다. 상태도 경로에서 다시 계산했습니다.'); readFromSection();
  });
  document.getElementById('save').addEventListener('click',() => {
    const value = JSON.stringify({fingerprint:data.fingerprint,route},null,2), a = document.createElement('a');
    const url = URL.createObjectURL(new Blob([value],{type:'application/json'}));
    a.href = url; a.download = 'novel-route.json'; a.click(); URL.revokeObjectURL(url);
    message('경로만 저장했습니다. 동료·금화·지식을 임의 저장하지 않습니다.');
  });
  document.getElementById('load').addEventListener('click',() => document.getElementById('file').click());
  document.getElementById('file').addEventListener('change',async event => {
    try {
      const file = event.target.files[0]; if (!file || file.size > 32768) throw Error('저장 파일이 너무 큽니다.');
      const saved = JSON.parse(await file.text());
      if (Object.keys(saved).sort().join(',') !== 'fingerprint,route' || saved.fingerprint !== data.fingerprint) throw Error('다른 판본 또는 변조된 저장 파일입니다.');
      const packet = replay(saved.route);
      if (automatic(packet.node.id,packet.state)) throw Error('자동 진행이 누락된 저장 경로입니다.');
      route = [...saved.route]; redraw(); message('경로를 검증하고 상태를 다시 계산했습니다.'); readFromSection();
    } catch (e) { message(e.message); }
    event.target.value = '';
  });
  redraw();
})();
</script></html>
