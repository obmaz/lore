er": "네크로맨서", "party_cook": "요리사", "party_hunter": "사냥꾼", "party_magician": "마술사", "party_woodcutter": "나무꾼", "polaris": "폴라리스", "protagonist": "서진", "red_antares": "레드 안타레스", "skeleton": "스켈레톤", "veteran": "특공대에 친구들을 보낸 주점 인물"}, "equipment": {"shield_5": "금제 방패", "story_axe": "벌목 도끼", "story_bow": "사냥 활", "story_knife": "주방 칼", "story_wand": "마술 지팡이", "weapon_0": "맨손", "weapon_1": "단도"}, "terms": {"lastditch": "라스트디치", "lore": "로어", "menace": "메너스"}}, "literals": {"LORESPEC.PAS:literal:10062": "당신들은 수감소 병사들을 물리쳤다.", "LORESPEC.PAS:literal:10752": " 일행은 가장 기본적인 무기로  모두  무장을", "LORESPEC.PAS:literal:10804": "하였다.", "LORESPEC.PAS:literal:11230": " 당신이 LORE 성을 떠나려는 순간 누군가가 당신을 불렀다.", "LORESPEC.PAS:literal:11609": " 나는 Skeleton이라 불리는 종족의 사람이오.", "LORESPEC.PAS:literal:11667": " 우리 종족의 사람들은 나를 제외하고는  모두", "LORESPEC.PAS:literal:11722": "Necromancer에게 굴복하여 그의 부하가 되었지", "LORESPEC.PAS:literal:11781": "만 나는 그렇지 않소. 나는 Necromancer 의 영", "LORESPEC.PAS:literal:11842": "향을 피해서 이곳 LORE 성으로 왔지만 나의 혐", "LORESPEC.PAS:literal:11899": "오스런 생김새 때문에 이곳 사람들에게 배척되", "LORESPEC.PAS:literal:11953": "어서 지금은 어디로도 갈 수 없는 존재가 되었", "LORESPEC.PAS:literal:12008": "소. 이제 나에게 남은 것은 Necromancer 의 타", "LORESPEC.PAS:literal:12069": "도 밖에 없소.  그래서  당신들의 일행에 끼고", "LORESPEC.PAS:literal:12125": "싶소.", "LORESPEC.PAS:literal:12158": "", "LORESPEC.PAS:literal:12171": "", "LORESPEC.PAS:literal:12184": "", "LORESPEC.PAS:literal:12197": "", "LORESPEC.PAS:literal:12210": "", "LORESPEC.PAS:literal:34455": "여기가 `MENACE'의 중심이다.", "LORESPEC.PAS:literal:34507": "당신의 탐험은 성공적이었다.", "LORESPEC.PAS:literal:34554": "이제 Lord Ahn 에게 돌아가는 일만 남았다.", "LORESPEC.PAS:literal:35886": "당신은 황금의 방패를 발견했다.", "LORESPEC.PAS:literal:35966": "누가 이 황금의 방패를 장착 하겠습니까 ?", "LORESPEC.PAS:literal:36451": "가 황금의 방패를 장착했다.", "LORESPEC.PAS:literal:8315": "일행은 상자 속에서 약간의 금을 발견했다.", "LORESPEC.PAS:literal:8655": " 다시 돌아오다니, ", "LORESPEC.PAS:literal:8714": " 이번에는 기어이 네놈들을 해치우고야 말겠다", "LORESPEC.PAS:literal:8768": ". 나의 친구들도 이번에 거들것이다.", "LORESPEC.PAS:literal:8908": " 아니! 당신이 우리들을 배신하고 죄수를 풀어", "LORESPEC.PAS:literal:8966": "주다니... 그렇다면 우리들은 결투로서 당신들", "LORESPEC.PAS:literal:9021": "과 승부할수 밖에 없군요.", "LORESPEC.PAS:literal:9657": " 우리들 뒤에 있던  Mad Joe가 전투가 일어나", "LORESPEC.PAS:literal:9718": "자마자 도망을 가버렸다.", "LORESUB.PAS:literal:27739": "당신은 금화 ", "LORESUB.PAS:literal:27757": "개를 발견했다.", "LORESUB.PAS:literal:27868": "당신이 바란다면 ...", "LORETALK.PAS:literal:1018": "다면  진정한 이 세계의 진실을 알수 있을것이", "LORETALK.PAS:literal:10265": "예.", "LORETALK.PAS:literal:10316": "이제부터 당신은 진정한 이 세계에 발을 디디게 되는 것입니다.", "LORETALK.PAS:literal:10517": "아니오.", "LORETALK.PAS:literal:10570": "다시 생각 해보십시오.", "LORETALK.PAS:literal:1066": "오.", "LORETALK.PAS:literal:10750": "난 당신을 믿소, ", "LORETALK.PAS:literal:10778": ".", "LORETALK.PAS:literal:10886": "힘내시오, ", "LORETALK.PAS:literal:10910": ".", "LORETALK.PAS:literal:11005": "저희 성주님을 만나십시오.", "LORETALK.PAS:literal:11040": "당신이 성공하기를 빕니다.", "LORETALK.PAS:literal:11156": " 나는 ", "LORETALK.PAS:literal:11163": "Lord Ahn", "LORETALK.PAS:literal:11174": " 이오.", "LORETALK.PAS:literal:11202": " 이제부터 당신은  이 게임에서 새로운 인물로", "LORETALK.PAS:literal:11251": "서 생을 시작하게 될것이오. 그럼 나의 이야기", "LORETALK.PAS:literal:11297": "를 시작하겠소.", "LORETALK.PAS:literal:11399": " 이 세계는 내가 통치하는 동안에는 무척 평화", "LORETALK.PAS:literal:11448": "로운 세상이 진행되어 왔었소.  그러나 그것은", "LORETALK.PAS:literal:11497": "한 운명의 장난으로 무참히 깨어져 버렸소.", "LORETALK.PAS:literal:11544": " 한날, 대기의 공간이 진동하며 난데없는 푸른", "LORETALK.PAS:literal:11593": "번개가 대륙들 중의 하나를 강타했소.  공간은", "LORETALK.PAS:literal:11642": "휘어지고 시간은 진동하며  이 세계를 공포 속", "LORETALK.PAS:literal:11691": "으로 몰고 갔소.  그 번개의 위력으로 그 불운", "LORETALK.PAS:literal:11741": "한 대륙은  황폐화된 용암 대지로 변하고 말았", "LORETALK.PAS:literal:11790": "고, 다른 하나의 대륙은 충돌시의 진동에 의해", "LORETALK.PAS:literal:11839": "바다 깊이 가라앉아 버렸소.", "LORETALK.PAS:literal:11878": " 그런 일이 있은 한참 후에,  이상하게도 용암", "LORETALK.PAS:literal:11928": "대지의 대륙으로부터 강한 생명의 기운이 발산", "LORETALK.PAS:literal:11976": "되기 시작 했소.  그래서, 우리들은 그 원인을", "LORETALK.PAS:literal:12026": "알아보기 위해 'LORE 특공대'를 조직하기로 합", "LORETALK.PAS:literal:12079": "의를 하고 이곳에 있는 거의 모든 용사들을 모", "LORETALK.PAS:literal:12128": "아서 용암 대지로 변한 그 대륙으로 급히 그들", "LORETALK.PAS:literal:12177": "을 파견하였지만 여태껏 아무 소식도 듣지못했", "LORETALK.PAS:literal:12225": "소. 그들이 생존해 있는지 조차도 말이오.", "LORETALK.PAS:literal:12272": " 이런 저런 방법을 통하여 그들의 생사를 알아", "LORETALK.PAS:literal:1228": " `MENACE' 속에는 Dwarf, Giant, Wolf, Python", "LORETALK.PAS:literal:12325": "려던중 우연히 우리들은 '", "LORETALK.PAS:literal:12343": "Necromancer", "LORETALK.PAS:literal:12357": "'라고 불", "LORETALK.PAS:literal:12387": "리우는  용암 대지속의  새로운 세력의 존재를", "LORETALK.PAS:literal:12436": "알아내었고,  그때의 그들은 이미 막강한 세력", "LORETALK.PAS:literal:12485": "으로 성장해가고 있는중 이었소.  그때의 번개", "LORETALK.PAS:literal:12534": "는 그가 이 공간으로 이동하는 수단이었소. 즉", "LORETALK.PAS:literal:12583": "그는 이 공간의 인물이 아닌 다른 차원을 가진", "LORETALK.PAS:literal:12632": "공간에서 왔던 것이오.", "LORETALK.PAS:literal:12668": " 그는 현재 이 세계의 반을  그의 세력권 안에", "LORETALK.PAS:literal:12718": "넣고 있소. 여기서 당신의 궁극적인 임무는 바", "LORETALK.PAS:literal:12771": "로 '", "LORETALK.PAS:literal:12778": "Necromancer 의 야심을 봉쇄 시키는 것", "LORETALK.PAS:literal:12807": "'이", "LORETALK.PAS:literal:12834": "라는 걸 명심해 두시오.", "LORETALK.PAS:literal:12868": "", "LORETALK.PAS:literal:1292": "같은 괴물들이 살고 있소.", "LORETALK.PAS:literal:12962": " Necromancer 의 영향력은 이미 LORE 대륙까지", "LORETALK.PAS:literal:13018": "도달해있소.  또한 그들은 이 대륙의 남서쪽에", "LORETALK.PAS:literal:13067": "'MENACE' 라고 불리우는 지하 동굴을 얼마전에", "LORETALK.PAS:literal:13121": "구축했소.  그래서, 그 동굴의 존재 때문에 우", "LORETALK.PAS:literal:13171": "리들은 그에게 위협을 당하게 되었던 것이오.", "LORETALK.PAS:literal:13219": " 하지만, LORE 특공대가 이 대륙을 떠난후로는", "LORETALK.PAS:literal:13270": "그 일당들에게 대적할 용사는  이미  남아있지", "LORETALK.PAS:literal:13319": "않았소. 그래서 부탁하건데, 그 동굴을 중심부", "LORETALK.PAS:literal:13368": "까지 탐사해 주시오.", "LORETALK.PAS:literal:13403": " 나는 당신들에게 Necromancer에 대한 일을 맡", "LORETALK.PAS:literal:13457": "기고 싶지만, 아직은 당신들의  확실한 능력을", "LORETALK.PAS:literal:13506": "모르는 상태이지요.  그래서 이 일은 당신들의", "LORETALK.PAS:literal:13555": "잠재력을 증명해 주는 좋은 기회가 될것이오.", "LORETALK.PAS:literal:13603": " 만약 당신들이 무기가 필요하다면 무기고에서", "LORETALK.PAS:literal:13651": "약간의 무기를 가져가도록 허락하겠소.", "LORETALK.PAS:literal:13692": "", "LORETALK.PAS:literal:13790": " 대륙의 남서쪽에 있는 `", "LORETALK.PAS:literal:13807": "MENACE", "LORETALK.PAS:literal:13816": "'를 탐사해 주시오.", "LORETALK.PAS:literal:1384": " 나의 부모님은 Python 의 독에 의해 돌아 가셨습니다.", "LORETALK.PAS:literal:13915": "당신들의 성공을 축하하오 !!", "LORETALK.PAS:literal:13956": "[EXP + 1000]", "LORETALK.PAS:literal:14212": " 드디어 나는 당신들의 능력을 믿을수 있게 되", "LORETALK.PAS:literal:14261": "었소.  그렇다면 당신들에게 Necromancer 응징", "LORETALK.PAS:literal:14315": "이라는 막중한 임무를 한번 맡겨 보겠소.", "LORETALK.PAS:literal:14365": " 먼저 대륙의 동쪽에 있는 '", "LORETALK.PAS:literal:1438": " Python 은 정말 위험한 존재입니다.", "LORETALK.PAS:literal:14385": "LASTDITCH", "LORETALK.PAS:literal:14397": "'에 가보", "LORETALK.PAS:literal:14431": "도록 하시오. '", "LORETALK.PAS:literal:14444": "LASTDITCH", "LORETALK.PAS:literal:14456": "'성에는 지금 많은 근", "LORETALK.PAS:literal:14493": "심에 쌓여있소. 그들을 도와 주시오.", "LORETALK.PAS:literal:14611": " 당신은 이제 스스로 행동해 나가시오.", "LORETALK.PAS:literal:1527": " 단지 Lord Ahn 만이 능력 상으로 Necromancer 에게 도전할 수 있습니다.", "LORETALK.PAS:literal:1596": " 하지만 Lord Ahn 자신이 대립을 싫어해서, 현재는", "LORETALK.PAS:literal:1648": " Necromancer 에게 대항할 자가 없습니다.", "LORETALK.PAS:literal:1733": " 우리는 Ancient Evil을 배척하고 Lord Ahn님을 받들어야 합니다.", "LORETALK.PAS:literal:1828": " 우리는 MENACE 의 동쪽에 있는 나무로부터 많은 식량을 얻은적이 있습니다.", "LORETALK.PAS:literal:1939": " 이 세계의 창시자는 안 영기님 이시며, 그는 위대한 프로그래머 입니다.", "LORETALK.PAS:literal:2110": " 어서 오십시오. 여기는 LORE 주점입니다.", "LORETALK.PAS:literal:2190": " 거기 ", "LORETALK.PAS:literal:2199": "분 어서 오십시오.", "LORETALK.PAS:literal:2246": " 위스키에서 칵테일까지 마음껏 선택하십시오.", "LORETALK.PAS:literal:2317": "...", "LORETALK.PAS:literal:2355": "요새 무덤쪽에서 유령이 떠돈다던데...", "LORETALK.PAS:literal:237": " 당신이 모험을 시작한다면, 많은 괴물들을 만날 것이오.", "LORETALK.PAS:literal:2411": "하하하, 자네도 한번 마셔보게나.", "LORETALK.PAS:literal:2483": " 이제 Lord Ahn의 시대도 끝나가는가 ? 그까짓", "LORETALK.PAS:literal:2535": "Necromancer라는 작자에게 쩔쩔 매는 꼴이라니", "LORETALK.PAS:literal:2587": "...  차라리 내가 나가서 그 놈과 싸우는게 났", "LORETALK.PAS:literal:2634": "겠다.", "LORETALK.PAS:literal:2703": " 당신은 Skeleton 족의 한명이 우리와 함께 생", "LORETALK.PAS:literal:2755": "활하려 한다는 것에 대해서 어떻게 생각하십니", "LORETALK.PAS:literal:2802": "까 ?  저는 그 말을 들었을때 너무 혐오스러웠", "LORETALK.PAS:literal:2851": "습니다. 어서 빨리 그 살아있는 뼈다귀를 여기", "LORETALK.PAS:literal:288": " 무엇보다도, Serpent 와 Insects 와 Python 은", "LORETALK.PAS:literal:2896": "서 쫒아냈으면 좋겠습니다.", "LORETALK.PAS:literal:2957": " ... 끄~~윽 ... ...", "LORETALK.PAS:literal:3028": " 이보게 자네, 내말 좀 들어 보게나.  나의 친", "LORETALK.PAS:literal:3078": "구들은 이제 이 세상에 없다네. 그들은 너무나", "LORETALK.PAS:literal:3126": "도 용감하고 믿음직스런 친구들이었는데... 내", "LORETALK.PAS:literal:3174": "가 다리를 다쳐 병원에 있을 동안 그들은 모두", "LORETALK.PAS:literal:3222": "이 대륙의 평화를 위해 LORE 특공대에 지원 했", "LORETALK.PAS:literal:3272": "다네.  하지만 그들은 아무도 다시는 돌아오지", "LORETALK.PAS:literal:3320": "못했어.  그런 그들에게 이렇게 살아있는 나로", "LORETALK.PAS:literal:3368": "서는 미안할 뿐이네  그래서 술로 나날을 보내", "LORETALK.PAS:literal:3416": "고 있지. 죄책감을 잊기위해서 말이지...", "LORETALK.PAS:literal:345": " 맹독이 있으니 주의 하시기 바라오.", "LORETALK.PAS:literal:3459": "", "LORETALK.PAS:literal:3525": " 물러나십시오.  여기는 용사의 유골들을 안치", "LORETALK.PAS:literal:3570": "해 놓은 곳입니다.", "LORETALK.PAS:literal:3679": " 당신이  한 유골 앞에 섰을때  이상한 느낌과", "LORETALK.PAS:literal:3725": "함께 먼곳으로 부터 어떤 소리가 들려왔다.", "LORETALK.PAS:literal:3772": " 안녕하시오. 대담한 용사여.", "LORETALK.PAS:literal:3812": " 당신이 나의 잠을 깨웠소 ?  나는 고대에 이", "LORETALK.PAS:literal:3862": "곳을 지키다가 죽어간 기사 Jr. Antares 라고", "LORETALK.PAS:literal:3915": "하오.  저의 아버지는 Red Antares 라고 불리", "LORETALK.PAS:literal:3969": "웠던 최강의 마법사였소.  그는 말년에  어떤", "LORETALK.PAS:literal:4018": "동굴로 은신을 한 후 아무에게도 모습을 나타", "LORETALK.PAS:literal:4066": "내지 않았소.  하지만 당신의 운명은 나의 아", "LORETALK.PAS:literal:4115": "버지를 만나야만하는 운명이라는 것을 알수있", "LORETALK.PAS:literal:412": "Orc 는 가장 하급 괴물이오.", "LORETALK.PAS:literal:4162": "소.  반드시 나의 아버지를 만나서 당신이 알", "LORETALK.PAS:literal:4211": "지 못했던 새로운 능력들을 배우시오. 그리고", "LORETALK.PAS:literal:4259": "나의 아버지를 당신의 동행으로 참가시키도록", "LORETALK.PAS:literal:4306": "하시오. 물론 좀 어렵겠지만 ...", "LORETALK.PAS:literal:4369": " 아참,  그리고 내가 죽기전에 여기에 뭔가를", "LORETALK.PAS:literal:4418": "여기에 숨겨 두었는데  당신에게 도움이 될지", "LORETALK.PAS:literal:4466": "모르겠소. 그럼, 나는 다시 오랜 잠으로 들어", "LORETALK.PAS:literal:4515": "가야 겠소.", "LORETALK.PAS:literal:4775": " 힘내게, ", "LORETALK.PAS:literal:4819": " 자네라면 충분히 Necromancer를 무찌를수 있", "LORETALK.PAS:literal:4868": "을 걸세. 자네만 믿겠네.", "LORETALK.PAS:literal:4948": " 위의 저 친구로부터  당신 얘기 많이 들었습", "LORETALK.PAS:literal:4996": "니다. 저는 우리성에서 당신같은 용감한 사람", "LORETALK.PAS:literal:5040": "이 있다는걸 자랑스럽게 생각합니다.", "LORETALK.PAS:literal:5125": " 만약, 당신들이  그 일을 해내기가 어렵다고", "LORETALK.PAS:literal:5173": "생각되시면 LASTDITCH 성에서  성문을 지키고", "LORETALK.PAS:literal:5224": "있는 Polaris란 청년을 일행에 참가시켜 주십", "LORETALK.PAS:literal:5274": "시오.  분명 그 사람이라면 쾌히 승락할 겁니", "LORETALK.PAS:literal:5319": "다.", "LORETALK.PAS:literal:5387": " 이 안에 갇혀있는 사람들에게는 일체 면회가", "LORETALK.PAS:literal:5431": "허용되지 않습니다. 나가 주십시오.", "LORETALK.PAS:literal:5516": " 여기는 Lord Ahn의 체제에 대해서 깊은 반감", "LORETALK.PAS:literal:5567": "을 가지고 있는 자들을 수용하고 있습니다.", "LORETALK.PAS:literal:5613": " 아마 그들은 죽기전에는 이곳을 나올수 없을", "LORETALK.PAS:literal:5657": "겁니다.", "LORETALK.PAS:literal:5727": " 나는 이곳의 기사로서  이 세계의 모든 대륙", "LORETALK.PAS:literal:5775": "을 탐험하고 돌아왔었습니다. 내가 마지막 대", "LORETALK.PAS:literal:5822": "륙을 돌았을때  나는 새로운 존재를 발견했습", "LORETALK.PAS:literal:5869": "니다. 그는 바로 예전까지도 Lord Ahn과 대립", "LORETALK.PAS:literal:5920": "하던 Ancient Evil이라는 존재였습니다. 지금", "LORETALK.PAS:literal:5972": "우리의 성에서는 철저하게 배격하도록 어릴때", "LORETALK.PAS:literal:6018": "부터 가르침 받아온 그 Ancient Evil이었습니", "LORETALK.PAS:literal:6070": "다.  하지만 그곳에서 본 그는 우리가 알고있", "LORETALK.PAS:literal:6118": "는 그와는 전혀 다른 인간미를 가진  말 그대", "LORETALK.PAS:literal:6166": "로  신과같은 존재였습니다.  내가 그의 신앙", "LORETALK.PAS:literal:6214": "아래 있는 어느 도시를 돌면서 내가 느낀것은", "LORETALK.PAS:literal:6261": "정말 Lord Ahn에게서는 찾아볼수가 없는 그런", "LORETALK.PAS:literal:6311": "자애와 따뜻한 정이었습니다.  그리고 여태껏", "LORETALK.PAS:literal:6358": "내가 알고 있는 그에 대한 지식이  정말 잘못", "LORETALK.PAS:literal:6406": "되었다는 것과  이런 사실을 다른 사람에게도", "LORETALK.PAS:literal:6453": "알려주고 싶다는 이유로  그의 사상을 퍼뜨리", "LORETALK.PAS:literal:6500": "다 이렇게 잡히게 된것입니다.", "LORETALK.PAS:literal:6559": " 하지만 더욱 이상한것은 Lord Ahn 자신도 그", "LORETALK.PAS:literal:6610": "에 대한 사실을 인정하면서도  왜 우리에게는", "LORETALK.PAS:literal:6657": "그를 배격하도록만 교육시키는 가를  알고 싶", "LORETALK.PAS:literal:6704": "을뿐입니다. Lord Ahn께서는 나를 이해한다고", "LORETALK.PAS:literal:6754": "하셨지만 사회 혼란을 방지하기 위해 나를 이", "LORETALK.PAS:literal:6801": "렇게 밖에 할수 없다고 말씀하시더군요. 그리", "LORETALK.PAS:literal:6848": "이것은 선을 대표하는 자기로서는 이 방법 밖", "LORETALK.PAS:literal:6895": "에는 없다고 하시더군요.", "LORETALK.PAS:literal:6931": " 하지만 Lord Ahn의 마음은 사실 이렇지 않다", "LORETALK.PAS:literal:6982": "는걸 알수 있었습니다.  Ancient Evil의 말로", "LORETALK.PAS:literal:7035": "는 사실 서로가 매우 절친한 관계임을 알수가", "LORETALK.PAS:literal:7082": "있었기 때문입니다.", "LORETALK.PAS:literal:7178": " 히히히... 위대한 용사님. 낄낄낄.. 내가 당", "LORETALK.PAS:literal:7228": "신들의 일행에 끼이면 안될까요 ? 우히히히..", "LORETALK.PAS:literal:7298": "그렇다면 당신을 받아들이지요", "LORETALK.PAS:literal:7335": "당신은 이곳에 그냥 있는게 낫겠소", "LORETALK.PAS:literal:743": " 당신이  Necromancer에 진정으로  대항하고자", "LORETALK.PAS:literal:799": "한다면, 이 성의 바로위에 있는 피라밋에 가보", "LORETALK.PAS:literal:8045": " 안녕하시오. 나는 한때 이 곳의 유명한 도둑", "LORETALK.PAS:literal:8093": "이었던 사람이오.  결국 그 때문에 나는 잡혀", "LORETALK.PAS:literal:8141": "서 평생 여기에 있게 되었지만...", "LORETALK.PAS:literal:8187": " 그건 그렇고, 내가 LORE 성의 보물인 ", "LORETALK.PAS:literal:8214": "황금의", "LORETALK.PAS:literal:8250": "방패", "LORETALK.PAS:literal:8255": "를 훔쳐 달아나다. 그만 그것을 MENACE라", "LORETALK.PAS:literal:8303": "는 금광에 숨겨 놓은채 잡혀 버리고 말았소.", "LORETALK.PAS:literal:8350": "나는 이제 그것을 가져봤자 쓸때도 없으니 차", "LORETALK.PAS:literal:8397": "라리 당신이 그걸 가지시오. 가만있자...  어", "LORETALK.PAS:literal:8446": "디였더라...  그래 ! MENACE의 가운데쯤에 벽", "LORETALK.PAS:literal:8498": "으로 사방이 둘러 싸여진 곳이었는데..  당신", "LORETALK.PAS:literal:850": "도록하시오. 그 곳은 Necromancer와 동시에 바", "LORETALK.PAS:literal:8546": "들이라면  지금 여기에 들어온것과 같은 방법", "LORETALK.PAS:literal:8593": "으로 들어가서 방패를 찾을수 있을것이오. 행", "LORETALK.PAS:literal:8640": "운을 빌겠소.", "LORETALK.PAS:literal:8733": " 당신들에게 경고해 두겠는데 건너편 방에 있", "LORETALK.PAS:literal:8780": "는 Joe는 오랜 수감생활 끝에 미쳐 버리고 말", "LORETALK.PAS:literal:8829": "았소.  그의 말에 속아서 당신네 일행에 참가", "LORETALK.PAS:literal:8874": "시키는 그런 실수는 하지마시오.", "LORETALK.PAS:literal:9026": " Lord Ahn 님의 명령에 의해서 당신들에게 한", "LORETALK.PAS:literal:9080": "가지의 무기를 드리겠습니다.  들어가셔서 무", "LORETALK.PAS:literal:910": "다에서 떠오른 ", "LORETALK.PAS:literal:9130": "기를 선택해 주십시오.", "LORETALK.PAS:literal:9203": " 여기서 가져가신 무기를 잘 사용하셔서 세계", "LORETALK.PAS:literal:921": "또다른 지식의 성전", "LORETALK.PAS:literal:9253": "의 적인 Necromancer를 무찔러 주십시오.", "LORETALK.PAS:literal:934": "이기 때문이", "LORETALK.PAS:literal:9365": "MENACE 에는 금덩이가 많다던데...", "LORETALK.PAS:literal:9422": "MENACE 는 한때 금광이었습니다.", "LORETALK.PAS:literal:966": "오.  당신이 어느 수준이 되어 그 곳에 들어간", "LORETALK.PAS:literal:9743": "행운을 빌겠소 !!!", "LORETALK.PAS:literal:9801": "저희 성주님을 만나 보십시오.", "LORETALK.PAS:literal:9858": "당신은 이 게임 세계에 도전하고 싶습니까 ?", "LORETALK.PAS:literal:9906": "(Y/n)"}, "main_story": [{"node": "prologue/arrival", "required_block_ids": ["prologue/arrival_first"]}, {"node": "prologue/courtyard", "required_block_ids": ["prologue/guide_dialogue"]}, {"node": "prologue/audience", "required_block_ids": ["prologue/audience_enter", "prologue/lord_intro_dialogue"]}, {"node": "prologue/briefing", "required_block_ids": ["prologue/lord_history_dialogue"]}, {"node": "lore_menace/assignment", "required_block_ids": ["lore_menace/request_quote", "lore_menace/request_reply"]}, {"node": "lore_menace/preparation", "required_block_ids": ["lore_menace/preparation_pause"]}, {"node": "i/threshold", "required_block_ids": ["i/threshold_question"]}, {"node": "lore_menace/castle_exit", "required_block_ids": ["lore_menace/exit_call_quote", "lore_menace/skeleton_quote"]}, {"node": "lore_menace/departure_path", "required_block_ids": ["lore_menace/departure_result"]}, {"node": "lore_menace/road", "required_block_ids": ["lore_menace/road_first"]}, {"node": "lore_menace/cave_entry", "required_block_ids": ["lore_menace/cave_threshold"]}, {"node": "lore_menace/cave_walk", "required_block_ids": ["lore_menace/walk_sense"]}, {"node": "lore_menace/center", "required_block_ids": ["lore_menace/center_quote", "lore_menace/center_after"]}, {"node": "lore_menace/return_road", "required_block_ids": ["lore_menace/return_first"]}, {"node": "lore_menace/report", "required_block_ids": ["lore_menace/report_words", "lore_menace/report_quote", "lore_menace/reward_counter_quote"]}, {"node": "lore_menace/next_task", "required_block_ids": ["lore_menace/next_quote"]}, {"node": "lore_menace/farewell", "required_block_ids": ["lore_menace/farewell_quote"]}], "nodes": [{"blocks": [{"id": "prologue/arrival_first", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "발밑에서 돌이 흔들렸다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 발을 거뒀다. 돌과 돌 사이에 흙이 끼어 있었다. 방금 밟은 자리에 무게를 실었다면 발목부터 꺾였을 것이다.\n\n성문은 그보다 훨씬 높았다.\n\n먼저 들어가는 사람들은 고개를 들지 않았다. 누군가는 짐을 끌었고 누군가는 나오던 사람과 어깨를 부딪쳤다. 자신만 문 앞에 멈춰 있다는 사실이 뒤늦게 느껴졌다.\n\n뒤에서 발소리가 가까워졌다. 그는 옆으로 비켰다.\n\n여기까지 왔다.\n\n그런데 어디로 가야 하지?\n\n문 안쪽을 보는 동안 짐을 끄는 사람이 그 앞을 지나갔다. 바퀴가 돌의 경계를 넘었다. 덜컥. 익숙한 길인 듯 그 사람은 멈추지 않았다. 그는 그 뒤를 따르려다가 몸을 돌렸다. 혼자 온 길이 아니었다."}], "when": true}, {"id": "prologue/arrival_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "뒤따라온 일행이 문 앞에 모였다.\n\n누군가는 성 안을 보고, 누군가는 지나가는 사람에게 길을 내주었다. 아직 서로의 걸음도 맞추지 못했다. 낯선 곳에서 한꺼번에 움직이기부터 하면 한 사람이 빠져도 모를 수 있었다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 손을 들었다.\n\n“잠깐만요.”\n\n일행의 눈길이 그에게 모였다. 어디로 가자는 말은 아니었다. 지금 누가 함께 있는지부터 확인할 생각이었다."}], "when": true}, {"id": "i/party_intro", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "문을 넘자 발소리가 흩어졌다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 가까운 사람부터 눈을 맞췄다. 다 같이 오라는 손짓보다 이름 하나가 빨랐다. 이름을 부르면 대답이 왔다. 대답을 들으면 뒤를 돌아볼 수 있었다.\n\n낯선 성에서 가장 먼저 익혀야 할 것은 지도가 아니었다.\n\n곁에서 돌아오는 목소리였다."}], "when": true}, {"id": "i/intro_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "은/는"}}, {"text": " "}, {"ref": {"catalog": "equipment", "id": "story_axe", "particle": "을/를"}}, {"text": " 세워 들었다. 긴 손잡이가 지나가는 사람의 길을 막으려다가 몸 옆으로 돌아왔다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "이/가"}}, {"text": " 부르자 그가 고개를 들었다.\n\n“여기 있습니다.”\n\n말을 끝내자마자 뒤쪽을 확인했다. 나머지 사람도 문을 넘고 있었다. 앞만 보는 사람은 아니었다.\n\n그는 옆으로 비켜 일행이 설 자리를 만들었다."}], "when": true}, {"id": "i/intro_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_hunter", "particle": "은/는"}}, {"text": " "}, {"ref": {"catalog": "equipment", "id": "story_bow", "particle": "을/를"}}, {"text": " 짐에서 떼어 놓고 안뜰을 살폈다. 무기를 고쳐 잡는 일보다 길을 보는 일이 빨랐다.\n\n사람들이 오가는 쪽. 짐을 세워 둔 쪽. 그 사이에 생겼다가 사라지는 빈자리.\n\n그가 가리키자 "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 반걸음 옮겼다. 뒤에서 오는 사람이 곧바로 그 자리를 지나갔다.\n\n“이쪽이 덜 걸립니다.”\n\n성 안에서 받은 첫 도움은 거창하지 않았다. 서 있을 자리 하나였다."}], "when": true}, {"id": "i/intro_party_cook", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_cook", "particle": "은/는"}}, {"text": " "}, {"ref": {"catalog": "equipment", "id": "story_knife", "particle": "을/를"}}, {"text": " 감싼 자리를 눌렀다. 날은 보이지 않았다. 늘어진 끈을 안으로 넣은 뒤에야 손을 뗐다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 제 옷자락을 내려다봤다. 문을 넘으면서 잡아당겨진 곳이 있었다. 짐의 끈이 걸렸던 모양이었다.\n\n“그쪽도요.”\n\n그가 자기 짐을 고쳐 묶었다. 누군가는 길을 봤고, 누군가는 사람을 봤다. 이 사람은 서로 걸려 넘어질 것을 먼저 보고 있었다."}], "when": true}, {"id": "i/intro_party_magician", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌바닥에 "}, {"ref": {"catalog": "equipment", "id": "story_wand"}}, {"text": " 끝이 닿았다.\n\n톡.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 시선을 돌렸다. 주문이라도 시작되는 줄 알았다. "}, {"ref": {"catalog": "characters", "id": "party_magician", "particle": "은/는"}}, {"text": " 지팡이를 들어 몸 옆에 붙였을 뿐이었다.\n\n아무 빛도 나타나지 않았다.\n\n그가 바라본 것은 높은 성문과 안쪽 복도였다. 같은 문을 넘어와도 살피는 것은 달랐다.\n\n무기를 들고 있다고 모든 문제를 해결할 수 있는 것은 아니었다. 그 생각은 문 안으로 들어온 뒤에도 따라붙었다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 다음 장면에 전달한다."}], "effects": [], "id": "prologue/enter_courtyard", "label": [{"text": "성 안으로 걸음을 옮긴다"}], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "prologue/courtyard", "when": true}], "editorial": {"intent": "원문 사이를 연결하는 시범 장면", "notes": "공간·행동·심리 묘사는 창작. 원문을 새로운 진상으로 확장하지 않는다.", "source_refs": ["prologue/start"], "status": "draft"}, "entry_when": true, "handoff": null, "id": "prologue/arrival", "kind": "scene", "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "source_adaptation", "source_refs": ["prologue/start"]}, "title": [{"text": "성 안에서"}]}, {"blocks": [{"id": "prologue/guide_dialogue", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:11005"], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "source_exact", "source_refs": ["prologue/guide"]}, "speaker": "castle_guide", "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:11005"]}}], "when": true}, {"id": "prologue/courtyard_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "안내를 듣고 나서야 갈 곳이 생겼다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 가리킨 쪽을 보았다. 성주가 기다린다고 했다. 자신들을 만나려 한다는 말은 반가워야 했다. 그런데 들어가기도 전에 목부터 말랐다.\n\n무엇을 물을까.\n\n어디서 왔느냐는 말에는 대답할 수 있었다. 무엇을 할 수 있느냐고 묻는다면?\n\n그는 일행을 돌아봤다. 누구도 먼저 뛰어가지 않았다. 접견실로 가는 길은 하나였지만 그 길을 곧장 걸어야 할 이유까지 들은 것은 아니었다. 주변에는 말소리가 있었다. 먼저 이야기를 들을 수도 있었다.\n\n걸음을 떼기 직전, 손을 쥐었다 폈다. 문턱 하나를 넘었을 뿐인데 다음 문턱은 더 높아 보였다."}], "when": true}, {"id": "i/threshold_before_assignment", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:9801"], "provenance": {"note": "독립 스냅샷의 해당 조건·대사. 증언은 확정 진상이 아니다.", "origin": "source_exact", "source_refs": ["i/castle_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:9801"]}}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 다음 장면에 전달한다."}], "effects": [], "id": "prologue/visit_lord", "label": [{"text": "성주를 만나러 간다"}], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "prologue/audience", "when": note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "문 앞에서 속도를 늦췄다.\n\n뒤의 소음이 멀어졌다. 대신 발을 놓을 때마다 방 안에서 돌바닥이 울렸다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 한 걸음 옮기고 멈췄다.\n\n어디까지 들어가야 하는지 몰랐다. 너무 멀리 서면 얼굴이 보이지 않을 것이고, 너무 가까이 가면 물러서라고 할지도 몰랐다.\n\n눈앞의 사람이 일행을 보았다.\n\n그 순간, 들어오기 전에 준비한 말이 하나도 떠오르지 않았다. 그는 고개를 숙였다. 우선 인사부터 했다."}], "when": true}, {"id": "prologue/lord_intro_dialogue", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:11156", "LORETALK.PAS:literal:11163", "LORETALK.PAS:literal:11174", "LORETALK.PAS:literal:11202", "LORETALK.PAS:literal:11251", "LORETALK.PAS:literal:11297"], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "source_exact", "source_refs": ["prologue/lord_intro"]}, "speaker": "lord_ahn", "text": [{"source": {"bindings": [{"end": 12, "ref": {"catalog": "characters", "id": "lord_ahn"}, "start": 4}], "literal_ids": ["LORETALK.PAS:literal:11156", "LORETALK.PAS:literal:11163", "LORETALK.PAS:literal:11174", "LORETALK.PAS:literal:11202", "LORETALK.PAS:literal:11251", "LORETALK.PAS:literal:11297"]}}], "when": true}, {"id": "prologue/audience_wait", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "이름을 밝힌 사람은 서두르지 않았다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 이름을 속으로 따라 했다. "}, {"ref": {"catalog": "characters", "id": "lord_ahn"}}, {"text": ".\n\n얼굴과 이름이 연결되자 막연했던 상대가 조금 가까워졌다. 그렇다고 편해진 것은 아니었다. 성주는 그 뒤에 선 사람들까지 보고 있었다.\n\n혼자 대답하고 끝낼 일이 아닐 수도 있었다.\n\n그는 고개를 들었다. 이제 상대가 무슨 말을 꺼내는지 들어야 했다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 다음 장면에 전달한다."}], "effects": [], "id": "prologue/hear_lord_intro", "label": [{"text": "성주의 설명을 듣는다"}], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "prologue/briefing", "when": true}], "editorial": {"intent": "원문 사이를 연결하는 시범 장면", "notes": "공간·행동·심리 묘사는 창작. 원문을 새로운 진상으로 확장하지 않는다.", "source_refs": ["prologue/lord_intro"], "status": "draft"}, "entry_when": true, "handoff": null, "id": "prologue/audience", "kind": "scene", "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "source_adaptation", "source_refs": ["prologue/lord_intro"]}, "title": [{"text": "이름을 밝히는 사람"}]}, {"blocks": [{"id": "prologue/briefing_memory", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말이 시작되기 전, 안뜰의 모습이 떠올랐다.\n\n사람들이 짐을 옮겼다. 누군가는 길을 비켜 주었다. 문은 열렸다 닫혔다. 그 안에서 살아가는 이들에게 오늘도 하던 일이 있을 것이다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성주의 입을 보았다.\n\n그 일상을 지키려면 무엇이 필요할까. 아직 답은 없었다."}], "when": {"op": "eq", "state": "knowledge.missing_squad", "value": true}}, {"id": "prologue/lord_history_dialogue", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:11399", "LORETALK.PAS:literal:11448", "LORETALK.PAS:literal:11497", "LORETALK.PAS:literal:11544", "LORETALK.PAS:literal:11593", "LORETALK.PAS:literal:11642", "LORETALK.PAS:literal:11691", "LORETALK.PAS:literal:11741", "LORETALK.PAS:literal:11790", "LORETALK.PAS:literal:11839", "LORETALK.PAS:literal:11878", "LORETALK.PAS:literal:11928", "LORETALK.PAS:literal:11976", "LORETALK.PAS:literal:12026", "LORETALK.PAS:literal:12079", "LORETALK.PAS:literal:12128", "LORETALK.PAS:literal:12177", "LORETALK.PAS:literal:12225", "LORETALK.PAS:literal:12272", "LORETALK.PAS:literal:12325", "LORETALK.PAS:literal:12343", "LORETALK.PAS:literal:12357", "LORETALK.PAS:literal:12387", "LORETALK.PAS:literal:12436", "LORETALK.PAS:literal:12485", "LORETALK.PAS:literal:12534", "LORETALK.PAS:literal:12583", "LORETALK.PAS:literal:12632", "LORETALK.PAS:literal:12668", "LORETALK.PAS:literal:12718", "LORETALK.PAS:literal:12771", "LORETALK.PAS:literal:12778", "LORETALK.PAS:literal:12807", "LORETALK.PAS:literal:12834", "LORETALK.PAS:literal:12868"], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "source_exact", "source_refs": ["prologue/lord_history"]}, "speaker": "lord_ahn", "text": [{"source": {"bindings": [{"end": 328, "ref": {"catalog": "terms", "id": "lore"}, "start": 324}, {"end": 489, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 478}, {"end": 696, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 685}], "literal_ids": ["LORETALK.PAS:literal:11399", "LORETALK.PAS:literal:11448", "LORETALK.PAS:literal:11497", "LORETALK.PAS:literal:11544", "LORETALK.PAS:literal:11593", "LORETALK.PAS:literal:11642", "LORETALK.PAS:literal:11691", "LORETALK.PAS:literal:11741", "LORETALK.PAS:literal:11790", "LORETALK.PAS:literal:11839", "LORETALK.PAS:literal:11878", "LORETALK.PAS:literal:11928", "LORETALK.PAS:literal:11976", "LORETALK.PAS:literal:12026", "LORETALK.PAS:literal:12079", "LORETALK.PAS:literal:12128", "LORETALK.PAS:literal:12177", "LORETALK.PAS:literal:12225", "LORETALK.PAS:literal:12272", "LORETALK.PAS:literal:12325", "LORETALK.PAS:literal:12343", "LORETALK.PAS:literal:12357", "LORETALK.PAS:literal:12387", "LORETALK.PAS:literal:12436", "LORETALK.PAS:literal:12485", "LORETALK.PAS:literal:12534", "LORETALK.PAS:literal:12583", "LORETALK.PAS:literal:12632", "LORETALK.PAS:literal:12668", "LORETALK.PAS:literal:12718", "LORETALK.PAS:literal:12771", "LORETALK.PAS:literal:12778", "LORETALK.PAS:literal:12807", "LORETALK.PAS:literal:12834", "LORETALK.PAS:literal:12868"]}}], "when": true}, {"id": "prologue/briefing_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "설명이 끝났다.\n\n그런데 아무도 바로 움직이지 않았다. 뒤에서 천이 스치는 소리가 들렸다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 자신도 숨을 얕게 쉬고 있었다는 것을 깨달았다.\n\n이야기 속의 땅은 멀었다. 가라앉은 곳도, 돌아오지 못한 사람도 눈앞에는 없었다. 하지만 그 일 때문에 이 방까지 왔다는 사실은 피할 수 없었다.\n\n무엇을 해야 하지?\n\n큰 이야기에는 자신들이 설 자리 하나쯤 있겠지 생각했다. 설명을 다 듣고도 그 자리는 보이지 않았다. 성주가 말하기를 기다려도 좋았다. 그러면 일행은 여기서 언제까지 서 있어야 할까.\n\n그는 발을 고쳐 디뎠다. 묻는 일부터 할 수 있었다."}], "when": true}, {"id": "prologue/briefing_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“그래서, 지금 저희가 해야 할 일은 무엇입니까?”"}], "when": true}, {"id": "prologue/briefing_end", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "질문은 생각보다 또렷하게 나왔다.\n\n돌이킬 수 없었다. 들은 이야기와 자기 일을 연결해 달라고 먼저 말한 셈이었다. 일행이 곁에 있다는 것도 알았다. 그들을 어디로 데려가야 할지는 아직 몰랐다.\n\n성주가 대답하기를 기다렸다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 다음 장면에 전달한다."}], "effects": [], "id": "prologue/hear_lord_briefing", "label": [{"text": "첫 부탁을 기다린다"}], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "prologue/first_quest_boundary", "when": true}], "editorial": {"intent": "원문 사이를 연결하는 시범 장면", "notes": "공간·행동·심리 묘사는 창작. 원문을 새로운 진상으로 확장하지 않는다.", "source_refs": ["prologue/lord_history"], "status": "draft"}, "entry_when": true, "handoff": null, "id": "prologue/briefing", "kind": "scene", "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "source_adaptation", "source_refs": ["prologue/lord_history"]}, "title": [{"text": "설명의 무게"}]}, {"blocks": [], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "앞선 선택의 상태·지식·사건을 초기화하지 않는다."}], "effects": [], "id": "prologue/first_quest_boundary/continue", "label": [{"text": "다음 이야기로 이어간다"}], "provenance": {"note": "집필 파일 경계 연결용 파생 선택. 게임 선택지가 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/assignment", "when": true}], "editorial": {"intent": "원문 사이를 연결하는 시범 장면", "notes": "공간·행동·심리 묘사는 창작. 원문을 새로운 진상으로 확장하지 않는다.", "source_refs": [], "status": "draft"}, "entry_when": true, "handoff": null, "id": "prologue/first_quest_boundary", "kind": "merge", "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "title": [{"text": "첫 의뢰 직전"}]}, {"blocks": [{"id": "lore_menace/request_before", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성주가 곧바로 대답하지 않았다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 젖은 손을 폈다. 방이 더운 탓만은 아니었다. 해야 할 일을 물을 때까지만 해도 질문 하나라고 생각했다.\n\n대답을 기다리는 동안 그 질문은 약속의 입구가 됐다."}], "when": true}, {"id": "lore_menace/request_silence", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "이제 질문을 거둘 수는 없었다.\n\n아무 일도 맡고 싶지 않은 사람이 할 말은 아니었다. 옆에서 발이 움직였다. 그도 움직이고 싶었다. 그러나 성주가 일행을 보고 있었다."}], "when": true}, {"id": "lore_menace/request_floor", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 발밑을 봤다.\n\n바닥의 금이 신발 아래까지 이어졌다. 그 선을 따라 시선을 피할 수는 있었다. 대답까지 피할 수는 없었다. 그는 다시 고개를 들었다."}], "when": true}, {"id": "lore_menace/request_lord_look", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성주의 시선은 처음과 달랐다.\n\n방금까지는 이야기를 들려주던 사람이었다. 지금은 그 일을 누구에게 맡길지 고르는 사람 같았다. 일행 가운데 누구도 앞으로 나서지 않았다."}], "when": true}, {"id": "lore_menace/request_distant_name", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "necromancer"}}, {"text": ".\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 이름을 떠올렸다. 설명 속에서는 멀리 있었다. 가라앉은 땅 너머에, 돌아오지 못한 사람들의 이야기 뒤에 있었다.\n\n그 이름을 상대로 할 일이 자기들에게 생기는 걸까."}], "when": true}, {"id": "lore_menace/request_waiting_breath", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "숨을 놓치고 있었다.\n\n천천히 내쉬자 마른침이 목에 걸렸다. 성주가 들었을까. 입을 다물었지만 이미 난 소리는 되돌릴 수 없었다. 대답을 기다리는 시간이 길어졌다."}], "when": true}, {"id": "lore_menace/request_lord_motion", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": null, "text": [{"text": "성주가 입을 열었다.\n\n남서쪽. 동굴.\n\n두 말이 먼저 귀에 걸렸다. 손에 잡히지 않던 큰 이야기보다 작은 목적지였다. 일행이 실제로 찾아갈 수 있는 방향이었다."}], "when": true}, {"id": "lore_menace/request_quote", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:12962", "LORETALK.PAS:literal:13018", "LORETALK.PAS:literal:13067", "LORETALK.PAS:literal:13121", "LORETALK.PAS:literal:13171", "LORETALK.PAS:literal:13219", "LORETALK.PAS:literal:13270", "LORETALK.PAS:literal:13319", "LORETALK.PAS:literal:13368", "LORETALK.PAS:literal:13403", "LORETALK.PAS:literal:13457", "LORETALK.PAS:literal:13506", "LORETALK.PAS:literal:13555", "LORETALK.PAS:literal:13603", "LORETALK.PAS:literal:13651", "LORETALK.PAS:literal:13692"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/assignment"]}, "speaker": "lord_ahn", "text": [{"source": {"bindings": [{"end": 12, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 1}, {"end": 27, "ref": {"catalog": "terms", "id": "lore"}, "start": 23}, {"end": 64, "ref": {"catalog": "terms", "id": "menace"}, "start": 58}, {"end": 145, "ref": {"catalog": "terms", "id": "lore"}, "start": 141}, {"end": 244, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 233}], "literal_ids": ["LORETALK.PAS:literal:12962", "LORETALK.PAS:literal:13018", "LORETALK.PAS:literal:13067", "LORETALK.PAS:literal:13121", "LORETALK.PAS:literal:13171", "LORETALK.PAS:literal:13219", "LORETALK.PAS:literal:13270", "LORETALK.PAS:literal:13319", "LORETALK.PAS:literal:13368", "LORETALK.PAS:literal:13403", "LORETALK.PAS:literal:13457", "LORETALK.PAS:literal:13506", "LORETALK.PAS:literal:13555", "LORETALK.PAS:literal:13603", "LORETALK.PAS:literal:13651", "LORETALK.PAS:literal:13692"]}}], "when": true}, {"id": "lore_menace/request_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "중심부까지 탐사하라.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 아직 보지도 않은 입구를 떠올렸다. 들어가면 빛은 등 뒤에 남는다. 더 들어가면 그 빛조차 보이지 않을 것이다.\n\n성주가 말한 곳은 그보다 안쪽이었다."}], "when": true}, {"id": "lore_menace/request_veteran_memory", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "주점에서 들은 목소리가 떠올랐다.\n\n친구들은 돌아오지 않았다고 했다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 말을 듣고도 지금 어디로 가야 하는지 몰랐다. 이제 목적지가 생겼다. 그래서 그 얼굴이 더 선명해졌다."}], "when": {"op": "eq", "state": "knowledge.missing_squad", "value": true}}, {"id": "lore_menace/request_after_recoil", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": null, "text": [{"text": "필요한 무기는 가져가도 좋다고 했다.\n\n잠깐 안심했다. 곧 그 말의 뒤쪽이 보였다. 무기가 필요할 만큼 위험할 수도 있다는 뜻이었다. 그는 접견실 문을 봤다. 나가는 길은 그대로인데, 나가서 할 일은 달라져 있었다."}], "when": true}, {"id": "lore_menace/request_question_gather", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 일행을 봤다.\n\n이 부탁은 혼자 들은 것이 아니었다. 자신이 대답하면 그들도 함께 움직인다. 목적지를 확인하는 것만으로는 부족했다. 무엇을 해야 하는지까지 분명히 해야 했다."}], "when": true}, {"id": "lore_menace/request_scope_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": "protagonist", "text": [{"text": "“안에서 싸워야 합니까?”"}], "when": true}, {"id": "lore_menace/request_scope_wait", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "짧게 물었지만, 정말 묻고 싶은 말은 더 길었다.\n\n피할 수 있는 위험인가. 꼭 해야 하는 일인가.\n\n그는 덧붙이지 않았다. 성주의 대답을 먼저 기다렸다."}], "when": true}, {"id": "lore_menace/request_scope_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": "lord_ahn", "text": [{"text": "“내가 부탁한 것은 탐사요. 중심부까지 가 주시오.”"}], "when": true}, {"id": "lore_menace/request_scope_face", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "안전하다는 말은 없었다.\n\n금방 다녀올 수 있다는 말도 없었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 자신이 그런 말을 기다리고 있었다는 것을 알아차렸다.\n\n중심부까지.\n\n목적은 분명했다. 돌아오는 방법은 일행이 찾아야 했다."}], "when": true}, {"id": "lore_menace/request_proof_sting", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": null, "text": [{"text": "능력을 증명해 달라는 말이 늦게 걸렸다.\n\n믿지 못한다는 뜻인가?\n\n그는 성주를 봤다. 아직 해 보인 일이 없었다. 함께 왔다는 것과 함께 돌아올 수 있다는 것은 달랐다."}], "when": true}, {"id": "lore_menace/request_proof_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": "protagonist", "text": [{"text": "“돌아오면, 그때는 믿으실 수 있습니까?”"}], "when": true}, {"id": "lore_menace/request_proof_blush", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말하고 나니 얼굴이 뜨거워졌다.\n\n아직 한 발짝도 안 갔으면서 돌아온 뒤의 일부터 묻고 있었다. 말을 고치려다가 참았다. 자신이 정말 듣고 싶은 대답이었다."}], "when": true}, {"id": "lore_menace/request_proof_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": "lord_ahn", "text": [{"text": "“우선 돌아와서 이야기합시다.”"}], "when": true}, {"id": "lore_menace/request_return_weight", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌아와서.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 제 뒤의 문을 떠올렸다. 복도와 안뜰, 스쳐 온 사람들. 방금까지 출발 전의 풍경이던 것들이 돌아올 장소가 됐다.\n\n먼저 살아서 길을 되짚어야 했다."}], "when": true}, {"id": "lore_menace/request_readiness", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "곁의 사람이 자세를 바로 했다. 누군가는 문을 봤다.\n\n모두 같은 생각인지는 알 수 없었다. 그래도 대답할 때가 됐다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성주에게 시선을 돌렸다."}], "when": true}, {"id": "lore_menace/request_dry_mouth", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "거창한 말은 나오지 않았다.\n\n나라를 구하겠다. 적을 쓰러뜨리겠다. 그런 약속은 지금 입에 올릴 수 없었다. 할 수 있는 일을 말해야 했다. 맡은 일을 그대로 되돌려 주면 됐다."}], "when": true}, {"id": "lore_menace/request_reply", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“중심부를 확인하고 돌아오겠습니다.”"}], "when": true}, {"id": "lore_menace/request_promise", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성주가 고개를 끄덕였다.\n\n그제야 일행의 어깨가 조금 풀렸다. 대답은 평범했다. 더 보탤 것도 없었다. 이 방에 다시 들어오는 것까지 해야 끝나는 일이었다."}], "when": true}, {"id": "lore_menace/request_unfinished_fear", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": null, "text": [{"text": "겁은 남았다.\n\n그러나 어디로 가야 할지 몰라 생긴 답답함은 줄었다. 남서쪽으로 가서 동굴을 찾는다. 중심부를 확인한다. 그리고 돌아온다.\n\n하나씩 할 수 있었다."}], "when": true}, {"id": "lore_menace/request_name_repeated", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "terms", "id": "menace"}}, {"text": ".\n\n낯선 이름에 방향이 붙었다. 목적지가 됐다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 속으로 한 번 더 외웠다. 여기서 한 약속을 다른 곳에서 잊고 싶지 않았다."}], "when": true}, {"id": "lore_menace/request_looking_back", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌아서자 바닥의 금이 다시 보였다.\n\n이번에는 끝을 찾지 않았다. 한 발을 놓으면 지나갈 자리였다. 그는 문 쪽으로 걸었다. 일행의 발소리가 뒤따랐다."}], "when": true}, {"id": "lore_menace/request_last_word", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "“돌아오겠습니다.”\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 방을 나서며 마지막 말을 되짚었다. 아직 출발도 하지 않았다. 그렇지만 이제부터는 돌아올 길까지 생각해야 했다."}], "when": true}], "choices": [{"branch_kind": "quest", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [{"op": "set", "provenance": {"note": "원작 조건/변화를 집필 상태로 추상화. 원문 코드 실행이나 고정 인물 설정 추가가 아니다.", "origin": "source_adaptation", "source_refs": ["lore_menace/assignment"]}, "state": "quest.lore_stage", "value": 3}], "id": "lore_menace/receive_assignment", "label": [{"text": "탐사 부탁을 받아들인다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/preparation", "when": true}], "editorial": {"intent": "1-1: 성주의 첫 탐사 부탁을 듣고 귀환을 약속하기까지 한 장면을 충분히 펼친 재집필 초고", "notes": "추가: 방의 감각·시선·침묵·신체 반응·의뢰 확인 질문과 답변은 창작. 첫 소편만 재집필했으며 나머지 장면은 짧은 구조 초고 상태다. 미정 나이/직업/초기 장비/동료 신원은 확정하지 않는다.", "source_refs": ["lore_menace/assignment"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lore_stage", "value": 2}, "handoff": null, "id": "lore_menace/assignment", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/assignment"]}, "title": [{"text": "1-1 · 돌아오겠다는 말"}]}, {"blocks": [{"id": "lore_menace/preparation_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "복도에 나오자 소음이 돌아왔다.\n\n문이 열렸다. 누군가 먼 곳에서 불렀다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 숨을 길게 내쉬었다. 안에서는 그 숨소리까지 크게 들릴 것 같았다."}], "when": true}, {"id": "lore_menace/prep_promise", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "일행이 잠깐 멈췄다.\n\n접견실에서 한 대답을 다시 설명해야 할까. 그는 사람들의 얼굴을 봤다. 모두 같은 말을 들었다. 다시 약속을 늘어놓을 필요는 없었다. 이제 움직일 차례였다."}], "when": true}, {"id": "lore_menace/prep_words", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“남서쪽입니다. 우선 그쪽으로 가죠.”"}], "when": true}, {"id": "lore_menace/prep_sound", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그 한마디면 됐다.\n\n일행이 걷기 시작했다. 좁은 복도에서는 길게 섰고, 넓은 곳에서는 간격이 벌어졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 앞쪽으로 나섰다. 그 뒤의 발소리가 끊기지 않는지 들었다."}], "when": true}, {"id": "lore_menace/prep_corridor", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "복도 옆의 문이 열렸다.\n\n나오려던 사람이 일행이 지나가기를 기다렸다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 고개를 숙였다. 상대도 짧게 답했다.\n\n성 안의 모든 사람이 자신들의 출발을 보는 것은 아니었다. 맡은 일이 생겼다고 세상까지 멈추는 것은 아니었다."}], "when": true}, {"id": "lore_menace/prep_name", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "terms", "id": "menace"}}, {"text": ".\n\n남서쪽. 동굴. 중심부.\n\n그는 세 말을 차례로 떠올렸다. 쉬운 말인데도 놓칠까 봐 자꾸 확인했다. 정말 잊는다면 길에서 다시 물어야 했다. 그러고 싶지는 않았다."}], "when": true}, {"id": "i/guide_progress", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:11040"], "provenance": {"note": "독립 스냅샷의 해당 조건·대사. 증언은 확정 진상이 아니다.", "origin": "source_exact", "source_refs": ["i/castle_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:11040"]}}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/leave_castle", "label": [{"text": "출구로 향한다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "i/threshold", "when": true}, {"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/ask_directions_again", "label": [{"text": "성주에게 목적지를 다시 확인한다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/reminder", "when": true}, {"branch_kind": "navigation", "consequence": [{"text": "선택한 경험만 상태와 다음 장면에 남긴다."}], "effects": [], "id": "i/explore", "label": [{"text": "출발 전에 성 안을 둘러본다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "target": "i/hub", "when": true}, {"branch_kind": "navigation", "consequence": [{"text": "선택한 경험만 상태와 다음 장면에 남긴다."}], "effects": [{"op": "set", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "state": "event.armory_order", "value": "first"}], "id": "i/armory_first", "label": [{"text": "무기고부터 들른다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "target": "i/armory", "when": true}], "editorial": {"intent": "1-2: 출발 준비와 첫 동행 요청을 길게 펼치고 수락·거절에 다른 현재 동료와 감정의 끝을 준다.", "notes": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "source_refs": ["lore_menace/assignment"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lore_stage", "value": 3}, "handoff": null, "id": "lore_menace/preparation", "kind": "hub", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/assignment"]}, "title": [{"text": "출발 전에"}]}, {"blocks": [{"id": "lore_menace/reminder_before", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 발을 멈췄다.\n\n“잠깐만 기다려 주세요.”\n\n일행을 남겨 두고 접견실로 돌아갔다. 방금 나왔던 길이었다. 성주 앞에서 다시 인사하자 뒤늦게 민망해졌다. 그래도 잘못된 방향으로 가는 것보다 지금 확인하는 편이 나았다."}], "when": true}, {"id": "lore_menace/reminder_quote", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:13790", "LORETALK.PAS:literal:13807", "LORETALK.PAS:literal:13816"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/reminder"]}, "speaker": "lord_ahn", "text": [{"source": {"bindings": [{"end": 20, "ref": {"catalog": "terms", "id": "menace"}, "start": 14}], "literal_ids": ["LORETALK.PAS:literal:13790", "LORETALK.PAS:literal:13807", "LORETALK.PAS:literal:13816"]}}], "when": true}, {"id": "lore_menace/reminder_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "남서쪽. 기억한 대로였다.\n\n더 물을 것은 없었다. 그는 인사하고 돌아섰다. 기다리던 일행이 보였다. 이유를 길게 설명하지 않고 방향을 가리켰다. 이번에는 망설이지 않았다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/finish_reminder", "label": [{"text": "안내를 기억하고 출구로 향한다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "i/threshold", "when": true}], "editorial": {"intent": "1-2: 출발 준비와 첫 동행 요청을 길게 펼치고 수락·거절에 다른 현재 동료와 감정의 끝을 준다.", "notes": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "source_refs": ["lore_menace/reminder"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lore_stage", "value": 3}, "handoff": null, "id": "lore_menace/reminder", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/reminder"]}, "title": [{"text": "같은 부탁을 다시 듣다"}]}, {"blocks": [{"id": "lore_menace/exit_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "출구 쪽에서 빛이 길게 들어왔다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 눈을 좁혔다. 밖은 조금 전과 같았다. 바뀐 것은 일행이 나갈 이유였다. 그는 문을 향해 몸을 돌렸다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_call_quote", "kind": "source_quote", "literal_ids": ["LORESPEC.PAS:literal:11230"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/skeleton_exit"]}, "speaker": null, "text": [{"source": {"bindings": [{"end": 9, "ref": {"catalog": "terms", "id": "lore"}, "start": 5}], "literal_ids": ["LORESPEC.PAS:literal:11230"]}}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_called", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "누군가 불렀다.\n\n처음에는 다른 사람을 부르는 줄 알았다. 일행이 함께 멈추는 것을 보고서야 돌아봤다. 바깥으로 가던 빛이 어깨 너머로 옮겨갔다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_wait", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "다가오던 사람은 마지막 두 걸음 앞에서 멈췄다.\n\n그 거리가 남았다. 충분히 들릴 만큼 가깝고, 바로 일행에 섞이기에는 멀었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 기다렸다. 상대가 먼저 입을 열었다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/skeleton_quote", "kind": "source_quote", "literal_ids": ["LORESPEC.PAS:literal:11609", "LORESPEC.PAS:literal:11667", "LORESPEC.PAS:literal:11722", "LORESPEC.PAS:literal:11781", "LORESPEC.PAS:literal:11842", "LORESPEC.PAS:literal:11899", "LORESPEC.PAS:literal:11953", "LORESPEC.PAS:literal:12008", "LORESPEC.PAS:literal:12069", "LORESPEC.PAS:literal:12125", "LORESPEC.PAS:literal:12158", "LORESPEC.PAS:literal:12171", "LORESPEC.PAS:literal:12184", "LORESPEC.PAS:literal:12197", "LORESPEC.PAS:literal:12210"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/skeleton_exit"]}, "speaker": "skeleton", "text": [{"source": {"bindings": [{"end": 12, "ref": {"catalog": "characters", "id": "skele keleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "“저희가 어디로 가는지는 아십니까?”"}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "“아직 모르오. 그래도 여기 계속 있을 수는 없소.”"}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_answer_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "짧은 대답이 더 가까이 들렸다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 문 밖을 봤다. 자신도 목적지의 이름만 알았다. 데려가겠다고 하면 한 사람의 걸음까지 책임져야 했다. 위험한 길이 아니라고 말할 수는 없었다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_outside_sound", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "바깥에서 웃음이 터졌다.\n\n상대의 눈길이 잠깐 그쪽으로 갔다가 돌아왔다. 그 작은 움직임이 걸렸다. 그는 말없이 지나가는 것만으로도 곤란해질 수 있는 사람처럼 보였다.\n\n그렇다고 부탁을 들었다는 이유만으로 동행을 정할 수는 없었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 일행의 얼굴도 확인했다. 답을 기다리는 사람이 하나 더 생겨 있었다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_
