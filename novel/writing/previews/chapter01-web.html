": [{"text": "의자 다리가 바닥에 걸렸다.\n\n짧고 높은 소리가 났다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 손을 멈췄다. 사람들이 돌아볼 줄 알았는데 가까운 탁자는 그대로 말을 이었다. 그는 의자를 들어 옮겼다."}], "when": true}, {"id": "i/tavern_story_hands", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "빈손을 탁자에 올렸다가 무릎으로 내렸다.\n\n앉으니 할 일이 사라진 것 같았다. 밖에서는 다음에 갈 곳을 고르고 있었다. 여기서는 다른 사람들의 말이 이어졌다. 그는 가장 가까운 자리부터 봤다."}], "when": true}, {"id": "i/tavern_story_silence_before", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "맞은편 사람과 눈이 마주쳤다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 입을 열려다가 기다렸다. 상대가 잔을 들고 있었다. 입까지 올리지도, 내려놓지도 않은 채였다."}], "when": true}, {"id": "i/silence", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:2317"], "provenance": {"note": "독립 스냅샷의 해당 조건·대사. 증언은 확정 진상이 아니다.", "origin": "source_exact", "source_refs": ["i/castle_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:2317"]}}], "when": true}, {"id": "i/tavern_story_silence_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "대답은 오지 않았다.\n\n그는 고개를 조금 숙이고 시선을 거뒀다. 지금 할 말이 없는 사람을 붙들 필요는 없었다. 옆에서 다른 목소리가 들렸다."}], "when": true}, {"id": "i/tavern_story_ghost_before", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "누군가 목소리를 낮췄다.\n\n웃음보다 잘 들렸다. 잔을 내려놓는 소리가 끝나자 마지막 말이 또렷해졌다. 그는 그쪽으로 귀를 기울였다."}], "when": true}, {"id": "i/ghost_rumor", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:2355"], "provenance": {"note": "독립 스냅샷의 해당 조건·대사. 증언은 확정 진상이 아니다.", "origin": "source_exact", "source_refs": ["i/castle_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:2355"]}}], "when": true}, {"id": "i/tavern_story_ghost_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "무덤이라는 말이 걸렸다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 이야기하는 사람을 봤다. 손가락이 탁자를 두드리고 있었다. 곁의 사람은 웃는지 믿는지 알 수 없는 얼굴이었다.\n\n직접 본 일을 말하는 것인지까지 확인할 수는 없었다."}], "when": true}, {"id": "i/tavern_story_offer_before", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "팔이 탁자 위로 뻗어 왔다.\n\n그는 몸을 뺐다. 잔이 그의 손 앞에서 멈췄다. 잔 속의 액체가 테두리에 닿았다가 내려갔다. 상대는 웃고 있었다."}], "when": true}, {"id": "i/drink_offer", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:2411"], "provenance": {"note": "독립 스냅샷의 해당 조건·대사. 증언은 확정 진상이 아니다.", "origin": "source_exact", "source_refs": ["i/castle_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:2411"]}}], "when": true}, {"id": "i/tavern_story_offer_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "“고맙습니다. 지금은 말씀만 듣겠습니다.”\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 손바닥을 들었다. 상대는 그의 빈손을 잠깐 보고 잔을 거둬 갔다. 기분이 상한 얼굴은 아니었다. 그는 탁자에 놓였던 손을 무릎으로 내렸다."}], "when": true}, {"id": "i/tavern_story_lord_before", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "안쪽에서 큰 목소리가 터졌다.\n\n앞선 대화가 아직 끝나지 않았는데도 그 말이 방을 넘어왔다. 누군가 의자를 뒤로 젖혔다. 말하던 사람의 손이 크게 움직였다."}], "when": true}, {"id": "i/drunk_lord", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:2483", "LORETALK.PAS:literal:2535", "LORETALK.PAS:literal:2587", "LORETALK.PAS:literal:2634"], "provenance": {"note": "독립 스냅샷의 해당 조건·대사. 증언은 확정 진상이 아니다.", "origin": "source_exact", "source_refs": ["i/castle_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [{"end": 12, "ref": {"catalog": "characters", "id": "lord_ahn"}, "start": 4}, {"end": 40, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 29}], "literal_ids": ["LORETALK.PAS:literal:2483", "LORETALK.PAS:literal:2535", "LORETALK.PAS:literal:2587", "LORETALK.PAS:literal:2634"]}}], "when": true}, {"id": "i/tavern_story_lord_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 접견실의 얼굴을 떠올렸다.\n\n이 목소리의 주인은 그 방에 없었다. 그와 다른 모습의 성주를 말하고 있었다. 그는 먼저 반박하지 않았다. 들은 말을 지금 본 사실과 구별해 둘 생각이었다."}], "when": true}, {"id": "i/tavern_story_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "잔 하나가 비었다.\n\n다른 사람이 말을 꺼내려다가 멈췄다. 옆에서 질문이 끼어들었다. 크게 묻지 않았는데 가까워서 또렷했다. 대답을 기다리는 시선이 그에게 왔다."}], "when": true}, {"id": "i/skeleton_prejudice", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:2703", "LORETALK.PAS:literal:2755", "LORETALK.PAS:literal:2802", "LORETALK.PAS:literal:2851", "LORETALK.PAS:literal:2896"], "provenance": {"note": "독립 스냅샷의 해당 조건·대사. 증언은 확정 진상이 아니다.", "origin": "source_exact", "source_refs": ["i/castle_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [{"end": 13, "ref": {"catalog": "characters", "id": "skeleton"}, "start": 5}], "literal_ids": ["LORETALK.PAS:literal:2703", "LORETALK.PAS:literal:2755", "LORETALK.PAS:literal:2802", "LORETALK.PAS:literal:2851", "LORETALK.PAS:literal:2896"]}}], "when": true}, {"id": "i/tavern_story_prejudice_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "상대는 계속 그를 봤다.\n\n고개만 끄덕여도 될 것 같았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 먼저 웃으려던 입을 다물었다. 대화가 편해지려고 동의하면 그 말도 자기 대답이 됐다."}], "when": true}, {"id": "i/tavern_story_prejudice_reply", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "“저는 직접 만나 보고 싶습니다.”\n\n상대의 눈썹이 움직였다. 그는 더 약속하지 않았다. 만난 뒤에 무엇을 느낄지 지금 말할 수는 없었다. 상대가 입술을 눌렀다가 다른 사람 쪽으로 고개를 돌렸다."}], "when": true}, {"id": "i/tavern_story_burp_before", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 시선을 거뒀다.\n\n누군가 한마디 보태려다가 목을 잡았다. 웃음부터 나올 것 같은 표정이었다. 그도 잠깐 기다렸다."}], "when": true}, {"id": "i/burp", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:2957"], "provenance": {"note": "독립 스냅샷의 해당 조건·대사. 증언은 확정 진상이 아니다.", "origin": "source_exact", "source_refs": ["i/castle_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:2957"]}}], "when": true}, {"id": "i/tavern_story_burp_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "가까운 자리에서 웃음이 났다.\n\n굳어 있던 얼굴도 잠깐 풀렸다. 그는 숨을 내쉬었다. 방금의 말을 지울 수는 없었다. 그래도 사람들은 잔을 옮기고 자리를 고쳤다. 다른 이야기를 시작할 틈이 생겼다."}], "when": true}, {"id": "i/tavern_story_veteran_glimpse", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "사람들 사이로 구석이 보였다.\n\n노인은 웃음이 날 때도 움직이지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그쪽을 봤다. 가까이 있는 사람과도 다른 거리에 앉아 있는 것 같았다. 말을 걸려면 자리에서 일어나야 했다."}], "when": {"op": "eq", "state": "knowledge.missing_squad", "value": false}}, {"id": "i/tavern_story_decision", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "주인이 다시 잔을 닦고 있었다.\n\n그동안 여러 목소리가 지나갔다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 가운데 누구의 이야기를 더 들을지 정해야 했다. 문도 가까웠다.\n\n앉았다고 계속 있을 필요는 없었다. 일어나면 동굴로 가는 길이 기다렸다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "대화에 다가가 노인의 증언을 직접 듣는다. 듣지 않은 미래 사실은 얻지 않는다."}], "effects": [], "id": "i/late_veteran", "label": [{"text": "구석에 앉은 노인에게 말을 건다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "target": "prologue/tavern", "when": {"op": "eq", "state": "knowledge.missing_squad", "value": false}}, {"branch_kind": "navigation", "consequence": [{"text": "질문을 남겨 둔 채 주점을 떠난다. 다른 인사나 노인의 증언을 자동으로 확인하지 않는다."}], "effects": [{"op": "set", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "state": "event.visited.tavern", "value": true}, {"op": "increment", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "state": "event.city_visits", "value": 1}], "id": "i/tavern_back", "label": [{"text": "더 머물지 않고 밖으로 나간다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "target": "i/tavern_departure", "when": {"op": "eq", "state": "quest.lore_stage", "value": 3}}], "editorial": {"intent": "주점 한 소편: 공간에 익숙해지는 시간, 원작 말들이 지나가는 상황, 말을 걸거나 떠나는 결정을 서사로 잇는다.", "notes": "추가 장면은 authored/proposed. 주점 공간·주인의 손놀림·익명 손님 반응·주인공 심리/응답은 창작이며 고정 인물 설정이 아니다. 음료 구매/섭취·금화/장비/동료 변화와 새 세계 진상은 없다. 입장과 인사는 자동 진행, 마지막 행동만 선택. 원작 두 인사의 노출은 기존 방문 횟수로 구별하는 집필용 각색이며 원작의 난수 규칙이 아니다.", "source_refs": [], "status": "draft"}, "entry_when": true, "handoff": null, "id": "i/tavern_people", "kind": "scene", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "title": [{"text": "술잔 사이의 소문"}]}, {"blocks": [{"id": "i/grave_entry", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "주점의 소음은 닿지 않았다.\n\n일행의 말수가 줄었다. "}, {"ref": {"catalog": "characters", "id": 았다. 길을 받치는 것이라면 함부로 건드릴 수 없었다.\n\n그가 손을 뗀 자리를 가리켰다. 일행은 그 옆으로 간격을 맞췄다. 가진 도구를 쓰지 않는 판단도 이 길에서는 도움이 됐다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험만 상태와 다음 장면에 남긴다."}], "effects": [], "id": "i/role_enter_party_woodcutter", "label": [{"text": "함께 동굴 입구로 향한다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/cave_entry", "when": true}], "editorial": {"intent": "선택한 지역·직업·장비가 작은 이야기와 후속 반응을 바꾸고 첫 임무의 큰 흐름에 합류한다.", "notes": "새 이동/대사는 창작. NPC 증언은 방문한 경로에서만 경험하며 세계 진상·후속 영입을 자동 확정하지 않는다.", "source_refs": [], "status": "draft"}, "entry_when": true, "handoff": null, "id": "i/role_party_woodcutter", "kind": "scene", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "title": [{"text": "다른 사람이 보는 것"}]}, {"blocks": [{"id": "i/role_action_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_hunter", "particle": "이/가"}}, {"text": " "}, {"ref": {"catalog": "equipment", "id": "story_bow", "particle": "을/를"}}, {"text": " 벽에서 떼었다.\n\n먼 곳을 겨누지 않았다. 몸을 낮추고 가까운 돌 사이부터 봤다. 가루가 덜 쌓인 면이 있었다. 그쪽으로 손을 움직이려다가 멈췄다.\n\n"}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 같은 높이로 시선을 내렸다. 흔적이 있다고 안전한 길이라는 뜻은 아니었다. 발을 놓을 자리는 따로 확인해야 했다.\n\n그가 먼저 한 발을 골랐다. 움직이지 않는 것을 본 뒤 뒤쪽에 손짓했다. 일행은 그 자리부터 따라갔다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험만 상태와 다음 장면에 남긴다."}], "effects": [], "id": "i/role_enter_party_hunter", "label": [{"text": "함께 동굴 입구로 향한다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []  "무기고를 나서며"}]}, {"blocks": [{"id": "i/tavern_story_departure", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "의자를 밀어 넣었다.\n\n이번에는 바닥을 긁지 않도록 들었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 주인에게 고개를 숙였다. 천을 쥔 손이 잠깐 들렸다. 앉을 때보다 나갈 때 인사가 쉬웠다."}], "when": true}, {"id": "i/tavern_story_departure_end", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: styles.json#/profiles/B 기준의 제한적 3인칭 웹소설형 산문 초고. A의 동일 장면을 재집필하며 새 정사·수치·효과·독자 선택을 만들지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "문을 열자 바깥 소리가 먼저 들어왔다.\n\n그는 문턱을 넘고 다시 닫았다. 안쪽의 웃음이 알아들을 수 없는 소리가 됐다. 못 들은 이야기들도 그 안에 남았다.\n\n지금 떠나는 길에서 모든 목소리를 챙길 수는 없었다. 그는 일행 쪽으로 걸었다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험만 상태와 다음 장면에 남긴다."}], "effects": [], "id": "i/tavern_depart_finish", "label": [{"text": "앞으로 이어지는 길로 나선다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다. 추가: 탐방 뒤 같은 갈림길로 돌아가지 않고 본줄기로 합류한다.", "origin": "authored", "source_refs": []}, "target": "i/threshold", "when": true}], "editorial": {"intent": "대화를 택하지 않은 행동도 떠나는 장면으로 보여 준 뒤 다음 지역/출발 경계에 합류한다.", "notes": "추가 장면은 authored/proposed. 주점 공간·주인의 손놀림·익명 손님 반응·주인공 심리/응답은 창작이며 고정 인물 설정이 아니다. 음료 구매/섭취·금화/장비/동료 변화와 새 세계 진상은 없다. 입장과 인사는 자동 진행, 마지막 행동만 선택. 원작 두 인사의 노출은 기존 방문 횟수로 구별하는 집필용 각색이며 원작의 난수 규칙이 아니다.", "source_refs": [], "status": "draft"}, "entry_when": true, "handoff": null, "id": "i/tavern_departure", "kind": "scene", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "title": [{"text": "문밖의 소리"}]}], "party": ["party_woodcutter", "party_hunter", "party_cook", "party_magician"], "version": 9}</script><script>/* Offline reader: save only choice IDs; reconstruct state/knowledge by replay. */
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('chapter-data').textContent);
  const nodes = Object.fromEntries(data.nodes.map(n => [n.id, n]));
  const clone = value => JSON.parse(JSON.stringify(value));
  let route = [];
  const message = text => { document.getElementById('message').textContent = text; };
  function matches(p, state) {
    if (typeof p === 'boolean') return p;
    if (p.all) return p.all.every(x => matches(x, state));
    if (p.any) return p.any.some(x => matches(x, state));
    if (p.not) return !matches(p.not, state);
    if (!(p.state in state)) throw Error('알 수 없는 상태');
    const value = state[p.state];
    switch (p.op) {
      case 'eq': return JSON.stringify(value) === JSON.stringify(p.value);
      case 'ne': return JSON.stringify(value) !== JSON.stringify(p.value);
      case 'gte': return value >= p.value;
      case 'lte': return value <= p.value;
      case 'contains': return value.includes(p.value);
      case 'not_contains': return !value.includes(p.value);
      default: throw Error('알 수 없는 조건');
    }
  }
  function apply(effects, state) {
    for (const e of effects) {
      if (!(e.state in state)) throw Error('잘못된 상태 변경');
      if (e.op === 'set') state[e.state] = clone(e.value);
      else if (e.op === 'increment') state[e.state] += e.value;
      else if (e.op === 'add') { if (!state[e.state].includes(e.value)) state[e.state].push(e.value); }
      else if (e.op === 'remove') state[e.state] = state[e.state].filter(x => x !== e.value);
      else throw Error('알 수 없는 효과');
    }
  }
  function automatic(node, state) {
    const rules = data.auto_rules.filter(r => r.node === node && matches(r.when, state));
    if (rules.length > 1) throw Error('자동 진행 충돌');
    if (rules[0]) return rules[0];
    const choices=nodes[node].choices.filter(c=>matches(c.when,state));
    return choices.length===1 ? {choice:choices[0].id,reason:''} : undefined;
  }
  function replay(saved) {
    if (!Array.isArray(saved) || saved.length > 160 || saved.some(x => typeof x !== 'string')) throw Error('잘못된 경로');
    let key = data.entry;
    const state = clone(data.initial), events = [], knowledge = {}, sections = [], mainStory = [], decisions=new Set();
    for (let index = 0; index <= saved.length; index++) {
      const node = nodes[key], contract = data.contracts[key];
      if (!node || !matches(node.entry_when, state) || !matches(contract.before, state)) throw Error('접근할 수 없는 장면');
      for (const item of contract.knowledge_required) {
        if (!(knowledge[item.character_id] || []).includes(item.fact_id)) throw Error('아직 듣지 않은 정보를 요구하는 장면');
      }
      const cast = contract.cast.filter(c => matches(c.when, state)).map(c => c.character_id);
      const blocks = node.blocks.filter(b => b.kind !== 'author_note' && matches(b.when, state));
      for (const rule of data.conditional_required.filter(r => r.node === key && matches(r.when,state))) {
        if (!blocks.some(b => b.id === rule.block)) throw Error('필수 원작 대사가 숨겨진 분기');
      }
      if (contract.must_include_block_ids.some(id => !blocks.some(b => b.id === id))) throw Error('필수 장면 누락');
      const checkpoint = data.main_story.findIndex(r => r.node === key);
      if (checkpoint >= 0 && !mainStory.includes(key)) {
        if (checkpoint !== mainStory.length) throw Error('필수 본줄기를 건너뛴 경로');
        if (data.main_story[checkpoint].required_block_ids.some(id => !blocks.some(b => b.id === id))) throw Error('첫 방문 필수 본문 누락');
        mainStory.push(key);
      }
      if (['boundary', 'ending'].includes(node.kind) && mainStory.length !== data.main_story.length) throw Error('필수 본줄기 전에 끝나는 경로');
      if (blocks.some(b => b.speaker && !cast.includes(b.speaker))) throw Error('없는 동료가 말하는 장면');
      const choices = node.choices.filter(c => matches(c.when, state));
      if(choices.length>1&&!automatic(key,state)){
        const fork=key+'|'+choices.map(c=>c.id).sort().join('|');
        if(decisions.has(fork))throw Error('같은 분기로 돌아가 다른 선택을 수집할 수 없습니다.');
        decisions.add(fork);
      }
      if (!choices.length && !['boundary', 'ending'].includes(node.kind)) throw Error('막힌 분기');
      sections.push({node, blocks, choices, state: clone(state), selected: saved[index]});
      if (index === saved.length) return {node, state, events, knowledge, sections, mainStory};
      const choice = choices.find(c => c.id === saved[index]);
      if (!choice) throw Error('이 경로에서는 할 수 없는 선택');
      const auto = automatic(key, state);
      if (auto && auto.choice !== choice.id) throw Error('필수 자동 진행을 건너뛴 경로');
      apply(choice.effects, state);
      if (!matches(contract.after, state)) throw Error('장면 후 조건 불일치');
      for (const event of data.events.filter(e => e.trigger_choice === choice.id && matches(e.when === undefined ? true : e.when, state))) {
        if (events.includes(event.id) || event.requires_events.some(id => !events.includes(id))) throw Error('사건 순서 불일치');
        events.push(event.id);
        for (const gain of event.knowledge_gained) {
          knowledge[gain.character_id] ||= [];
          if (!knowledge[gain.character_id].includes(gain.fact_id)) knowledge[gain.character_id].push(gain.fact_id);
        }
      }
      key = choice.target;
    }
  }
  function reference(ref) {
    const name = data.labels[ref.catalog]?.[ref.id];
    if (!name) throw Error('찾을 수 없는 참조');
    if (!ref.particle) return name;
    const code = name.codePointAt(name.length - 1) - 0xac00, jong = code % 28;
    if (code < 0 || code >= 11172) throw Error('조사를 붙일 수 없는 이름');
    const pair = ref.particle.split('/');
    return name + (jong && !(ref.particle === '으로/로' && jong === 8) ? pair[0] : pair[1]);
  }
  function text(spans, state, blockId) {
    if (typeof spans === 'string') return spans;
    return spans.map(span => {
      if ('text' in span) return span.text;
      if (span.ref) return reference(span.ref);
      const source = span.source, raw = Array.from(source.literal_ids.map(id => data.literals[id]).join(''));
      const edits = source.bindings.map(b => ({start:b.start, end:b.end, value:reference(b.ref)}));
      for (const insert of data.insertions[blockId] || []) {
        const value = insert.ref ? reference(insert.ref) : insert.state ? (insert.state_ref_catalog ? reference({catalog:insert.state_ref_catalog,id:state[insert.state],...(insert.particle ? {particle:insert.particle} : {})}) : String(state[insert.state])) : '[' + insert.placeholder + ']';
        edits.push({start:insert.offset, end:insert.offset + (insert.replace_length || 0), value});
      }
      edits.sort((a,b) => a.start - b.start || a.end - b.end);
      let result = '', offset = 0;
      for (const edit of edits) { result += raw.slice(offset,edit.start).join('') + edit.value; offset = edit.end; }
      return result + raw.slice(offset).join('');
    }).join('');
  }
  function element(tag, value, className) {
    const e = document.createElement(tag); e.textContent = value;
    if (className) e.className = className;
    return e;
  }
  function readFromSection(index) {
    const sections = document.getElementById('manuscript').children;
    const section = index === undefined ? sections[sections.length - 1] : sections[index];
    const target=section.querySelector('h2')||section;
    target.tabIndex=-1;target.focus({preventScroll:true});
    section.scrollIntoView({block:'start',behavior:'instant'});
  }
  function redraw() {
    for(let count=0;count<data.nodes.length;count++){
      const current=replay(route),auto=automatic(current.node.id,current.state);
      if(!auto)break;
      route.push(auto.choice);
      if(count===data.nodes.length-1)throw Error('자동 진행 반복');
    }
    const packet = replay(route), manuscript = document.getElementById('manuscript');
    manuscript.replaceChildren();
    let priorGroup=null,priorChapter='chapter01';
    for (const section of packet.sections) {
      const root = document.createElement('section');
      const chapter=data.chapters?.find(c=>c.prefixes.some(prefix=>section.node.id.startsWith(prefix)));
      if(chapter&&chapter.id!==priorChapter){
        root.append(element('h2','제'+Number(chapter.id.slice(7))+'장 · '+text(chapter.title,section.state)));
        priorChapter=chapter.id;
      }
      const heading = element('h2',text(section.node.title,section.state));
      heading.dataset.storyRole = data.main_story.some(r => r.node === section.node.id) ? 'main' : 'optional';
      heading.tabIndex = -1;
      const group=data.display_groups?.[section.node.id]||section.node.id;
      if(group!==priorGroup)root.append(heading);
      priorGroup=group;
      for (const b of section.blocks) {
        const body=text(b.text,section.state,b.id);
        const paragraphs=b.provenance.origin==='authored'?body.split(/\n{2,}/):[body];
        paragraphs.forEach((paragraph,index)=>{
          const p=element('p',paragraph,b.provenance.origin==='source_exact'?'quote':'');
          p.dataset.blockId=b.id;
          if(b.speaker&&index===0)p.prepend(element('small',data.labels.characters[b.speaker]||b.speaker),document.createElement('br'));
          root.append(p);
        });
      }
      if (section.selected && !automatic(section.node.id,section.state)) root.append(element('p','선택: ' + text(section.choices.find(c => c.id === section.selected).label,section.state),'selected'));
      manuscript.append(root);
    }
    const current = packet.sections.at(-1), box = document.getElementById('choices');
    box.replaceChildren();
    for (const choice of current.choices) {
      const button = element('button',text(choice.label,packet.state));
      button.type = 'button'; button.dataset.choice = choice.id;
      button.addEventListener('click',() => {
        try {
          const firstNewSection = route.length + 1;
          const next = [...route,choice.id]; let notice = '';
          for (let count = 0; count < data.nodes.length; count++) {
            const p = replay(next), auto = automatic(p.node.id,p.state);
            if (!auto) { route = next; redraw(); message(notice); readFromSection(firstNewSection); return; }
            next.push(auto.choice); notice = auto.reason;
          }
          throw Error('자동 진행 반복');
        } catch (e) { message(e.message); }
      });
      box.append(button);
    }
    const info = document.getElementById('state'); info.replaceChildren();
    const companions = [...packet.state['companions.starting'],...packet.state['companions.optional_recruits']];
    info.append(element('p','동행: ' + companions.map(id => data.labels.characters[id] || id).join(', ')));
    info.append(element('p','성 안에서 들른 곳: ' + packet.state['event.city_visits'] + ' · 금화: ' + packet.state['event.gold']));
    for (const id of packet.state['companions.starting']) info.append(element('p',data.labels.characters[id] + ': ' + (data.labels.equipment[packet.state['event.weapon.' + id]] || '미정')));
    if (companions.includes('mad_joe')) info.append(element('p',data.labels.characters.mad_joe + ': ' + (data.labels.equipment[packet.state['event.weapon.mad_joe']] || '미정')));
    if (packet.state['event.shield_owner']) info.append(element('p','발견 방패 장착자: ' + data.labels.characters[packet.state['event.shield_owner']]));
    for(const id of ['protagonist','skeleton','polaris']){
      if(id!=='protagonist'&&!companions.includes(id))continue;
      const weapon=packet.state['event.weapon.'+id];
      if(weapon)info.append(element('p',data.labels.characters[id]+': '+(data.labels.equipment[weapon]||'미정')));
    }
    if(packet.state['event.chapter02.spear_owner'])info.append(element('p',data.labels.terms.oedipus_spear+': '+data.labels.characters[packet.state['event.chapter02.spear_owner']]));
    if (!current.choices.length) box.append(element('p',`제${data.chapters.length}장 끝. 선택한 동료·장비·경험은 다음 장으로 인계됩니다. ${data.chapters.length+1}장 이후는 이 판본에서 아직 집필 전이며, 전편 개요와 분기 미리보기는 제작 자료입니다.`));
    document.getElementById('back').disabled = !packet.sections.some(s=>s.selected&&!automatic(s.node.id,s.state));
  }
  document.getElementById('restart').addEventListener('click',() => { route = []; redraw(); message('처음부터 시작합니다.'); readFromSection(0); });
  document.getElementById('back').addEventListener('click',() => {
    const next = [...route]; next.pop();
    while (next.length && automatic(replay(next).node.id,replay(next).state)) next.pop();
    route = next; redraw(); message('직전 선택으로 돌아왔습니다. 상태도 경로에서 다시 계산했습니다.'); readFromSection();
  });
  document.getElementById('save').addEventListener('click',() => {
    const value = JSON.stringify({fingerprint:data.fingerprint,route},null,2), a = document.createElement('a');
    const url = URL.createObjectURL(new Blob([value],{type:'application/json'}));
    a.href = url; a.download = 'novel-route.json'; a.click(); URL.revokeObjectURL(url);
    message('경로만 저장했습니다. 동료·금화·지식을 임의 저장하지 않습니다.');
  });
  document.getElementById('load').addEventListener('click',() => document.getElementById('file').click());
  document.getElementById('file').addEventListener('change',async event => {
    try {
      const file = event.target.files[0]; if (!file || file.size > 32768) throw Error('저장 파일이 너무 큽니다.');
      const saved = JSON.parse(await file.text());
      if (Object.keys(saved).sort().join(',') !== 'fingerprint,route' || saved.fingerprint !== data.fingerprint) throw Error('다른 판본 또는 변조된 저장 파일입니다.');
      const packet = replay(saved.route);
      if (automatic(packet.node.id,packet.state)) throw Error('자동 진행이 누락된 저장 경로입니다.');
      route = [...saved.route]; redraw(); message('경로를 검증하고 상태를 다시 계산했습니다.'); readFromSection();
    } catch (e) { message(e.message); }
    event.target.value = '';
  });
  redraw();
})();
</script></html>
