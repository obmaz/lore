fset": 6, "ref": {"catalog": "characters", "id": "protagonist"}}], "i/welcome_personal": [{"note": "ReturnSex(1)은 미정 성별을 원문 고정값으로 바꾸지 않는다.", "offset": 4, "placeholder": "호칭 미정"}]}, "labels": {"bestiary": {"enemy_01": "오크", "enemy_03": "서펀트", "enemy_05": "드워프", "enemy_06": "자이언트", "enemy_08": "울프", "enemy_11": "파이선", "enemy_12": "인섹츠"}, "characters": {"ancient_evil": "에인션트 이블", "castle_guide": "성 안의 안내 인물", "jr_antares": "주니어 안타레스", "lord_ahn": "로드 안", "mad_joe": "매드 조", "necromancer": "네크로맨서", "party_cook": "요리사", "party_hunter": "사냥꾼", "party_magician": "마술사", "party_woodcutter": "나무꾼", "polaris": "폴라리스", "protagonist": "서진", "red_antares": "레드 안타레스", "skeleton": "스켈레톤", "veteran": "특공대에 친구들을 보낸 주점 인물"}, "equipment": {"shield_5": "금제 방패", "story_axe": "벌목 도끼", "story_bow": "사냥 활", "story_knife": "주방 칼", "story_wand": "마술 지팡이", "weapon_0": "맨손", "weapon_1": "단도"}, "terms": {"lastditch": "라스트디치", "lore": "로어", "menace": "메너스"}}, "literals": {"LORESPEC.PAS:literal:10062": "당신들은 수감소 병사들을 물리쳤다.", "LORESPEC.PAS:literal:10752": " 일행은 가장 기본적인 무기로  모두  무장을", "LORESPEC.PAS:literal:10804": "하였다.", "LORESPEC.PAS:literal:11230": " 당신이 LORE 성을 떠나려는 순간 누군가가 당신을 불렀다.", "LORESPEC.PAS:literal:11609": " 나는 Skeleton이라 불리는 종족의 사람이오.", "LORESPEC.PAS:literal:11667": " 우리 종족의 사람들은 나를 제외하고는  모두", "LORESPEC.PAS:literal:11722": "Necromancer에게 굴복하여 그의 부하가 되었지", "LORESPEC.PAS:literal:11781": "만 나는 그렇지 않소. 나는 Necromancer 의 영", "LORESPEC.PAS:literal:11842": "향을 피해서 이곳 LORE 성으로 왔지만 나의 혐", "LORESPEC.PAS:literal:11899": "오스런 생김새 때문에 이곳 사람들에게 배척되", "LORESPEC.PAS:literal:11953": "어서 지금은 어디로도 갈 수 없는 존재가 되었", "LORESPEC.PAS:literal:12008": "소. 이제 나에게 남은 것은 Necromancer 의 타", "LORESPEC.PAS:literal:12069": "도 밖에 없소.  그래서  당신들의 일행에 끼고", "LORESPEC.PAS:literal:12125": "싶소.", "LORESPEC.PAS:literal:12158": "", "LORESPEC.PAS:literal:12171": "", "LORESPEC.PAS:literal:12184": "", "LORESPEC.PAS:literal:12197": "", "LORESPEC.PAS:literal:12210": "", "LORESPEC.PAS:literal:34455": "여기가 `MENACE'의 중심이다.", "LORESPEC.PAS:literal:34507": "당신의 탐험은 성공적이었다.", "LORESPEC.PAS:literal:34554": "이제 Lord Ahn 에게 돌아가는 일만 남았다.", "LORESPEC.PAS:literal:35886": "당신은 황금의 방패를 발견했다.", "LORESPEC.PAS:literal:35966": "누가 이 황금의 방패를 장착 하겠습니까 ?", "LORESPEC.PAS:literal:36451": "가 황금의 방패를 장착했다.", "LORESPEC.PAS:literal:8315": "일행은 상자 속에서 약간의 금을 발견했다.", "LORESPEC.PAS:literal:8655": " 다시 돌아오다니, ", "LORESPEC.PAS:literal:8714": " 이번에는 기어이 네놈들을 해치우고야 말겠다", "LORESPEC.PAS:literal:8768": ". 나의 친구들도 이번에 거들것이다.", "LORESPEC.PAS:literal:8908": " 아니! 당신이 우리들을 배신하고 죄수를 풀어", "LORESPEC.PAS:literal:8966": "주다니... 그렇다면 우리들은 결투로서 당신들", "LORESPEC.PAS:literal:9021": "과 승부할수 밖에 없군요.", "LORESPEC.PAS:literal:9657": " 우리들 뒤에 있던  Mad Joe가 전투가 일어나", "LORESPEC.PAS:literal:9718": "자마자 도망을 가버렸다.", "LORESUB.PAS:literal:27739": "당신은 금화 ", "LORESUB.PAS:literal:27757": "개를 발견했다.", "LORESUB.PAS:literal:27868": "당신이 바란다면 ...", "LORETALK.PAS:literal:1018": "다면  진정한 이 세계의 진실을 알수 있을것이", "LORETALK.PAS:literal:10265": "예.", "LORETALK.PAS:literal:10316": "이제부터 당신은 진정한 이 세계에 발을 디디게 되는 것입니다.", "LORETALK.PAS:literal:10517": "아니오.", "LORETALK.PAS:literal:10570": "다시 생각 해보십시오.", "LORETALK.PAS:literal:1066": "오.", "LORETALK.PAS:literal:10750": "난 당신을 믿소, ", "LORETALK.PAS:literal:10778": ".", "LORETALK.PAS:literal:10886": "힘내시오, ", "LORETALK.PAS:literal:10910": ".", "LORETALK.PAS:literal:11005": "저희 성주님을 만나십시오.", "LORETALK.PAS:literal:11040": "당신이 성공하기를 빕니다.", "LORETALK.PAS:literal:11156": " 나는 ", "LORETALK.PAS:literal:11163": "Lord Ahn", "LORETALK.PAS:literal:11174": " 이오.", "LORETALK.PAS:literal:11202": " 이제부터 당신은  이 게임에서 새로운 인물로", "LORETALK.PAS:literal:11251": "서 생을 시작하게 될것이오. 그럼 나의 이야기", "LORETALK.PAS:literal:11297": "를 시작하겠소.", "LORETALK.PAS:literal:11399": " 이 세계는 내가 통치하는 동안에는 무척 평화", "LORETALK.PAS:literal:11448": "로운 세상이 진행되어 왔었소.  그러나 그것은", "LORETALK.PAS:literal:11497": "한 운명의 장난으로 무참히 깨어져 버렸소.", "LORETALK.PAS:literal:11544": " 한날, 대기의 공간이 진동하며 난데없는 푸른", "LORETALK.PAS:literal:11593": "번개가 대륙들 중의 하나를 강타했소.  공간은", "LORETALK.PAS:literal:11642": "휘어지고 시간은 진동하며  이 세계를 공포 속", "LORETALK.PAS:literal:11691": "으로 몰고 갔소.  그 번개의 위력으로 그 불운", "LORETALK.PAS:literal:11741": "한 대륙은  황폐화된 용암 대지로 변하고 말았", "LORETALK.PAS:literal:11790": "고, 다른 하나의 대륙은 충돌시의 진동에 의해", "LORETALK.PAS:literal:11839": "바다 깊이 가라앉아 버렸소.", "LORETALK.PAS:literal:11878": " 그런 일이 있은 한참 후에,  이상하게도 용암", "LORETALK.PAS:literal:11928": "대지의 대륙으로부터 강한 생명의 기운이 발산", "LORETALK.PAS:literal:11976": "되기 시작 했소.  그래서, 우리들은 그 원인을", "LORETALK.PAS:literal:12026": "알아보기 위해 'LORE 특공대'를 조직하기로 합", "LORETALK.PAS:literal:12079": "의를 하고 이곳에 있는 거의 모든 용사들을 모", "LORETALK.PAS:literal:12128": "아서 용암 대지로 변한 그 대륙으로 급히 그들", "LORETALK.PAS:literal:12177": "을 파견하였지만 여태껏 아무 소식도 듣지못했", "LORETALK.PAS:literal:12225": "소. 그들이 생존해 있는지 조차도 말이오.", "LORETALK.PAS:literal:12272": " 이런 저런 방법을 통하여 그들의 생사를 알아", "LORETALK.PAS:literal:1228": " `MENACE' 속에는 Dwarf, Giant, Wolf, Python", "LORETALK.PAS:literal:12325": "려던중 우연히 우리들은 '", "LORETALK.PAS:literal:12343": "Necromancer", "LORETALK.PAS:literal:12357": "'라고 불", "LORETALK.PAS:literal:12387": "리우는  용암 대지속의  새로운 세력의 존재를", "LORETALK.PAS:literal:12436": "알아내었고,  그때의 그들은 이미 막강한 세력", "LORETALK.PAS:literal:12485": "으로 성장해가고 있는중 이었소.  그때의 번개", "LORETALK.PAS:literal:12534": "는 그가 이 공간으로 이동하는 수단이었소. 즉", "LORETALK.PAS:literal:12583": "그는 이 공간의 인물이 아닌 다른 차원을 가진", "LORETALK.PAS:literal:12632": "공간에서 왔던 것이오.", "LORETALK.PAS:literal:12668": " 그는 현재 이 세계의 반을  그의 세력권 안에", "LORETALK.PAS:literal:12718": "넣고 있소. 여기서 당신의 궁극적인 임무는 바", "LORETALK.PAS:literal:12771": "로 '", "LORETALK.PAS:literal:12778": "Necromancer 의 야심을 봉쇄 시키는 것", "LORETALK.PAS:literal:12807": "'이", "LORETALK.PAS:literal:12834": "라는 걸 명심해 두시오.", "LORETALK.PAS:literal:12868": "", "LORETALK.PAS:literal:1292": "같은 괴물들이 살고 있소.", "LORETALK.PAS:literal:12962": " Necromancer 의 영향력은 이미 LORE 대륙까지", "LORETALK.PAS:literal:13018": "도달해있소.  또한 그들은 이 대륙의 남서쪽에", "LORETALK.PAS:literal:13067": "'MENACE' 라고 불리우는 지하 동굴을 얼마전에", "LORETALK.PAS:literal:13121": "구축했소.  그래서, 그 동굴의 존재 때문에 우", "LORETALK.PAS:literal:13171": "리들은 그에게 위협을 당하게 되었던 것이오.", "LORETALK.PAS:literal:13219": " 하지만, LORE 특공대가 이 대륙을 떠난후로는", "LORETALK.PAS:literal:13270": "그 일당들에게 대적할 용사는  이미  남아있지", "LORETALK.PAS:literal:13319": "않았소. 그래서 부탁하건데, 그 동굴을 중심부", "LORETALK.PAS:literal:13368": "까지 탐사해 주시오.", "LORETALK.PAS:literal:13403": " 나는 당신들에게 Necromancer에 대한 일을 맡", "LORETALK.PAS:literal:13457": "기고 싶지만, 아직은 당신들의  확실한 능력을", "LORETALK.PAS:literal:13506": "모르는 상태이지요.  그래서 이 일은 당신들의", "LORETALK.PAS:literal:13555": "잠재력을 증명해 주는 좋은 기회가 될것이오.", "LORETALK.PAS:literal:13603": " 만약 당신들이 무기가 필요하다면 무기고에서", "LORETALK.PAS:literal:13651": "약간의 무기를 가져가도록 허락하겠소.", "LORETALK.PAS:literal:13692": "", "LORETALK.PAS:literal:13790": " 대륙의 남서쪽에 있는 `", "LORETALK.PAS:literal:13807": "MENACE", "LORETALK.PAS:literal:13816": "'를 탐사해 주시오.", "LORETALK.PAS:literal:1384": " 나의 부모님은 Python 의 독에 의해 돌아 가셨습니다.", "LORETALK.PAS:literal:13915": "당신들의 성공을 축하하오 !!", "LORETALK.PAS:literal:13956": "[EXP + 1000]", "LORETALK.PAS:literal:14212": " 드디어 나는 당신들의 능력을 믿을수 있게 되", "LORETALK.PAS:literal:14261": "었소.  그렇다면 당신들에게 Necromancer 응징", "LORETALK.PAS:literal:14315": "이라는 막중한 임무를 한번 맡겨 보겠소.", "LORETALK.PAS:literal:14365": " 먼저 대륙의 동쪽에 있는 '", "LORETALK.PAS:literal:1438": " Python 은 정말 위험한 존재입니다.", "LORETALK.PAS:literal:14385": "LASTDITCH", "LORETALK.PAS:literal:14397": "'에 가보", "LORETALK.PAS:literal:14431": "도록 하시오. '", "LORETALK.PAS:literal:14444": "LASTDITCH", "LORETALK.PAS:literal:14456": "'성에는 지금 많은 근", "LORETALK.PAS:literal:14493": "심에 쌓여있소. 그들을 도와 주시오.", "LORETALK.PAS:literal:14611": " 당신은 이제 스스로 행동해 나가시오.", "LORETALK.PAS:literal:1527": " 단지 Lord Ahn 만이 능력 상으로 Necromancer 에게 도전할 수 있습니다.", "LORETALK.PAS:literal:1596": " 하지만 Lord Ahn 자신이 대립을 싫어해서, 현재는", "LORETALK.PAS:literal:1648": " Necromancer 에게 대항할 자가 없습니다.", "LORETALK.PAS:literal:1733": " 우리는 Ancient Evil을 배척하고 Lord Ahn님을 받들어야 합니다.", "LORETALK.PAS:literal:1828": " 우리는 MENACE 의 동쪽에 있는 나무로부터 많은 식량을 얻은적이 있습니다.", "LORETALK.PAS:literal:1939": " 이 세계의 창시자는 안 영기님 이시며, 그는 위대한 프로그래머 입니다.", "LORETALK.PAS:literal:2110": " 어서 오십시오. 여기는 LORE 주점입니다.", "LORETALK.PAS:literal:2190": " 거기 ", "LORETALK.PAS:literal:2199": "분 어서 오십시오.", "LORETALK.PAS:literal:2246": " 위스키에서 칵테일까지 마음껏 선택하십시오.", "LORETALK.PAS:literal:2317": "...", "LORETALK.PAS:literal:2355": "요새 무덤쪽에서 유령이 떠돈다던데...", "LORETALK.PAS:literal:237": " 당신이 모험을 시작한다면, 많은 괴물들을 만날 것이오.", "LORETALK.PAS:literal:2411": "하하하, 자네도 한번 마셔보게나.", "LORETALK.PAS:literal:2483": " 이제 Lord Ahn의 시대도 끝나가는가 ? 그까짓", "LORETALK.PAS:literal:2535": "Necromancer라는 작자에게 쩔쩔 매는 꼴이라니", "LORETALK.PAS:literal:2587": "...  차라리 내가 나가서 그 놈과 싸우는게 났", "LORETALK.PAS:literal:2634": "겠다.", "LORETALK.PAS:literal:2703": " 당신은 Skeleton 족의 한명이 우리와 함께 생", "LORETALK.PAS:literal:2755": "활하려 한다는 것에 대해서 어떻게 생각하십니", "LORETALK.PAS:literal:2802": "까 ?  저는 그 말을 들었을때 너무 혐오스러웠", "LORETALK.PAS:literal:2851": "습니다. 어서 빨리 그 살아있는 뼈다귀를 여기", "LORETALK.PAS:literal:288": " 무엇보다도, Serpent 와 Insects 와 Python 은", "LORETALK.PAS:literal:2896": "서 쫒아냈으면 좋겠습니다.", "LORETALK.PAS:literal:2957": " ... 끄~~윽 ... ...", "LORETALK.PAS:literal:3028": " 이보게 자네, 내말 좀 들어 보게나.  나의 친", "LORETALK.PAS:literal:3078": "구들은 이제 이 세상에 없다네. 그들은 너무나", "LORETALK.PAS:literal:3126": "도 용감하고 믿음직스런 친구들이었는데... 내", "LORETALK.PAS:literal:3174": "가 다리를 다쳐 병원에 있을 동안 그들은 모두", "LORETALK.PAS:literal:3222": "이 대륙의 평화를 위해 LORE 특공대에 지원 했", "LORETALK.PAS:literal:3272": "다네.  하지만 그들은 아무도 다시는 돌아오지", "LORETALK.PAS:literal:3320": "못했어.  그런 그들에게 이렇게 살아있는 나로", "LORETALK.PAS:literal:3368": "서는 미안할 뿐이네  그래서 술로 나날을 보내", "LORETALK.PAS:literal:3416": "고 있지. 죄책감을 잊기위해서 말이지...", "LORETALK.PAS:literal:345": " 맹독이 있으니 주의 하시기 바라오.", "LORETALK.PAS:literal:3459": "", "LORETALK.PAS:literal:3525": " 물러나십시오.  여기는 용사의 유골들을 안치", "LORETALK.PAS:literal:3570": "해 놓은 곳입니다.", "LORETALK.PAS:literal:3679": " 당신이  한 유골 앞에 섰을때  이상한 느낌과", "LORETALK.PAS:literal:3725": "함께 먼곳으로 부터 어떤 소리가 들려왔다.", "LORETALK.PAS:literal:3772": " 안녕하시오. 대담한 용사여.", "LORETALK.PAS:literal:3812": " 당신이 나의 잠을 깨웠소 ?  나는 고대에 이", "LORETALK.PAS:literal:3862": "곳을 지키다가 죽어간 기사 Jr. Antares 라고", "LORETALK.PAS:literal:3915": "하오.  저의 아버지는 Red Antares 라고 불리", "LORETALK.PAS:literal:3969": "웠던 최강의 마법사였소.  그는 말년에  어떤", "LORETALK.PAS:literal:4018": "동굴로 은신을 한 후 아무에게도 모습을 나타", "LORETALK.PAS:literal:4066": "내지 않았소.  하지만 당신의 운명은 나의 아", "LORETALK.PAS:literal:4115": "버지를 만나야만하는 운명이라는 것을 알수있", "LORETALK.PAS:literal:412": "Orc 는 가장 하급 괴물이오.", "LORETALK.PAS:literal:4162": "소.  반드시 나의 아버지를 만나서 당신이 알", "LORETALK.PAS:literal:4211": "지 못했던 새로운 능력들을 배우시오. 그리고", "LORETALK.PAS:literal:4259": "나의 아버지를 당신의 동행으로 참가시키도록", "LORETALK.PAS:literal:4306": "하시오. 물론 좀 어렵겠지만 ...", "LORETALK.PAS:literal:4369": " 아참,  그리고 내가 죽기전에 여기에 뭔가를", "LORETALK.PAS:literal:4418": "여기에 숨겨 두었는데  당신에게 도움이 될지", "LORETALK.PAS:literal:4466": "모르겠소. 그럼, 나는 다시 오랜 잠으로 들어", "LORETALK.PAS:literal:4515": "가야 겠소.", "LORETALK.PAS:literal:4775": " 힘내게, ", "LORETALK.PAS:literal:4819": " 자네라면 충분히 Necromancer를 무찌를수 있", "LORETALK.PAS:literal:4868": "을 걸세. 자네만 믿겠네.", "LORETALK.PAS:literal:4948": " 위의 저 친구로부터  당신 얘기 많이 들었습", "LORETALK.PAS:literal:4996": "니다. 저는 우리성에서 당신같은 용감한 사람", "LORETALK.PAS:literal:5040": "이 있다는걸 자랑스럽게 생각합니다.", "LORETALK.PAS:literal:5125": " 만약, 당신들이  그 일을 해내기가 어렵다고", "LORETALK.PAS:literal:5173": "생각되시면 LASTDITCH 성에서  성문을 지키고", "LORETALK.PAS:literal:5224": "있는 Polaris란 청년을 일행에 참가시켜 주십", "LORETALK.PAS:literal:5274": "시오.  분명 그 사람이라면 쾌히 승락할 겁니", "LORETALK.PAS:literal:5319": "다.", "LORETALK.PAS:literal:5387": " 이 안에 갇혀있는 사람들에게는 일체 면회가", "LORETALK.PAS:literal:5431": "허용되지 않습니다. 나가 주십시오.", "LORETALK.PAS:literal:5516": " 여기는 Lord Ahn의 체제에 대해서 깊은 반감", "LORETALK.PAS:literal:5567": "을 가지고 있는 자들을 수용하고 있습니다.", "LORETALK.PAS:literal:5613": " 아마 그들은 죽기전에는 이곳을 나올수 없을", "LORETALK.PAS:literal:5657": "겁니다.", "LORETALK.PAS:literal:5727": " 나는 이곳의 기사로서  이 세계의 모든 대륙", "LORETALK.PAS:literal:5775": "을 탐험하고 돌아왔었습니다. 내가 마지막 대", "LORETALK.PAS:literal:5822": "륙을 돌았을때  나는 새로운 존재를 발견했습", "LORETALK.PAS:literal:5869": "니다. 그는 바로 예전까지도 Lord Ahn과 대립", "LORETALK.PAS:literal:5920": "하던 Ancient Evil이라는 존재였습니다. 지금", "LORETALK.PAS:literal:5972": "우리의 성에서는 철저하게 배격하도록 어릴때", "LORETALK.PAS:literal:6018": "부터 가르침 받아온 그 Ancient Evil이었습니", "LORETALK.PAS:literal:6070": "다.  하지만 그곳에서 본 그는 우리가 알고있", "LORETALK.PAS:literal:6118": "는 그와는 전혀 다른 인간미를 가진  말 그대", "LORETALK.PAS:literal:6166": "로  신과같은 존재였습니다.  내가 그의 신앙", "LORETALK.PAS:literal:6214": "아래 있는 어느 도시를 돌면서 내가 느낀것은", "LORETALK.PAS:literal:6261": "정말 Lord Ahn에게서는 찾아볼수가 없는 그런", "LORETALK.PAS:literal:6311": "자애와 따뜻한 정이었습니다.  그리고 여태껏", "LORETALK.PAS:literal:6358": "내가 알고 있는 그에 대한 지식이  정말 잘못", "LORETALK.PAS:literal:6406": "되었다는 것과  이런 사실을 다른 사람에게도", "LORETALK.PAS:literal:6453": "알려주고 싶다는 이유로  그의 사상을 퍼뜨리", "LORETALK.PAS:literal:6500": "다 이렇게 잡히게 된것입니다.", "LORETALK.PAS:literal:6559": " 하지만 더욱 이상한것은 Lord Ahn 자신도 그", "LORETALK.PAS:literal:6610": "에 대한 사실을 인정하면서도  왜 우리에게는", "LORETALK.PAS:literal:6657": "그를 배격하도록만 교육시키는 가를  알고 싶", "LORETALK.PAS:literal:6704": "을뿐입니다. Lord Ahn께서는 나를 이해한다고", "LORETALK.PAS:literal:6754": "하셨지만 사회 혼란을 방지하기 위해 나를 이", "LORETALK.PAS:literal:6801": "렇게 밖에 할수 없다고 말씀하시더군요. 그리", "LORETALK.PAS:literal:6848": "이것은 선을 대표하는 자기로서는 이 방법 밖", "LORETALK.PAS:literal:6895": "에는 없다고 하시더군요.", "LORETALK.PAS:literal:6931": " 하지만 Lord Ahn의 마음은 사실 이렇지 않다", "LORETALK.PAS:literal:6982": "는걸 알수 있었습니다.  Ancient Evil의 말로", "LORETALK.PAS:literal:7035": "는 사실 서로가 매우 절친한 관계임을 알수가", "LORETALK.PAS:literal:7082": "있었기 때문입니다.", "LORETALK.PAS:literal:7178": " 히히히... 위대한 용사님. 낄낄낄.. 내가 당", "LORETALK.PAS:literal:7228": "신들의 일행에 끼이면 안될까요 ? 우히히히..", "LORETALK.PAS:literal:7298": "그렇다면 당신을 받아들이지요", "LORETALK.PAS:literal:7335": "당신은 이곳에 그냥 있는게 낫겠소", "LORETALK.PAS:literal:743": " 당신이  Necromancer에 진정으로  대항하고자", "LORETALK.PAS:literal:799": "한다면, 이 성의 바로위에 있는 피라밋에 가보", "LORETALK.PAS:literal:8045": " 안녕하시오. 나는 한때 이 곳의 유명한 도둑", "LORETALK.PAS:literal:8093": "이었던 사람이오.  결국 그 때문에 나는 잡혀", "LORETALK.PAS:literal:8141": "서 평생 여기에 있게 되었지만...", "LORETALK.PAS:literal:8187": " 그건 그렇고, 내가 LORE 성의 보물인 ", "LORETALK.PAS:literal:8214": "황금의", "LORETALK.PAS:literal:8250": "방패", "LORETALK.PAS:literal:8255": "를 훔쳐 달아나다. 그만 그것을 MENACE라", "LORETALK.PAS:literal:8303": "는 금광에 숨겨 놓은채 잡혀 버리고 말았소.", "LORETALK.PAS:literal:8350": "나는 이제 그것을 가져봤자 쓸때도 없으니 차", "LORETALK.PAS:literal:8397": "라리 당신이 그걸 가지시오. 가만있자...  어", "LORETALK.PAS:literal:8446": "디였더라...  그래 ! MENACE의 가운데쯤에 벽", "LORETALK.PAS:literal:8498": "으로 사방이 둘러 싸여진 곳이었는데..  당신", "LORETALK.PAS:literal:850": "도록하시오. 그 곳은 Necromancer와 동시에 바", "LORETALK.PAS:literal:8546": "들이라면  지금 여기에 들어온것과 같은 방법", "LORETALK.PAS:literal:8593": "으로 들어가서 방패를 찾을수 있을것이오. 행", "LORETALK.PAS:literal:8640": "운을 빌겠소.", "LORETALK.PAS:literal:8733": " 당신들에게 경고해 두겠는데 건너편 방에 있", "LORETALK.PAS:literal:8780": "는 Joe는 오랜 수감생활 끝에 미쳐 버리고 말", "LORETALK.PAS:literal:8829": "았소.  그의 말에 속아서 당신네 일행에 참가", "LORETALK.PAS:literal:8874": "시키는 그런 실수는 하지마시오.", "LORETALK.PAS:literal:9026": " Lord Ahn 님의 명령에 의해서 당신들에게 한", "LORETALK.PAS:literal:9080": "가지의 무기를 드리겠습니다.  들어가셔서 무", "LORETALK.PAS:literal:910": "다에서 떠오른 ", "LORETALK.PAS:literal:9130": "기를 선택해 주십시오.", "LORETALK.PAS:literal:9203": " 여기서 가져가신 무기를 잘 사용하셔서 세계", "LORETALK.PAS:literal:921": "또다른 지식의 성전", "LORETALK.PAS:literal:9253": "의 적인 Necromancer를 무찔러 주십시오.", "LORETALK.PAS:literal:934": "이기 때문이", "LORETALK.PAS:literal:9365": "MENACE 에는 금덩이가 많다던데...", "LORETALK.PAS:literal:9422": "MENACE 는 한때 금광이었습니다.", "LORETALK.PAS:literal:966": "오.  당신이 어느 수준이 되어 그 곳에 들어간", "LORETALK.PAS:literal:9743": "행운을 빌겠소 !!!", "LORETALK.PAS:literal:9801": "저희 성주님을 만나 보십시오.", "LORETALK.PAS:literal:9858": "당신은 이 게임 세계에 도전하고 싶습니까 ?", "LORETALK.PAS:literal:9906": "(Y/n)"}, "nodes": [{"blocks": [{"id": "prologue/arrival_first", "kind": "narration", "literal_ids": [], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 발걸음을 멈췄다. "}, {"ref": {"catalog": "terms", "id": "lore"}}, {"text": " 성에서 시작된 길은 아직 어느 쪽으로도 뻗어 있지 않았다. 곁에 선 일행을 한 번 돌아본 뒤, 그는 앞으로 시선을 돌렸다."}], "when": true}, {"id": "prologue/arrival_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "누가 먼저 말을 꺼내야 할지 알 수 없는 짧은 침묵이 흘렀다. 함께 나설 사람들은 있었지만, 함께 겪은 일은 이제부터 만들어야 했다. 그는 그 사실을 서두르지 않고 받아들이기로 했다."}], "when": true}, {"id": "i/party_intro", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성으로 향하는 길에서 네 사람의 걸음소리를 나누어 들었다. 가장 무거운 발소리는 앞에서, 가장 가벼운 발소리는 뒤에서 났다. 모두 같은 일을 하러 가는 사람들이었지만 등에 짊어진 물건은 조금씩 달랐다. 그는 네 사람을 한 번에 부르려다 그만두었다. 얼굴을 보고 하나씩 부르는 편이 낫겠다고 생각했다."}], "when": true}, {"id": "i/intro_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "은/는"}}, {"text": " 자기 짐에서 "}, {"ref": {"catalog": "equipment", "id": "story_axe"}}, {"text": "의 손잡이를 확인했다. 오늘 할 일에 그것이 얼마나 쓸모 있을지는 아직 아무도 몰랐다. 그래도 낯선 성문 앞에서 익숙한 물건을 손으로 짚는 동안, 발걸음이 조금은 고르게 맞춰졌다."}], "when": true}, {"id": "i/intro_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_hunter", "particle": "은/는"}}, {"text": " 자기 짐에서 "}, {"ref": {"catalog": "equipment", "id": "story_bow"}}, {"text": "의 손잡이를 확인했다. 오늘 할 일에 그것이 얼마나 쓸모 있을지는 아직 아무도 몰랐다. 그래도 낯선 성문 앞에서 익숙한 물건을 손으로 짚는 동안, 발걸음이 조금은 고르게 맞춰졌다."}], "when": true}, {"id": "i/intro_party_cook", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "speaker": null, "t 28, "ref": {"catalog": "terms", "id": "lore"}, "start": 324}, {"end": 489, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 478}, {"end": 696, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 685}], "literal_ids": ["LORETALK.PAS:literal:11399", "LORETALK.PAS:literal:11448", "LORETALK.PAS:literal:11497", "LORETALK.PAS:literal:11544", "LORETALK.PAS:literal:11593", "LORETALK.PAS:literal:11642", "LORETALK.PAS:literal:11691", "LORETALK.PAS:literal:11741", "LORETALK.PAS:literal:11790", "LORETALK.PAS:literal:11839", "LORETALK.PAS:literal:11878", "LORETALK.PAS:literal:11928", "LORETALK.PAS:literal:11976", "LORETALK.PAS:literal:12026", "LORETALK.PAS:literal:12079", "LORETALK.PAS:literal:12128", "LORETALK.PAS:literal:12177", "LORETALK.PAS:literal:12225", "LORETALK.PAS:literal:12272", "LORETALK.PAS:literal:12325", "LORETALK.PAS:literal:12343", "LORETALK.PAS:literal:12357", "LORETALK.PAS:literal:12387", "LORETALK.PAS:literal:12436", "LORETALK.PAS:literal:12485", "LORETALK.PAS:literal:12534", "LORETALK.PAS:literal:12583", "LORETALK.PAS:literal:12632", "LORETALK.PAS:literal:12668", "LORETALK.PAS:literal:12718", "LORETALK.PAS:literal:12771", "LORETALK.PAS:literal:12778", "LORETALK.PAS:literal:12807", "LORETALK.PAS:literal:12834", "LORETALK.PAS:literal:12868"]}}], "when": true}, {"id": "prologue/briefing_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "이야기는 한 사람의 부탁보다 훨씬 먼 곳까지 뻗어 있었다. 용암으로 변한 땅, 가라앉은 대륙, 소식이 끊긴 사람들. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 모든 것을 직접 본 적이 없었다. 지금 자신이 가진 것은 성주가 들려준 설명이었다."}], "when": true}, {"id": "prologue/briefing_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "그렇다면 지금 저희에게 필요한 일은 무엇입니까?"}], "when": true}, {"id": "prologue/briefing_end", "kind": "narration", "literal_ids": [], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성주는 곧바로 대답하지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 짧은 간격 동안 일행의 숨소리를 들었다. 이야기를 듣는 시간은 끝나 가고 있었다. 이제는 자신들이 무엇을 할 수 있는지 물어야 할 차례였다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 다음 장면에 전달한다."}], "effects": [], "id": "prologue/hear_lord_briefing", "label": [{"text": "첫 부탁을 기다린다"}], "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "prologue/first_quest_boundary", "when": true}], "editorial": {"intent": "원문 사이를 연결하는 시범 장면", "notes": "공간·행동·심리 묘사는 창작. 원문을 새로운 진상으로 확장하지 않는다.", "source_refs": ["prologue/lord_history"], "status": "draft"}, "entry_when": true, "handoff": null, "id": "prologue/briefing", "kind": "scene", "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "source_adaptation", "source_refs": ["prologue/lord_history"]}, "title": [{"text": "설명의 무게"}]}, {"blocks": [], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "앞선 선택의 상태·지식·사건을 초기화하지 않는다."}], "effects": [], "id": "prologue/first_quest_boundary/continue", "label": [{"text": "다음 이야기로 이어간다"}], "provenance": {"note": "집필 파일 경계 연결용 파생 선택. 게임 선택지가 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/assignment", "when": true}], "editorial": {"intent": "원문 사이를 연결하는 시범 장면", "notes": "공간·행동·심리 묘사는 창작. 원문을 새로운 진상으로 확장하지 않는다.", "source_refs": [], "status": "draft"}, "entry_when": true, "handoff": null, "id": "prologue/first_quest_boundary", "kind": "merge", "provenance": {"note": "새로 집필한 연결 서사·표현. 원작 문장이나 확정 설정이 아니다.", "origin": "authored", "source_refs": []}, "title": [{"text": "첫 의뢰 직전"}]}, {"blocks": [{"id": "lore_menace/request_before", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-1 재집필. 바람·창·더위·손의 감각과 질문 뒤의 긴장은 이 장면의 창작 묘사이며 고정 건축·기후·성격 설정이 아니다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성주는 대답하지 않았다. 창 쪽에서 들어온 바람이 방 안의 더운 공기를 조금 밀어냈다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 손바닥을 폈다가 다시 쥐었다. 아까부터 손에 땀이 나고 있었다. 묻는 말 한마디쯤은 쉽게 할 수 있을 줄 알았는데, 막상 입 밖에 내놓고 나니 누가 주워서 돌려주었으면 좋겠다는 생각이 들었다."}], "when": true}, {"id": "lore_menace/request_silence", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 대답을 기다리는 시간과 익명 일행의 작은 움직임. 동료의 신원·고정 성향은 정하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "이제 와서 질문을 거둘 수도 없었다. 지금 저희에게 필요한 일이 무엇이냐고 물었다. 정말로 아무 일도 주지 말아 달라는 뜻이었다면, 훨씬 다른 말을 했어야 했다. 옆에서 누군가 발을 고쳐 디뎠다. 돌바닥을 스치는 소리가 조용한 방 안에서는 지나치게 크게 들렸다."}], "when": true}, {"id": "lore_menace/request_floor", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 접견실 바닥과 시선 회피의 순간 묘사. 신발 종류나 성의 영구 구조를 설정하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 시선을 내렸다. 발끝 가까이 바닥의 금이 하나 보였다. 가늘게 갈라진 선은 두 돌 사이를 비껴가다가 신발 아래에서 사라졌다. 그는 잠시 그 끝을 찾았다. 바닥을 보고 있으면 적어도 성주와 눈을 마주치지 않아도 되었다. 그러다 자신이 무엇을 하고 있는지 깨닫고, 서둘러 고개를 들었다."}], "when": true}, {"id": "lore_menace/request_lord_look", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 주인공이 느끼는 시선과 압박. 성주의 속마음을 객관적 사실로 단정하지 않는 제한적 시점이다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성주는 일행을 보고 있었다. 아까부터 같은 자리에 같은 자세로 있었을 텐데, 이번에는 그 시선이 다르게 느껴졌다. 이야기를 들려주는 사람의 눈이 아니라, 대답을 고르는 사람의 눈 같았다. 누구에게 어느 만큼을 맡길 것인지 가늠하는 동안, 맡겨질 쪽은 자신이 그 값에 못 미칠까 봐 숨을 얕게 쉬고 있었다."}], "when": true}, {"id": "lore_menace/request_distant_name", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 앞 장에서 들은 설명에 대한 순간적 반응. 적의 위치·정체·실제 능력은 추가로 공개하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "necromancer"}}, {"text": ". 그 이름을 머릿속에서 한 번 더 불러 보았다. 조금 전 성주의 설명에 나왔을 때는 너무 멀었다. 가라앉은 땅과 돌아오지 않는 사람들의 이야기 속에 있었다. 그런 이름을 상대로 자신들이 무슨 일을 할 수 있느냐고 묻고 싶기도 했다. 그러나 조금이라도 우스운 질문처럼 들릴까 봐, 이번에는 입을 다물었다."}], "when": true}, {"id": "lore_menace/request_waiting_breath", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 기다림을 몸의 감각으로 펼친 연결 서사. 고정 질병이나 체질 설정이 아니다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "자신도 모르게 들이마신 숨을 오래 붙들고 있었다. 천천히 내쉬려는데 목이 먼저 움직였다. 마른침이 잘 넘어가지 않았다. 성주가 그 소리를 들었을까. 괜히 입술을 다물었다가, 그렇게 한다고 소리가 없었던 일이 되는 것은 아니라는 생각에 턱의 힘을 풀었다. 방금 한 질문에 대답을 듣는 것뿐이었다. 아직 어디로 떠난 것도 아니었다."}], "when": true}, {"id": "lore_menace/request_lord_motion", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 이어지는 원문 의뢰를 듣는 감각. 새 원문 대사나 실제 지형·경로 정보는 추가하지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": null, "text": [{"text": "성주가 입을 열었다. 첫마디를 듣자 바닥의 금도, 옆에서 났던 소리도 멀어졌다. 남서쪽이라는 방향이 나왔다. 동굴이라는 장소가 뒤따랐다. 앞선 이야기에 비하면 작고 또렷한 말들이었다. 그 안으로 사람의 발이 들어갈 수 있을 것 같았다."}], "when": true}, {"id": "lore_menace/request_quote", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:12962", "LORETALK.PAS:literal:13018", "LORETALK.PAS:literal:13067", "LORETALK.PAS:literal:13121", "LORETALK.PAS:literal:13171", "LORETALK.PAS:literal:13219", "LORETALK.PAS:literal:13270", "LORETALK.PAS:literal:13319", "LORETALK.PAS:literal:13368", "LORETALK.PAS:literal:13403", "LORETALK.PAS:literal:13457", "LORETALK.PAS:literal:13506", "LORETALK.PAS:literal:13555", "LORETALK.PAS:literal:13603", "LORETALK.PAS:literal:13651", "LORETALK.PAS:literal:13692"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/assignment"]}, "speaker": "lord_ahn", "text": [{"source": {"bindings": [{"end": 12, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 1}, {"end": 27, "ref": {"catalog": "terms", "id": "lore"}, "start": 23}, {"end": 64, "ref": {"catalog": "terms", "id": "menace"}, "start": 58}, {"end": 145, "ref": {"catalog": "terms", "id": "lore"}, "start": 141}, {"end": 244, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 233}], "literal_ids": ["LORETALK.PAS:literal:12962", "LORETALK.PAS:literal:13018", "LORETALK.PAS:literal:13067", "LORETALK.PAS:literal:13121", "LORETALK.PAS:literal:13171", "LORETALK.PAS:literal:13219", "LORETALK.PAS:literal:13270", "LORETALK.PAS:literal:13319", "LORETALK.PAS:literal:13368", "LORETALK.PAS:literal:13403", "LORETALK.PAS:literal:13457", "LORETALK.PAS:literal:13506", "LORETALK.PAS:literal:13555", "LORETALK.PAS:literal:13603", "LORETALK.PAS:literal:13651", "LORETALK.PAS:literal:13692"]}}], "when": true}, {"id": "lore_menace/request_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말이 끝났는데도 동굴이라는 낱말이 귀에 남았다. 들어가는 순간 빛이 등 뒤로 밀려나고, 조금 더 걸으면 등 뒤의 빛도 없어질 것이다. 보지도 않은 입구가 먼저 떠올랐다. 중심부라는 말은 그 어둠의 한가운데를 가리키는 듯했다. 그는 손가락을 펴서 옷자락에 문질렀다. 손에 땀이 난 채로 어디를 붙들고 싶지는 않았다."}], "when": true}, {"id": "lore_menace/request_veteran_memory", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "주점에서 들었던 목소리가 불쑥 끼어들었다. 친구들이 돌아오지 않았다고 말하던 사람. 그는 친구들의 이름을 하나하나 들려주지는 않았다. 그런데도 "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 자리에 남겨진 얼굴을 떠올렸다. 술잔보다 오래 붙들고 있는 이야기가 있다는 것은 그때 알았다. 지금 이 방에서 선뜻 가겠다고 말하고 나면, 누군가는 또 기다리는 쪽에 서게 될까. 그는 눈을 한번 감았다가 떴다."}], "when": {"op": "eq", "state": "knowledge.missing_squad", "value": true}}, {"id": "lore_menace/request_after_recoil", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 무기고 허가에 대한 주인공의 긴장. 무기를 지급하거나 전투를 확정한 장면이 아니다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": null, "text": [{"text": "성주의 마지막 말은 무기고에 관한 것이었다. 필요한 무기를 가져가도 좋다. 그 대목에서 마음이 잠깐 가벼워졌다가, 곧 더 무거워졌다. 무기를 말한다는 것은 그만큼 다칠 수도 있다는 뜻처럼 들렸다. 동굴을 보고 오라는 부탁이 산책은 아니었다. 말로 들을 때에는 입구에서 중심까지가 한 호흡이었지만, 실제로 걸어갈 때도 그럴 리는 없었다."}], "when": true}, {"id": "lore_menace/request_question_gather", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 익명 시작 일행의 존재와 발화 전 동작. 신원·직업·장비·관계를 임의 확정하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 옆을 돌아보았다. 자신과 함께 온 사람들은 여전히 그곳에 서 있었다. 이 부탁을 들은 것은 자기 혼자가 아니었다. 방금까지는 성주 앞에서 무슨 대답을 해야 할지가 문제였는데, 이제는 대답한 뒤 이 사람들과 어디로 가게 되는지가 문제였다. 눈길을 되돌리면서 그는 조금 천천히 말했다."}], "when": true}, {"id": "lore_menace/request_scope_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 의뢰 범위를 확인하는 새 질문. 원작에 없는 대사이며 전투 조건을 새로 설정하지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": "protagonist", "text": [{"text": "그곳에서 싸워야 한다는 말씀입니까?"}], "when": true}, {"id": "lore_menace/request_scope_wait", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 질문 직후의 망설임. 전편에 걸친 고정 겁쟁이 성향을 부여하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "입 밖에 나온 말은 생각했던 것보다 짧았다. 피할 수 있습니까, 라고 묻고 싶었던 것인지도 몰랐다. 꼭 해야 합니까, 라는 말을 돌려 한 것 같기도 했다. 성주가 대답하기 전에 덧붙일 말들을 골라 보았지만, 어느 것도 처음 말보다 나아 보이지 않았다. 그는 입을 다물고 기다렸다."}], "when": true}, {"id": "lore_menace/request_scope_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 원문 의뢰를 재확인하는 창작 답변. 적·보스 처치나 안전·귀환 보장을 덧붙이지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": "lord_ahn", "text": [{"text": "내가 부탁한 것은 탐사요. 중심부까지 가 주시오."}], "when": true}, {"id": "lore_menace/request_scope_face", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 답변에 기대했던 안심이 오지 않는 순간. 원작 접근 조건과 적 배치를 변화시키지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성주는 곧바로 안심시키는 말을 보태지 않았다. 위험하지 않다거나, 금방 다녀올 수 있다거나. 그런 말 하나쯤을 기다리고 있었던 것 같아 그는 머쓱해졌다. 중심부까지. 같은 말인데 이번에는 조금 단단하게 들렸다. 어디를 가리키는 말인지 모르는 채로도, 거기까지 걸어야 한다는 것은 알아들을 수 있었다."}], "when": true}, {"id": "lore_menace/request_proof_sting", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 능력 증명의 요청에 대한 즉각적 감정. 성주의 선악이나 배후 관계를 암시·확정하지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": null, "text": [{"text": "능력을 증명해 달라는 말도 늦게 걸렸다. 처음 들었을 때는 목적지에 정신이 팔려 흘려보냈는데, 이제는 그 말만 한 걸음 뒤에서 따라붙었다. 자신들을 믿지 못한다는 뜻일까. 성주 쪽을 보자 곧 다른 생각이 들었다. 자기 역시 이 방에 들어서기 전에는 성주가 어떤 사람인지 몰랐다. 잠깐 이야기를 나누었다고 해서 그 모르는 부분이 전부 사라진 것은 아니었다."}], "when": true}, {"id": "lore_menace/request_proof_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 신뢰를 확인하고 싶은 주인공의 새 대사. 신뢰 수치나 새 보상 조건을 만들지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": "protagonist", "text": [{"text": "저희가 돌아오면, 그때는 믿으실 수 있습니까?"}], "when": true}, {"id": "lore_menace/request_proof_blush", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 발화 뒤 당혹감과 내적 말 고르기. 나이·외모·고정 말투 설정을 추가하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "묻고 나니 재촉처럼 들렸다. 아직 한 발짝도 가지 않았으면서 돌아온 뒤의 대접부터 정해 달라는 사람 같았다. 얼굴이 조금 뜨거워졌다. 그는 아니, 그런 뜻은 아니고, 하고 말을 고칠 뻔했다. 하지만 처음 한 질문도 그렇게 주워 담고 싶었는데, 이번 것까지 주워 담으면 정작 하고 싶은 말은 하나도 남지 않을 것 같았다."}], "when": true}, {"id": "lore_menace/request_proof_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 장면의 새 응답. 이후 보고·보상 사건을 미리 실행하거나 숨은 동기를 확정하지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": "lord_ahn", "text": [{"text": "우선 돌아와서 이야기합시다."}], "when": true}, {"id": "lore_menace/request_return_weight", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환이라는 말에 연결된 감각과 생각. 미래 귀환의 성공·기다리는 인물을 사전에 확정하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌아와서. 그 말에 그는 처음으로 성주 뒤가 아니라 자기 뒤를 생각했다. 이 방으로 들어온 길, 복도, 성 안에서 스쳐 지나온 얼굴들. 방금까지 모두 출발 전의 풍경이었는데, 대답 하나를 사이에 두고 돌아왔을 때 다시 볼 것들이 되었다. 돌아올 수 있을까, 하는 생각은 입 밖에 내놓지 않았다. 대신 들이마신 숨을 끝까지 내쉬었다."}], "when": true}, {"id": "lore_menace/request_readiness", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 익명 일행의 순간적 몸짓. 전원의 동의·영입·관계 상승을 시스템 사실로 기록하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 다시 곁의 사람들을 보았다. 누군가 그의 눈길을 받고 자세를 바로 했다. 누군가는 문 쪽으로 고개를 돌렸다가 되돌아왔다. 모두가 같은 생각을 하고 있는지는 알 수 없었다. 그래도 조금 전보다 가까이 서 있는 듯했다. 혼자 앞에 나서서 기다리는 기분이 덜했다. 그는 자신이 서 있던 자리를 반 발짝 고쳐 잡았다."}], "when": true}, {"id": "lore_menace/request_dry_mouth", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 큰 맹세 대신 현재 의뢰에 답하는 장면. 새 충성·직업·능력을 부여하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "입안은 여전히 말라 있었다. 무언가 대단한 말을 해야 하는 자리 같았지만 대단한 말은 하나도 떠오르지 않았다. 성주를 보면서 준비된 문장을 기다렸다. 나라를 위해서라거나, 반드시 적을 쓰러뜨리겠다거나. 어느 말을 골라도 자신의 목소리로 들리지 않을 것 같았다. 결국 아까 들은 부탁에서 딱 한 부분만 꺼냈다."}], "when": true}, {"id": "lore_menace/request_reply", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "중심부까지 확인하고 돌아오겠습니다."}], "when": true}, {"id": "lore_menace/request_promise", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말하고 나서 그는 잠깐 기다렸다. 자기 목소리가 방 안에서 잦아들 때까지. 대답이 너무 평범했나 싶기도 했다. 그러나 더 보태지는 않았다. 성주는 고개를 끄덕였고, 그제야 옆에 선 일행도 조금씩 움직였다. 오래 같은 자세로 서 있었던 모양이다. 그 역시 어깨를 느슨하게 했다. 목덜미가 뻐근했다."}], "when": true}, {"id": "lore_menace/request_unfinished_fear", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 수락 직전의 남은 긴장. 실제 탐사·접근·보상 상태를 미리 바꾸지 않는다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": null, "text": [{"text": "어깨를 내린다고 겁까지 내려가지는 않았다. 동굴의 안쪽을 생각하면 아직 가슴이 답답했다. 그런데도 아까처럼 무슨 말을 해야 할지 몰라서 답답한 것은 아니었다. 남서쪽으로 가면 된다. 동굴을 찾으면 된다. 그다음 일은 그다음에 눈앞에 닥칠 것이다. 그는 목적지를 속으로 되풀이했다."}], "when": true}, {"id": "lore_menace/request_name_repeated", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 이름을 되뇌는 순간과 작은 자조. 지명은 ID로 참조하고 고정 성향을 새로 확정하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "terms", "id": "menace"}}, {"text": ". 아직 입구도 본 적 없는 곳의 이름이었다. 다른 사람에게서 들었을 때는 그저 낯설었는데, 지금은 입 안에서 몇 번이고 굴리게 되었다. 중심부까지 간다는 말을 했으니 적어도 이름만은 잊어서는 안 되겠지. 그런 엉뚱한 생각에 그는 아주 잠깐 웃을 뻔했다. 웃음은 나오지 않았지만 턱의 힘이 조금 풀렸다."}], "when": true}, {"id": "lore_menace/request_looking_back", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 같은 감각으로 장면을 닫는 창작 동작. 성 출구 사건이나 다음 소편의 이동은 아직 집필하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성주에게 인사를 하고 몸을 돌리자 아까 보았던 바닥의 금이 다시 나타났다. 이번에는 그 끝을 찾지 않았다. 한 걸음 내디디면 발 아래로 사라질 선이었다. 등 뒤에 남은 방은 조금 전과 같았고, 앞에 선 사람들도 달라지지 않았다. 달라진 것은 이제 그들 모두에게 갈 곳이 생겼다는 것뿐이었다."}], "when": true}, {"id": "lore_menace/request_last_word", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-1 끝의 감정과 걸음. 성공을 보장하거나 다음 사건을 발생시킨 기록이 아니다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 문 쪽으로 걸으며 방금 한 말을 다시 생각했다. 중심부까지 확인하고 돌아오겠습니다. 앞부분을 말할 때는 성주를 보고 있었다. 끝부분을 말할 때 어디를 보고 있었는지는 기억나지 않았다. 다만 돌아오겠다는 그 짧은 말이, 문을 향하는 동안 자꾸 발걸음을 붙들었다."}], "when": true}], "choices": [{"branch_kind": "quest", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [{"op": "set", "provenance": {"note": "원작 조건/변화를 집필 상태로 추상화. 원문 코드 실행이나 고정 인물 설정 추가가 아니다.", "origin": "source_adaptation", "source_refs": ["lore_menace/assignment"]}, "state": "quest.lore_stage", "value": 3}], "id": "lore_menace/receive_assignment", "label": [{"text": "탐사 부탁을 받아들인다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/preparation", "when": true}], "editorial": {"intent": "1-1: 성주의 첫 탐사 부탁을 듣고 귀환을 약속하기까지 한 장면을 충분히 펼친 재집필 초고", "notes": "추가: 방의 감각·시선·침묵·신체 반응·의뢰 확인 질문과 답변은 창작. 첫 소편만 재집필했으며 나머지 장면은 짧은 구조 초고 상태다. 미정 나이/직업/초기 장비/동료 신원은 확정하지 않는다.", "source_refs": ["lore_menace/assignment"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lore_stage", "value": 2}, "handoff": null, "id": "lore_menace/assignment", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/assignment"]}, "title": [{"text": "1-1 · 돌아오겠다는 말"}]}, {"blocks": [{"id": "lore_menace/preparation_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "접견실을 나서자 먼저 소리가 돌아왔다. 안에서는 옆 사람의 발끝이 바닥을 스치는 소리까지 들렸는데, 복도에는 어디선가 문을 여닫는 소리와 멀리서 오가는 말소리가 섞여 있었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 숨을 길게 내쉬었다. 성주 앞에서도 숨은 쉬었을 텐데, 이상하게 이제야 숨을 쉬는 것 같았다."}], "when": true}, {"id": "lore_menace/prep_promise", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "일행은 잠깐 걸음을 늦췄다. 누구도 곧바로 말을 꺼내지 않았다. 중심부까지 확인하고 돌아오겠다고 말한 목소리가 아직 목 안에 남아 있었다. 그는 자신이 방금 한 대답을 다시 들려주어야 하나 생각했다. 모두 함께 들었는데 똑같은 말을 하면 우스울 것 같았다. 그렇다고 아무 말 없이 앞장서는 것도 어딘가 어색했다."}], "when": true}, {"id": "lore_menace/prep_words", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "남서쪽이라고 했습니다. 우선 그쪽으로 가죠."}], "when": true}, {"id": "lore_menace/prep_sound", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "입을 열고 나니 그 정도 말이면 충분했다. 일행도 다시 움직였다. 누가 먼저랄 것 없이 좁혀졌다 벌어지는 발걸음 사이로 그가 들어갔다. 앞장서겠다고 정한 적은 없는데, 어느 순간 앞쪽에 서 있었다. 조금 빠른가 싶어 걸음을 늦추었다가 너무 눈에 띄게 늦춘 것 같아 다시 한 발을 보탰다."}], "when": true}, {"id": "lore_menace/prep_corridor", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 익명 배경 인물과 복도 소리. 새 인물 설정·퀘스트·지식 전달을 만들지 않는 순간 묘사다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "복도 옆에서 문이 하나 열렸다. 안에서 나오던 사람은 일행이 지나갈 때까지 잠깐 기다렸다. 그는 가볍게 고개를 숙였다. 별것 아닌 인사였는데, 그제야 성 안의 사람들이 모두 자신들의 출발을 지켜보고 있는 것은 아니라는 것을 알았다. 누군가는 문을 열고, 누군가는 길을 비키고, 누군가는 하던 말을 계속했다. 그 틈으로 지나가면 되었다."}], "when": true}, {"id": "lore_menace/prep_name", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "terms", "id": "menace"}}, {"text": ". 속으로 부르자 금세 성주가 말한 방향이 따라붙었다. 남서쪽. 동굴. 중심부. 세 말을 잊을까 봐 다시 외웠다. 이렇게 쉬운 말도 긴장하면 잊어버리나, 하는 생각이 들었다. 정말 잊어버린다면 돌아와서 무엇부터 잘못했는지 설명하는 일이 더 어려울 것이다. 그는 복도 끝에서 잠깐 고개를 들었다."}], "when": true}, {"id": "i/guide_progress", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:11040"], "provenance": {"note": "독립 스냅샷의 해당 조건·대사. 증언은 확정 진상이 아니다.", "origin": "source_exact", "source_refs": ["i/castle_dialogue"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:11040"]}}], "when": true}], "choices": [{" ", "source_refs": ["lore_menace/assignment"]}, "title": [{"text": "출발 전에"}]}, {"blocks": [{"id": "lore_menace/reminder_before", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "몇 걸음 걷던 "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 되돌아갔다. 일행을 기다리게 한 뒤 다시 성주 앞에 서자, 방금 나갔던 사람이 왜 벌써 돌아왔느냐는 질문을 받을 것 같았다. 그는 멋쩍게 인사했다. 잠깐만 확인하고 싶습니다, 하고 말하면서도 무슨 말을 잊었는지 바로 떠오르지 않았다. 목적지는 기억하고 있었다. 다만 한 번 더 들으면 마음이 놓일 것 같았다."}], "when": true}, {"id": "lore_menace/reminder_quote", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:13790", "LORETALK.PAS:literal:13807", "LORETALK.PAS:literal:13816"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/reminder"]}, "speaker": "lord_ahn", "text": [{"source": {"bindings": [{"end": 20, "ref": {"catalog": "terms", "id": "menace"}, "start": 14}], "literal_ids": ["LORETALK.PAS:literal:13790", "LORETALK.PAS:literal:13807", "LORETALK.PAS:literal:13816"]}}], "when": true}, {"id": "lore_menace/reminder_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "이번에는 남서쪽이라는 말을 들으며 고개를 끄덕였다. 자신이 기억한 것과 같았다. 덧붙일 질문이 없다는 것을 알고도 잠깐 서 있다가, 그는 다시 인사하고 돌아섰다. 복도에 남은 일행을 보자 조금 민망해졌다. 누군가 웃을까 싶어 먼저 괜찮습니다, 라고 말할 뻔했다. 하지만 아무도 묻지 않았으므로, 그대로 다시 걷기 시작했다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/finish_reminder", "label": [{"text": "안내를 기억하고 출구로 향한다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "i/threshold", "when": true}], "editorial": {"intent": "1-2: 출발 준비와 첫 동행 요청을 길게 펼치고 수락·거절에 다른 현재 동료와 감정의 끝을 준다.", "notes": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "source_refs": ["lore_menace/reminder"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lore_stage", "value": 3}, "handoff": null, "id": "lore_menace/reminder", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/reminder"]}, "title": [{"text": "같은 부탁을 다시 듣다"}]}, {"blocks": [{"id": "lore_menace/exit_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "출구가 가까워지자 바깥의 빛이 바닥 위에 길게 놓여 있었다. 복도 안에서는 밝아 보이던 곳도 그 빛 곁에서는 어두워졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 눈을 가늘게 떴다. 성주 앞에서 했던 대답이 이 문까지 따라온 것 같았다. 문만 넘으면 남서쪽이었다. 그는 무심코 문턱을 보았다. 넘어갈 곳은 생각보다 작았다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_call_quote", "kind": "source_quote", "literal_ids": ["LORESPEC.PAS:literal:11230"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/skeleton_exit"]}, "speaker": null, "text": [{"source": {"bindings": [{"end": 9, "ref": {"catalog": "terms", "id": "lore"}, "start": 5}], "literal_ids": ["LORESPEC.PAS:literal:11230"]}}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_called", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "처음에는 자기들을 부르는 줄 몰랐다. 다른 누군가가 뒤에 있는 줄 알고 옆으로 비켜서려다가 일행도 함께 멈춘 것을 보았다. 그제야 돌아보았다. 바깥으로 돌렸던 몸을 안쪽으로 되돌리자 눈앞의 빛이 옮겨갔다. 부르는 쪽의 얼굴은 잠깐 그늘에 묻혀 있었다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_wait", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "다가오는 이는 서둘러 입을 열려다가 한 번 멈추었다. 가까이까지 와 놓고도 마지막 두어 걸음은 남겨 두었다. 이 정도면 충분히 들릴 거리였다. 더 가까이 오지 않는 까닭은 알 수 없었지만, 그 간격 탓에 자신들이 그를 기다리고 있다는 것이 더 분명해졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 먼저 무슨 일이냐고 물으려던 말을 삼켰다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/skeleton_quote", "kind": "source_quote", "literal_ids": ["LORESPEC.PAS:literal:11609", "LORESPEC.PAS:literal:11667", "LORESPEC.PAS:literal:11722", "LORESPEC.PAS:literal:11781", "LORESPEC.PAS:literal:11842", "LORESPEC.PAS:literal:11899", "LORESPEC.PAS:literal:11953", "LORESPEC.PAS:literal:12008", "LORESPEC.PAS:literal:12069", "LORESPEC.PAS:literal:12125", "LORESPEC.PAS:literal:12158", "LORESPEC.PAS:literal:12171", "LORESPEC.PAS:literal:12184", "LORESPEC.PAS:literal:12197", "LORESPEC.PAS:literal:12210"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/skeleton_exit"]}, "speaker": "skeleton", "text": [{"source": {"bindings": [{"end": 12, "ref": {"catalog": "characters", "id": "skeleton"}, "start": 4}, {"end": 64, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 53}, {"end": 109, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 98}, {"end": 127, "ref": {"catalog": "terms", "id": "lore"}, "start": 123}, {"end": 216, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 205}], "literal_ids": ["LORESPEC.PAS:literal:11609", "LORESPEC.PAS:literal:11667", "LORESPEC.PAS:literal:11722", "LORESPEC.PAS:literal:11781", "LORESPEC.PAS:literal:11842", "LORESPEC.PAS:literal:11899", "LORESPEC.PAS:literal:11953", "LORESPEC.PAS:literal:12008", "LORESPEC.PAS:literal:12069", "LORESPEC.PAS:literal:12125", "LORESPEC.PAS:literal:12158", "LORESPEC.PAS:literal:12171", "LORESPEC.PAS:literal:12184", "LORESPEC.PAS:literal:12197", "LORESPEC.PAS:literal:12210"]}}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_last_sentence", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "한참 이어진 말은 함께 가고 싶다는 부탁으로 끝났다. 말이 끝나자 방금까지 남겨져 있던 두어 걸음의 간격이 갑자기 넓어 보였다. 그 사이로 빛이 들어와 있었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 누구를 보아야 할지 몰라 잠깐 일행 쪽으로 시선을 돌렸다. 그들을 바라보는 눈길을 알아차렸을까 싶어 곧 다시 앞을 보았다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/skeleton_reaction", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "혐오스런 생김새라고, 그가 스스로 말했다. 남의 입에서 그런 말을 듣는 것과 자기 입으로 말하는 것은 다를 것이다. 그는 그 표현이 나오던 순간의 목소리를 떠올렸다. 서둘러 다음 말로 넘어가는 바람에 오히려 더 오래 귀에 남았다. 아무 대답이나 빨리 해 주어야 할 것 같다가도, 함께 가겠다는 대답을 동정 때문에 해서는 안 될 것 같았다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "저희가 어디로 가는지는 알고 계십니까?"}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "아직 모르오. 하지만 이대로 여기 있을 수는 없소."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_answer_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "짧아진 대답이 조금 전의 긴 이야기보다 더 가깝게 들렸다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 문 밖을 보았다. 자기 역시 목적지를 안다고 해서 그곳을 아는 것은 아니었다. 하지만 이 사람을 데려간다면 지금보다 한 사람을 더 돌아보게 된다. 거절한다면 그는 이 문 안쪽에 남는다. 어느 쪽을 골라도 성주는 이 결정까지 대신해 주지 않을 것이다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_outside_sound", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2 동행 요청 뒤의 소리·몸짓과 주인공의 추측. 배경 인물 신원과 요청자의 실제 과거·심리는 확정하지 않는다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "바깥에서 누군가 웃는 소리가 났다. 기다리고 있던 이가 그쪽을 잠깐 보았다가 다시 일행 쪽으로 시선을 돌렸다. 그 작은 움직임 때문에 그가 여기까지 와서 말을 걸기 전에 얼마나 오래 망설였을지 궁금해졌다. 문은 열려 있었고, 남은 거리는 겨우 몇 걸음이었다. 그런데도 그가 가고 싶다는 곳은 혼자서는 넘기 어려운 간격 너머에 있는 듯했다. 그는 문턱 바깥의 길이 아니라, 지금 자신들의 대답을 기다리고 있었다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}, {"id": "lore_menace/exit_pause_again", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "다시 침묵이 왔다. 이번에는 기다리는 사람이 자기 앞에 있었다. 접견실에서 대답을 기다릴 때는 성주의 침묵이 길다고 생각했는데, 지금 자신의 침묵은 얼마나 길게 느껴질까. 마음을 정하기도 전에 말부터 꺼내고 싶어졌다. 그는 입술을 열었다가, 마지막으로 일행 쪽을 한 번 돌아보았다."}], "when": {"op": "eq", "state": "event.skeleton_conversation_done", "value": false}}], "choices": [{"branch_kind": "companion", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [{"op": "set", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "state": "companions.optional_recruits", "value": ["skeleton"]}, {"op": "set", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "state": "event.slot6", "value": "skeleton"}, {"op": "set", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "state": "event.skeleton_offer_seen", "value": true}], "id": "lore_menace/accept_skeleton", "label": [{"text": "당신을 환영하오."}], "label_literal_id": "LORESPEC.PAS:literal:12269", "provenance": {"note": "원작 수락·거절 선택 문구 그대로.", "origin": "source_exact", "source_refs": ["lore_menace/skeleton_exit"]}, "target": "lore_menace/departure_path", "when": {"op": "eq", "state": "event.slot6", "value": ""}}, {"branch_kind": "companion", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [{"op": "set", "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "state": "event.skeleton_offer_seen", "value": true}], "id": "lore_menace/decline_skeleton", "label": [{"text": "미안하지만 안되겠소."}], "label_literal_id": "LORESPEC.PAS:literal:12307", "provenance": {"note": "원작 수락·거절 선택 문구 그대로.", "origin": "source_exact", "source_refs": ["lore_menace/skeleton_exit"]}, "target": "lore_menace/departure_path", "when": true}, {"branch_kind
