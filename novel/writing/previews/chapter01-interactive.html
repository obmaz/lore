"literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "다가오라는 손짓을 받은 "}, {"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 남겨 둔 거리를 건너왔다. 곧바로 일행 한가운데로 들어오지는 않았다. 끝자리에 섰다가 앞사람이 움직이는 것을 보고 한 걸음을 따라 옮겼다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 모습을 보고 자기 역시 아까 복도에서 걸음을 맞추느라 쓸데없이 속도를 바꾸었던 것을 떠올렸다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/join_warning", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "길에서 무엇을 만날지는 저희도 모릅니다. 그래도 돌아오는 일까지 함께하겠습니다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/join_warning_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그 말은 성주 앞에서 했던 대답과 조금 달랐다. 아까는 누군가의 부탁에 대답했고, 이번에는 곁에 설 사람에게 말했다. 돌아오겠다는 말에 함께라는 말이 붙자 무게가 변했다. 그는 너무 큰 약속을 한 것은 아닐까 생각하면서도 말을 고치지는 않았다. 이미 상대가 듣고 있었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/join_response", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "그렇게 하겠소."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/join_space", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 그 뒤로 아무 말도 보태지 않았다. 오래 설명하던 사람의 짧은 대답이 어쩐지 조심스러워 보였다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그에게 출구를 가리켰다. 자기보다 먼저 나가라는 손짓으로 보였는지 상대가 잠깐 멈췄다. 그는 아니, 같이 가자는 뜻입니다, 하고 덧붙였다. 이번에는 둘 다 움직였다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/join_second_step", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "문턱을 넘는 걸음은 조금 겹쳤다. 누구를 기다린 것인지 알 수 없는 짧은 멈춤 뒤에, 일행의 끝에 서 있던 사람이 다시 한 발을 내디뎠다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 이번에는 굳이 앞장서려 하지 않았다. 함께 나갈 사람이 더 있다는 사실을 자기 발걸음이 먼저 알아차릴 시간을 주었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/decline_result", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "거절의 말이 끝나자 상대는 더 다가오지 않았다. 처음부터 남겨 두었던 거리가 그대로였다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 설명을 보태려고 했다. 지금은 어렵다거나, 위험한 곳이라거나. 하지만 어디까지가 진짜 이유인지 자신도 분명히 알 수 없었다. 어렵다는 말은 이미 했고, 위험하다는 말로 이 사람의 마음을 바꿀 수 있을 것 같지도 않았다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/decline_words", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "미안합니다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/decline_wait", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "대답을 기다린 것은 누구였을까. 거절당한 쪽보다 거절한 자신이 더 오래 서 있는 것 같았다. 그는 무슨 말을 들어야 움직일 수 있는 사람처럼 문 앞에 머물렀다. 상대가 고개를 돌리자 그제야 발끝을 출구 쪽으로 옮겼다. 따라오라고 손짓하지 않은 손이 옆구리에서 어색하게 흔들렸다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/decline_distance", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "일행이 다시 걷기 시작했다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 문턱을 넘기 전에 한 번 뒤를 보았다. 그 사람은 아직 안쪽에 있었다. 더 늦게 돌아보았다면 얼굴을 못 보았을지도 몰랐다. 그렇다고 한 번 더 돌아본다고 결정이 바뀌는 것은 아니었다. 그는 앞에 선 사람들과의 거리가 벌어지지 않도록 걸음을 보탰다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/decline_not_erased", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "함께 가지는 않게 되었지만, 들었던 목소리는 남아 있었다. 이대로 여기 있을 수는 없다는 말이 자꾸 뒤에서 들리는 것 같았다. 문 밖의 바람이 얼굴에 닿자 그는 고개를 조금 숙였다. 무슨 선택을 하면 마음이 편해질 거라고 생각한 적은 없었는데, 막상 결정하고 나니 그런 기대가 조금 있었다는 것을 알았다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/departure_result", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "바깥은 복도보다 시끄러웠다. 아직 아무것도 달라지지 않은 것 같은데, 성을 떠나려던 길은 한 번 멈추었고 다시 이어졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 멀리 나가기 전에 일행을 돌아보았다. 자신에게 필요한 첫 준비가 무엇이었는지 이제 조금 알 것 같았다. 앞에 있는 길을 찾기 전에, 지금 곁에 있는 사람들을 먼저 보아야 했다."}], "when": true}, {"id": "lore_menace/departure_direction", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그는 남서쪽을 향해 몸을 돌렸다. 접견실에서 그 말을 외울 때는 머릿속에만 있던 방향이었다. 햇빛과 바람 속에서 한쪽으로 걸음을 내딛자 다른 방향들이 등 뒤와 양옆으로 나뉘었다. 성문 안에서 미처 떼지 못한 생각들도 따라왔지만, 발은 이미 움직이고 있었다. 이번에는 멈추지 않고 몇 걸음을 더 걸었다."}], "when": true}, {"id": "lore_menace/departure_end", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "문 앞의 그림자가 뒤로 멀어졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 어깨를 한 번 움직였다. 한동안 긴장하고 서 있느라 뻐근해진 곳이 걸을 때마다 조금씩 풀렸다. 누군가의 발소리가 가까워졌다가 다시 일정한 간격에 머물렀다. 그는 그 간격을 바꾸려 하지 않았다. 이제 그 소리들과 함께 길을 나서면 되었다."}], "when": true}, {"id": "i/joe_departure", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "mad_joe", "particle": "은/는"}}, {"text": " 성을 등진 뒤에도 한동안 뒤쪽을 살폈다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 먼저 따라오라고 재촉하는 대신 걸음을 조금 늦췄다. 금세 친한 사람이 될 수는 없어도, 지금 같은 길 위에 있다는 사실은 확인할 수 있었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "mad_joe"}}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/set_out", "label": [{"text": "남서쪽으로 길을 잡는다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/road", "when": true}], "editorial": {"intent": "1-2: 출발 준비와 첫 동행 요청을 길게 펼치고 수락·거절에 다른 현재 동료와 감정의 끝을 준다.", "notes": "추가: 1-2의 복도·햇빛·거리감·머뭇거림·새 질문과 대답은 장면을 잇는 창작이다. 나이·직업·초기 장비·동료 신원·종족의 실제 처지는 확정하지 않으며, 수락/거절 조건을 원문대로 유지한다.", "source_refs": ["lore_menace/skeleton_exit"], "status": "draft"}, "entry_when": true, "handoff": null, "id": "lore_menace/departure_path", "kind": "merge", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/skeleton_exit"]}, "title": [{"text": "함께 걷거나 남겨 두거나"}]}, {"blocks": [{"id": "lore_menace/road_first", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성을 등지고 걷자 발밑의 소리가 달라졌다. 고른 바닥 위에서는 발을 디딜 때마다 소리가 뒤따랐는데, 바깥에서는 한 걸음이 다른 걸음보다 깊이 눌리기도 했다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 처음 몇 번 자기 발을 내려다보았다. 금세 눈을 들었지만, 몸은 여전히 발밑을 신경 쓰고 있었다. 복도에서 하던 속도로 걸으려니 자꾸 보폭이 어긋났다."}], "when": true}, {"id": "lore_menace/road_shoulders", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "바람이 옷에 닿았다가 지나갔다. 방 안에서는 덥다고 생각했는데 이제는 등이 식는 느낌이 들었다. 그는 걸음을 멈추지 않고 어깨를 한 번 뒤로 당겼다. 접견실에서 긴장하고 서 있던 자리가 아직 뻐근했다. 성주 앞에서 조금 덜 꼿꼿하게 섰어도 아무도 뭐라고 하지 않았을 텐데, 왜 그렇게까지 힘을 주고 있었을까."}], "when": true}, {"id": "lore_menace/road_castle_behind", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "몇 걸음마다 성이 어느 만큼 멀어졌는지 보고 싶었다. 처음 돌아보았을 때는 거의 달라 보이지 않았다. 조금 더 걷고 나서는 돌아보지 않으려고 했는데, 그 생각을 하자 오히려 다시 보고 싶어졌다. 결국 고개를 돌렸다. 일행과 눈이 마주치자 성이 아니라 뒤따라오는 사람을 확인한 척하며 가볍게 고개를 끄덕였다."}], "when": true}, {"id": "lore_menace/road_checking_pace", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "곁의 발소리는 제각기 다른 간격을 가지고 있었다. 빠르게 겹쳤다가 잠깐 떨어지는 소리, 작은 돌을 밟고 멈칫하는 소리. 그가 조금 늦추자 뒤쪽도 늦춰지는 것 같았다. 자꾸 이렇게 속도를 바꾸면 누구도 편하게 걷지 못할 것이다. 그는 앞의 한 지점으로 시선을 옮기고, 거기까지는 같은 걸음으로 가 보기로 했다."}], "when": true}, {"id": "lore_menace/road_destination_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "가기 전에 부탁받은 일을 다시 말씀드리겠습니다."}], "when": true}, {"id": "lore_menace/road_intro_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그렇게 말하고 나니 방금 출발했는데 무슨 가기 전인가 싶었다. 하지만 일행이 그의 말에 귀를 기울였다. 그는 조금 더 천천히 걸었다. 성주 앞에서는 모두 같은 말을 들었지만, 성문에서 멈추는 동안 그 이야기가 잠깐 뒤로 밀려나 있었다. 자기가 기억한 일을 입으로 다시 꺼내 놓으면 곁의 사람들도 같은 곳을 떠올릴 수 있을 것이다."}], "when": true}, {"id": "lore_menace/road_share", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": ["lore_menace/assignment"]}, "speaker": "protagonist", "text": [{"text": "성주가 부탁한 것은 "}, {"ref": {"catalog": "terms", "id": "menace"}}, {"text": "의 중심부를 확인하는 일입니다. 거기까지 간 뒤 성으로 돌아가 보고합니다."}], "when": true}, {"id": "lore_menace/road_mission_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "중심부, 라는 말에 그는 바깥의 먼 곳을 보았다. 그곳이 보일 리는 없었지만 눈길을 둘 곳이 필요했다. 성주 앞에서 한 대답은 이제 자기들끼리 나누는 말이 되었다. 탐사해 주시오, 라고 들었던 부탁이 확인하고 돌아갑니다, 라는 말로 바뀌었다. 목소리는 작아졌는데 해야 할 일이 더 가까워진 것 같았다."}], "when": true}, {"id": "lore_menace/road_skeleton", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 그 이야기가 끝날 때까지 걸음을 맞추며 들었다. 성문 앞에서는 서둘러 자기 이야기를 풀어놓았는데, 이번에는 말을 끼우지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 목적지를 설명한 것이 아니라 이름만 전달한 것은 아닐까 싶어 잠깐 상대를 보았다. 그쪽도 바라보고 있어서, 그는 먼저 눈길을 앞쪽으로 돌렸다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/road_join_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "그곳에 들어갔다가 다시 나오는 것이오?"}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/road_join_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "네. 지금은 그렇게 하려 합니다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/road_join_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "생각보다 짧은 대화였다. 상대가 더 큰 일을 요구하면 어떻게 대답할지 잠깐 고민했던 것이 무색해졌다. "}, {"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 고개를 끄덕이고 다시 앞을 보았다. 그에게도 같은 방향이 생겼다는 사실이, 함께 가자는 대답을 했을 때보다 이번 짧은 문답에서 더 또렷하게 느껴졌다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/road_declined_memory", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "설명을 마치고 뒤쪽을 돌아보았을 때, 성문 앞의 목소리가 잠깐 떠올랐다. 함께 왔다면 이 부탁을 그에게도 설명했을 것이다. 그는 아직 하지 않은 대화를 머릿속에서 시작하려다가 멈췄다. 지금은 곁에 있는 이들이 자기 말을 듣고 있었다. 누군가 고개를 끄덕이는 것을 보고 그는 다시 걸음에 집중했다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/road_veteran", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "주점의 사람은 친구들이 떠났다고 말했다. 그때는 떠난다는 말을 그저 들었는데, 지금 걷고 있으니 그 말 안에도 이런 시간이 있었을 것 같았다. 성이 아직 보이는 동안 돌아보았을까. 목적지를 몇 번이나 되물었을까. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 문득 그 사람에게 친구들은 어떤 말투였는지 물어볼 걸 그랬다는 생각을 했다. 이제 와서는 길 위에 남은 발소리밖에 들을 수 없었다."}], "when": {"op": "eq", "state": "knowledge.missing_squad", "value": true}}, {"id": "lore_menace/road_stone", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "발끝에 걸린 작은 돌이 앞으로 굴렀다. 그는 다음 걸음으로 그 돌을 또 건드릴 뻔했다가 비켜 디뎠다. 돌 하나 피하려고 몸을 틀었더니 뒤쪽과 거리가 조금 벌어졌다. 다시 속도를 늦추었다. 길을 나섰다는 것은 넓고 거창한 일 같았는데, 실제로는 이런 작은 것에 자꾸 걸렸다. 바닥을 보고, 앞을 보고, 곁을 보고. 눈길이 쉴 틈이 없었다."}], "when": true}, {"id": "lore_menace/road_distance", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "걸어온 거리가 궁금해졌다. 성주에게 얼마나 먼지 물어볼 생각을 왜 하지 못했을까. 남서쪽이라는 말은 길어도 짧아도 같은 방향이었다. 그는 잠깐 입을 열었다가 다물었다. 여기서 누군가에게 얼마나 남았느냐고 물어도 아는 사람이 있을 것 같지 않았다. 대신 목적지의 이름을 속으로 한 번 더 불렀다. 잊지는 않고 있었다."}], "when": true}, {"id": "lore_menace/road_breath", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "조금 더 걷자 생각과 발걸음이 느슨하게 맞물렸다. 한 발을 내딛는 데까지 매번 마음을 정하지는 않아도 되었다. 바람이 오는 쪽으로 고개를 돌렸다가 앞으로 돌렸다. 옆의 사람이 보폭을 바꾸는 소리에 잠깐 귀를 기울였다. 성문에서의 말들이 조금씩 멀어졌다. 길 위의 소리가 그 자리를 채우고 있었다."}], "when": true}, {"id": "lore_menace/road_end", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "동굴이 눈에 들어왔을 때, "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 처음에 그대로 지나갈 뻔했다. 성주가 말한 동굴이라면 멀리서부터 알아볼 것 같았는데, 막상 시선에 닿은 것은 빛이 머물지 않는 어두운 한쪽이었다. 그는 걸음을 늦췄다. 앞에 있던 어둠이 제자리를 잡자 그제야 입구의 윤곽이 보였다. 한 번 더 보려고 고개를 조금 기울였다."}], "when": true}, {"id": "i/joe_route", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 새 동행에게 오늘의 부탁을 처음부터 다시 설명했다. 뒤에서 함께 걸었다는 이유만으로 접견실의 말을 모두 들었을 리는 없었다. "}, {"ref": {"catalog": "characters", "id": "mad_joe", "particle": "은/는"}}, {"text": " 중심부까지 살피고 되돌아온다는 말을 작게 따라 했다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "mad_joe"}}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/enter_menace", "label": [{"text": "동굴 안으로 들어간다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/cave_entry", "when": true}, {"branch_kind": "navigation", "consequence": [{"text": "선택한 경험만 상태와 다음 장면에 남긴다."}], "effects": [], "id": "i/choose_role", "label": [{"text": "동굴에 들어가기 전에 각자의 할 일을 나눈다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "target": "i/roles", "when": true}], "editorial": {"intent": "1-3: 성을 떠난 일행의 걸음과 대화, 동굴 문턱의 감각을 펼치고 안으로 들어가는 결정에서 멈춘다.", "notes": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "source_refs": ["lore_menace/assignment", "lore_menace/menace_entry"], "status": "draft"}, "entry_when": true, "handoff": null, "id": "lore_menace/road", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/assignment", "lore_menace/menace_entry"]}, "title": [{"text": "말이 길이 될 때"}]}, {"blocks": [{"id": "lore_menace/cave_threshold", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": ["lore_menace/menace_entry"]}, "speaker": null, "text": [{"ref": {"catalog": "terms", "id": "menace"}}, {"text": "의 입구에서 일행은 멈췄다. 안쪽은 바깥에서 보던 것보다 깊이 어두워 보였다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 서둘러 눈을 가늘게 떴다가 다시 크게 떴다. 어떤 쪽으로 보아도 어둠이 갑자기 물러나지는 않았다. 그는 들어갈 수 있는 자리를 찾듯 바닥으로 시선을 내렸다. 발 하나 놓을 곳은 생각보다 가까이에 있었다."}], "when": true}, {"id": "lore_menace/cave_outside_noise", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "바깥의 소리는 여전히 들렸다. 바람이 지나가고, 뒤쪽에서 누군가 발을 옮겼다. 그런데 입구를 보는 동안에는 그 소리들이 모두 등 뒤에 붙어 있는 것 같았다. 앞에는 소리가 없었다. 조용하다고 말하면 끝날 일이었지만, 그는 그 조용함을 쉽게 말하고 싶지 않았다. 들어가면 자기 발소리가 먼저 그쪽을 채우게 될 것이다."}], "when": true}, {"id": "lore_menace/cave_first_step", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그가 한 발을 들였다. 발밑은 버텼다. 당연한 일인데도 잠깐 안도했다. 뒤쪽 발도 옮기자 어깨에 닿던 바람이 약해졌다. 움직임이 아주 작은 경계 하나를 건너갔을 뿐인데, 바깥에서 걷던 자세가 그대로 이어지지 않았다. 그는 자신도 모르게 몸을 조금 낮추고 있었다. 고개 위를 확인하고서야 다시 폈다."}], "when": true}, {"id": "lore_menace/cave_eyes", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "한동안 눈으로 안쪽을 더듬었다. 처음에는 한 덩어리였던 어둠에서 가까운 돌의 선이 조금씩 나뉘었다. 멀리까지는 보이지 않았다. 눈이 익었다고 여긴 순간에도 한 발 더 디디면 새로 보아야 했다. 그는 잘 보이지 않는 곳을 오래 보다가, 지금 발 앞에 있는 것을 놓치고 있다는 생각에 고개를 내렸다."}], "when": true}, {"id": "lore_menace/cave_look_back", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "뒤를 돌아보니 입구가 밝았다. 들어올 때는 어둠만 보았는데 안에서 보니 바깥의 빛이 너무 환했다. 빛 안에 선 사람의 윤곽과 그늘로 들어온 사람의 윤곽이 달랐다. 그는 자기들과 함께 들어오는 이들을 잠깐 기다렸다. 누가 늦는 것도 아닌데 먼저 가면 거리가 벌어질 것 같았다."}], "when": true}, {"id": "lore_menace/cave_companion_reply", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "조금만 천천히 갑시다. 뒤를 보면서 가겠습니다."}], "when": true}, {"id": "lore_menace/cave_breath", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말소리가 생각보다 가까운 데서 돌아왔다. 바깥에서 했던 말은 바람에 섞여 멀어졌는데 여기서는 끝 음절이 잠깐 남았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 말이 사라진 자리를 바라보았다. 조금 더 작게 말해도 충분히 들릴 것 같았다. 뒤에서 한 발이 다가오는 소리도 크기를 알아보기가 어려웠다. 그는 그 소리를 따라 다시 돌아보았다."}], "when": true}, {"id": "lore_menace/cave_skeleton_presence", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 바로 멀지 않은 곳에 있었다. 돌아보는 눈길을 받자 걸음을 멈췄다가, 주인공이 움직이자 다시 따라왔다. 따로 정한 신호는 없었는데도 그 정도 움직임은 서로 알아볼 수 있었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성문에서 함께 나가자는 손짓이 어긋났던 순간을 떠올렸다. 이번에는 말로 고쳐 줄 필요가 없었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/cave_wall", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "가까운 돌에 손을 대 보았다. 차가웠다. 손바닥 전체를 붙인 것도 아닌데 손끝의 온기가 금방 옮겨가는 것 같았다. 그는 손을 떼어 손가락을 한 번 폈다. 어둠 속에서는 바라보는 것만으로 거리를 짐작하기 어려웠다. 닿을 줄 알았던 것이 손을 조금 더 뻗어야 닿았다. 그 작은 어긋남이 바깥에서 돌을 피하던 걸음보다 더 신경 쓰였다."}], "when": true}, {"id": "lore_menace/cave_not_far", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "바깥으로 돌아갈 수 있는 거리는 아직 짧았다. 몇 걸음만 돌리면 빛 속이었다. 그렇게 생각하자 이상하게 더 망설여졌다. 가까울 때 돌아가면 쉽다는 생각과, 아직 이만큼밖에 오지 않았다는 생각이 번갈아 들었다. 그는 어느 쪽으로도 몸을 돌리지 않은 채 한 번 숨을 내쉬었다. 숨소리도 말소리처럼 가까운 데서 멎었다."}], "when": true}, {"id": "lore_menace/cave_dust_light", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "입구에서 들어온 빛이 발뒤쪽에 남아 있었다. 그는 발을 반쯤 옮겨 보았다. 빛 안에 있던 끝이 그늘로 들어갔다. 아주 조금만 움직여도 경계가 옮겨갔다. 들어간다는 것이 무엇인지, 성주 앞에서 들을 때보다 그 작은 움직임이 더 잘 설명해 주는 것 같았다. 그는 어둠 안쪽을 보다가 다시 곁의 사람들을 보았다."}], "when": true}, {"id": "lore_menace/cave_hold_together", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "앞선 사람이 멈추자 뒤쪽도 멈췄다. 누군가 한 발을 더 다가왔다. 그들이 좁은 간격 안에 있다는 것을 알아차리자 숨이 조금 편해졌다. 바깥에서 걸을 때는 사람마다 다른 발소리가 거슬리기도 했는데, 여기서는 그 소리들이 없으면 오히려 불안할 것 같았다. 그는 다시 걷기 전에 잠깐 그 자리에 머물렀다."}], "when": true}, {"id": "lore_menace/cave_decision", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 한 번 더 앞을 보았다. 해야 할 말을 머릿속에서 길게 준비하지는 않았다. 이미 길 위에서 목적지를 함께 불렀고, 지금은 모두 같은 문턱 안에 있었다. 돌아오겠다는 대답도 여전히 자기 목소리로 기억났다. 그는 발을 내디뎠다. 이번에는 뒤쪽 발을 옮기기 전에 오래 기다리지 않았다."}], "when": true}, {"id": "lore_menace/cave_last_light", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "조금 더 들어가자 바깥이 멀어졌다. 빛은 없어지지 않았지만 그쪽을 보려면 고개를 돌려야 했다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 처음으로 빛을 보지 않은 채 몇 걸음을 걸었다. 등 뒤에서 따라오는 소리들이 있었다. 그는 그 간격을 귀로 짚으면서, 눈앞에 새로 나타나는 선을 천천히 따라갔다."}], "when": true}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/walk_deeper", "label": [{"text": "일행의 거리를 맞추며 더 안으로 간다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/cave_walk", "when": true}], "editorial": {"intent": "1-3: 성을 떠난 일행의 걸음과 대화, 동굴 문턱의 감각을 펼치고 안으로 들어가는 결정에서 멈춘다.", "notes": "추가: 1-3의 길·바람·돌·어둠·새 대화와 동료 간 순간 반응은 창작이다. 원작 지형을 확정한 설명이나 신규 아이템·기술·고정 성격이 아니며, 동행 여부와 주점 방문 기억을 조건부로 유지한다.", "source_refs": ["lore_menace/menace_entry", "lore_menace/center"], "status": "draft"}, "entry_when": true, "handoff": null, "id": "lore_menace/cave_entry", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/menace_entry", "lore_menace/center"]}, "title": [{"text": "빛이 짧아지는 곳"}]}, {"blocks": [{"id": "lore_menace/walk_sense", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "안으로 들어갈수록 자기 발소리가 먼저 도착하는 것 같았다. 발을 디디고 나서 앞쪽에서 같은 소리가 한 번 더 났다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 처음 몇 번 그쪽을 보았다. 돌아오는 소리라는 것을 알고도 눈은 자꾸 소리가 나는 쪽으로 갔다. 안다고 해서 놀라지 않는 것은 아니었다. 그는 다음 발을 조금 조심해서 놓았다."}], "when": true}, {"id": "lore_menace/walk_noise_stopped", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "어딘가에서 짧은 소리가 났다. 발소리와는 달랐다. 그는 걸음을 멈추었다. 뒤쪽도 멈췄다. 모두 멈춘 뒤에도 작은 소리는 한 번 더 들렸다. 물이 떨어지는 것 같기도 했지만, 바라보아도 어디에서 난 소리인지 알 수 없었다. 잠깐 귀를 기울이자 자기 숨소리가 더 크게 들렸다. 숨을 참았다가 곧 다시 내쉬었다."}], "when": true}, {"id": "lore_menace/walk_sound_wait", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "다음 소리를 기다리는 동안 시간이 늘어졌다. 바깥에서는 들어도 지나쳤을 소리 하나 때문에 아무도 움직이지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 자신이 먼저 멈췄다는 것을 뒤늦게 생각했다. 다시 움직이려면 자기가 먼저 발을 떼야 할 것 같았다. 그는 앞을 한 번 더 보고, 발끝으로 바닥을 짚었다. 발이 놓일 곳이 있었다."}], "when": true}, {"id": "lore_menace/walk_small_word", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "갑시다. 조금씩만."}], "when": true}, {"id": "lore_menace/walk_follow_sound", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말을 하고 걷자 뒤에서 소리가 이어졌다. 방금까지 기다리던 다른 소리는 그 사이로 묻혔다. 그는 귀를 앞쪽에만 기울이지 않으려고 했다. 바로 뒤와 옆에서도 사람이 움직이고 있었다. 가까운 소리를 듣고 나니 먼 곳의 소리가 조금 덜 낯설었다. 그렇다고 마음껏 빨리 걸을 수 있는 것은 아니었다."}], "when": true}, {"id": "lore_menace/walk_wall_hand", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "가까운 돌을 손끝으로 짚었다. 표면은 한결같지 않았다. 매끄러운 듯하다가 갑자기 거친 부분이 손끝에 걸렸다. 그는 손을 살짝 떼었다가 다시 댔다. 눈으로 짐작한 거리보다 손을 뻗어 확인하는 거리가 편했다. 한 손을 너무 오래 같은 높이로 들고 있었는지 팔이 뻐근해졌다. 그제야 손을 내려 손가락을 폈다."}], "when": true}, {"id": "lore_menace/walk_stop_body", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "발밑에 걸리는 것이 있어 그는 몸을 조금 멈췄다. 뒤쪽에서 누군가 가까워지는 기척이 났다. 부딪치지는 않았지만 그는 반사적으로 어깨를 굳혔다. 다시 돌아보며 괜찮다고 말하려는데, 목소리가 생각보다 크게 나왔다. 좁은 곳에서 소리가 되돌아와 자신의 말이 다른 사람의 대답처럼 들렸다. 그는 민망하게 입을 다물었다."}], "when": true}, {"id": "lore_menace/walk_smaller_word", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "괜찮습니다. 발밑을 보느라 멈췄습니다."}], "when": true}, {"id": "lore_menace/walk_awkward_release", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "옆에서 누군가 짧게 움직였다. 고개를 끄덕인 것인지 다시 걷자는 뜻인지 분명히 보이지는 않았다. 그래도 거기 사람이 있다는 것은 알 수 있었다. 그는 발밑의 걸리는 자리를 피해서 디뎠다. 크게 돌아갈 것도 아닌데, 조금 전에는 그 자리 하나가 길을 막고 있는 것 같았다. 지나오고 나자 다시 작은 곳이 되었다."}], "when": true}, {"id": "lore_menace/walk_companion", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 일행의 간격이 좁아질 때마다 걸음을 늦췄다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 뒤를 돌아보다가 그가 자기 발앞을 살피는 것을 보았다. 성문 앞에서 다급하게 나누었던 이야기가 새삼 먼 일처럼 느껴졌다. 그 사람도 지금은 바로 앞의 한 걸음을 고르고 있었다. 함께 온다는 것이 이런 시간을 같이 지나가는 일이기도 했다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/walk_join_question", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "잠깐 멈추겠소?"}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/walk_join_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "네. 너무 가까워졌습니다. 간격만 다시 맞추죠."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/walk_join_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그가 몸을 조금 비켰다. "}, {"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 뒤쪽의 움직임을 본 뒤 다시 그를 보았다. 그 짧은 기다림 덕분에 일행의 발소리가 하나씩 나뉘었다. 누군가를 데려왔다고 해서 바로 같이 걷는 법을 알게 되는 것은 아니었다. 하지만 한 번 멈춰 같은 것을 보았다는 기억은, 다음에 멈출 때 쓸 수 있을 것 같았다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/walk_declined_space", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그는 잠깐 걸음을 늦추어 일행이 가까워지기를 기다렸다. 뒤에 선 사람이 자기에게 닿을 만큼 가까워졌다가 다시 한 걸음 물러났다. 그 정도 간격이면 되었다. 성문 앞에서 남겨 두었던 거리가 생각났지만 그는 오래 거기에 머물지 않았다. 지금 곁의 사람들은 다음 걸음을 기다리고 있었다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/walk_focus", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "지나온 곳을 기억해 두려고 몇 번 뒤를 보았다. 똑같이 어두운 곳도 돌아보는 쪽에 따라 달라 보였다. 처음부터 모든 자리를 기억하려 하자 오히려 머릿속이 뒤섞였다. 그는 바로 지나온 돌의 선과 잠깐 멈췄던 간격부터 떠올렸다. 조금씩 확인한 자리가 뒤로 이어지고 있었다. 돌아갈 때도 한꺼번에 전부 떠올릴 필요는 없을 것이다."}], "when": true}, {"id": "lore_menace/walk_name_low", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "목적지의 이름을 속으로 불렀다. "}, {"ref": {"catalog": "terms", "id": "menace"}}, {"text": ". 바깥에서 외울 때보다 입안의 느낌이 묵직했다. 그 이름을 알고 있어서 여기까지 왔지만, 안에서 걷는 동안에는 이름보다 가까운 소리와 돌의 선이 더 자주 필요했다. 그는 손을 다시 조금 들었다. 닿을 만한 곳을 짚고 나서 발을 옮겼다."}], "when": true}, {"id": "lore_menace/walk_breath_changes", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "서두르지 않겠다고 생각할수록 한 걸음이 느려졌다. 너무 느리게 가고 있는 것은 아닐까 싶기도 했다. 그 생각이 들면 보폭이 조금 커졌고, 발을 놓은 다음 곧 후회했다. 그는 속도를 고르느라 자꾸 쓰던 힘을 발앞에만 모아 보기로 했다. 다음 자리까지. 거기서 다시 다음 자리까지. 그러고 나니 어깨가 조금 내려갔다."}], "when": true}, {"id": "lore_menace/walk_different_echo", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그러다 소리가 달라졌다. 똑같이 발을 디뎠는데 돌아오는 소리가 조금 늦었다. 가까운 데서 막히던 느낌이 옅어졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 앞쪽으로 눈을 들었다. 처음에는 자기 귀가 틀린 줄 알았다. 한 발을 더 옮기고 나서도 같은 느낌이 남았다. 그는 이번에는 돌아보지 않고 앞을 조금 더 살폈다."}], "when": true}, {"id": "lore_menace/walk_arrival", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "눈에 익던 가까운 선이 바뀌었다. 한쪽을 보고 손을 뻗었을 때 닿을 줄 알았던 곳이 더 멀었다. 그는 손을 내려 옆을 보았다. 일행도 같은 자리에서 걸음을 늦추고 있었다. 어디를 가리켜야 할지 정하지 못한 채 시선이 앞과 옆으로 움직였다. 그러다 그는 자기들이 더 걷기 전에 이곳을 먼저 보아야 한다는 것을 느꼈다."}], "when": true}, {"id": "i/role_echo_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particle": "은/는"}}, {"text": " 조금 전 살폈던 자리를 떠올리며 걸음을 늦췄다. "}, {"ref": {"catalog": "equipment", "id": "story_axe"}}, {"text": "의 손잡이는 아직 같은 손에 있었다. 앞사람도 그가 왜 멈췄는지 다시 묻지 않았다. 길을 오기 전에 나누었던 말이 지금 걸음 사이에서 작은 도움이 되었다."}], "when": {"all": [{"op": "eq", "state": "event.role.party_woodcutter", "value": true}, {"op": "contains", "state": "companions.starting", "value": "party_woodcutter"}, {"op": "eq", "state": "event.weapon.party_woodcutter", "value": "story_axe"}]}}, {"id": "i/role_echo_party_hunter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_hunter", "particle": "은/는"}}, {"text": " 조금 전 살폈던 자리를 떠올리며 걸음을 늦췄다. "}, {"ref": {"catalog": "equipment", "id": "story_bow"}}, {"text": "의 손잡이는 아직 같은 손에 있었다. 앞사람도 그가 왜 멈췄는지 다시 묻지 않았다. 길을 오기 전에 나누었던 말이 지금 걸음 사이에서 작은 도움이 되었다."}], "when": {"all": [{"op": "eq", "state": "event.role.party_hunter", "value": true}, {"op": "contains", "state": "companions.starting", "value": "party_hunter"}, {"op": "eq", "state": "event.weapon.party_hunter", "value": "story_bow"}]}}, {"id": "i/role_echo_party_cook", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_cook", "particle": "은/는"}}, {"text": " 조금 전 살폈던 자리를 떠올리며 걸음을 늦췄다. "}, {"ref": {"cata rce_refs": ["lore_menace/center"]}, "title": [{"text": "확인해야 할 끝"}]}, {"blocks": [{"id": "lore_menace/center_quote", "kind": "source_quote", "literal_ids": ["LORESPEC.PAS:literal:34455", "LORESPEC.PAS:literal:34507", "LORESPEC.PAS:literal:34554"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/center"]}, "speaker": null, "text": [{"source": {"bindings": [{"end": 11, "ref": {"catalog": "terms", "id": "menace"}, "start": 5}, {"end": 45, "ref": {"catalog": "characters", "id": "lord_ahn"}, "start": 37}], "literal_ids": ["LORESPEC.PAS:literal:34455", "LORESPEC.PAS:literal:34507", "LORESPEC.PAS:literal:34554"]}}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 한동안 제자리에 서 있었다. 중심부까지 확인하겠다는 말이, 이제 막 도착한 곳에서 자신을 기다리고 있었던 것 같았다. 멀리 가겠다는 대답을 할 때는 돌아왔을 때의 일을 먼저 생각했는데, 막상 여기까지 오니 무슨 말을 해야 할지 떠오르지 않았다. 그는 입을 열지 않고 주위를 한 번 더 살폈다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_listen", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "발소리가 멎자 주변이 조용해졌다. 그렇지만 입구에서 들었던 조용함과는 달랐다. 지금은 그 안에 자기들 숨소리와 옷이 움직이는 소리가 섞여 있었다. 잠깐 전까지 길을 가로막는 것처럼 느껴지던 작은 소리도 어딘가로 지나갔다. 그는 그 소리 하나를 끝까지 따라가려 하지 않았다. 곁에 있는 사람들을 먼저 보았다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_hands", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "손가락을 한 번 폈다. 돌을 짚고 걷던 손이 차가웠다. 자기 손등에 손끝을 대 보니 온도가 조금 달랐다. 그는 손을 내린 채 한동안 가만히 있었다. 여기까지 걸어오는 동안 손끝과 발끝을 동시에 신경 쓰느라, 정작 자기 몸이 얼마나 긴장해 있었는지 잊고 있었다. 멈춘 뒤에야 팔과 어깨가 조금씩 무거워졌다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_group_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "일행도 바로 말을 꺼내지는 않았다. 누군가 앞을 보고, 다른 누군가는 뒤를 살폈다. 같은 자리에 와서도 처음 보는 쪽이 달랐다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 조금 비켜서 뒤쪽의 사람이 앞으로 볼 자리를 내주었다. 설명할 만한 말을 찾기보다 같이 볼 시간을 주는 편이 나을 것 같았다. 그는 다시 입구로 이어지는 쪽을 돌아보았다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_say_at_last", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "여기까지 왔습니다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_small_sentence", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말이 작았다. 길 위에서 부탁받은 일을 되풀이할 때보다 더 작았는데, 모두가 알아들은 것 같았다. 누군가 고개를 돌렸고, 누군가는 발을 고쳐 디뎠다. 그는 조금 더 길게 말할 수도 있었겠지만 그렇게 하지 않았다. 중심부라는 말을 다시 보태지 않아도, 지금 자기들이 어디에서 멈추어 서 있는지 함께 느낄 수 있었다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_before_return", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌아가겠다는 말은 아직 하지 않았다. 그는 앞쪽을 다시 보았다. 막 도착했는데 벌써 돌아서는 것이 어딘가 성급한 일 같기도 했다. 하지만 가만히 있는 동안에도 돌아갈 길이 뒤에서 기다리고 있었다. 들어올 때는 어디까지 가야 할지만 생각했는데, 이제는 어느 쪽으로 몸을 돌려야 하는지 생각하고 있었다. 두 생각이 한 자리에 놓였다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_companion", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 일행과 함께 지나온 쪽을 살폈다. 그가 성문에서 했던 긴 말을 떠올리자, 여기서 돌려야 하는 걸음이 그에게는 다르게 느껴질지도 모른다는 생각이 들었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 먼저 물어볼까 하다가, 상대도 돌아갈 쪽을 보고 있는 것을 알아차렸다. 두 사람은 잠깐 같은 곳을 보았다."}], "when": {"all": [{"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}, {"op": "eq", "state": "event.cave_detour_done", "value": false}]}}, {"id": "lore_menace/center_join_reply", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "돌아가는 길도 천천히 가면 되겠소."}], "when": {"all": [{"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}, {"op": "eq", "state": "event.cave_detour_done", "value": false}]}}, {"id": "lore_menace/center_join_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "그 말을 듣자 그는 자신이 기다리던 대답이 무엇이었는지 조금 알 것 같았다. 누구든 다음 걸음을 함께 고르면 좋겠다고 생각하고 있었다. 굳이 그런 말을 부탁하지 않았는데도 대답이 왔다. 그는 고개를 끄덕였다. 아직 돌아간 것은 아니었지만, 돌아갈 방향을 함께 보고 있다는 사실만으로도 움직일 수 있을 것 같았다."}], "when": {"all": [{"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}, {"op": "eq", "state": "event.cave_detour_done", "value": false}]}}, {"id": "lore_menace/center_reply", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "돌아갑시다. 우리가 본 것을 그대로 보고하겠습니다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_turning", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "몸을 돌리자 조금 전까지 등 뒤에 있던 길이 앞으로 왔다. 걸어왔던 곳인데도 한동안 새 길처럼 보였다. 그는 돌아설 때 일행과 너무 가까워지지 않도록 한 발 비켰다. 누군가 움직일 자리가 생겼고, 다른 사람도 그 뒤를 따랐다. 갈 때보다 빨리 움직일 수 있을 것 같았지만, 그는 처음 한 걸음을 천천히 놓았다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "lore_menace/center_last_look", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "몇 걸음 옮긴 뒤 한 번 뒤를 보았다. 자신들이 머물렀던 자리가 다시 조용해졌다. 조금 전에는 그곳까지 가는 일이 전부였는데, 이제는 그 자리가 걸어온 길의 끝으로 남았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 길게 보지 않고 고개를 돌렸다. 앞에서 일행의 발소리가 났다. 이번에는 그 소리가 성으로 향하고 있었다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}, {"id": "i/center_return_from_detour", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 경로 사건의 반복/인계 관리. 실제 영입과 이탈만 상태에 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "주변을 돌아본 일행은 아까 방향을 확인했던 자리로 돌아왔다. 달라진 짐이 있어도 달라지지 않은 일이 있었다. 여기까지 왔고, 이제 돌아가서 보고해야 했다. 그는 돌아갈 길 쪽으로 몸을 돌렸다."}], "when": {"op": "eq", "state": "event.cave_detour_done", "value": true}}], "choices": [{"branch_kind": "quest", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [{"op": "set", "provenance": {"note": "원작 조건/변화를 집필 상태로 추상화. 원문 코드 실행이나 고정 인물 설정 추가가 아니다.", "origin": "source_adaptation", "source_refs": ["lore_menace/center"]}, "state": "quest.lore_stage", "value": 4}], "id": "lore_menace/return_to_lore", "label": [{"text": "탐사 성공을 기록하고 성으로 돌아간다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/return_road", "when": true}, {"branch_kind": "navigation", "consequence": [{"text": "선택한 경험만 상태와 다음 장면에 남긴다."}], "effects": [], "id": "i/cave_treasure", "label": [{"text": "돌아가기 전에 주변의 옛 금광 자취를 살핀다"}], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "target": "i/treasure_hub", "when": {"op": "eq", "state": "event.cave_detour_done", "value": false}}], "editorial": {"intent": "1-4: 동굴 안의 거리와 소리를 더듬는 탐사, 중심부 확인, 함께 돌아서기까지의 긴 장면 초고.", "notes": "추가: 1-4의 어둠·돌·물소리·간격·작은 멈춤과 새 대화는 창작 연출이다. 정확한 지도·광원·고정 위험·보스·전투·부상·획득물을 추가하지 않는다. 중심부 성공은 보존 원문의 사건이며, 동행 문단은 해당 경로에서만 보인다.", "source_refs": ["lore_menace/center"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lore_stage", "value": 3}, "handoff": null, "id": "lore_menace/center", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/center"]}, "title": [{"text": "여기까지 왔다는 사실"}]}, {"blocks": [{"id": "lore_menace/return_first", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌아서는 순간에는 길이 낯설었다. 조금 전까지 등 뒤에 두었던 어둠이 앞에 놓이자, 같은 장소인데도 어느 쪽으로 발을 디뎌야 하는지 다시 살펴야 했다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 손을 벽 가까이 가져갔다. 닿았던 거친 면을 찾아 손끝을 움직이고, 발밑을 확인한 뒤 한 걸음을 내디뎠다. 뒤에서 나던 기척도 잠깐 멈췄다가 따라왔다. 들어올 때처럼 서두르지 말자고 말하려다 입을 다물었다. 앞선 사람의 걸음이 이미 그 말을 하고 있었다."}], "when": true}, {"id": "lore_menace/return_order", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "좁은 곳을 지나며 뒤를 돌아보았다. 얼굴보다 움직임이 먼저 보였다. 누군가가 옆으로 몸을 비켜 주자 그 뒤의 사람이 통과했고, 다시 빈 자리가 메워졌다. 잠시 사이에 둔 간격은 벌어졌다가 줄어들었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 모두가 지난 것을 확인하고 나서야 걸음을 옮겼다. 갈 때는 앞에 무엇이 있는지 보느라 자주 멈췄다. 돌아올 때는 뒤에 누가 있는지 살피느라 멈췄다. 같은 멈춤이라고 생각했던 것이 조금 달라져 있었다."}], "when": true}, {"id": "lore_menace/return_small_mark", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "발에 걸릴 뻔했던 작은 돌이 다시 눈에 들어왔다. 이번에는 몸을 기울이지 않고 피했다. 그 사소한 일이 우스워서 입가가 조금 올라갔다. 익숙해졌다고 하기에는 아는 것이 너무 적었지만, 적어도 여기서 어떤 실수를 했는지는 기억하고 있었다. 옆을 지나던 일행도 그 돌 앞에서 보폭을 줄였다. 누가 가르쳐 주지 않았는데도 같은 곳을 조심하는 모습을 보고, "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 처음으로 지나온 길이 자신 혼자에게만 남은 것은 아니라는 생각을 했다."}], "when": true}, {"id": "lore_menace/return_echo_reply", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "돌 사이에서 발소리가 몇 번 되돌아왔다. 들어올 때는 멀리서 다른 발걸음이 오는 것처럼 들리던 소리였다. 지금은 자신이 멈추면 같이 끊기고, 다시 움직이면 따라 시작했다. 그렇다고 그 안의 모든 소리를 알아듣게 된 것은 아니었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 잘 모르는 쪽으로 고개를 돌렸다가 돌아갈 길에 시선을 놓았다. 알아내지 못한 것을 하나씩 붙잡고 서 있다가는, 돌아가겠다고 했던 말이 끝없이 뒤로 밀릴 것 같았다."}], "when": true}, {"id": "lore_menace/return_skeleton", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "이/가"}}, {"text": " 조금 뒤에서 걸음을 맞췄다. 성문 앞에서 말을 걸어 왔을 때에는 함께 가겠다는 뜻만 들었고, 어느 순간에 멈추는 사람인지는 몰랐다. 이제는 앞사람이 비킬 때까지 기다리고, 마지막 사람이 따라오면 다시 움직이는 모습을 알고 있었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 어둠 속에서도 그 움직임을 알아보았다. 서로를 다 안다고 할 수는 없었다. 그래도 동행을 허락하던 때보다 말을 덜 써도 되는 순간이 생겼다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/return_skeleton_line", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "올 때는 이 길이 더 길었던 것 같은데요."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/return_skeleton_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "그때는 멈출 때마다 아직 멀었나 생각했으니까요. 지금은 멈춰도 돌아가는 중이고요."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/return_absent", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 뒤따르는 일행을 기다렸다. 성문에서 하지 못했던 말이 떠오를 틈은 없었다. 지금 곁에 있는 사람들과 무사히 빠져나가는 일이 먼저였다. 한 사람이 지나면 다음 사람이 움직였고, 마지막 기척이 가까워진 뒤에야 다시 앞을 향했다. 출발할 때 정했던 동행의 범위가 돌아올 때에도 그대로 이어졌다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/return_light", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "빛은 처음에 벽의 색이 조금 달라지는 것으로 보였다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 걸음을 멈추고 그 차이를 바라보았다. 눈이 잘못 본 것이 아니었다. 더 나아가자 멀리 열린 곳의 윤곽이 드러났다. 들어올 때 자꾸 돌아보고 싶었던 문턱이었다. 반가운 마음에 보폭이 커질 뻔했지만 발끝에서 멈췄다. 아직 바닥은 고르지 않았다. 밖이 보인다고 이미 밖에 있는 것은 아니었다."}], "when": true}, {"id": "lore_menace/return_outside", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "문턱을 넘었을 때 바람이 얼굴 한쪽에 닿았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 눈을 가늘게 뜨고 잠시 서 있었다. 굴 안에서 크게 들리던 옷깃의 마찰과 발소리가 바깥에서는 작아졌다. 바람 소리가 그 사이로 들어왔고, 멀리 보이는 길은 한눈에 들어오지 않을 만큼 넓었다. 뒤따라 나온 일행에게 자리를 내주면서도 조금 더 그 자리에 머물렀다. 돌아갈 곳이 보이는 것과, 실제로 돌아갈 수 있는 곳까지 나온 것은 다른 일이었다."}], "when": true}, {"id": "lore_menace/return_reset", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "잠깐만 쉬었다 가죠. 여기서는 서로 얼굴을 보고 말할 수 있으니까."}], "when": true}, {"id": "lore_menace/return_pause", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "누군가 고개를 끄덕였다. 다른 한 사람은 지나온 문턱을 돌아보았다가 앞의 길을 보았다. 말을 기다리던 듯한 시선들이 "}, {"ref": {"catalog": "characters", "id": "protagonist"}}, {"text": "에게 모였는데, 막상 하려던 말은 없었다. 그래서 모두 나왔다는 뜻으로 고개만 한 번 움직였다. 그것으로 충분한지 확인하듯 잠깐 더 바라보다가 시선을 거뒀다. 긴 말을 하지 않아도 되는 것이 편했다. 조금 전까지 짧은 말조차 조심해서 골라야 했던 탓인지, 바깥에 나온 뒤에는 침묵도 덜 답답했다."}], "when": true}, {"id": "lore_menace/return_veteran", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "주점에서 들었던 말이 뒤늦게 떠올랐다. 돌아오지 않은 사람들을 이야기하던 목소리였다. 밖의 바람을 맞고 있으니 기다리는 쪽의 시간도 생각났다. 어디까지 갔는지, 지금 무엇을 보고 있는지 전해 들을 수 없는 시간. 하지만 이 길에서 느낀 일을 그 사람들의 행방에 덧붙일 수는 없었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그들의 생사를 알지 못했다. 지금 할 수 있는 것은 자신의 일행이 돌아왔다는 소식을 더 늦추지 않는 것뿐이었다."}], "when": {"op": "eq", "state": "knowledge.missing_squad", "value": true}}, {"id": "lore_menace/return_rehearsal", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성을 향해 걸으며 보고할 말을 떠올렸다. 굴에 들어갔고, 안쪽을 지나 중심부에 닿았다. 여기까지 생각하자 이상하게 말이 막혔다. 길을 걷는 동안에는 작은 소리 하나에도 설명할 것이 많아 보였는데, 보고할 문장으로 바꾸자 몇 마디밖에 남지 않았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 처음부터 다시 해 보았다. 어디서 주저했는지, 얼마나 긴장했는지까지 붙였다가 그만두었다. 그런 마음이 없었던 것은 아니지만, 그것을 다 말해야 도착한 일이 사실이 되는 것은 아니었다."}], "when": true}, {"id": "lore_menace/return_rehearsal_line", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "안에 들어가서 중심부까지 확인했습니다. 그리고 모두 돌아왔습니다."}], "when": true}, {"id": "lore_menace/return_rehearsal_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "걸음 옆으로 말이 흘러나갔다. 가까이 있던 일행이 고개를 돌렸다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성주에게 할 말이라고 덧붙이고는 조금 머쓱해졌다. 다녀온 사람이 듣기에도 너무 짧지 않느냐고 묻고 싶었지만, 상대는 먼저 고개를 끄덕였다. 그 반응을 보고 같은 문장을 속으로 한 번 더 말했다. 길을 줄인 것이 아니라, 길에서 확인한 것을 남긴 말이었다. 굳이 더 크게 보이게 만들 필요는 없었다."}], "when": true}, {"id": "lore_menace/return_arrive", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성이 가까워질수록 발소리가 또 바뀌었다. 밖의 길에서 밟던 바닥과 성 안의 바닥은 같은 힘으로 디뎌도 다른 소리를 냈다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 문을 지날 때 문득 첫 출발을 떠올렸다. 나갈 때는 눈앞의 틈을 지나기만 하면 된다고 생각했었다. 돌아오는 일은 그보다 길었다. 문 안에 들어섰는데도 아직 할 일이 남아 있었다. 앞서 들었던 부탁을 기억하며 일행과 함께 접견하는 곳으로 향했다."}], "when": true}, {"id": "i/shield_echo", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "equipment", "id": "shield_5"}}, {"text": "는 아까까지 돌 틈에 있던 물건이었다. 지금은 일행의 걸음에 맞춰 조금씩 움직였다. 처음부터 가진 것처럼 잊어버리지 않으려고, 그는 발견했던 자리의 모양을 한 번 떠올렸다."}], "when": {"op": "ne", "state": "event.shield_owner", "value": ""}}], "choices": [{"branch_kind": "navigation", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [], "id": "lore_menace/report_success", "label": [{"text": "성주에게 탐사 성공을 보고한다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/report", "when": true}], "editorial": {"intent": "같은 길을 돌아온 일행이 과장하지 않은 보고를 통해 첫 부탁을 끝내는 소편", "notes": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "source_refs": ["lore_menace/center", "lore_menace/report"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lore_stage", "value": 4}, "handoff": null, "id": "lore_menace/return_road", "kind": "scene", "provenance": {"note": "원문 사건을 연결한 집필 장면. 공간·심리·새 대사는 각 블록의 창작 표시를 따른다.", "origin": "source_adaptation", "source_refs": ["lore_menace/center", "lore_menace/report"]}, "title": [{"text": "같은 길을 거꾸로"}]}, {"blocks": [{"id": "lore_menace/report_threshold", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성주 앞에 서자 준비한 말이 잠깐 멀어졌다. 길 위에서는 자연스럽게 입에 붙던 문장이 이곳에서는 첫마디부터 자리를 찾지 못했다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 손을 한 번 폈다가 느슨하게 모았다. 굴의 벽을 짚을 때와는 다른 긴장이었다. 일행의 기척이 등 뒤에 있었고, 성주는 대답을 기다리고 있었다. 이렇게 돌아오겠다고 약속한 뒤 이제 막 돌아온 참인데도, 제대로 시작하지 못하면 길에서 한 일이 작아질 것처럼 느껴졌다."}], "when": true}, {"id": "lore_menace/report_words", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "말씀하신 "}, {"ref": {"catalog": "terms", "id": "menace"}}, {"text": "에 다녀왔습니다. 안으로 들어가 중심부까지 확인했습니다. 일행도 함께 돌아왔습니다."}], "when": true}, {"id": "lore_menace/report_wait", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말하고 나자 덧붙이고 싶은 것이 한꺼번에 떠올랐다. 처음에는 길을 잘못 볼까 걱정했으며, 안쪽에서는 소리가 어디서 나는지 알기 어려웠다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 말들을 입 밖으로 내기 전에 성주의 얼굴을 보았다. 자신들이 확인한 일과 자신이 느낀 일이 머릿속에서 겨우 갈라졌다. 더 묻는다면 대답할 수 있었다. 다만 지금 말한 문장에는, 보지 못한 것을 봤다고 할 부분이 없었다. 그 생각이 들자 어깨를 고쳐 세우고 기다릴 수 있었다."}], "when": true}, {"id": "lore_menace/report_quote", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:13915"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/report"]}, "speaker": "lord_ahn", "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:13915"]}}], "when": true}, {"id": "lore_menace/reward_counter_quote", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:13956"], "provenance": {"note": "원작 UI 보상 표기. 성주의 발화가 아니다. 수치로 나이/자동 레벨 상승/새 능력을 확정하지 않는다.", "origin": "source_exact", "source_refs": ["lore_menace/report"]}, "speaker": null, "text": [{"source": {"bindings": [], "literal_ids": ["LORETALK.PAS:literal:13956"]}}], "when": true}, {"id": "lore_menace/report_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "축하라는 말이 먼저 남았다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성주를 바라보다가 짧게 고개를 숙였다. 바로 대답하려던 입에서는 생각보다 낮은 목소리가 나왔다. 긴 말을 준비할 때에는 떠오르지 않던 말이었다. 돌아왔다는 보고를 받아 줄 사람이 앞에 있고, 그 사람이 성공했다고 말해 주고 있었다. 고개를 들자 성 안의 바닥이 다시 눈에 들어왔다. 조금 전까지 발을 어디에 둘지 의식하던 곳인데, 이제는 그냥 서 있을 수 있는 바닥 같았다."}], "when": true}, {"id": "lore_menace/report_thanks", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "감사합니다. 다녀왔습니다."}], "when": true}, {"id": "lore_menace/report_double_word", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말을 하고 나서야 같은 뜻을 또 말했다는 것을 알아차렸다. 이미 돌아왔다고 보고했는데, 감사하다는 말 뒤에도 다녀왔다는 말이 붙었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 괜히 일행 쪽으로 시선을 옮겼다. 누군가의 시선이 마주쳤다가 먼저 풀렸다. 웃는지 아닌지 분명하지 않은 그 짧은 표정 때문에, 스스로도 입가에 들어갔던 힘을 조금 놓았다. 적어도 여기서는 말을 한 번 더 했다고 위험해지는 일은 없었다."}], "when": true}, {"id": "lore_menace/report_skeleton", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 일행 곁에서 접견을 함께하고 있었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성문 앞에서 멈춰 말을 듣던 순간을 떠올렸다. 그때에는 이 사람을 받아들여도 되는지 고민했다. 지금은 돌아온 일행이라고 말하면서 따로 셈하지 않았다. 함께 걸었던 길이 그 한마디 안에 들어갔다. 그 이상의 약속까지 저절로 생긴 것은 아니었지만, 적어도 이번 길을 다녀왔다는 말을 하는 동안에는 누구도 바깥에 남아 있지 않았다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/report_declined", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "뒤에 있는 일행은 출발할 때와 같은 사람들이었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 한 번 눈을 맞추고 다시 성주를 향했다. 밖에서 내렸던 결정을 이 자리에서 다른 결정으로 고칠 수는 없었다. 돌아왔다는 말은 함께 다녀온 사람들에게만 닿았다. 지금은 그들에게 돌아갈 자리를 만들어 주는 것이 먼저였다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/report_settle", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 귀환 중의 감각·말의 연습·접견 동작·새 대화는 집필용 창작이다. 실종자의 생사·동료의 고유 설정·새 장비·자동 성장·다음 지역 정보는 확정하지 않는다. 동행과 주점 기억은 실제 경로 조건을 따른다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "잠깐의 침묵이 이어졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 더 이상 보고할 문장을 머릿속에서 고치지 않았다. 돌아오는 동안 줄이고 다시 붙였던 말이 이제 자신에게서 떠나 상대에게 닿아 있었다. 무슨 일을 해냈는지 앞서 떠벌리고 싶었던 것도 아니고, 한 일이 없었던 것처럼 숨기고 싶었던 것도 아니었다. 부탁받은 곳에 갔고, 확인한 것을 들고 돌아왔다. 그만큼을 인정받은 지금, 발끝에 남아 있던 긴장이 천천히 가라앉았다. 다음 말이 나오기 전까지는 그대로 서 있어도 괜찮았다."}], "when": true}, {"id": "i/role_report_party_woodcutter", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 선택형 초고의 연결 장면·탐방·심리·행동·선택 규칙. 원작 사건과 새 설정을 구별한다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "party_woodcutter", "particl 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "성주는 아직 말을 끝내지 않은 얼굴이었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 물러나려던 발을 그대로 두었다. 축하를 들었으니 인사하고 나가면 될 거라고 생각했는데, 그 짧은 생각이 발끝에서 멈췄다. 일행도 자리를 옮기지 않았다. 잠시 전까지는 기다리는 시간이 길어 보이지 않았다. 이제는 다음 말이 무엇일지 몰라, 손을 편히 두는 것마저 의식하게 됐다. 처음 부탁을 받았을 때도 이곳에 서 있었다. 그때와 같은 자리에 돌아왔다는 사실이 갑자기 선명해졌다."}], "when": true}, {"id": "lore_menace/next_silence", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 어깨를 세우려다가 그만두었다. 방금 축하받은 사람처럼 보이려 애쓰면 오히려 자세가 어색해질 것 같았다. 돌아오는 길에 만든 짧은 보고를 이미 전했고, 이제는 준비한 문장이 없었다. 성주가 말을 꺼내자 고개를 들었다. 이번에는 앞서 대답을 준비하지 않고 끝까지 듣기로 했다. 무엇을 부탁하는지 듣기 전에 할 수 있다고 말하면, 그 말이 먼저 자신을 끌고 가 버릴 것 같았다."}], "when": true}, {"id": "lore_menace/next_quote", "kind": "source_quote", "literal_ids": ["LORETALK.PAS:literal:14212", "LORETALK.PAS:literal:14261", "LORETALK.PAS:literal:14315", "LORETALK.PAS:literal:14365", "LORETALK.PAS:literal:14385", "LORETALK.PAS:literal:14397", "LORETALK.PAS:literal:14431", "LORETALK.PAS:literal:14444", "LORETALK.PAS:literal:14456", "LORETALK.PAS:literal:14493"], "provenance": {"note": "보존 원문 발생을 원래 순서대로 참조. 표시명 각색은 바인딩으로 분리한다.", "origin": "source_exact", "source_refs": ["lore_menace/next_task"]}, "speaker": "lord_ahn", "text": [{"source": {"bindings": [{"end": 52, "ref": {"catalog": "characters", "id": "necromancer"}, "start": 41}, {"end": 102, "ref": {"catalog": "terms", "id": "lastditch"}, "start": 93}, {"end": 125, "ref": {"catalog": "terms", "id": "lastditch"}, "start": 116}], "literal_ids": ["LORETALK.PAS:literal:14212", "LORETALK.PAS:lite "speaker": "protagonist", "text": [{"text": "우선 그 성으로 가서, 그곳의 사정을 들으면 되겠습니까?"}], "when": true}, {"id": "lore_menace/next_lord_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": "lord_ahn", "text": [{"text": "그렇소. 가서 그들의 이야기를 들어 보시오."}], "when": true}, {"id": "lore_menace/next_question_after", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "새로운 사정이 덧붙은 대답은 아니었다. 그래도 "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 고개를 끄덕일 수 있었다. 한꺼번에 맡은 것처럼 들리던 일이 조금 나뉘었다. 우선 가야 했다. 가면 사람을 만나야 했고, 만나면 자신이 알고 있는 것부터 떠들기보다 그쪽의 말을 들어야 했다. 거기까지 생각하자 다음 걸음을 놓을 자리가 생겼다. 그 뒤에 어떻게 할지는 아직 정할 수 없었다. 정하지 못한 것을 빈말로 메우지 않아도 될 만큼의 대답이었다."}], "when": true}, {"id": "lore_menace/next_skeleton", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "옆으로 눈을 돌리자 "}, {"ref": {"catalog": "characters", "id": "skeleton"}}, {"text": "도 성주 쪽을 보고 있었다. 굴에서 돌아올 때와 달리 지금은 먼저 걸음을 옮길 사람이 없었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 성문 앞에서 함께 가도 되느냐고 묻던 목소리를 떠올렸다. 그 질문에 대답할 때는 앞에 놓인 길만 생각했다. 이제 다른 길의 이름을 같이 듣고 있었다. 아직 일행을 대신해 모든 대답을 할 수는 없었지만, 자신만 듣고 혼자 정해야 하는 자리도 아니었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/next_declined", "kind": "narration", "literal_id ": "성주 앞에 서 있는 시간이 처음보다 덜 낯설어진 것은 사실이었다. 시선을 어디에 둘지 몰라 바닥만 보지도 않았고, 한마디를 할 때마다 목소리가 멀리 튀어나간 것처럼 놀라지도 않았다. 그렇다고 다음 길이 쉬워진 것은 아니었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 자신에게서 달라진 것이 있다면 지금의 대답을 하고도 그 자리에 서 있을 수 있게 된 것이라고 생각했다. 더 큰 말로 덮지 않고, 상대가 듣도록 기다릴 수 있었다."}], "when": true}, {"id": "lore_menace/next_hold_name", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 동쪽이라는 말과 성의 이름을 머릿속에서 다시 붙였다. 긴 의뢰를 들을 때 마음이 먼저 달려가면 정작 가야 할 곳의 이름을 놓칠 수 있었다. 굴 앞에서 아직 안으로 들어가지도 않고 돌아올 길부터 걱정하던 자신이 떠올라, 이번에는 들은 말을 순서대로 짚었다. 혼잣말로 중얼거리지는 않았다. 접견을 마치면 일행과 다시 이야기할 수 있었다. 누군가 다른 대목을 기억하고 있다면 그 말을 들을 자리도 남겨 두고 싶었다."}], "when": true}], "choices": [{"branch_kind": "quest", "consequence": [{"text": "선택한 경험과 현재 상태를 유지해 다음 장면에 전달한다."}], "effects": [{"op": "set", "provenance": {"note": "원작 조건/변화를 집필 상태로 추상화. 원문 코드 실행이나 고정 인물 설정 추가가 아니다.", "origin": "source_adaptation", "source_refs": ["lore_menace/next_task"]}, "state": "quest.lore_stage", "value": 6}], "id": "lore_menace/hear_next_task", "label": [{"text": "동쪽 성에 관한 부탁을 기억한다"}], "provenance": {"note": "추가: 장면 연결·행동·심리·새 대사는 집필용 창작 제안이다. 원작 고정 설정이 아니다.", "origin": "authored", "source_refs": []}, "target": "lore_menace/farewell", "when": true}], "editorial": {"intent": "첫 부탁을 마친 뒤 더 큰 의뢰를 듣되 만능의 자신감 대신 가서 듣겠다는 태도로 다음 이야기의 문턱에 서는 소편", "notes": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "source_refs": ["lore_menace/next_task"], "status": "draft"}, "entry_when": {"op": "eq", "state": "quest.lore_stage", "value": 5}, "handoff": null, "id": "lore_menace/next_task", "kind": "scene", 직이는 기척이 났다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 충분히 물러난 다음 몸을 돌렸다. 접견하던 자리에서 멀어질수록 목소리를 낮춰도 되는 것 같았다. 그렇다고 바로 할 말이 떠오르지는 않았다. 성주의 마지막 한마디가 아직 귀에 남아 있어, 밖으로 향하는 동안에도 그 짧은 말의 끝을 따라 걷는 기분이었다."}], "when": true}, {"id": "lore_menace/farewell_companion", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"ref": {"catalog": "characters", "id": "skeleton", "particle": "은/는"}}, {"text": " 일행과 함께 나왔다. 다시 옆에 자리를 내달라고 묻지 않았고, "}, {"ref": {"catalog": "characters", "id": "protagonist"}}, {"text": "도 누구를 받아들였는지 새로 설명하지 않았다. 둘 사이의 걸음이 잠시 나란해졌다. 성문 앞에서 대답을 기다리던 순간과는 달랐다. 함께 돌아와 같은 부탁을 들었고, 이제 잠깐 말을 섞을 수 있는 자리가 자연스럽게 남았다. 그것이 앞으로의 모든 일을 대신 정해 주지는 않았다. 다만 다음 말을 시작하기 위해 처음부터 허락을 구할 필요는 없었다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/farewell_skeleton_line", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": "skeleton", "text": [{"text": "이번에는 제가 먼저 같이 가도 되냐고 묻지 않아도 되겠죠?"}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/farewell_skeleton_answer", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "네. 대신 어디로 갈지 이야기할 때는 같이 들어 주세요. 저 혼자 잘못 듣고 앞서가지 않게."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/farewell_smile", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "말하고 보니 부탁인지 농담인지 자신도 분명하지 않았다. "}, {"ref": {"catalog": "characters", "id": "skeleton", "particle": "이/가"}}, {"text": " 고개를 끄덕이자 "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그만 웃음이 조금 났다. 길을 잘못 들까 걱정하는 말로 다음 길의 이야기를 시작하게 될 줄은 몰랐다. 그래도 앞에 서서 아무 걱정도 없는 것처럼 보이려던 것보다 나았다. 짧게 웃고 나니 접견하던 동안 꼿꼿하게 세워 둔 목덜미가 조금 편해졌다."}], "when": {"op": "contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/farewell_declined", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "일행과 나란히 걷자 접견하던 동안 보이지 않던 얼굴들이 다시 시야에 들어왔다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 입을 열었다가, 복도를 다 지나기 전에 서두를 필요는 없다고 생각했다. 함께 걸을 다음 길을 성주 앞에서 들었던 말 한마디로 모두 설명할 수는 없었다. 모두가 같은 말을 들었어도 마음에 남은 대목은 다를 수 있었다. 먼저 자신의 귀에 남은 것을 꺼내 놓고, 다른 사람의 말을 들어야 했다."}], "when": {"op": "not_contains", "state": "companions.optional_recruits", "value": "skeleton"}}, {"id": "lore_menace/farewell_share", "kind": "dialogue", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": "protagonist", "text": [{"text": "동쪽으로 가라고 하셨습니다. 바로 서두르기보다, 나가기 전에 같이 이야기해 보죠."}], "when": true}, {"id": "lore_menace/farewell_loosen", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "대답을 기다리며 걸음이 조금 느려졌다. 누군가 옆으로 자리를 맞췄고, 뒤에 있던 기척도 가까워졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 그 움직임을 보며 자신이 출발할 때부터 앞서 걷게 될 것이라고 멋대로 생각했다는 것을 깨달았다. 굴에서는 앞사람을 따라 걸어야 하는 순간이 많았다. 바깥의 길에서는 나란히 이야기할 수도 있었다. 이제 어느 쪽이 필요한지 그때마다 정하면 됐다. 처음부터 한 사람의 걸음을 나머지가 전부 따를 필요는 없었다."}], "when": true}, {"id": "lore_menace/farewell_window_light", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "밖에서 들어오는 빛이 가까워졌다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 밝은 쪽으로 향하다가 잠시 발을 멈췄다. 처음 이곳을 나갈 때에도 밖은 밝았다. 그때는 앞으로 보이는 길이 얼마든지 뻗어 있을 것 같아, 돌아오는 장면을 제대로 상상하지 못했다. 지금은 돌아와 같은 자리를 지나고 있었다. 굴 안에서 손끝으로 찾던 거친 면과 바깥에서 얼굴에 닿던 바람이 차례로 떠올랐다. 그 일들을 한꺼번에 말하려면 또 길어지겠지만, 자신이 기억하기 위해 길게 설명할 필요는 없었다."}], "when": true}, {"id": "lore_menace/farewell_hands", "kind": "narration", "literal_ids": [], "provenance": {"note": "추가: 다음 임무를 듣는 반응·머뭇거림·확인 질문·작별 동작·새 대사는 창작 연결이다. 성주의 원문 의뢰는 발언으로 보존하고 아직 듣지 못한 지역의 진상·적의 능력·새 장비·확정 성장·영구 관계는 만들지 않는다. 실제 도착과 다음 퀘스트 집필은 인계 이후로 남긴다.", "origin": "authored", "source_refs": []}, "speaker": null, "text": [{"text": "손을 내려다보니 어느새 손가락을 가볍게 말아 쥐고 있었다. "}, {"ref": {"catalog": "characters", "id": "protagonist", "particle": "은/는"}}, {"text": " 손을 펴고 팔을 옆으로 내렸다. 굴의 벽도, 성주 앞에 설 때의 자세도 지금까지 붙잡고 올 필요는 없었다. 일행 쪽으로 몸을 돌리자 자연스럽게 원을 조금 비워 서게 됐다. 앞을 향해 한 줄로 걷던 사람들의 얼굴이 그 빈자리를 사이에 두고 보였다. 아직 출발하는 자리는 아니었다. 서로 말할 수 있는 자리였다."}], "when": true}, {"id": "lore_menace/farewell_end", "kind": "narration",
