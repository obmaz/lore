name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Require successful validation of this commit
        id: validation
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'validate.yml',
              branch: 'main',
              head_sha: context.sha,
              status: 'success',
              per_page: 100,
            });
            const run = runs.find(run => run.head_sha === context.sha && run.conclusion === 'success');
            if (!run) {
              throw new Error(`Validate must succeed for ${context.sha} before deployment.`);
            }
            core.setOutput('run_id', run.id);

      - name: Download verified original web release
        uses: actions/download-artifact@v4
        with:
          name: lore-web-original
          path: original/build/web
          run-id: ${{ steps.validation.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download verified remake web release
        uses: actions/download-artifact@v4
        with:
          name: lore-web-remake
          path: remake/build/web
          run-id: ${{ steps.validation.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify downloaded releases
        run: |
          (cd original && python3 tool/build_web_release.py --check-only)
          (cd remake && python3 tool/build_web_release.py --check-only)

      - name: Assemble independent site paths
        run: |
          mkdir -p site/original site/remake site/novel
          cp -a original/build/web/. site/original/
          cp -a remake/build/web/. site/remake/
          sed -i 's#<base href="/lore/">#<base href="/lore/original/">#' site/original/index.html
          sed -i 's#<base href="/lore/">#<base href="/lore/remake/">#' site/remake/index.html
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          root = Path('novel').resolve()
          manifest = json.loads((root / 'writing/previews/manifest.json').read_text(encoding='utf-8'))
          for relative, expected in manifest['source_sha256'].items():
              source = (root / relative).resolve()
              if not source.is_relative_to(root) or hashlib.sha256(source.read_bytes()).hexdigest() != expected:
                  raise SystemExit(f'Novel reading export is stale: {relative}. Run tools/writing.py export in novel/.')
          reader = root / 'writing/previews/novel-reader.html'
          if hashlib.sha256(reader.read_bytes()).hexdigest() != manifest['artifacts'][reader.name]:
              raise SystemExit('Novel reader differs from its generated manifest.')
          # The reader remains separate from the explicitly public author workspace.
          policy = json.loads((root / 'writing/studio/publication.json').read_text(encoding='utf-8'))
          if policy.get('audience') != 'public' or policy.get('status') != 'user_requested' or policy.get('studio_path') != '/novel/studio/':
              raise SystemExit('Novel studio public publication is not explicitly configured.')
          studio_manifest = json.loads((root / 'writing/studio/generated/manifest.json').read_text(encoding='utf-8'))
          for relative, expected in studio_manifest['source_sha256'].items():
              source = (root / relative).resolve()
              if not source.is_relative_to(root) or hashlib.sha256(source.read_bytes()).hexdigest() != expected:
                  raise SystemExit(f'Novel studio export is stale: {relative}. Run tools/writing.py export in novel/.')
          studio = root / 'writing/studio/generated/index.html'
          if hashlib.sha256(studio.read_bytes()).hexdigest() != studio_manifest['artifacts'].get('index.html'):
              raise SystemExit('Novel studio differs from its generated manifest.')
          ebook_manifest = json.loads((root / 'writing/ebooks/generated/manifest.json').read_text(encoding='utf-8'))
          ebook_name = 'lore-B-chapters01-03.epub'
          if ebook_manifest.get('edition') != 'B' or ebook_manifest.get('public_path') != '/novel/downloads/' + ebook_name:
              raise SystemExit('Novel EPUB publication path is not explicitly configured.')
          for relative, expected in ebook_manifest['source_sha256'].items():
              source = (root / relative).resolve()
              if not source.is_relative_to(root) or hashlib.sha256(source.read_bytes()).hexdigest() != expected:
                  raise SystemExit(f'Novel EPUB export is stale: {relative}. Run tools/writing.py export in novel/.')
          ebook = root / 'writing/ebooks/generated' / ebook_name
          if hashlib.sha256(ebook.read_bytes()).hexdigest() != ebook_manifest['artifacts'].get(ebook_name):
              raise SystemExit('Novel EPUB differs from its generated manifest.')
          # Publish only the two validated HTML files and the requested B EPUB.
          # Covers are embedded; raw JSON, private master cards and PDFs stay out.
          shutil.copyfile(reader, 'site/novel/index.html')
          Path('site/novel/studio').mkdir(parents=True, exist_ok=True)
          shutil.copyfile(studio, 'site/novel/studio/index.html')
          Path('site/novel/downloads').mkdir(parents=True, exist_ok=True)
          shutil.copyfile(ebook, Path('site/novel/downloads') / ebook_name)
          PY
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
