name: Deploy original and remake

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Assemble both site paths
        run: |
          mkdir -p site/original site/remake
          cp -a original/docs/. site/original/
          cp -a remake/docs/. site/remake/
          sed -i 's#<base href="/lore/">#<base href="/lore/original/">#' site/original/index.html
          sed -i 's#<base href="/lore/">#<base href="/lore/remake/">#' site/remake/index.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
