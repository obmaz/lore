name: Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [original, remake]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Verify deployment assembly
        working-directory: .
        run: python3 -m unittest discover -s .github/tests
      - name: Verify release tooling
        run: python3 -m unittest discover -s tool -p test_build_web_release.py
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build and verify web release
        run: python3 tool/build_web_release.py
      - name: Upload verified web release
        uses: actions/upload-artifact@v4
        with:
          name: lore-web-${{ matrix.project }}
          path: ${{ matrix.project }}/build/web/
          if-no-files-found: error
          retention-days: 14
